<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>Film</title>
<!-- Video-agnostic film compiler. Reads ./video.json and the unit JSON and assets it lists.

<style>

#ui{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;border:1px solid #ffffff70;background:#08121bd0;display:grid;place-items:center;cursor:pointer}
#ui[hidden]{display:none}
#ui i{width:0;height:0;border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:4px}
#bar{position:absolute;left:0;bottom:0;height:3px;background:#ffffff80;width:0}
#mirror{display:none}
body.render #ui,body.render #bar{display:none}
</style></head>
<body>
<div id="screen"><canvas id="film"></canvas><div id="bar"></div><button id="ui" hidden aria-label="Play"><i></i></button></div>
