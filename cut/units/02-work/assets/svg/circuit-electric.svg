<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -562.5 3200 562.5">
  <!-- Electric mirror circuit, same topology, 481 units above the token circuit. Loads attach at e1-e5 tops (y -238). -->
  <path class="wire" id="bus" d="M 0 -200 L 3200 -200" fill="none"/>
  <path class="wire" id="e1" d="M 900 -200 L 900 -238" fill="none"/><path class="wire" id="e2" d="M 1350 -200 L 1350 -238" fill="none"/><path class="wire" id="e3" d="M 1800 -200 L 1800 -238" fill="none"/><path class="wire" id="e4" d="M 2250 -200 L 2250 -238" fill="none"/><path class="wire" id="e5" d="M 2700 -200 L 2700 -238" fill="none"/>
  <circle class="pin" id="terminal" cx="120" cy="-200" r="7"/>
</svg>
