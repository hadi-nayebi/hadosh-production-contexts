  <rect class="acc" id="piston" x="14" y="44" width="14" height="22" rx="2"/>
  <line class="acc" id="rod" x1="28" y1="55" x2="112" y2="55"/>
  <g id="wheel" transform-origin="118 55"><circle class="ln" cx="118" cy="55" r="36" fill="none"/>
    <line class="ln" x1="118" y1="19" x2="118" y2="91"/><line class="ln" x1="82" y1="55" x2="154" y2="55"/><line class="ln" x1="93" y1="30" x2="143" y2="80"/><line class="ln" x1="143" y1="30" x2="93" y2="80"/>
    <circle class="acc" cx="118" cy="55" r="5" fill="none"/></g>
  <line class="ln" x1="0" y1="104" x2="160" y2="104"/>
</svg>
