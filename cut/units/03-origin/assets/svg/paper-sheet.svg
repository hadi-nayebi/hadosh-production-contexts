<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <!-- Tri-fold paper sheet. Folded: side panels scaled to 0 behind the middle panel. Unfolding animates panel-left / panel-right scaleX about their fold lines (x 100 and x 200). Each panel carries its own edge. -->
  <g id="panel-left"><rect class="paper" x="0" y="0" width="100" height="200"/><path class="edge" d="M 100 0.5 L 0.5 0.5 L 0.5 199.5 L 100 199.5" fill="none"/><line class="fold" x1="99.5" y1="0" x2="99.5" y2="200"/></g>
  <g id="panel-right"><rect class="paper" x="200" y="0" width="100" height="200"/><path class="edge" d="M 200 0.5 L 299.5 0.5 L 299.5 199.5 L 200 199.5" fill="none"/><line class="fold" x1="200.5" y1="0" x2="200.5" y2="200"/></g>
  <g id="panel-mid"><rect class="paper" x="100" y="0" width="100" height="200"/><path class="edge" d="M 100 0.5 L 200 0.5 M 100 199.5 L 200 199.5" fill="none"/></g>
</svg>
