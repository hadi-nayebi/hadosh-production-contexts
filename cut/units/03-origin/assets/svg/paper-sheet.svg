<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <!-- Tri-fold paper sheet. Folded: side panels scaled to 0 behind the middle panel. Unfolding animates panel-left / panel-right scaleX about their fold lines (x 100 and x 200). -->
  <g id="panel-left"><rect class="paper" x="0" y="0" width="100" height="200"/><line class="fold" x1="100" y1="0" x2="100" y2="200"/></g>
  <g id="panel-mid"><rect class="paper" x="100" y="0" width="100" height="200"/></g>
  <g id="panel-right"><rect class="paper" x="200" y="0" width="100" height="200"/><line class="fold" x1="200" y1="0" x2="200" y2="200"/></g>
  <rect class="edge" x="0.5" y="0.5" width="299" height="199" fill="none"/>
</svg>
