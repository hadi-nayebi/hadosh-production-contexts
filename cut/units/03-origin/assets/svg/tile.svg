<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 40">
  <!-- Paper word tile. Width is set per tile by the node size; the word is a text node. -->
  <rect class="tile" x="0" y="0" width="100" height="40" rx="2"/>
  <rect class="tile-edge" x="0.5" y="0.5" width="99" height="39" rx="2" fill="none"/>
</svg>
