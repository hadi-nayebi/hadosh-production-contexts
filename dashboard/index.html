<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Production — Hadosh Academy</title>
<style>
:root{
  --void:#07070b; --ink:#eef0f4; --dim:rgba(238,240,244,.58); --faint:rgba(238,240,244,.34);
  --accent:#7ce7ff; --glow:rgba(124,231,255,.16);
  --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.08);
  --ok:#7de8b0; --bad:#ff9d97;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html{scrollbar-color:rgba(255,255,255,.18) transparent}
body{margin:0;background:
  radial-gradient(1100px 550px at 78% -10%, rgba(124,231,255,.07), transparent 60%),
  radial-gradient(900px 600px at -10% 110%, rgba(124,231,255,.05), transparent 60%),
  var(--void);
  color:var(--ink); font-family:"Avenir Next","Trebuchet MS",Verdana,system-ui,sans-serif;
  font-size:15.5px; line-height:1.6; letter-spacing:.012em; min-height:100vh}
::selection{background:rgba(124,231,255,.28)}
button{font-family:inherit}
/* ---------- overview ---------- */
header{padding:52px 30px 6px; max-width:1460px; margin:0 auto}
.micro{font-size:11.5px; letter-spacing:.34em; text-transform:uppercase; color:var(--accent); opacity:.85}
h1{font-size:clamp(38px,5.4vw,64px); font-weight:200; margin:10px 0 6px; letter-spacing:.01em}
h1 b{font-weight:600}
.counts{color:var(--dim); font-size:15px}
.counts b{color:var(--ink); font-weight:600}
.hnav{display:flex; gap:9px; padding:18px 30px 0; max-width:1460px; margin:0 auto; flex-wrap:wrap}
.ghostbtn{background:var(--glass); border:1px solid rgba(255,255,255,.09); color:var(--dim);
  border-radius:999px; padding:8px 17px; font-size:13.5px; cursor:pointer; backdrop-filter:blur(8px);
  transition:all .3s var(--ease); text-decoration:none; display:inline-block}
.ghostbtn:hover{color:var(--ink); border-color:rgba(124,231,255,.45)}
.pillbtn{background:rgba(124,231,255,.12); border:1px solid rgba(124,231,255,.35); color:var(--ink);
  border-radius:999px; padding:10px 22px; font-size:14.5px; cursor:pointer; transition:all .3s var(--ease)}
.pillbtn:hover{background:rgba(124,231,255,.22); box-shadow:0 0 26px -6px var(--glow)}
.pillbtn.sm{padding:8px 18px; font-size:13.5px}
/* the three sections */
.sect{max-width:1460px; margin:0 auto; padding:38px 30px 0}
.sect-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:0 2px 14px}
.sect-head h2{font-size:13px; letter-spacing:.3em; text-transform:uppercase; color:var(--dim); font-weight:600; margin:0}
.sect-head .n{font-size:13px; color:var(--faint); letter-spacing:.08em; white-space:nowrap}
/* layered rows: L0 name only -> L1 reveal in place -> L2 enter */
.lrow{border-radius:18px; margin-bottom:10px; background:rgba(255,255,255,.028);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.045); backdrop-filter:blur(10px);
  transition:background .35s var(--ease), box-shadow .35s var(--ease)}
.lrow:hover{background:rgba(255,255,255,.05)}
.lrow.open{background:linear-gradient(120deg, rgba(124,231,255,.075), rgba(255,255,255,.028));
  box-shadow:inset 0 0 0 1px rgba(124,231,255,.22)}
.rowhead{display:flex; width:100%; align-items:baseline; gap:14px; text-align:left;
  background:none; border:0; color:var(--ink); cursor:pointer; padding:17px 20px; min-height:60px}
.rowhead .kick{flex:1 1 auto; min-width:0}
.kicker{display:block; font-size:10.5px; letter-spacing:.26em; text-transform:uppercase; color:var(--accent); opacity:.85; margin-bottom:3px}
.rtitle{display:block; font-size:clamp(17px,2.4vw,21px); font-weight:600; line-height:1.3}
.chev{flex:0 0 auto; font-size:20px; font-weight:200; color:var(--faint); line-height:1}
.lrow.open .chev{color:var(--accent)}
.reveal{padding:2px 20px 20px; animation:rev .45s var(--ease)}
@keyframes rev{from{opacity:0; transform:translateY(-5px)} to{opacity:1; transform:none}}
.rdesc{color:var(--dim); font-size:14.5px; line-height:1.6; margin:0 0 6px; max-width:64ch}
.pmeta{color:var(--faint); font-size:12.5px; letter-spacing:.04em; margin-bottom:4px}
.ropts{display:flex; gap:9px; flex-wrap:wrap; margin-top:14px; align-items:center}
.pchiprow{display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-top:10px}
.minichip{border:1px solid rgba(255,255,255,.12); background:var(--glass); color:var(--dim);
  border-radius:999px; padding:5px 13px; font-size:12.5px; cursor:pointer; transition:all .3s var(--ease)}
.minichip:hover{color:var(--ink); border-color:rgba(124,231,255,.45)}
.morebtn{display:block; margin:6px auto 0; background:none; border:0; color:var(--dim); cursor:pointer;
  font-size:13px; letter-spacing:.18em; text-transform:uppercase; padding:12px 20px; transition:color .3s}
.morebtn:hover{color:var(--accent)}
/* piece reveal internals (kept from v1 cards, now behind L1) */
.pline{height:2px; border-radius:2px; background:rgba(255,255,255,.09); margin:11px 0 6px; overflow:hidden}
.pline i{display:block; height:100%; background:var(--accent); border-radius:2px; box-shadow:0 0 8px var(--glow)}
.pline.bad i{background:var(--bad); box-shadow:none}
.ptxt{font-size:11.5px; color:var(--faint); display:flex; justify-content:space-between}
.ptxt .who{color:var(--dim)}
.dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent);
  box-shadow:0 0 9px var(--accent); margin-right:5px; vertical-align:1px}
.dot.me{background:rgba(255,255,255,.3); box-shadow:none}
.cychip{display:inline-block; margin-top:8px; font-size:11.5px; letter-spacing:.05em; color:var(--dim);
  background:rgba(124,231,255,.08); border-radius:999px; padding:2.5px 10px}
.cychip b{color:var(--accent); font-weight:600}
/* filters — live inside the pieces expansion, never at rest */
.filters{display:flex; flex-wrap:wrap; gap:8px; padding:4px 2px 14px}
.chip{border:1px solid rgba(255,255,255,.10); background:var(--glass); color:var(--dim);
  border-radius:999px; padding:6px 15px; font-size:13px; cursor:pointer; backdrop-filter:blur(8px);
  transition:all .3s var(--ease)}
.chip:hover{color:var(--ink); border-color:rgba(124,231,255,.4)}
.chip[aria-pressed="true"]{color:var(--ink); background:rgba(124,231,255,.13); border-color:rgba(124,231,255,.55); font-weight:600; box-shadow:0 0 18px -6px var(--glow)}
/* playlist stage timeline */
.tlwrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin-top:12px; padding-bottom:8px;
  scrollbar-width:thin}
.tl{display:flex; min-width:980px}
.tlstage{flex:1 1 0; min-width:98px; padding:0 8px 0 0}
.tlname{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tlbar{height:2px; border-radius:2px; background:rgba(255,255,255,.13); margin:8px 0 10px; position:relative}
.tlstage.has .tlbar{background:rgba(124,231,255,.4)}
.tlnodes{display:flex; flex-direction:column; gap:6px; align-items:flex-start}
.node{display:flex; align-items:center; gap:7px; max-width:100%; background:rgba(124,231,255,.07);
  border:1px solid rgba(124,231,255,.18); color:var(--ink); border-radius:999px;
  padding:5px 11px 5px 8px; font-size:11.5px; cursor:pointer; text-align:left;
  transition:all .3s var(--ease)}
.node:hover{border-color:rgba(124,231,255,.5); box-shadow:0 0 16px -6px var(--glow)}
.node .nd{flex:0 0 auto; width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.35)}
.node .nd.hadi{background:var(--accent); box-shadow:0 0 8px var(--accent)}
.node .nt{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px}
.tlnone{color:rgba(255,255,255,.14); font-size:12px; padding-left:2px}
footer{max-width:1460px; margin:0 auto; padding:44px 30px 48px; color:var(--faint); font-size:12.5px}
/* ---------- focus view ---------- */
.view{position:fixed; inset:0; overflow-y:auto;
  background:radial-gradient(900px 620px at 50% 30%, rgba(124,231,255,.08), transparent 65%), var(--void);
  opacity:0; pointer-events:none; transition:opacity .45s var(--ease); z-index:20}
.view.open{opacity:1; pointer-events:auto}
#focus{padding:22px 20px 120px}
#focus .inner{max-width:1060px; margin:0 auto; transform:translateY(10px) scale(.995); transition:transform .5s var(--ease)}
#focus.open .inner{transform:none}
.f-top{display:flex; justify-content:space-between; align-items:center; gap:10px}
.f-stage{font-size:11.5px; letter-spacing:.3em; text-transform:uppercase; color:var(--accent); text-align:right}
.artifact{display:flex; justify-content:center; margin:30px 0 8px; position:relative}
.artifact video{height:min(62vh,680px); max-width:92vw; border-radius:20px; background:#000;
  box-shadow:0 30px 80px -30px rgba(0,0,0,.95), 0 0 90px -18px var(--glow)}
.beat{max-width:21ch; text-align:center; font-size:clamp(27px,4.6vw,44px); font-weight:250;
  line-height:1.35; padding:7vh 10px}
.beat small{display:block; margin-top:20px; font-size:13px; letter-spacing:.26em; text-transform:uppercase; color:var(--faint)}
.f-title{text-align:center; font-size:clamp(23px,3.4vw,34px); font-weight:300; margin:20px 0 4px; line-height:1.3}
.f-meta{text-align:center; color:var(--dim); font-size:14px}
.f-next{text-align:center; margin:16px auto 0; max-width:56ch; color:var(--ink); font-size:15px;
  background:var(--glass); border-radius:14px; padding:12px 18px; backdrop-filter:blur(8px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.f-next span{color:var(--faint)}
.f-actions{display:flex; justify-content:center; gap:10px; margin-top:18px; flex-wrap:wrap}
/* toolbox rail + drawer */
.rail{position:fixed; right:22px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:9px; z-index:30}
#rail[hidden]{display:none} /* author display:flex would otherwise beat the UA [hidden] rule — the rail bled onto the overview (round-6 find) */
.tool{width:104px; padding:10px 0; text-align:center; border-radius:14px; cursor:pointer; font-size:12.5px;
  letter-spacing:.05em; color:var(--dim); background:rgba(16,16,22,.55); border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px); transition:all .3s var(--ease)}
.tool:hover,.tool.on{color:var(--ink); border-color:rgba(124,231,255,.5); box-shadow:0 0 22px -6px var(--glow)}
.tool .ic{display:block; font-size:17px; margin-bottom:2px; color:var(--accent)}
#drawer{position:fixed; top:0; right:0; height:100dvh; width:min(430px,94vw); z-index:40; padding:24px 24px 44px;
  overflow-y:auto; background:rgba(13,13,19,.78); backdrop-filter:blur(22px);
  box-shadow:-30px 0 60px -30px rgba(0,0,0,.9), inset 1px 0 0 rgba(255,255,255,.07);
  transform:translateX(105%); visibility:hidden; transition:transform .5s var(--ease), visibility 0s .5s}
#drawer.open{transform:none; visibility:visible; transition:transform .5s var(--ease)}
#drawer h3{font-size:19px; font-weight:400; margin:2px 34px 4px 0}
#drawer .x{position:absolute; top:18px; right:18px}
.stagegrp{margin-top:20px}
.stagegrp h4{font-size:11.5px; letter-spacing:.26em; text-transform:uppercase; color:var(--accent);
  margin:0 0 8px; font-weight:600; opacity:.9}
.chk{display:flex; gap:11px; padding:7px 0; align-items:flex-start}
.chk .ic{flex:0 0 18px; text-align:center; font-size:13px; margin-top:2px}
.chk .ev{display:block; color:var(--faint); font-size:13px; margin-top:1px}
.tr p{margin:0 0 13px; font-size:16px; line-height:1.65}
.dlinks a{display:block; color:var(--accent); text-decoration:none; padding:9px 0; font-size:15px}
.dlinks a:hover{text-decoration:underline}
.dnote{color:var(--dim); font-size:14px}
#drawer audio{width:100%; margin:10px 0}
/* compare */
#cmp{display:none; margin-top:8px}
#cmp.open{display:block}
.cmp-grid{display:flex; gap:18px; justify-content:center; align-items:flex-start}
.cmp-cell{flex:0 1 auto; text-align:center}
.cmp-cell video{height:min(56vh,600px); width:auto; max-width:92vw; border-radius:18px; background:#000;
  box-shadow:0 24px 60px -26px rgba(0,0,0,.95), 0 0 70px -20px var(--glow)}
.cmp-lab{font-size:11.5px; letter-spacing:.26em; text-transform:uppercase; color:var(--dim); margin-bottom:9px}
.cmp-lab b{color:var(--accent); font-weight:600}
.cmp-ctl{display:flex; justify-content:center; align-items:center; gap:14px; margin-top:20px; flex-wrap:wrap}
.cmp-note{color:var(--faint); font-size:12.5px; letter-spacing:.14em; text-transform:uppercase}
/* cycles */
.cycles{display:flex; gap:0; margin:26px auto 0; max-width:860px; overflow-x:auto; padding:4px 2px 10px}
.cy{flex:1 1 0; min-width:150px; position:relative; padding:16px 14px 0 0}
.cy::before{content:""; position:absolute; top:5px; left:0; right:0; height:1px; background:rgba(255,255,255,.13)}
.cy .cdot{position:absolute; top:0; left:0; width:11px; height:11px; border-radius:50%;
  background:rgba(255,255,255,.25)}
.cy.done .cdot{background:var(--ok)}
.cy.cur .cdot{background:var(--accent); box-shadow:0 0 12px var(--accent)}
.cy .cl{font-size:13.5px; font-weight:600; line-height:1.35}
.cy .cp{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-top:3px}
.cy.cur .cp{color:var(--accent)}
.cy .cn{font-size:12.5px; color:var(--faint); margin-top:5px; line-height:1.45}
.cy.cur .cn{color:var(--dim)}
/* library + lab views */
#library{z-index:15; padding:26px 22px 70px}
#labView{z-index:15; padding:26px 22px 70px}
.view .inner{max-width:1060px; margin:0 auto}
.view h2{font-size:clamp(30px,4.4vw,46px); font-weight:200; margin:16px 0 4px}
.view h2 b{font-weight:600}
.libgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; margin-top:26px; align-items:start}
.asset{border-radius:18px; overflow:hidden; background:var(--glass); backdrop-filter:blur(10px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05); transition:box-shadow .35s var(--ease)}
.asset.open{box-shadow:inset 0 0 0 1px rgba(124,231,255,.25)}
.asset .ahead{display:block; width:100%; background:none; border:0; padding:0; cursor:pointer; text-align:left; color:var(--ink)}
.asset img{width:100%; height:170px; object-fit:cover; display:block; background:#000}
.asset .an{display:block; padding:14px 16px 15px; font-weight:600; font-size:15.5px; line-height:1.35}
.asset .reveal{padding:0 16px 17px}
#assetView{z-index:35; display:none; background:radial-gradient(900px 620px at 50% 26%, rgba(124,231,255,.08), transparent 65%), rgba(7,7,11,.94); padding:24px 20px 80px}
#assetView.open{display:block}
#assetView .inner{max-width:820px; margin:0 auto; text-align:center}
#assetView img{max-width:100%; max-height:56vh; border-radius:18px; margin:26px 0 6px;
  box-shadow:0 30px 80px -30px rgba(0,0,0,.95), 0 0 90px -18px var(--glow)}
.usedin{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:16px}
/* view switch — one segmented control: Board / Kanban (Timeline lives in focus) */
.seg{display:flex; background:var(--glass); border:1px solid rgba(255,255,255,.09); border-radius:999px; padding:3px; backdrop-filter:blur(8px)}
.segbtn{border:0; background:transparent; color:var(--dim); padding:6px 18px; border-radius:999px; cursor:pointer; font-size:13.5px; transition:all .3s var(--ease)}
.segbtn.on{background:rgba(124,231,255,.13); color:var(--ink); font-weight:600; box-shadow:0 0 18px -6px var(--glow)}
/* kanban view */
#kanbanView{z-index:15; padding:26px 22px 70px}
#kanbanView .inner{max-width:1460px}
.kboard{display:flex; gap:14px; overflow-x:auto; align-items:flex-start; padding:26px 2px 30px; -webkit-overflow-scrolling:touch; scrollbar-width:thin}
.kcol{flex:0 0 254px; padding:14px 12px 6px; border-radius:20px; background:rgba(255,255,255,.026); backdrop-filter:blur(12px); box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.kcol.ghost{flex-basis:82px; opacity:.38; background:transparent; box-shadow:none}
.kcol.ghost .colhead{flex-direction:column; align-items:center; gap:8px}
.kcol.ghost .colhead .nm{writing-mode:vertical-rl; letter-spacing:.24em; white-space:nowrap}
.kcol .colhead{display:flex; justify-content:space-between; align-items:baseline; padding:0 4px 10px}
.kcol .colhead .nm{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim)}
.kcol .colhead .n{font-size:22px; font-weight:200; color:var(--ink)}
.kcol .lrow{margin-bottom:9px}
.kcol .rowhead{padding:13px 14px; min-height:0}
.kcol .rtitle{font-size:14.5px}
.kcol .kicker{font-size:9.5px}
.kcol .reveal{padding:2px 14px 15px}
/* timeline inside focus: past readable, current glows, future ghosted */
.tl-head{max-width:860px; margin:28px auto 0}
.cy.future{opacity:.36}
.cy.future .cdot{background:rgba(255,255,255,.16)}
.pips{display:inline-flex; gap:4px; margin-top:7px}
.pip{font-size:9.5px; width:16px; height:16px; line-height:15px; text-align:center; border-radius:50%;
  border:1px solid rgba(255,255,255,.14); color:var(--faint)}
.pip.lit{color:var(--ink); border-color:rgba(124,231,255,.45); background:rgba(124,231,255,.10)}
.pip.now{color:var(--accent); box-shadow:0 0 9px var(--glow); border-color:rgba(124,231,255,.7)}
.abmark{margin-top:9px; display:inline-block; background:rgba(124,231,255,.12); border:1px solid rgba(124,231,255,.42);
  color:var(--ink); border-radius:999px; padding:4px 12px; font-size:11.5px; cursor:pointer; transition:all .3s var(--ease)}
.abmark:hover{background:rgba(124,231,255,.22); box-shadow:0 0 16px -4px var(--glow)}
/* YouTube embeds (media rule): the piece plays from its YouTube copy */
.ytwrap{width:min(400px,92vw); margin:12px auto 0; aspect-ratio:9/16; max-height:66vh; border-radius:18px; overflow:hidden; background:#000; box-shadow:0 24px 60px -18px rgba(0,0,0,.8)}
.ytwrap iframe{width:100%; height:100%; border:0; display:block}
.cmp-cell .yt-slot{aspect-ratio:9/16; max-height:56vh; margin:0 auto; border-radius:14px; overflow:hidden; background:#000}
.cmp-cell .yt-slot iframe{width:100%; height:100%; border:0; display:block}
/* giscus comment box inside the drawer */
.giscus-wrap{margin-top:14px; min-height:150px}
.giscus-wrap iframe.giscus-frame{width:100%; border:0}
/* context completeness: the question, stated plainly */
.rquestion{font-size:16.5px; font-weight:600; color:var(--ink); margin:0 0 6px}
.rctx{margin-top:8px; font-size:13px; color:var(--dim); display:grid; gap:3px}
.waitpanel{max-width:860px; margin:22px auto 0; text-align:left; background:rgba(124,231,255,.055); border:1px solid rgba(124,231,255,.20); border-radius:20px; padding:18px 20px}
.waitpanel .wq{font-size:19px; font-weight:600; color:var(--ink); margin:6px 0 8px}
.waitpanel .wline{font-size:13.5px; color:var(--dim); padding:2px 0}
/* readiness gate + stage gate */
.askchecks{margin-top:10px; display:grid; gap:4px}
.ack{display:flex; gap:8px; font-size:13px; color:var(--dim); align-items:baseline}
.ack>span:first-child{color:var(--ok); flex:0 0 auto}
.ack.pending>span:first-child{color:#ffc46b}
.ack .ev{display:block; font-size:12px; color:var(--faint)}
.notready{margin-top:10px; font-size:13px; color:#ffc46b}
.prep-head{margin:26px 0 10px}
.gateline{font-size:12.5px; color:var(--dim); margin-top:8px}
.f-gate{max-width:860px; margin:10px auto 0; font-size:12.5px; color:var(--faint)}
/* the bench */
#benchView{z-index:15; padding:26px 22px 70px}
.bench-hint{margin-top:14px; background:transparent; border:1px dashed rgba(255,255,255,.22); color:var(--dim); border-radius:14px; padding:10px 16px; font-size:13px; cursor:pointer; transition:all .3s var(--ease)}
.bench-hint:hover{color:var(--ink); border-color:rgba(124,231,255,.5)}
.bench-group{margin-top:30px}
.bench-group .micro{display:block; margin-bottom:10px}
.bench-row{display:flex; gap:12px; align-items:center; justify-content:space-between; padding:11px 16px; margin-bottom:8px; border-radius:14px; background:var(--glass); font-size:14px}
.bench-miss{color:#ffc46b; font-size:12.5px; flex:1}
.bench-note{margin-top:26px; background:var(--glass); border:1px solid rgba(255,255,255,.07); border-radius:18px; padding:20px 22px; color:var(--dim); font-size:14.5px}
.bench-note a{color:var(--accent)}
@media (max-width:760px){
  header{padding:38px 20px 4px} .hnav,.sect,footer{padding-left:20px; padding-right:20px}
  .sect{padding-top:30px}
  .rail{left:0; right:0; top:auto; bottom:0; transform:none; flex-direction:row; justify-content:space-around;
    padding:9px 6px calc(9px + env(safe-area-inset-bottom)); background:rgba(10,10,15,.72); backdrop-filter:blur(16px);
    box-shadow:0 -1px 0 rgba(255,255,255,.07)}

          fail:p.checklist.filter(c=>c.status==="fail").length};
}

  const g=p.gate; if(!g || !g.stage_n) return "";
  return `Stage gate · ${esc(stageName(p.stage))}: ${g.stage_pass}/${g.stage_n} checks — ${g.stage_open?"open":"blocked"}` +
         (g.debt?` · ⚠ checklist debt: ${g.debt} open check${g.debt===1?"":"s"} from before the gate`:"");
}
function cycleChip(p){
  const cs=p.cycles||[]; if(!cs.length) return "";

  const ph=last.phase[0].toUpperCase()+last.phase.slice(1);
  const wait=last.blocked_on?` · waiting on <b>${last.blocked_on==="hadi"?"you":"Archer"}</b>`:"";
  return `<span class="cychip">C${last.n} · ${ph}${wait}</span>`;
}

function compOf(p){
  // completion state, derived from the checklist: all crossed = completed,
  // none crossed = pending, anything between = active
  const c=counts(p);
  if(c.tot>0 && c.pass===c.tot) return "completed";
  if(c.pass===0) return "pending";
  return "active";
}
function chip(label,val,group){
  const b=document.createElement("button"); b.className="chip"; b.textContent=label;
  const curVal = group==="chan"?fChan : group==="comp"?fComp : fPl;
  b.setAttribute("aria-pressed", curVal===val?"true":"false");
  b.onclick=()=>{ if(group==="chan") fChan=val;

}

  const d=document.createElement("div"); d.className="lrow"+(open?" open":""); d.dataset.testid="pl-"+name;
  d.innerHTML=`<button class="rowhead" data-act="toggle">${headHTML(
      `Repeating job · ${items.length} piece${items.length===1?"":"s"}`, esc(name), open)}</button>` +
    (open?`<div class="reveal">
      <p class="rdesc">${esc(PL_JOBS[name]||"One piece at a time, carried through the same stages.")}</p>
      <div class="tlwrap" data-tl><div class="tl">${S.stages.map(st=>{
        const its=items.filter(p=>p.stage===st.id);
        return `<div class="tlstage${its.length?" has":""}"><div class="tlname">${esc(st.label)}</div><div class="tlbar"></div>
          <div class="tlnodes">${its.length?its.map(p=>`<button class="node" data-pid="${p.id}"><span class="nd ${p.next_move.owner==="hadi"?"hadi":""}"></span><span class="nt">${esc(p.title)}</span></button>`).join(""):`<span class="tlnone">·</span>`}</div></div>`;
      }).join("")}</div></div></div>`:"");
  d.querySelector('[data-act="toggle"]').onclick=()=>{ openKey=open?null:key; renderAll(); };
  d.querySelectorAll(".node").forEach(n=>n.onclick=()=>{ location.hash=`#/p/${n.dataset.pid}`; });
  return d;
}
function renderPlaylists(){
  const names=[...new Set(S.pieces.map(p=>p.playlist))]
    .map(n=>({name:n, items:S.pieces.filter(p=>p.playlist===n)}))
    .sort((a,b)=>b.items.length-a.items.length);
  $("#plN").textContent = names.length+" playlists";
  const show=plsOpen?names:names.slice(0,3);
  const w=$("#plList"); w.innerHTML="";
  show.forEach(({name,items})=>w.appendChild(plRow(name,items)));
  const mb=$("#plMore");
  mb.style.display = names.length>3 ? "" : "none";
  mb.textContent = plsOpen ? "Show fewer ▴" : `All ${names.length} playlists ▾`;
  mb.onclick=()=>{ plsOpen=!plsOpen; renderPlaylists(); };
}

function renderAll(){
  const pub=S.pieces.filter(p=>p.stage==="published").length;

  $("#counts").innerHTML=`<b>${S.pieces.length}</b> pieces · <b>${pub}</b> published · <b>${waiting}</b> waiting on your eye`;

function pieceRequest(p){
  return (S.input_requests||[]).find(r=>r.status==="open" &&
    (r.piece_id===p.id || (r.pieces||[]).includes(p.id))) || null;
}
function waitPanel(p){
  const r=pieceRequest(p); if(!r) return "";
  return `<div class="waitpanel">
    <div class="micro" style="font-size:10.5px">Waiting on you${r.action_ref?` · ${esc(r.action_ref)}`:""}</div>
    <div class="wq">${esc(r.question||r.title)}</div>
    ${(r.context_summary||[]).map(l=>`<div class="wline">${esc(l)}</div>`).join("")}
    <div class="ropts" style="margin-top:12px">
      <button class="pillbtn sm" onclick="location.hash='#/p/${p.id}/comment'">✎ Comment on this</button>
      ${r.view==="compare"&&p.compare_with&&p.compare_visible?`<button class="ghostbtn" onclick="toggleCompare()">▸ Open the A/B compare</button>`:""}
    </div></div>`;
}
const PHASES=["observe","plan","execute","verify","condense"];
function phasePips(c, cls){
  let lit=0;
  if(c.phase==="done") lit=5;
  else { const i=PHASES.indexOf(c.phase); lit=i<0?0:i+1; }
  return `<span class="pips">${PHASES.map((ph,j)=>`<span class="pip ${j<lit?"lit":""} ${cls==="cur"&&j===lit-1?"now":""}" title="${ph}">${ph[0].toUpperCase()}</span>`).join("")}</span>`;
}
function cycleRequest(p, c, ci, i){
  // an open input request attached to this piece + cycle (or, unattached to a
  // cycle, to this piece's current stage) marks the timeline here
  const reqs=(S.input_requests||[]).filter(r=>r.status==="open" &&
    (r.piece_id===p.id || (r.pieces||[]).includes(p.id)));
  for(const r of reqs){
    if(r.cycle!=null && r.cycle===c.n) return r;
    if(r.cycle==null && r.stage===p.stage && i===ci) return r;
  }
  return null;
}
function jumpToRequest(r){
  if(!r) return;
  if(r.view==="compare"){ const p=byId(r.pieces[0]); if(p){ location.hash=`#/p/${p.id}/compare`; return; } }
  openKey="ask:"+r.id;
  if(!askReady(r)){
    // gated asks live on the Bench — route there, not into the waiting list
    location.hash="#/bench";
    setTimeout(()=>{ renderBench();
      const el=document.querySelector(`#benchView [data-testid="ask-${r.id}"]`);
      if(el) el.scrollIntoView({block:"center"}); }, 80);
    return;
  }
  goHome();
  setTimeout(()=>{ renderAll();
    const el=document.querySelector(`[data-testid="ask-${r.id}"]`);
    if(el) el.scrollIntoView({block:"center"}); }, 60);
}
function cycleTrack(p){
  const cs=p.cycles||[]; if(!cs.length) return "";
  const fi=cs.findIndex(c=>c.phase!=="done"); const ci=fi===-1?cs.length-1:fi;
  return `<div class="tl-head"><span class="micro" style="font-size:10.5px">Timeline · the piece's history</span></div>
  <div class="cycles" style="margin-top:8px">`+cs.map((c,i)=>{
    const cls=c.phase==="done"?"done":(i===ci?"cur":(i>ci?"future":"done"));
    const r=cycleRequest(p,c,ci,i);
    return `<div class="cy ${cls}">
    <span class="cdot"></span><div class="cl">Cycle ${c.n} — ${esc(c.layer)}</div>
    <div class="cp">${esc(c.phase)}${c.blocked_on?` · waiting on ${c.blocked_on==="hadi"?"you":"Archer"}`:""}</div>
    ${phasePips(c, cls)}
    <div class="cn">${esc(c.note)}</div>
    ${r?`<button class="abmark" data-req="${r.id}">${r.kind==="ab_test"?"⚖ A/B open":"✦ Input open"} · ${esc(r.action_ref||"")}</button>`:""}
    </div>`;}).join("")+`</div>`;
}
function buildRail(p, c){
  const tools=[
    ["check","✓",`Checks ${c.pass}/${c.tot}`],
    ...(p.transcript&&p.transcript.length?[["script","≣","Script"]]:[]),
    ...(p.audio_obj?[["listen","♪","Listen"]]:[]),
    ["links","↗","Links"],
    ["comment","✎","Comment"],
  ];
  const rail=$("#rail"); rail.innerHTML="";
  tools.forEach(([k,ic,label])=>{
    const b=document.createElement("button"); b.className="tool"; b.dataset.k=k;
    b.innerHTML=`<span class="ic">${ic}</span>${label}`;
    b.onclick=()=>openDrawer(p,k);
    rail.appendChild(b);
  });
}
function closeDrawer(){ $("#drawer").classList.remove("open"); $("#drawer").setAttribute("aria-hidden","true");
  document.querySelectorAll(".tool").forEach(t=>t.classList.remove("on"));
  const gb=document.getElementById("giscusBox"); if(gb) gb.innerHTML=""; }
function openDrawer(p, kind){
  const d=$("#drawer");
  document.querySelectorAll(".tool").forEach(t=>t.classList.toggle("on", t.dataset.k===kind));
  let h=`<button class="ghostbtn x" onclick="closeDrawer()">✕</button>`;
  if(kind==="check"){
    const groups={}; p.checklist.forEach(c=>{(groups[c.stage]=groups[c.stage]||[]).push(c);});
    h+=`<h3>Checklist</h3><div class="dnote">It grows as the piece passes each stage. ${counts(p).pass} of ${counts(p).tot} passed so far.</div>`;
    Object.keys(groups).forEach(st=>{
      h+=`<div class="stagegrp"><h4>${esc(stageName(st))}</h4>`+groups[st].map(c=>
        `<div class="chk st-${c.status}"><span class="ic" style="color:${c.status==="pass"?"var(--ok)":c.status==="fail"?"var(--bad)":""}">${ICON[c.status]}</span><span>${esc(c.check)}${c.evidence?`<span class="ev">${esc(c.evidence)}</span>`:""}</span></div>`).join("")+`</div>`;
    });
  }
  if(kind==="script"){
    h+=`<h3>Script</h3><div class="dnote">Spoken lines only.</div><div class="tr" style="margin-top:14px">`+
       p.transcript.map(l=>`<p>${esc(l)}</p>`).join("")+`</div>`;
  }
  if(kind==="listen"){
    h+=`<h3>Listen</h3><div class="dnote">The script, read aloud.</div>`+
      (p.audio_obj.embed?`<audio controls preload="none" src="${p.audio_obj.embed}"></audio>`
                        :`<audio controls preload="metadata" src="${p.audio_obj.href}"></audio>`);
  }
  if(kind==="links"){
    const L=p.links, defs=[["📄 Script doc",L.script],["🎬 Scene HTML (the source)",L.scene_html],
      ["🗂 Upload package",L.package],["📝 Studio draft",L.studio_draft],["▶️ Public video",L.public]];
    h+=`<h3>Links</h3><div class="dlinks">`+defs.filter(([_,v])=>v)
      .map(([n,v])=>`<a href="${linkHref(v)}" ${v.startsWith("http")?'target="_blank" rel="noopener"':""}>${n}</a>`).join("")+`</div>`;
  }
  if(kind==="comment"){
    const req=pieceRequest(p);
    h+=`<h3>Your input</h3><div class="dnote">${req
      ? `This piece is waiting on you: <b style="color:var(--ink)">${esc(req.title)}</b><br>${esc(req.question||req.governs)}`
      : `Notes, picks and corrections for this piece — they post to this item's own discussion and accumulate there; Archer reads them back and applies them.`}</div>
      <div class="giscus-wrap" id="giscusBox"></div>
      <div class="dnote">Write here and send — the box (giscus) posts to this item's own GitHub Discussion under your sign-in and starts the thread automatically. It never links out, and your pick becomes standing law — it is never re-asked.</div>`;
  }
  d.innerHTML=h; d.classList.add("open"); d.setAttribute("aria-hidden","false"); d.scrollTop=0;
  if(kind==="comment") loadGiscus(p.id);
}
/* ---------- compare ---------- */
let cmpCtl=null, cmpSyncTimer=null;
function loadYTApi(){
  if(window.YT && YT.Player) return Promise.resolve(true);
  if(loadYTApi._p) return loadYTApi._p;
  loadYTApi._p=new Promise(res=>{
    const tag=document.createElement("script"); tag.src="https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
    const t0=Date.now();
    (function poll(){ if(window.YT && YT.Player) return res(true);
      if(Date.now()-t0>6000) return res(false); setTimeout(poll,200); })();
  });
  return loadYTApi._p;
}
function showCompare(p){
  const other=byId(p.compare_with); if(!other) return;
  const A = p.stage==="published" ? p : other, B = p.stage==="published" ? other : p; // published first = the old version
  const tag=x=>x===A?"on air":"new";
  const cell=x=>`<div class="cmp-cell"><div class="cmp-lab"><b>${tag(x)}</b> · ${esc(x.title)}</div>
    ${x.youtube_id?`<div class="yt-slot" data-ytid="${x.youtube_id}"></div>`
                  :`<video src="${x.video}" poster="${x.poster||""}" muted loop playsinline autoplay preload="auto"></video>`}</div>`;
  $("#artZone").style.display="none";
  const z=$("#cmpZone");
  const anyYT = !!(A.youtube_id || B.youtube_id);
  z.innerHTML=`<div id="cmp" class="open"><div class="cmp-grid">${cell(A)}${cell(B)}</div>
    <div class="cmp-ctl"><button class="pillbtn" id="cmpPlay">▶ Play both</button>
    <button class="pillbtn" id="cmpPause">❚❚ Pause both</button>
    <button class="pillbtn" id="cmpRestart">↺ Restart both</button>
    <span class="cmp-note" id="cmpNote">${anyYT?"YouTube copies — playing together, looping":"playing together · looping"}</span></div></div>`;
  const sides=[];
  z.querySelectorAll(".cmp-cell").forEach(cellEl=>{
    const v=cellEl.querySelector("video");
    if(v){ sides.push({kind:"video", t:()=>v.currentTime,
      seek:t=>{try{v.currentTime=t;}catch(e){}}, play:()=>{v.play();}, pause:()=>{v.pause();},
      playing:()=>!v.paused&&!v.ended, ready:()=>v.readyState>=2, fallback:false}); return; }
    const slot=cellEl.querySelector(".yt-slot"); if(!slot) return;
    const entry={kind:"yt", id:slot.dataset.ytid, player:null, fallback:false,
      t:()=>{ try{ return entry.player&&entry.player.getCurrentTime?entry.player.getCurrentTime():0; }catch(e){ return 0; } },
      seek:t=>{ if(entry.player&&entry.player.seekTo) entry.player.seekTo(t,true); },
      play:()=>{ if(entry.player&&entry.player.playVideo) entry.player.playVideo(); },
      pause:()=>{ if(entry.player&&entry.player.pauseVideo) entry.player.pauseVideo(); },
      playing:()=>{ try{ return !!(entry.player&&entry.player.getPlayerState&&entry.player.getPlayerState()===1); }catch(e){ return false; } },
      ready:()=>!!entry.player};
    sides.push(entry);
    loadYTApi().then(ok=>{
      if(!cmpOn) return;
      if(ok && window.YT){
        entry.player=new YT.Player(slot, { videoId: entry.id,
          playerVars:{rel:0, playsinline:1, autoplay:1, mute:1, loop:1, playlist:entry.id},
          events:{ onReady:e=>{ e.target.mute(); e.target.playVideo(); },
                   onStateChange:e=>{ if(e.data===YT.PlayerState.ENDED){ e.target.seekTo(0); e.target.playVideo(); } } } });
      } else if(slot.isConnected){
        slot.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${entry.id}?loop=1&playlist=${entry.id}&rel=0&playsinline=1" title="YouTube copy" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
        entry.fallback=true;
        const n=$("#cmpNote"); if(n) n.textContent="YouTube copies — each loops on its own (sync unavailable in this browser)";
      }
    });
  });
  cmpCtl={sides};
  window.__cmpState=()=> (cmpCtl ? cmpCtl.sides.map(s=>({kind:s.kind, ready:s.ready(), playing:s.playing(), t:Math.round(s.t()*100)/100, fallback:!!s.fallback})) : []);
  $("#cmpPlay").onclick=()=>sides.forEach(s=>s.play());
  $("#cmpPause").onclick=()=>sides.forEach(s=>s.pause());
  $("#cmpRestart").onclick=()=>sides.forEach(s=>{ s.seek(0); s.play(); });
  clearInterval(cmpSyncTimer);
  cmpSyncTimer=setInterval(()=>{
    if(!cmpOn||!cmpCtl) return;
    const rs=cmpCtl.sides.filter(s=>s.ready());
    if(rs.length<2) return;
    const ts=rs.map(s=>s.t()); const mx=Math.max(...ts), mn=Math.min(...ts);
    if(mx-mn>0.4) rs.forEach(s=>{ if(mx-s.t()>0.4) s.seek(mx); });
  },1200);
  const btn=$("#cmpBtn"); if(btn) btn.textContent="Hide compare";
}
function hideCompare(){
  clearInterval(cmpSyncTimer); cmpSyncTimer=null;
  if(cmpCtl) cmpCtl.sides.forEach(s=>{ if(s.kind==="yt"&&s.player&&s.player.destroy) try{s.player.destroy();}catch(e){} });
  cmpCtl=null;
  $("#cmpZone").innerHTML=""; $("#artZone").style.display="";
  const btn=$("#cmpBtn"); if(btn) btn.textContent="Compare versions";
}
function toggleCompare(){
  if(!cur) return;
  cmpOn=!cmpOn;
  history.replaceState(null,"", cmpOn?`#/p/${cur.id}/compare`:`#/p/${cur.id}`);
  cmpOn?showCompare(cur):hideCompare();
}

    <div class="f-top"><button class="ghostbtn" onclick="goHome()">← Board</button>
      <span class="f-stage">The Bench · Archer's domain</span></div>
    <h2>Not ready for <b>your eye — yet.</b></h2>
    <div class="counts">Visibility on this board is computed from checklists: crossed = it appears in your sections; uncrossed = it waits here, with the missing items named. Nothing renders on a promise.</div>
    ${asks.length?`<div class="bench-group"><div class="micro" style="font-size:10.5px">Asks being readied</div><div id="benchAsks"></div></div>`:""}
    ${grp("Style Lab — packages incomplete", labs.map(t=>labRowHTML(t, true)).join(""))}
    ${grp("Media — no web-playable copy yet", media.map(p=>`<div class="bench-row"><span>${esc(p.title)}</span><span class="bench-miss">${esc(p.media_missing)}</span><button class="ghostbtn" onclick="location.hash='#/p/${p.id}'">Open</button></div>`).join(""))}
    ${grp("Surfaces gated off", cmps.map(p=>`<div class="bench-row"><span>Compare — ${esc(p.title)}</span><span class="bench-miss">missing: ${esc((p.compare_missing||[]).join(" · "))}</span></div>`).join(""))}
    ${(!asks.length&&!labs.length&&!media.length&&!cmps.length)?`<div class="bench-note">The bench is empty — every checklist on the board currently crosses.</div>`:""}`;
  const ba=$("#benchAsks");
  asks.forEach(r=>ba.appendChild(askRowEl(r)));
  wireLabRows($("#benchInner"));
}
/* ---------- style lab (layered; only crossed packages render) ---------- */
function renderLab(){
  const vis=S.style_lab.filter(t=>t.visible_to_hadi);
  $("#labInner").innerHTML=`
    <div class="f-top"><button class="ghostbtn" onclick="goHome()">← Board</button>
      <span class="f-stage">Style Lab</span></div>
    <h2>One pick becomes <b>the standard.</b></h2>
    <div class="counts">Micro A/B tests. Your winner is written into the template for every video after it.</div>
    ${vis.length
      ? `<div style="margin-top:26px">${vis.map(t=>labRowHTML(t, false)).join("")}</div>`
      : `<div class="bench-note">Nothing here is ready for your eye yet — every test's package checklist is incomplete, so the tests wait on the <a href="#/bench">Bench</a> with their missing items named. The first tests land with the Ep.1 rebuild — package incomplete until the clips exist.</div>`}`;
  wireLabRows($("#labInner"));
}
/* ---------- routing ---------- */
function goHome(){ location.hash="#/"; }
function showView(id){
  ["library","labView","kanbanView","benchView"].forEach(v=>{
    const el=document.getElementById(v);
    const on = v===id;
    el.classList.toggle("open", on); el.setAttribute("aria-hidden", on?"false":"true");
    if(on) el.scrollTop=0;
  });
  setSeg(id==="kanbanView" ? "kanban" : id==="benchView" ? "bench" : "board");
}
function setSeg(view){
  const map={vwBoard:"board", vwKanban:"kanban", vwBench:"bench"};
  Object.entries(map).forEach(([id, v])=>{
    const el=document.getElementById(id); if(el) el.classList.toggle("on", v===view);
  });
}
function route(){
  const m=location.hash.match(/^#\/p\/([\w-]+)(?:\/(compare|checks|script|listen|links|comment))?/);
  closeDrawer(); closeAsset();
  const am=location.hash.match(/^#\/asset\/([\w-]+)/);
  if(am){ showView("library"); renderLibrary(); openAsset(am[1]); return; }
  if(location.hash==="#/library"){
    $("#focus").classList.remove("open"); $("#rail").hidden=true;
    showView("library"); renderLibrary(); return;
  }
  if(location.hash==="#/lab"){
    $("#focus").classList.remove("open"); $("#rail").hidden=true;
    showView("labView"); renderLab(); return;
  }
  if(location.hash==="#/kanban"){
    $("#focus").classList.remove("open"); $("#rail").hidden=true;
    showView("kanbanView"); renderKanban(); return;
  }
  if(location.hash==="#/bench"){
    $("#focus").classList.remove("open"); $("#rail").hidden=true;
    showView("benchView"); renderBench(); return;
  }
  showView(null);
  if(m){ const p=byId(m[1]); if(p){ openFocus(p, m[2]==="compare");
      if(m[2] && m[2]!=="compare") setTimeout(()=>openDrawer(p, m[2]==="checks"?"check":m[2]), 350);
      return; } }
  cur=null; cmpOn=false;
  $("#focus").classList.remove("open"); $("#focus").setAttribute("aria-hidden","true");
  $("#rail").hidden=true; document.title="Production — Hadosh Academy";
}
window.addEventListener("hashchange", route);
renderAll(); route();
</script></body></html>
