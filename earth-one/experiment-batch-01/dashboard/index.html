<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earth One — Experiment Batch 02 · Review Dashboard (Batch 01 dashboard path)</title>
<meta name="description" content="Swipe-review dashboard for Earth One's Daily Language Challenge, Experiment Batch 02, served from the legacy Experiment Batch 01 dashboard path. Like, dislike and comment — feedback lands as GitHub issues.">
<style>
  :root{
    --ground:#17100a;
    --cream:#f7ecd7;
    --cream-dim:rgba(247,236,215,.72);
    --amber:#f2b04a;
    --terra:#e07856;
    --olive:#a8bf6f;
    --glass:rgba(38,26,16,.55);
    --glass-brd:rgba(255,214,150,.20);
    --glass-hi:rgba(255,240,214,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--cream);
    background:
      radial-gradient(120% 60% at 85% -5%, rgba(242,176,74,.20), transparent 60%),
      radial-gradient(100% 55% at -10% 105%, rgba(224,120,86,.16), transparent 60%),
      linear-gradient(180deg,#1d130b 0%, #17100a 45%, #120c07 100%);
    overflow:hidden;
  }
  /* ---------- top bar ---------- */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:40;
    display:flex;align-items:center;gap:10px;
    padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
    background:var(--glass);border-bottom:1px solid var(--glass-brd);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  }
  .brand{font-weight:800;letter-spacing:.14em;font-size:13px;color:var(--amber);white-space:nowrap}
  .brand span{display:block;letter-spacing:.02em;font-weight:600;font-size:11px;color:var(--cream-dim)}
  .topbar .batch{margin-left:auto;text-align:right;font-size:12px;color:var(--cream-dim);white-space:nowrap}
  .topbar .batch b{display:block;color:var(--cream);font-size:13px}
  /* the coverage line is a state claim, not a label: it wraps in full —
     truncating or clipping it would silently change the claim */
  #batchstate{flex:1 1 720px;max-width:880px;white-space:normal;line-height:1.35}
  /* PASS 123 (P56-2): the coverage line's TEXT stays verbatim behind a tap
     (single-source gate) — its container form changes: a short face
     (<=10 words exposed) + this expand button */
  .covbtn{
    margin-left:8px;padding:2px 10px;border-radius:999px;cursor:pointer;vertical-align:baseline;
    border:1px solid var(--amber);background:rgba(29,19,11,.85);color:var(--amber);
    font-size:11.5px;font-weight:800;font-family:inherit;white-space:nowrap;
  }
  .counter{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;
    padding:6px 10px;border-radius:999px;border:1px solid var(--glass-brd);
    background:var(--glass-hi);white-space:nowrap;
  }
  /* ---------- index rail ---------- */
  .railwrap{
    position:fixed;left:0;right:0;z-index:39;
    top:calc(57px + env(safe-area-inset-top));
    /* PASS 123 RETURN ROUND (P56-4, visual cure): the edge controls no
       longer share the chip row's band — they sit in their own strip
       ABOVE the chips, right-aligned at the viewport's width, so no
       scroll position of the rail can bring a chip's glyphs under a
       control and the two bands never overlap. The prep's in-row form
       still overprinted chip glyphs mid-scroll (frame p390-02-railend:
       "‹ Back" over chip 19, "More ›" over the clipped chip at the
       right edge); the frames for this form are p390-/p360-02v2-*. */
    display:flex;flex-direction:column;align-items:stretch;
  }
  .railnavrow{
    display:flex;justify-content:space-between;align-items:center;
    padding:2px 12px 0;min-height:26px;
  }
  .rail{
    display:flex;gap:8px;overflow-x:auto;padding:8px 12px;width:100%;box-sizing:border-box;
    /* pill-row reachability, phone leg (2026-11-08 pill-fix, on the v20
       base): at <=759px the rail stays a single scrollable row (PASS 46
       wrapped it only at >=760px), and a scroll no one can discover is a
       row that ends at chip ~3 — the pre-fix rules hid the scrollbar
       (scrollbar-width:none + ::-webkit-scrollbar{display:none}) and
       offered no other cue (PASS 39 flag a, phone leg). Now: a thin
       visible scrollbar + the edge controls below. At >=760px the rail
       wraps (PASS 46) and the controls are display:none there. */
    scrollbar-width:thin;scrollbar-color:var(--amber) transparent;
    overscroll-behavior-x:contain;
  }
  .rail::-webkit-scrollbar{display:block;height:4px}
  .rail::-webkit-scrollbar-thumb{background:var(--amber);border-radius:99px}
  .rail::-webkit-scrollbar-track{background:transparent}
  /* edge controls for the rail: 44px-wide tap targets seated in their
     own strip above the chips (PASS 123 return round, P56-4 visual cure
     — the absolute seats over the chips hid labels, and the in-row form
     still overprinted chip glyphs MID-SCROLL: its ∩=∅ measurement
     covered rest/end only). Each removes itself ([hidden]) when its
     direction is exhausted; seated in a separate band, a control can
     never cover a chip label at any scroll state */
  .railnav{
    position:static;flex:0 0 auto;margin:0;
    min-width:44px;height:24px;padding:0 10px;border-radius:999px;cursor:pointer;
    border:1px solid var(--amber);background:rgba(29,19,11,.94);color:var(--amber);
    font-size:12px;font-weight:800;font-family:inherit;line-height:1;
    box-shadow:0 4px 18px rgba(0,0,0,.5);
  }
  .railnav[hidden]{display:none}
  .chip{
    flex:0 0 auto;display:flex;align-items:center;gap:7px;
    padding:8px 12px;border-radius:999px;cursor:pointer;
    border:1px solid var(--glass-brd);color:var(--cream-dim);
    background:var(--glass);font-size:12.5px;font-weight:600;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;background:#a2937d;flex:0 0 auto}
  .chip.active{color:#1d130b;background:var(--amber);border-color:var(--amber)}
  .chip.active .dot{background:#1d130b}
  /* ---------- feed ---------- */
  .feed{
    height:100vh;height:100dvh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .feed::-webkit-scrollbar{display:none}
  /* PASS 123 (P56-1) + RETURN ROUND (P56-1 visual cure): at the feed's
     end state NOTHING of the last screen's stage may sit in the fixed
     chrome's zone (the glass is translucent; content behind it reads as
     bleed-through — frames p390-/p360-05-feedbottom). The feed therefore
     ends with a quiescent closing screen (see .feedend below): at max
     scroll the closing screen fills the chrome zone while the last
     screen rests fully below it — stage scrolled past, panel below,
     one layer, nothing behind the glass. (The prep's first form — a
     chrome-height spacer — shifted a taller-than-viewport last screen
     UP into the chrome and was removed; this form is measured on the
     v2 frames at both sizes.) RETURN ROUND 2 (the settled/end-state
     cure): the mechanism the v2 frames exposed is that a screen's
     stage is the flex-expanding region at the TOP of its screen, so a
     short cell's stage content rides at its screen's top edge, and the
     120px closing screen dragged the last screen's stage into the
     chrome zone at max scroll (stage top −29 at 390, −281 at 360 —
     its poster tags over the chips, its status pill and readiness
     lines over the coverage row). The cure takes the SAME measured
     number everywhere (--chrome-h, the full chrome height: 189px at
     phone widths, more while the coverage expansion is open): every
     screen's top padding clears it (+16px) so at a screen's settled
     rest (top edge at the viewport top — the scrollIntoView position
     a chip tap lands on) the stage begins BELOW the chrome; at phone
     widths each screen's min-height grows by the same number so the
     flex stage expands and a short cell's content sits lower in its
     screen; and the closing screen is a full viewport tall (above),
     so at max scroll the viewport contains only the closing screen.
     Judged from the v3 frames at both sizes. */
  /* feed-end closing screen: an empty, stage-less terminus a full
     viewport tall (PASS 123 RETURN ROUND 2 — it was 120px by a stray
     override, which dragged the last screen's stage into the chrome
     zone at max scroll), so at max scroll the chrome zone shows
     only this blank screen — the last screen's stage has scrolled
     entirely past it and its panel was read on the way */
  .feedend{
    height:100vh;height:100dvh;flex:0 0 auto;
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px;
  }
  .feedend .femark{
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(247,236,215,.38);font-weight:700;text-align:center;padding:0 24px;
  }
  /* a screen is a section in one continuous scroll flow, never a fixed-height
     snap page: min-height (not height) lets an expanded panel grow the screen
     instead of overflowing it onto its neighbours */
  .screen{
    min-height:100vh;min-height:100dvh;
    position:relative;display:flex;flex-direction:column;
    padding:calc(118px + env(safe-area-inset-top)) 12px calc(30px + env(safe-area-inset-bottom));
  }
  /* the stage is an in-flow flex child: its box ends where the panel begins,
     so panel overlap of video/poster content is impossible by construction */
  /* the stage's content is anchored to the stage's BOTTOM edge (the
     panel edge), never centred: PASS 123 RETURN ROUND 2 measured the
     centred form leaking — with the min-height growth the stage is
     taller than the poster, and a centred poster's bottom lines float
     up into the chrome zone at the panel's scroll-margin rest (poster
     bottom 168 < chrome 189 at the Details rest). Bottom-anchored, the
     poster's lowest line sits at the stage's bottom = the panel's top,
     which the panel's scroll-margin keeps at chrome + 16 in every
     resting state; at a screen's settled rest the same anchor moves
     the poster DOWN (top 280 vs centred 242 at 390×844), further from
     the chrome. Video fills the stage box either way (height:100%). */
  .stage{position:relative;flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
  .stage video{width:100%;height:100%;object-fit:contain;background:#000}
  /* poster / status card */
  .poster{max-width:520px;width:100%;padding:24px 10px;text-align:center}
  .poster .eyebrow{font-size:12px;letter-spacing:.22em;color:var(--amber);font-weight:700;text-transform:uppercase}
  .poster .sentence{
    font-family:Georgia,"Times New Roman",serif;font-weight:700;
    font-size:clamp(34px,9.5vw,54px);line-height:1.12;margin:16px 0 14px;color:var(--cream);
    text-shadow:0 4px 30px rgba(0,0,0,.45);
  }
  .poster .flow{font-size:16px;color:var(--cream-dim);margin-bottom:18px}
  .poster .flow b{color:var(--cream)}
  .poster .tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
  .tag{font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px solid var(--glass-brd);background:var(--glass-hi);white-space:nowrap}
  .statuspill{
    display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;
    padding:9px 15px;border-radius:999px;border:1px solid var(--glass-brd);
    background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  }
  .statuspill .dot{width:9px;height:9px;border-radius:50%}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .poster .lands{margin-top:14px;font-size:13px;color:var(--cream-dim)}
  /* ---------- glass panel ---------- */
  .panel{
    position:relative;z-index:2;border-radius:22px;padding:14px 14px 12px;flex:0 0 auto;
    /* scrollIntoView on Details-open lands the panel head under the fixed
       header + rail, never beneath them. The margin must clear the header
       as it actually stands at this width, so it takes the same values
       PASS 46 gave .screen's top padding for the same breakpoints
       (116px dated from the one-row rail: measured 2026-11-08 pill-fix —
       panel top landed at 116 while the rail's bottom edge sat at 158
       desktop / 268 phone, occluding the panel head) */
    scroll-margin-top:calc(284px + env(safe-area-inset-top));
    background:var(--glass);border:1px solid var(--glass-brd);
    -webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  /* collapse handle: the panel can always be folded to a slim bar */
  .handle{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    min-height:36px;margin:-6px 0 8px;padding:6px 10px;border-radius:12px;
    border:1px solid transparent;background:transparent;color:var(--cream-dim);
    font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .handle:active{background:var(--glass-hi)}
  .handle .hchev{font-size:12px;color:var(--amber)}
  .panel.collapsed{padding:8px 14px}
  .panel.collapsed .pbody{display:none}
  .panel.collapsed .handle{margin:0}
  .titleline{font-size:16.5px;font-weight:700;line-height:1.3}
  .titleline .meta{color:var(--amber);font-weight:700}
  .subline{font-size:12.5px;color:var(--cream-dim);margin-top:3px}
  /* reviewer seats — readiness summary up front (one big number + failing
     seats only); the full roster lives in the Details drawer */
  .readiness{display:flex;align-items:baseline;gap:9px;margin-top:11px}
  .readiness .rbig{font-size:27px;font-weight:900;color:var(--cream);line-height:1}
  .readiness .rlab{font-size:12.5px;color:var(--cream-dim)}
  .flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .rnote{font-size:11.5px;color:var(--cream-dim);margin-top:7px}
  .reviews{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
  .reviews .rcount{font-size:12.5px;font-weight:800;color:var(--cream);margin-right:2px}
  .rchip{
    font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:999px;
    border:1px solid var(--glass-brd);background:rgba(0,0,0,.22);color:var(--cream-dim);white-space:nowrap;
  }
  .rchip.pass{border-color:rgba(134,214,106,.65);color:#b9e39d}
  .rchip.accepted{border-color:rgba(242,176,74,.75);color:var(--amber)}
  .rchip.running{border-color:var(--amber);color:var(--amber)}
  .rchip.fail{border-color:var(--terra);color:#f0a58e}
  .poster .revcount{margin-top:12px;font-size:12.5px;font-weight:800;color:var(--cream-dim)}
  .poster .revcount b{color:var(--cream)}
  .actions{display:flex;gap:9px;margin-top:12px}
  .fb{
    flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
    min-height:50px;border-radius:14px;border:1px solid var(--glass-brd);
    background:var(--glass-hi);color:var(--cream);
    font-size:16px;font-weight:700;cursor:pointer;
  }
  .fb:active{transform:scale(.97)}
  .fb.like.sel{background:#3d5a1e;border-color:#86d66a}
  .fb.dislike.sel{background:#5f2417;border-color:var(--terra)}
  .fb.details{flex:0 0 104px;font-size:14.5px}
  .commentrow{display:flex;gap:9px;margin-top:9px}
  .commentrow textarea{
    flex:1;min-height:50px;max-height:96px;resize:vertical;
    border-radius:14px;border:1px solid var(--glass-brd);
    background:rgba(0,0,0,.28);color:var(--cream);
    padding:12px;font-size:15px;font-family:inherit;
  }
  .commentrow textarea::placeholder{color:rgba(247,236,215,.45)}
  .send{
    flex:0 0 92px;border-radius:14px;border:1px solid var(--amber);
    background:var(--amber);color:#1d130b;font-size:15px;font-weight:800;cursor:pointer;
  }
  .send:active{transform:scale(.97)}
  .hint{font-size:11.5px;color:var(--cream-dim);margin-top:8px}
  /* details drawer: grid-rows sizing animates to the content's natural
     height — no fixed max-height cap, so drawer content is never clipped */
  .drawer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
  .drawer.open{grid-template-rows:1fr}
  .drawer .inner{overflow:hidden;min-height:0;padding-top:12px}
  .drow{display:flex;gap:10px;padding:7px 0;border-top:1px solid rgba(255,214,150,.12);font-size:13.5px;line-height:1.45}
  .drow .k{flex:0 0 108px;color:var(--amber);font-weight:700}
  .drow .v{color:var(--cream)}
  /* ---------- toast ---------- */
  /* no floating prev/next arrows: a fixed control floating over the panel
     occludes the text it sits on (owner screenshots 2026-11-08). Navigation
     is the rail chips + the scroll itself. */
  .toast{
    position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    z-index:50;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:700;
    background:var(--glass);border:1px solid var(--glass-brd);color:var(--cream);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    opacity:0;pointer-events:none;transition:all .3s ease;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (min-width:760px){
    /* desktop index rail: the batch index WRAPS — every one of the 22
       chips is on the page, none parked off-screen behind a scroll
       (PASS 39 flag a). The rail chips carry number + opening only;
       architecture lives in the poster + Details. Screen top padding
       clears the taller wrapped rail + coverage header. */
    .railwrap{top:calc(70px + env(safe-area-inset-top))}
    .rail{flex-wrap:wrap;overflow-x:visible;row-gap:8px}
    .railnav{display:none}
    .screen{padding-left:24px;padding-right:24px;padding-top:calc(196px + env(safe-area-inset-top))}
    .panel{max-width:640px;margin:0 auto;width:100%;scroll-margin-top:calc(196px + env(safe-area-inset-top))}
    .poster .sentence{font-size:56px}
  }
  /* PASS 123 RETURN ROUND 2: the closing screen is a full viewport at
     every width (see .feedend above) — the former height:auto /
     min-height:120px override here is REMOVED: it was the defect's
     mechanism (a 120px terminus drags the last screen's stage into
     the chrome zone at max scroll) */
  @media (min-width:760px) and (max-width:1099px){
    .screen{padding-top:calc(238px + env(safe-area-inset-top))}
    .panel{scroll-margin-top:calc(238px + env(safe-area-inset-top))}
  }
  @media (max-width:759px){
    /* phone header: the v20 coverage line is long — it takes its own
       full-width row under the brand row instead of pushing the counter
       and itself off-screen (PASS 46 phone-width check, staged bytes) */
    .topbar{flex-wrap:wrap;row-gap:4px}
    .topbar .batch{margin-left:0;white-space:normal;flex:1 1 150px}
    #batchstate{order:4;flex:1 1 100%;max-width:none;text-align:left;font-size:11.5px}
    .counter{margin-left:auto}
    .railwrap{top:var(--rail-top, calc(220px + env(safe-area-inset-top)))}
    /* PASS 123 RETURN ROUND 2 (settled-state cure): the screen's top
       padding clears the FULL measured chrome height (--chrome-h,
       189px at phone widths, more while the coverage expansion is
       open — fitChrome re-measures on the toggle) + 16px, so the stage
       begins below the chrome at the screen's settled rest; the
       screen's min-height grows by the same measured number, so the
       flex stage expands and a short cell's content sits lower in its
       screen instead of riding its top edge. The panel's scroll-margin
       takes the SAME number (+16px), audited this round: a Details tap
       lands the panel head at chrome bottom + 16, never under it. */
    .screen{padding-top:calc(var(--chrome-h, 268px) + 16px + env(safe-area-inset-top));min-height:calc(100dvh + var(--chrome-h, 268px))}
    .panel{scroll-margin-top:calc(var(--chrome-h, 268px) + 16px + env(safe-area-inset-top))}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">EARTH ONE<span>The Daily Language Challenge</span></div>
  <div class="batch"><b>Experiment Batch 02</b>review dashboard · Batch 01 path (legacy)</div>
  <div class="batch" id="dashver" style="text-align:right"></div>
  <div class="batch" id="batchstate" style="text-align:right"></div>
  <div class="counter" id="counter">– / –</div>
</header>

<div class="railwrap">
<div class="railnavrow">
<button class="railnav prev" id="railPrev" type="button" aria-label="Scroll the cell index back" hidden>&#8249; Back</button>
<button class="railnav next" id="railNext" type="button" aria-label="Scroll the cell index for more cells">More &#8250;</button>
</div>
<nav class="rail" id="rail" aria-label="Batch index"></nav>
</div>

<main class="feed" id="feed"></main>

<div class="toast" id="toast">Opening your GitHub issue…</div>

<script src="data.js?v=25"></script>
<script>
(function(){
  "use strict";
  var REPO = (window.BATCH_META && window.BATCH_META.repo) || "hadi-nayebi/hadosh-production-contexts";
  var CELLS = window.BATCH_CELLS || [];
  var STATUS_COLORS = {
    "ready": "#86d66a",
    "recut": "#f2b04a",
    "recut-owed": "#e07856",
    "inbuild": "#ffd97a",
    "planned": "#a2937d"
  };
  var ARCH_COLORS = { "A": "#f2b04a", "B": "#e07856", "C": "#a8bf6f" };
  var feed = document.getElementById("feed");
  var rail = document.getElementById("rail");
  var counter = document.getElementById("counter");
  var toast = document.getElementById("toast");
  var current = 0;
  var verdicts = {}; /* cellId -> "like" | "dislike" */
  var topbarEl = document.querySelector(".topbar");
  var railwrapEl = document.querySelector(".railwrap");
  var screenEls = [];
  /* PASS 123 (P56-3): the fixed chrome is MEASURED, not guessed — the rail
     sits directly under the topbar (the ~61px empty band is gone) and the
     feed's top padding + the panels' scroll-margin take the measured
     chrome height. Phone widths only; the desktop layout keeps its
     static clearances. */
  function fitChrome(){
    if (window.innerWidth > 759 || !topbarEl || !railwrapEl) return;
    var tb = topbarEl.getBoundingClientRect();
    document.documentElement.style.setProperty("--rail-top", Math.round(tb.bottom) + "px");
    var rw = railwrapEl.getBoundingClientRect();
    var chromeH = Math.round(rw.bottom);
    document.documentElement.style.setProperty("--chrome-h", chromeH + "px");
  }

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }
  function taughtLine(cell){ return cell.taught.join(" · "); }

  var ROSTER = window.BATCH_REVIEWS || [];
  var bs = document.getElementById("batchstate");
  if (bs && window.BATCH_META && window.BATCH_META.coverage) {
    /* PASS 123 (P56-2, ten-word law): the coverage line's TEXT stays
       verbatim — it renders in full behind the tap; the resting face is a
       short summary (<=10 words exposed in the container) + a More button */
    var covText = window.BATCH_META.coverage;
    var covM = /exactly one: (G\d+)/.exec(covText);
    var covShort = document.createElement("span");
    covShort.textContent = "Coverage — one open item" + (covM ? " (" + covM[1] + ")" : "");
    var covFull = document.createElement("span");
    covFull.textContent = covText;
    covFull.hidden = true;
    var covBtn = document.createElement("button");
    covBtn.type = "button";
    covBtn.className = "covbtn";
    covBtn.textContent = "More ›";
    covBtn.setAttribute("aria-expanded", "false");
    covBtn.setAttribute("aria-label", "Show the full coverage line");
    covBtn.addEventListener("click", function(){
      var open = covFull.hidden;
      covFull.hidden = !open;
      covShort.hidden = open;
      covBtn.textContent = open ? "‹ Less" : "More ›";
      covBtn.setAttribute("aria-expanded", open ? "true" : "false");
      fitChrome();
    });
    bs.appendChild(covShort);
    bs.appendChild(covBtn);
    bs.appendChild(covFull);
  }
  var dv = document.getElementById("dashver");
  if (dv && window.BATCH_META && window.BATCH_META.dashboard) {
    /* PASS 144 (F-V24-1a): the dashboard version renders FROM THE DATA —
       BATCH_META.dashboard is the only source; no version literal lives in
       this file, so the next round's data changes the visible line with no
       edit here. Same ten-word shape as the coverage line above: the
       resting face is "Dashboard vNN" (the string's leading version
       token); the full string stays verbatim behind the tap. */
    var dvText = window.BATCH_META.dashboard;
    var dvM = /^v\d+/.exec(dvText);
    var dvShort = document.createElement("span");
    dvShort.textContent = "Dashboard " + (dvM ? dvM[0] : dvText.split(" ")[0]);
    var dvFull = document.createElement("span");
    dvFull.textContent = dvText;
    dvFull.hidden = true;
    var dvBtn = document.createElement("button");
    dvBtn.type = "button";
    dvBtn.className = "covbtn";
    dvBtn.textContent = "More ›";
    dvBtn.setAttribute("aria-expanded", "false");
    dvBtn.setAttribute("aria-label", "Show the full dashboard version line");
    dvBtn.addEventListener("click", function(){
      var open = dvFull.hidden;
      dvFull.hidden = !open;
      dvShort.hidden = open;
      dvBtn.textContent = open ? "‹ Less" : "More ›";
      dvBtn.setAttribute("aria-expanded", open ? "true" : "false");
      fitChrome();
    });
    dv.appendChild(dvShort);
    dv.appendChild(dvBtn);
    dv.appendChild(dvFull);
  }
  function reviewState(cell, key){
    var r = cell.reviews || {};
    return r[key] || "pending";
  }
  function countingSeats(){
    return ROSTER.filter(function(seat){ return seat.counts !== false; }).length;
  }
  function reviewCount(cell){
    var n = 0;
    ROSTER.forEach(function(seat){ if (seat.counts !== false && reviewState(cell, seat.key) === "pass") n++; });
    return n;
  }
  function reviewsHTML(cell){
    if (!ROSTER.length) return "";
    var fails = [], running = 0;
    ROSTER.forEach(function(seat){
      var st = reviewState(cell, seat.key);
      if (st === "fail") fails.push(seat);
      if (st === "running") running++;
    });
    var h = '<div class="readiness"><span class="rbig">' + reviewCount(cell) + '/' + countingSeats() + '</span>' +
      '<span class="rlab">readiness — decisive passes only (code + confirmed/armed guards; provisional + advisory never count)</span></div>';
    if (fails.length) {
      h += '<div class="flags">' + fails.map(function(seat){
        return '<span class="rchip fail">✗ ' + esc(seat.label) + '</span>';
      }).join("") + '</div>';
    }
    h += '<div class="rnote">' + (running ? running + ' running · provisional + advisory verdicts in Details — never counted' : 'Provisional + advisory verdicts in Details — never counted') + '</div>';
    return h;
  }
  function rosterHTML(cell){
    if (!ROSTER.length) return "";
    return '<div class="reviews">' + ROSTER.map(function(seat){
      var st = reviewState(cell, seat.key);
      var mark = st === "pass" ? "✓ " : st === "accepted" ? "◐ " : st === "running" ? "⟳ " : st === "fail" ? "✗ " : "· ";
      return '<span class="rchip ' + st + '">' + mark + esc(seat.label) + '</span>';
    }).join("") + '</div>';
  }

  function issueURL(cell, verdict, comment){
    var title = "[Batch02][" + cell.id + "] " + verdict + ": " + cell.sentence + " (" + cell.opening + ")";
    var body = [
      "Cell: " + cell.id,
      "Video file: " + (cell.file || "not built yet"),
      "Status: " + cell.statusLabel,
      "Verdict: " + verdict,
      "",
      "Comment:",
      (comment && comment.trim()) ? comment.trim() : "(no comment written)",
      "",
      "---",
      "From the Experiment Batch 02 review dashboard.",
      "Sentence: \"" + cell.sentence + "\" · Opening: " + cell.opening +
        " → " + taughtLine(cell) + " · Architecture: " + cell.arch + " " + cell.archName +
        " · Length: " + cell.length + " (" + cell.lengthLabel + ")"
    ].join("\n");
    var labels = ["batch-02", "feedback", verdict].join(",");
    return "https://github.com/" + REPO + "/issues/new" +
      "?title=" + encodeURIComponent(title) +
      "&body=" + encodeURIComponent(body) +
      "&labels=" + encodeURIComponent(labels);
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toast.classList.remove("show"); }, 2600);
  }

  function openIssue(cell, verdict, comment){
    verdicts[cell.id] = (verdict === "comment") ? (verdicts[cell.id] || "comment") : verdict;
    window.open(issueURL(cell, verdict, comment), "_blank", "noopener");
    showToast("Opening your GitHub issue — one tap there sends it.");
  }

  function buildScreen(cell){
    var screen = document.createElement("section");
    screen.className = "screen";
    screen.dataset.id = cell.id;
    var color = STATUS_COLORS[cell.status] || "#a2937d";
    var busy = (cell.status === "recut" || cell.status === "inbuild");

    var stage;
    if (cell.video){
      stage = '<video src="' + esc(cell.video) + '"' +
        (cell.poster ? ' poster="' + esc(cell.poster) + '"' : '') +
        ' playsinline controls preload="metadata"></video>';
    } else {
      stage =
        '<div class="poster">' +
          '<div class="eyebrow">Cell ' + String(cell.n).padStart(2,"0") + ' · ' + esc(cell.archName) + '</div>' +
          '<div class="sentence">&ldquo;' + esc(cell.sentence) + '&rdquo;</div>' +
          '<div class="flow"><b>' + esc(cell.opening) + ' opening</b> &nbsp;→&nbsp; teaches ' + esc(taughtLine(cell)) + '</div>' +
          '<div class="tags">' +
            '<span class="tag" style="border-color:' + (ARCH_COLORS[cell.arch] || "#ccc") + '">Architecture ' + esc(cell.arch) + ' · ' + esc(cell.archName) + '</span>' +
            '<span class="tag">' + esc(cell.lengthLabel) + '</span>' +
          '</div>' +
          '<div class="statuspill"><span class="dot' + (busy ? " pulse" : "") + '" style="background:' + color + '"></span>' + esc(cell.statusLabel) + '</div>' +
          '<div class="revcount">Readiness <b>' + reviewCount(cell) + '/' + countingSeats() + '</b> decisive checks passing</div>' +
          '<div class="lands">In production — full state in Details.</div>' +
        '</div>';
    }

    var drawerRows = [
      ["Sentence", "&ldquo;" + esc(cell.sentence) + "&rdquo;"],
      ["Opening → taught", esc(cell.opening) + " → " + esc(taughtLine(cell))],
      ["Architecture", esc(cell.arch) + " · " + esc(cell.archName)],
      ["Length", esc(cell.length) + " · " + esc(cell.lengthLabel)],
      ["Hook", esc(cell.hook)],
      ["Reviewers", rosterHTML(cell)],
      ["Gate status", esc(cell.gate)],
      ["About this cell", esc(cell.about)]
    ].map(function(r){
      return '<div class="drow"><div class="k">' + r[0] + '</div><div class="v">' + r[1] + '</div></div>';
    }).join("");

    screen.innerHTML =
      '<div class="stage">' + stage + '</div>' +
      '<div class="panel">' +
        '<button class="handle" type="button" aria-label="Hide or show the review panel">' +
          '<span class="hlabel">Hide panel</span><span class="hchev">▾</span>' +
        '</button>' +
        '<div class="pbody">' +
        '<div class="titleline">&ldquo;' + esc(cell.sentence) + '&rdquo; <span class="meta">— ' +
          esc(cell.opening) + ' opening</span></div>' +
        '<div class="subline">Cell ' + String(cell.n).padStart(2,"0") + ' of ' + CELLS.length +
          ' · teaches ' + esc(taughtLine(cell)) + '</div>' +
        reviewsHTML(cell) +
        '<div class="actions">' +
          '<button class="fb like" type="button">👍 Like</button>' +
          '<button class="fb dislike" type="button">👎 Dislike</button>' +
          '<button class="fb details" type="button">Details ▾</button>' +
        '</div>' +
        '<div class="commentrow">' +
          '<textarea rows="2" placeholder="Comment on this video… (rides into the issue)"></textarea>' +
          '<button class="send" type="button">Send ➤</button>' +
        '</div>' +
        '<div class="hint">Each tap opens a prefilled GitHub issue.</div>' +
        '<div class="drawer"><div class="inner">' + drawerRows + '</div></div>' +
        '</div>' +
      '</div>';

    var panel = screen.querySelector(".panel");
    var handleBtn = screen.querySelector(".handle");
    var hlabel = screen.querySelector(".hlabel");
    var hchev = screen.querySelector(".hchev");
    handleBtn.addEventListener("click", function(){
      var collapsed = panel.classList.toggle("collapsed");
      hlabel.textContent = collapsed ? "Show panel" : "Hide panel";
      hchev.textContent = collapsed ? "▴" : "▾";
    });

    var likeBtn = screen.querySelector(".fb.like");
    var dislikeBtn = screen.querySelector(".fb.dislike");
    var detailsBtn = screen.querySelector(".fb.details");
    var sendBtn = screen.querySelector(".send");
    var ta = screen.querySelector("textarea");
    var drawer = screen.querySelector(".drawer");

    function paintVerdict(){
      likeBtn.classList.toggle("sel", verdicts[cell.id] === "like");
      dislikeBtn.classList.toggle("sel", verdicts[cell.id] === "dislike");
    }
    likeBtn.addEventListener("click", function(){
      verdicts[cell.id] = "like"; paintVerdict();
      openIssue(cell, "like", ta.value);
    });
    dislikeBtn.addEventListener("click", function(){
      verdicts[cell.id] = "dislike"; paintVerdict();
      openIssue(cell, "dislike", ta.value);
    });
    sendBtn.addEventListener("click", function(){
      var v = (verdicts[cell.id] === "like" || verdicts[cell.id] === "dislike") ? verdicts[cell.id] : "comment";
      openIssue(cell, v, ta.value);
    });
    detailsBtn.addEventListener("click", function(){
      var open = drawer.classList.toggle("open");
      detailsBtn.textContent = open ? "Details ▴" : "Details ▾";
      if (open) {
        /* bring the panel head to the top of the reading area (under the
           fixed header + rail, via the panel's scroll-margin) so the reader
           starts the drawer from its top and scrolls down through it */
        setTimeout(function(){
          panel.scrollIntoView({ behavior: "smooth", block: "start" });
        }, 60);
      }
    });
    return screen;
  }

  function buildRail(){
    CELLS.forEach(function(cell, i){
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.innerHTML = '<span class="dot" style="background:' + (STATUS_COLORS[cell.status] || "#a2937d") + '"></span>' +
        esc(String(cell.n).padStart(2,"0")) + ' · ' + esc(cell.opening);
      chip.addEventListener("click", function(){ goTo(i); });
      rail.appendChild(chip);
    });
  }

  function goTo(i){
    i = Math.max(0, Math.min(CELLS.length - 1, i));
    if (screenEls[i]) screenEls[i].scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function setCurrent(i){
    if (i === current && counter.dataset.set) { /* still refresh videos */ }
    current = i;
    counter.textContent = (i + 1) + " / " + CELLS.length;
    counter.dataset.set = "1";
    Array.prototype.forEach.call(rail.children, function(chip, j){
      chip.classList.toggle("active", j === i);
      if (j === i) chip.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
    });
    Array.prototype.forEach.call(screenEls, function(screen, j){
      var v = screen.querySelector("video");
      if (!v) return;
      if (j !== i && !v.paused) v.pause();
    });
  }

  CELLS.forEach(function(cell){ feed.appendChild(buildScreen(cell)); });
  /* PASS 123 RETURN ROUND (P56-1 visual cure) + RETURN ROUND 2: the
     feed ends with a quiescent closing screen — no stage, no panel — a
     FULL VIEWPORT tall, so at max scroll the viewport (and therefore
     the chrome zone) contains only this blank screen and the last
     screen's stage sits entirely above the viewport, instead of the
     120px terminus dragging it into the chrome zone. It is NOT a
     .screen (the count/current-cell machinery ignores it). */
  var feedend = document.createElement("div");
  feedend.className = "feedend";
  feedend.setAttribute("aria-hidden", "true");
  feedend.innerHTML = '<div class="femark">End of batch — 22 cells</div>';
  feed.appendChild(feedend);
  screenEls = Array.prototype.filter.call(feed.children, function(el){ return el.classList.contains("screen"); });
  buildRail();

  /* pill-row reachability, phone leg (2026-11-08 pill-fix): the rail's edge
     controls. Each control removes itself when its scroll direction is
     exhausted, so the end chips are never occluded by the control that
     revealed them. At >=760px the rail wraps (PASS 46), nothing scrolls,
     and CSS keeps the controls display:none. */
  var railPrev = document.getElementById("railPrev");
  var railNext = document.getElementById("railNext");
  function updateRailNav(){
    var max = rail.scrollWidth - rail.clientWidth;
    if (railPrev) railPrev.hidden = rail.scrollLeft <= 4;
    if (railNext) railNext.hidden = max <= 4 || rail.scrollLeft >= max - 4;
  }
  /* instant jumps, one full rail width per tap: a paged index the owner
     pages deliberately — no animated drift, and the landing position is
     deterministic (the control's effect is exactly one page, every tap) */
  if (railPrev) railPrev.addEventListener("click", function(){ rail.scrollBy({ left: -rail.clientWidth }); updateRailNav(); });
  if (railNext) railNext.addEventListener("click", function(){ rail.scrollBy({ left: rail.clientWidth }); updateRailNav(); });
  rail.addEventListener("scroll", updateRailNav, { passive: true });
  window.addEventListener("resize", updateRailNav);
  window.addEventListener("resize", fitChrome);
  updateRailNav();
  fitChrome();
  setTimeout(fitChrome, 400);
  /* PASS 123 RETURN ROUND 2: the measured chrome number drives the
     screens' padding, min-height and the panels' scroll-margin — it
     must never be a stale first-paint measurement, so it is re-measured
     once everything (fonts, posters) has loaded, and again shortly
     after */
  window.addEventListener("load", fitChrome);
  setTimeout(fitChrome, 1200);

  counter.textContent = CELLS.length ? ("1 / " + CELLS.length) : "0 / 0";

  /* current-cell detection uses a middle band, not a visibility fraction:
     an expanded screen is taller than the viewport and can never reach a
     0.6 intersection ratio, which would freeze the counter and the rail */
  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (e.isIntersecting){
        var idx = Array.prototype.indexOf.call(screenEls, e.target);
        if (idx >= 0) setCurrent(idx);
      }
    });
  }, { root: feed, rootMargin: "-38% 0px -55% 0px", threshold: 0 });
  Array.prototype.forEach.call(screenEls, function(s){ observer.observe(s); });

  document.addEventListener("keydown", function(e){
    if (e.key === "ArrowDown" || e.key === "PageDown") goTo(current + 1);
    else if (e.key === "ArrowUp" || e.key === "PageUp") goTo(current - 1);
  });
})();
</script>
</body>
</html>
