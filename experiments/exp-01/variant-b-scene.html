<script>
"use strict";
// ---- timeline constants (segment-relative seconds; segment = full-piece 2.45..14.107) ----
const CARD_IN = 4.384;          // spoken word "prompt" (L2 ACCENT)
const GROW_T0 = 7.60, GROW_T1 = 8.30;   // card opens into the definition (after "things:" + reading hold)
const CARD_TOP0 = 880, CARD_H0 = 250, CARD_TOP1 = 590, CARD_H1 = 810;
const BAND_TOPS = [762, 968, 1174];     // final band tops (card-relative layout handled in abs coords below)
const BAND_H = 190;
const BAND_ON = [7.90, 8.75, 9.85];     // band rule/highlight draws, ahead of each phrase
const clamp01 = x => Math.min(1, Math.max(0, x));
const easeOut = p => 1 - Math.pow(1 - p, 3);           // cubic ease-out (A59 entry grammar)
const lerp = (a, b, p) => a + (b - a) * p;

function wordState(el, t) {
  const start = parseFloat(el.dataset.t);
  const principal = el.classList.contains("principal");
  const dur = principal ? 0.28 : 0.20;                  // A59: 0.28 s principal entry
  const rise = principal ? 24 : 10;                     // A59: rise 24 units for principal words
  const p = clamp01((t - start) / dur);
  const e = easeOut(p);
  let op = e, ty = (1 - e) * rise, sc = principal ? (0.82 + 0.18 * e) : (0.94 + 0.06 * e);
  return { op, ty, sc };
}
// group exit windows (quiet fades): [groupId, fadeStart, fadeEnd]
const EXITS = [ ["l1a", 4.02, 4.52], ["l1b", 4.02, 4.52],
                ["l2a", 4.92, 5.32], ["l2b", 4.92, 5.32] ];
function exitFactor(id, t) {
  for (const [g, a, b] of EXITS) if (g === id) return 1 - clamp01((t - a) / (b - a));
  return 1;
}
const $ = id => document.getElementById(id);

function renderAt(t) {
  // word entries, per group, with group exit factors
  document.querySelectorAll(".row, .band, #typedRow").forEach(rowEl => {
    const ef = exitFactor(rowEl.id, t);
    rowEl.querySelectorAll(".word").forEach(el => {
      const s = wordState(el, t);
      el.style.opacity = (s.op * ef).toFixed(3);
      el.style.transform = `translateY(${s.ty.toFixed(1)}px) scale(${s.sc.toFixed(3)})`;
    });
    if (rowEl.classList.contains("row")) rowEl.style.opacity = ef.toFixed(3);
  });
  // the prompt card: entry at CARD_IN with the principal grammar, as an object
  const card = $("card");
  const ep = easeOut(clamp01((t - CARD_IN) / 0.28));
  const gp = easeOut(clamp01((t - GROW_T0) / (GROW_T1 - GROW_T0)));
  const top = lerp(CARD_TOP0, CARD_TOP1, gp), h = lerp(CARD_H0, CARD_H1, gp);
  card.style.opacity = ep.toFixed(3);
  card.style.top = top.toFixed(1) + "px";
  card.style.height = h.toFixed(1) + "px";
  card.style.transform = `translateY(${((1 - ep) * 24).toFixed(1)}px) scale(${(0.82 + 0.18 * ep).toFixed(3)})`;
  // card face + typed line geometry follow the growth
  const face = $("cardFace");
  face.style.top = lerp(38, 26, gp) + "px";
  face.style.fontSize = lerp(88, 58, gp) + "px";
  const tr = $("typedRow");
  tr.style.top = lerp(150, 96, gp) + "px";
  tr.style.fontSize = lerp(56, 40, gp) + "px";
  // caret: visible while the typed line is being spoken, deterministic blink
  const caret = $("caret");
  const typing = (t > 5.10 && t < 6.45) ? 1 : 0;
  caret.style.opacity = typing * ((t * 2) % 1 < 0.55 ? 1 : 0.15);
  caret.style.height = lerp(56, 40, gp) + "px";
  // bands: highlight + rule draw ahead of each phrase; band tops are card-relative final, gated by growth
  for (let i = 0; i < 3; i++) {
    const bg = $("bg" + (i + 1)), band = $("band" + (i + 1));
    const bp = clamp01((t - BAND_ON[i]) / 0.25) * gp;
    const relTop = BAND_TOPS[i] - CARD_TOP1;         // final top relative to final card top
    bg.style.top = relTop + "px"; bg.style.height = BAND_H + "px"; bg.style.opacity = (bp * 0.9).toFixed(3);
    band.style.top = relTop + "px"; band.style.height = BAND_H + "px";
    band.style.borderTopColor = `rgba(150,112,32,${(bp * 0.85).toFixed(3)})`;
  }
  // ground light follows the card's base (contact only)
  const g = $("ground");
  g.style.top = (top + h - 90) + "px";
  g.style.opacity = (0.35 + 0.65 * ep).toFixed(3);
}
// browser playback mode: click to play; visuals follow the media clock
const mix = $("mix");
let raf = null;
function loop() { renderAt(mix.currentTime); if (!mix.paused) raf = requestAnimationFrame(loop); }
document.body.addEventListener("click", () => { if (mix.paused) { mix.play(); loop(); } });
if (!new URLSearchParams(location.search).has("render")) renderAt(0);
</script>
