<script>
"use strict";
const clamp01 = x => Math.min(1, Math.max(0, x));
const easeOut = p => 1 - Math.pow(1 - p, 3);
const lerp = (a, b, p) => a + (b - a) * p;
function entry(el, t, dur, rise, sc0) {
  const start = parseFloat(el.dataset.t);
  const e = easeOut(clamp01((t - start) / dur));
  el.style.opacity = e.toFixed(3);
  el.style.transform = `translateY(${(1 - e) * rise}px) scale(${(sc0 + (1 - sc0) * e).toFixed(3)})`;
  return e;
}
function renderAt(t) {
  // generic word entries
  document.querySelectorAll(".word").forEach(el => {
    const row = el.closest(".row, #billion").id;
    if (row === "l1a" || row === "l1b") {
      const e = entry(el, t, 0.55, 8, 0.97);
      el.style.letterSpacing = (lerp(0.30, 0.12, e)).toFixed(3) + "em";
    } else if (row === "billion") {
      const e = entry(el, t, 0.55, 30, 0.72);
      el.style.letterSpacing = (lerp(0.05, -0.01, e)).toFixed(3) + "em";
    } else if (row === "l3b" || row === "l3c") {
      const start = parseFloat(el.dataset.t);
      const e = easeOut(clamp01((t - start) / 0.5));
      el.style.opacity = e.toFixed(3);
      el.style.transform = `translateY(${(1 - e) * 10}px) scale(${(1.07 - 0.07 * e).toFixed(3)})`;
    } else {
      entry(el, t, 0.42, 14, 0.96);
    }
  });
  // ghost numeral glyphs assemble on One / point / two
  document.querySelectorAll(".glyph").forEach(g => {
    const e = easeOut(clamp01((t - parseFloat(g.dataset.g)) / 0.45));
    g.style.opacity = e.toFixed(3);
    g.style.transform = `scale(${(1.09 - 0.09 * e).toFixed(3)})`;
  });
  // dateline rule draws 1.00-1.40
  document.getElementById("rule").style.transform = `scaleX(${clamp01((t - 1.00) / 0.40).toFixed(3)})`;
  // L1 pushes up into a header as L2 begins (2.60-3.10), then yields fully by 5.60
  const push = easeOut(clamp01((t - 2.60) / 0.50));
  const yieldL1 = clamp01((t - 5.30) / 0.50);
  const gL1 = document.getElementById("gL1");
  gL1.style.transform = `translateY(${(-336 * push).toFixed(1)}px) scale(${(1 - 0.40 * push).toFixed(3)})`;
  gL1.style.opacity = ((1 - push) + push * 0.52 * (1 - yieldL1)).toFixed(3);
  // L2 recedes into depth as L3 takes the stage (5.48-6.10)
  const rec = easeOut(clamp01((t - 5.48) / 0.62));
  const gL2 = document.getElementById("gL2");
  gL2.style.opacity = (1 - 0.84 * rec).toFixed(3);
  gL2.style.transform = `scale(${(1 - 0.05 * rec).toFixed(3)}) translateY(${(14 * rec).toFixed(1)}px)`;
  // the dismissed claim dims once the correction lands (6.40-6.90)
  const dim = clamp01((t - 6.40) / 0.50);
  document.getElementById("l3a").style.opacity = (1 - 0.55 * dim).toFixed(3);
}
const mix = document.getElementById("mix");
let raf = null;
function loop() { renderAt(mix.currentTime); if (!mix.paused) raf = requestAnimationFrame(loop); }
document.body.addEventListener("click", () => { if (mix.paused) { mix.play(); loop(); } });
if (!new URLSearchParams(location.search).has("render")) renderAt(0);
</script>
