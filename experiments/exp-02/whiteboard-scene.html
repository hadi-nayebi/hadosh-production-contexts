<script>
"use strict";
const clamp01 = x => Math.min(1, Math.max(0, x));
const STROKES = [ ["st-circle",1.05,1.55], ["st-arrow",2.15,2.40], ["st-box1",3.35,4.05],
  ["st-cut",5.95,6.25], ["st-x1",7.85,8.10], ["st-x2",9.00,9.25], ["st-box2",10.05,10.50], ["st-flourish",10.15,10.60] ];
let measured = false;
function boxPath(r, px, py) {
  const x = r.left - px, y = r.top - py, w = r.width + 2 * px, h = r.height + 2 * py;
  return `M ${x + 12},${y} Q ${x + w / 2},${y - 5} ${x + w - 8},${y + 2} Q ${x + w + 4},${y + h / 2} ${x + w - 3},${y + h - 5} Q ${x + w / 2},${y + h + 5} ${x + 5},${y + h - 3} Q ${x - 4},${y + h / 2} ${x + 3},${y + 7} Q ${x + 5},${y - 3} ${x + 12},${y} Z`;
}
function ellipsePath(r, px, py) {
  const x = r.left - px, y = r.top - py, w = r.width + 2 * px, h = r.height + 2 * py, cx = x + w / 2, cy = y + h / 2;
  return `M ${cx},${y} C ${cx + w * 0.38},${y - 3} ${x + w + 3},${cy - h * 0.2} ${x + w},${cy} C ${x + w - 2},${cy + h * 0.32} ${cx + w * 0.3},${y + h + 3} ${cx},${y + h} C ${cx - w * 0.36},${y + h + 2} ${x - 3},${cy + h * 0.22} ${x},${cy} C ${x + 1},${cy - h * 0.3} ${cx - w * 0.32},${y - 3} ${cx},${y} Z`;
}
function xPath(r) {
  const x = r.left - 2, y = r.top + 2, w = r.width + 4, h = r.height - 4;
  return `M ${x},${y} L ${x + w},${y + h} M ${x + w},${y} L ${x},${y + h}`;
}
function measure() {
  const body = document.body.getBoundingClientRect();
  const rel = el => { const r = el.getBoundingClientRect(); return { left: r.left - body.left, top: r.top - body.top, width: r.width, height: r.height }; };
  document.getElementById("st-circle").setAttribute("d", ellipsePath(rel(document.getElementById("m-circle")), 16, 10));
  document.getElementById("st-box1").setAttribute("d", boxPath(rel(document.getElementById("m-chunk")), 14, 9));
  document.getElementById("st-box2").setAttribute("d", boxPath(rel(document.getElementById("m-box2")), 14, 9));
  document.getElementById("st-x1").setAttribute("d", xPath(rel(document.getElementById("m-x1"))));
  document.getElementById("st-x2").setAttribute("d", xPath(rel(document.getElementById("m-x2"))));
  measured = true;
}
function renderAt(t) {
  if (!measured) measure();
  document.querySelectorAll(".word").forEach(el => {
    const start = parseFloat(el.dataset.t);
    const p = clamp01((t - start) / 0.22);
    el.style.clipPath = `inset(0 ${(1 - p) * 100}% 0 0)`;
    el.style.opacity = (0.15 + 0.85 * p).toFixed(3);
  });
  const wipeNow = clamp01((t - 6.60) / 0.50);
  for (const [id, a, b] of STROKES) {
    const el = document.getElementById(id); if (!el) continue;
    const pr = clamp01((t - a) / (b - a));
    el.style.strokeDasharray = "100";
    el.style.strokeDashoffset = (100 * (1 - pr)).toFixed(1);
    const earlyInk = (id === "st-circle" || id === "st-box1") ? (1 - 0.94 * wipeNow) : 1;
    el.style.opacity = pr <= 0 ? "0" : earlyInk.toFixed(3);
  }
  // split-block sketch: outline draws 5.40-5.70, cut draws (stroke), halves separate 6.25-6.60
  const so = clamp01((t - 5.40) / 0.30);
  ["sp-left","sp-right"].forEach(id => {
    const el = document.getElementById(id);
    el.style.strokeDasharray = "500"; el.style.strokeDashoffset = (500 * (1 - so)).toFixed(1);
    el.style.opacity = so <= 0 ? "0" : "1";
  });
  const sep = clamp01((t - 6.25) / 0.35) * 12;
  document.getElementById("sp-left").style.transform = `translateX(${-sep}px)`;
  document.getElementById("sp-right").style.transform = `translateX(${sep}px)`;
  // board wipe: early content fades to a smudge 6.60-7.10; L3 writes in
  const wipe = clamp01((t - 6.60) / 0.50);
  document.getElementById("early").style.opacity = (1 - 0.94 * wipe).toFixed(3);
  document.getElementById("l3").style.opacity = clamp01((t - 6.60) / 0.30).toFixed(3);
}
const mix = document.getElementById("mix");
let raf = null;
function loop() { renderAt(mix.currentTime); if (!mix.paused) raf = requestAnimationFrame(loop); }

if (!new URLSearchParams(location.search).has("render")) renderAt(0);
