<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Canvas turns source audio and transcripts into editable browser-native illustrated productions."
    />
    <script>
      if (location.pathname === "/" || location.pathname.startsWith("/songs/lyrics")) {
        let theme = "dark";
        try {
          if (localStorage.getItem("canvas-lyrics-theme") === "light") theme = "light";
        } catch {}
        document.documentElement.dataset.canvasTheme = theme;
        document.documentElement.style.background = theme === "dark" ? "#101214" : "#eef3f7";
      }
    </script>
    <link rel="stylesheet" href="/src/canvas/song/lyricFocus/theme.css" />
    <title>Canvas Production Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
