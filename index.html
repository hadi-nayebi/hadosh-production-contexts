<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#03060b;color:white;font-family:system-ui,sans-serif;overflow:hidden}
#screen{position:absolute;inset:0;overflow:hidden;touch-action:manipulation}
#film{position:absolute;left:50%;top:50%;overflow:hidden;transform-origin:0 0;background:#020409;isolation:isolate}
.node{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.node>img{width:100%;height:100%;display:block;object-fit:fill;user-select:none}
#action{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);appearance:none;cursor:pointer;border:1px solid #e7f2ff85;background:#08121bda;color:#fff;border-radius:50%;width:58px;height:58px;display:grid;place-items:center;box-shadow:0 2px 22px #0007}
#action[hidden],#message[hidden]{display:none}#action:focus-visible{outline:2px solid #8ee2ff;outline-offset:5px}
.play{width:0;height:0;border-left:16px solid #f8fbff;border-top:10px solid transparent;border-bottom:10px solid transparent;transform:translateX(2px)}
#action.named{border-radius:25px;width:auto;height:auto;padding:12px 24px;white-space:nowrap;font:600 15px system-ui}
#message{position:absolute;left:10%;right:10%;bottom:10%;text-align:center;color:#fff;background:#111b;padding:12px}#folder{display:none}
