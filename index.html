:root{color-scheme:dark;--ivory:#f2eddf;--muted:#a5adba;--line:#ffffff25;--amber:#d9ad70}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05090f;color:var(--ivory);font-family:FilmSans,Arial,sans-serif;container-type:inline-size}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}
#film{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;cursor:pointer}body.playing #film{cursor:none}#controls{position:fixed;inset:0;z-index:3;background:linear-gradient(180deg,#05090f90,transparent 29%,transparent 54%,#05090fef);transition:opacity .18s ease;pointer-events:none}body.playing #controls{opacity:0;visibility:hidden}#controls>*{pointer-events:auto}
.top{position:absolute;inset:max(24px,env(safe-area-inset-top)) 4.5cqw auto;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:#e4dfd2}.edition{font-size:11px;color:#9ba6b5;letter-spacing:.04em;text-align:right}.play{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:88px;height:88px;border:1px solid #f5efdc66;border-radius:50%;background:#09101ac9;color:var(--ivory);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(10px);transition:background .2s,scale .2s}.play:hover{background:#1c2a3ee0;scale:1.05}.play svg{width:27px;height:27px;margin-left:5px;fill:currentColor}.play:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:6px}
.bottom{position:absolute;bottom:max(25px,env(safe-area-inset-bottom));left:4.5cqw;right:4.5cqw;max-width:1500px;margin:auto}.caption{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:24px}.part-title{font-family:FilmSerif,Georgia,serif;font-size:clamp(20px,2.2cqw,30px);letter-spacing:-.02em}.part-index{display:block;font-family:FilmSans,Arial,sans-serif;font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:#97a8bd;margin-bottom:7px}.timing{font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap;color:#b6bdc8}.rail{display:block;width:100%;height:22px;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer}.rail::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,#f0e7d7 var(--progress,0%),#ffffff35 var(--progress,0%))}.rail::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;border:none;width:10px;height:10px;border-radius:50%;margin-top:-4px;background:var(--ivory)}.rail::-moz-range-track{height:2px;background:#ffffff35}.rail::-moz-range-progress{height:2px;background:var(--ivory)}.rail::-moz-range-thumb{width:10px;height:10px;border:0;background:var(--ivory);border-radius:50%}
.tools{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:13px}.group{display:flex;align-items:center;gap:17px}.tool{padding:7px 0;background:none;border:0;color:#b7c0cf;font-size:11px;text-decoration:none;cursor:pointer}.tool:hover{color:#fff}.tool svg{display:block;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5}.select{background:#080e17;border:1px solid #ffffff2a;padding:7px 9px;border-radius:4px;color:#c1c9d5;font-size:11px;max-width:200px}.time-field{width:60px;color:#c5cdd9;background:#0c1421;border:1px solid #ffffff25;border-radius:4px;padding:6px;font-size:11px}.time-label{font-size:10px;color:#8e9aae}.hint{font-size:10px;color:#7e8b9d}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}#notice{position:fixed;left:50%;top:25px;transform:translateX(-50%);padding:10px 16px;border:1px solid #ffffff30;background:#0d1728f5;border-radius:6px;max-width:90%;font-size:12px;z-index:5}#notice:empty{display:none}
@container(max-width:600px){.top{left:24px;right:24px;align-items:flex-start}.brand{font-size:9px;letter-spacing:.2em}.edition{font-size:9px;max-width:130px;line-height:1.6}.bottom{left:24px;right:24px;bottom:max(24px,env(safe-area-inset-bottom))}.play{width:76px;height:76px}.caption{margin-bottom:11px}.part-title{font-size:23px}.tools{gap:8px;flex-wrap:wrap}.group{gap:13px}.caption>div{max-width:calc(100% - 85px)}.part-title{display:block;line-height:1.2}.hint{display:none}.select{max-width:173px;font-size:11px}.time-label,.time-field{display:none}.tool{font-size:11px}.part-index{font-size:10px}.timing{font-size:11px}.plan-link{font-size:10px}}
@media(prefers-reduced-motion:reduce){#controls,.play{transition:none}}

<script id="production-plan" type="application/json">{"title":"Quadrillion — complete four-part production plan","version":"1.1.0","status":"visual draft implemented and sampled — provisional timing — final audiovisual acceptance open","duration":143.0,"narrationStatus":"Fresh narration is absent. The 143-second allocation and all interval times are provisional editorial targets. Preserve the exact 25 lines; record one consistent fresh performance, align actual word and clause anchors, then revise timing rather than forcing or substituting the older recording.","openingSentence":"The river overflowed its banks.","sourceTranscript":{"description":"The supplied standing 25-line transcript, preserved verbatim in segments L01–L25. The public earlier production source is a provenance reference only; no previous code, imagery or audio is reused.","lineCount":25,"alphanumericWordCount":336,"publicReference":"https://github.com/hadi-nayebi/hadosh-production-contexts/blob/dashboard/dashboard/quadrillion/index.html","referenceBlobSha":"3babb2003a131dc58c072c773f957e0905964d0b"},"parts":[{"id":"P1","title":"The scale","start":0,"end":35.6,"thesis":"Make Google’s reported monthly token processing intelligible through scope, growth, a public-text reference and repeated processing.","arc":"Void → concrete sentence → shrinking words → murmuration → quantity → Google scope → dated growth → stock/flow comparison → repeat-pass loop.","review":["The entire claim reads near two seconds and remains readable afterward.","Google’s monthly processing is not confused with unique new language or an industry total.","The public-text stock remains an estimate and is not consumed by processing.","The common measure uses ten whole units and a two-thirds remainder, with approximately 10.67 as a rounded display."]},{"id":"P2","title":"The work → the era","start":35.6,"end":81.2,"thesis":"Turn scale into familiar language operations and an earned, conditional analogy with industrialization.","arc":"A request reaches work → search → transcription and summary → repeated operations → translation → physical/language analogy → wider human work → reflection → possible era.","review":["Every example has an observable input, operation and result.","The flock retires when concrete work becomes the subject.","The electricity/intelligence and industrialization parallels remain analogies.","People retain a visible purpose and role; could is not turned into certainty."]},{"id":"P3","title":"The origin","start":81.2,"end":121.5,"thesis":"Explain the 2017 architectural milestone through prediction and contextual attention, culminating in one distinct model.","arc":"Present capability → 2017 paper → language challenge → prediction learning signal → relational architecture → contextual continuation → stable model.","review":["2017 is a milestone within prior research, not the origin of all AI.","The exact opening sentence returns and banks is withheld until its prediction.","Training, supplied context and inference remain distinguishable.","The formed model is not depicted as the complete agent or as a literal copy of its corpus."]},{"id":"P4","title":"The invitation","start":121.5,"end":143,"thesis":"Show how model output participates in an externally executed and checked job, then invite the viewer into the series.","arc":"Request ticket → permission boundary → tool operation → returned context → checked result → human-directed project → series route → invitation.","review":["The model generates the request; external software and tools perform the action.","A result returns to context before the next step.","One useful result is checked without claiming universal safety or completed human approval.","The ending carries the series’ use-it/live-through-it promise and resolves cleanly."]}],"segments":[{"id":"L01","part":"P1","start":0,"end":3.6,"narration":"3.2 quadrillion tokens processed every month.","intent":"Let concrete language expand into an intelligible claim about monthly processing. The first readable quantity must emerge from the flock near two seconds.","continuity":"The opening sentence returns in the prediction and attention demonstrations. Selected language marks persist as processing, while the foreground claim remains stable.","beats":[{"id":"L01B01","motionBeat":"Language emerges from void","start":0,"end":0.15,"visible":"A completely empty ink viewport. No letters, particles, stage, logo, controls or ambient glow.","action":"Hold true absence for 0.15 seconds; the first visual event is reserved for the next interval.","camera":"Stationary; no implied movement in the empty field.","carry":"Only the background survives into the first word.","pass":"The first frame and every frame before 0.15s contain no visible object.","fail":"A pre-existing sentence, particle field, logo, spinner or player furniture occupies the void."},{"id":"L01B02","motionBeat":"Language emerges from void","start":0.15,"end":0.35,"visible":"Large ivory words begin at one stable sentence baseline.","action":"Reveal The, then river, in reading order; each new word seats without shaking earlier words.","camera":"Close enough that the words are the sole focal subject; begin no pullback before the words exist.","carry":"The exact same text objects continue into the next interval.","pass":"The viewer recognizes actual language being extended, not abstract bars or a title.","fail":"Letters appear out of order, the phrase is replaced by generic lorem ipsum, or the sentence behaves like a narration subtitle."},{"id":"L01B03","motionBeat":"Language emerges from void","start":0.35,"end":0.65,"visible":"The phrase grows into The river overflowed its banks.","action":"Add “overflowed”, “its”, then “banks.” including the period; accelerate the appearance cadence while earlier words retain their order. The pullback begins at 0.35s and remains gentle enough to read the complete sentence by 0.65s.","camera":"Pull away from the sentence baseline; do not cut to a second scene.","carry":"The complete five-word sentence is present before shrinking into the wider field.","pass":"The exact sentence can be read in a frame at 0.65s and its origin remains spatially traceable.","fail":"The sentence never completes, banks is omitted, or the camera makes the complete phrase unreadable immediately."},{"id":"L01B04","motionBeat":"Language expands into a flock","start":0.65,"end":1.1,"visible":"The first sentence shrinks among additional language rows; distant words become small cobalt and ivory marks.","action":"Continue and accelerate the pullback. As word height falls below useful readability, cross-resolve those same word objects into marks. Begin shared curvature at 0.85s, while the last readable words are still retreating.","camera":"One continuous retreat, without a sudden focal jump; preserve the original sentence near the field center.","carry":"Small marks inherit the words positions and velocities.","pass":"Words become marks through diminishing scale; collective motion starts while the retreat is still happening.","fail":"A cut swaps the text for unrelated particles, or words disappear without spatial continuity."},{"id":"L01B05","motionBeat":"Language expands into a flock","start":1.1,"end":1.35,"visible":"A broad murmuration ribbon crosses the field; no literal birds or arbitrary pictorial silhouettes.","action":"Bend the whole ribbon into one crescent. Nearby marks share direction and spacing; one coherent subgroup becomes brighter and larger as it approaches the foreground.","camera":"Ease the retreat to a stop as foreground depth becomes the action.","carry":"The selected subgroup remains part of the visible moving body until formation starts.","pass":"The flock reads as coordinated collective motion with one clear foreground selection.","fail":"Independent jitter, confetti, a brain silhouette or a decorative star field replaces the murmuration."},{"id":"L01B06","motionBeat":"The flock forms the quantity","start":1.35,"end":2.0,"visible":"Foreground marks approach the numeral and two unit words while the residual flock continues behind them.","action":"From 1.35s converge the selected marks into 3.2 quadrillion tokens. Keep the remaining flock bending through 1.50s while the selected foreground marks continue forming the lettering. Resolve enough density for all three elements to read by approximately 2.0s.","camera":"Hold the camera steady during final letter assembly; a clear exclusion zone prevents background marks crossing the claim.","carry":"The foreground claim seats; remaining marks retain a quieter background stream.","pass":"The complete phrase is readable near 2.0s and visibly formed by the selected marks.","fail":"Only 3.2 is readable at two seconds, the phrase is pasted on by an unrelated cut, or moving gaps prevent reading."},{"id":"L01B07","motionBeat":"The quantity becomes a monthly measure","start":2.0,"end":3.6,"visible":"Stable 3.2 quadrillion tokens with a small processed / month qualifier; the stream remains secondary.","action":"Settle the lettering completely. Resolve processed / month on its spoken clause and a restrained tokens · units of data cue. Keep residual marks moving through one bounded processing path.","camera":"Locked reading composition; portrait uses three short claim rows rather than a compressed single line.","carry":"The complete claim and its monthly qualifier carry into Google attribution.","pass":"The quantity and its unit can be read without pausing; residual movement never competes with the foreground.","fail":"The lettering boils continuously, the qualifiers flash away, or particle counts imply one visible mark equals one real token."}]},{"id":"L02","part":"P1","start":3.6,"end":7.2,"narration":"And that is Google alone — by Google's own count.","intent":"Constrain the reported number to Google and identify it as a company report.","continuity":"The monthly quantity stays in place; a scope frame encloses its existing processing stream.","beats":[{"id":"L02B01","motionBeat":"Give the stream its scope","start":3.6,"end":5.4,"visible":"The established quantity and stream, with a clean measuring frame emerging around them.","action":"Draw the frame from its corners around the existing operation; seat Google on its edge without covering the number.","camera":"Slight widening only to fit the scope boundary.","carry":"Number, stream and company boundary remain one composition.","pass":"Google clearly scopes the displayed processing figure.","fail":"New companies or a globe imply that the number measures the entire industry."},{"id":"L02B02","motionBeat":"Attribute the measure","start":5.4,"end":7.2,"visible":"The same frame carries Google and quiet company-reported source/date text.","action":"Let the scope label settle; place the verified reporting date beneath it. Prepare two endpoint seats inside the frame, without introducing growth yet.","camera":"Hold the claim long enough to read the attribution; no new camera flourish.","carry":"The Google frame becomes the growth-comparison frame.","pass":"By Google’s own count has a visible attribution and the original quantity remains readable.","fail":"Attribution is absent, unreadably small or presented as independent measurement."}]},{"id":"L03","part":"P1","start":7.2,"end":12.3,"narration":"Its monthly processing grew by more than 300 times in two years.","intent":"Show how much two-year monthly processing grew using sourced endpoints, not an invented historical curve.","continuity":"The company frame becomes a shared endpoint scale; the later endpoint retains the established monthly figure.","beats":[{"id":"L03B01","motionBeat":"Establish the earlier endpoint","start":7.2,"end":8.9,"visible":"A 2024 endpoint appears at the left of the same measuring frame; its stream is small on the common scale.","action":"Seat the verified 2024 monthly value, 9.7 trillion, as a narrow endpoint. Keep its denominator monthly and its baseline visible.","camera":"Move only enough to frame both endpoint seats; portrait stacks them on the same scale.","carry":"The earlier endpoint remains throughout the comparison.","pass":"The earlier date, monthly unit and baseline are legible.","fail":"The starting endpoint disappears, uses a different denominator, or becomes a merely symbolic size."},{"id":"L03B02","motionBeat":"Establish the later endpoint","start":8.9,"end":10.6,"visible":"The 2026 endpoint fills the larger end of the same frame, anchored by the reported 3.2 quadrillion figure.","action":"Grow the later measure to the sourced lower-bound proportion while retaining the earlier one. The movement illustrates an endpoint comparison, not measured intervening months.","camera":"Keep both endpoints visible; do not zoom separately into each value.","carry":"Both dated endpoint measures stay present.","pass":"The two quantities share units and a comparison baseline.","fail":"A fabricated smooth data curve or a false exact monthly history appears."},{"id":"L03B03","motionBeat":"Resolve the multiplier","start":10.6,"end":12.3,"visible":"Both endpoints remain; >300× occupies the comparison space between them.","action":"Seat the multiplier once the endpoint relation is visible. Remove any transient guide marks; preserve the larger monthly measure for the next reference.","camera":"Settle on the larger measure and an empty neighboring seat for public text.","carry":"The 2026 monthly-processing scale survives into L04.","pass":"Growth is understood as more than 300 times over two years, with endpoint evidence still in view.","fail":"A flashing number replaces the comparison or implies an exact 300-fold measured ratio."}]},{"id":"L04","part":"P1","start":12.3,"end":20,"narration":"To understand the scale, consider this: the usable public text written by people is estimated at 300 trillion tokens.","intent":"Introduce usable public text as a stationary estimated stock and a fair reference for monthly processing.","continuity":"A separate amber stock enters beside the existing cobalt flow; the flow does not consume it.","beats":[{"id":"L04B01","motionBeat":"Introduce the reference stock","start":12.3,"end":14.2,"visible":"Amber text tiles collect in the empty reference seat while cobalt processing continues alongside.","action":"Bring several organized text tiles together into one stable block. Keep its entrance separate from the processing aperture.","camera":"Widen gently to give both stock and flow their own space.","carry":"The amber block remains stationary after assembly.","pass":"The reference is visually a retained collection, not newly generated output.","fail":"The stock emerges from Google’s stream or is visibly consumed by it."},{"id":"L04B02","motionBeat":"Name what the stock measures","start":14.2,"end":16.1,"visible":"The amber block gains the functional label usable public text.","action":"Reveal only the category label; align it to the amber stock, not to the stream. Reduce background flock activity so the new category reads.","camera":"Hold both categories; no decorative orbit.","carry":"The reference block and its category remain.","pass":"The qualifier usable public text is readable and visibly belongs to the stock.","fail":"The label says all writing, all human knowledge or all thought."},{"id":"L04B03","motionBeat":"Name its estimated quantity","start":16.1,"end":18.0,"visible":"The amber reference shows ≈300 trillion tokens next to the category label.","action":"Seat the estimate qualifier and quantity together. The cobalt monthly quantity remains visible with its own unit.","camera":"Keep the shared framing; do not enlarge the amber number to make its quantity appear larger.","carry":"Both quantities retain their labels and distinct stock/flow roles.","pass":"The estimate is recognizable as an estimate, with tokens as the shared unit.","fail":"Approximation is dropped or the reader cannot distinguish which number belongs to which quantity."},{"id":"L04B04","motionBeat":"Prepare the common measure","start":18.0,"end":20.0,"visible":"An identical unit outline spans the amber stock and is echoed along the cobalt measure.","action":"Normalize one reference unit to 300 trillion. Place a shared measuring guide through both forms; preserve the actual source stock outside the counting strip.","camera":"Frame the entire comparison; portrait places the strips vertically with equal unit dimensions.","carry":"The shared unit is ready for the tenth comparison.","pass":"One visual unit has the same size and meaning in both quantities.","fail":"Different dimensions, area-versus-length tricks or changing zoom manufacture the ratio."}]},{"id":"L05","part":"P1","start":20,"end":23.4,"narration":"That's about a tenth of Google's monthly volume.","intent":"Make the tenth comparison visible on an exact normalized common measure.","continuity":"Retain the stationary reference and show 3,200/300 = 10⅔ processing units; the displayed decimal is approximate.","beats":[{"id":"L05B01","motionBeat":"Count the common units","start":20,"end":21.7,"visible":"One amber unit sits beside a cobalt strip of ten whole units and a two-thirds remainder.","action":"Resolve the cobalt divisions from the shared guide, without creating new source text blocks. Keep all units equal in area and length.","camera":"Show both complete measures simultaneously.","carry":"The one-to-ten-and-two-thirds comparison remains intact.","pass":"Geometry expresses 10⅔ units, approximately 10.67, with the fractional remainder visible.","fail":"The measure uses ten full units only, falsely claims an exact empirical ratio, or changes unit size."},{"id":"L05B02","motionBeat":"Let the fraction register","start":21.7,"end":23.4,"visible":"The two measures remain with a restrained ≈10.67× relationship marker.","action":"Briefly connect the amber unit to one equivalent cobalt division, then return that guide to rest.","camera":"Locked reading composition.","carry":"Both measures remain available for the repeat.","pass":"The viewer can identify the approximately one-tenth relationship without reading a sentence.","fail":"New scales or moving camera comparisons replace the common measure."}]},{"id":"L06","part":"P1","start":23.4,"end":25.7,"narration":"Let me say that again.","intent":"Create a deliberate reading breath before the repeated explanation.","continuity":"Preserve both quantities and simplify competing movement rather than restarting the scene.","beats":[{"id":"L06B01","motionBeat":"Prepare the repeat","start":23.4,"end":24.55,"visible":"Stable amber stock and cobalt monthly measure; guide marks are now quiet.","action":"Slow the residual stream and remove only the temporary measuring connectors.","camera":"Stationary; the pause serves reading.","carry":"The numerical relation remains unchanged.","pass":"The comparison can be absorbed during the spoken preparation.","fail":"A flashy rewind, title repeat or unrelated scene interrupts the argument."},{"id":"L06B02","motionBeat":"Prepare the repeat","start":24.55,"end":25.7,"visible":"One small, distinctly marked group within the stream comes into focus.","action":"Mark three representative tiles with stable notches, without moving the stock. Position them at the processing entry.","camera":"Shift attention through contrast rather than a large zoom.","carry":"The marked group is ready to circulate visibly.","pass":"The viewer can track the same subgroup into the next line.","fail":"The subgroup changes identity or the pause introduces a new quantitative claim."}]},{"id":"L07","part":"P1","start":25.7,"end":35.6,"narration":"Every month, Google alone processes more than ten times the estimated usable public text written by people — the same words, passing through again and again.","intent":"Clarify that accumulated processing can revisit the same language many times.","continuity":"A recognizable group circulates through the same scoped path while the source stock remains intact; the outgoing route becomes the first task route.","beats":[{"id":"L07B01","motionBeat":"Repeat the monthly comparison","start":25.7,"end":27.68,"visible":"Google’s scope and the full monthly measure remain; the three marked tiles enter the processor.","action":"Move the subgroup through one clearly defined aperture and advance a small pass indicator once.","camera":"Frame entry, processor and return path together.","carry":"All three identifying marks remain attached to the same tiles.","pass":"A processing pass is observable and separate from creating new text.","fail":"The pass indicator is presented as an actual token-by-token measurement."},{"id":"L07B02","motionBeat":"Return the same language","start":27.68,"end":29.66,"visible":"The group exits the processor and curves back toward the entry.","action":"Follow the same three notched tiles around the return route without multiplying them.","camera":"Hold the route in one shot; never hide the return behind a cut.","carry":"The same group returns with its identity intact.","pass":"The viewer can follow the original group around the loop.","fail":"New replacement tiles conceal that the language is being processed again."},{"id":"L07B03","motionBeat":"Show repeated processing","start":29.66,"end":31.64,"visible":"The same tiles pass through again; the stock remains unchanged.","action":"Advance the pass indicator a second time. Keep the stock’s size fixed while processed volume accumulates.","camera":"Stable composition with the repeated action as focus.","carry":"Return route, stock and pass distinction remain.","pass":"More processing is visibly compatible with an unchanged source stock.","fail":"The stock grows or shrinks in step with processing as though unique writing were being counted."},{"id":"L07B04","motionBeat":"Resolve the stock/flow distinction","start":31.64,"end":33.62,"visible":"The comparison and the recirculation share one frame.","action":"Let the group complete another partial return; keep ≈10.67× tied to the normalized monthly comparison rather than to the illustrated loop count.","camera":"Pull back slightly to show the two distinct measures together.","carry":"One outgoing branch becomes visible beyond the processor.","pass":"The visual does not confuse a few illustrative passes with the reported monthly statistic.","fail":"A loop counter falsely claims to reproduce the complete reported ratio."},{"id":"L07B05","motionBeat":"Hand the stream to useful work","start":33.62,"end":35.6,"visible":"The outgoing branch straightens toward a work surface beyond the comparison.","action":"Send one marked tile onward while retiring the comparison labels as the narration completes them. Retain the Google scope only until its final claim is finished.","camera":"Follow the outgoing tile into the new work surface.","carry":"The tile becomes a work request; the amber source stock recedes intact.","pass":"The passage hands a familiar object into a concrete operation.","fail":"The flock persists as meaningless decorative activity behind every later scene."}]},{"id":"L08","part":"P2","start":35.6,"end":40.9,"narration":"And here is what it does: every token of it goes to work.","intent":"Turn processing into concrete examples of useful operations, without claiming that every reported token is productive.","continuity":"The outgoing tile becomes a request on a work surface; the murmuration retires when the tasks become concrete.","beats":[{"id":"L08B01","motionBeat":"A stream acquires a destination","start":35.6,"end":37.35,"visible":"The marked tile reaches a clean work surface with a query seat and an answer seat.","action":"The tile opens into a request card with a small search symbol. Give it a defined destination instead of scattering it into icons.","camera":"Move with the tile, then stop at a useful working distance.","carry":"The request card is the focal object for the first task.","pass":"A distinct request and destination replace abstract scale.","fail":"The viewer sees decorative particles but no operation."},{"id":"L08B02","motionBeat":"Prepare the task routes","start":37.35,"end":39.1,"visible":"Three restrained route outlines appear: search, transcription and document work.","action":"Seat the routes one at a time; keep only search fully lit. The remaining stream exits the frame rather than orbiting the tasks.","camera":"Fixed work-surface view.","carry":"Search remains active; other routes wait without pulsing.","pass":"There is one dominant operation and no competing activity.","fail":"All routes flash simultaneously or appear to allocate measured shares of Google’s total."},{"id":"L08B03","motionBeat":"Hand off to the search","start":39.1,"end":40.9,"visible":"A query enters the search route; source fragments wait beyond it.","action":"Move the request to the input boundary and reveal the source side. Hold the answer slot empty until the next line supplies the operation.","camera":"Slight tightening around query, sources and answer position.","carry":"The same request carries into L09.","pass":"The answer has an observable input and source path.","fail":"A completed answer appears before any operation, or the scene claims guaranteed useful output from all tokens."}]},{"id":"L09","part":"P2","start":40.9,"end":44.3,"narration":"A search comes back as a written answer.","intent":"Make the query-to-written-answer transformation legible.","continuity":"Search uses the request and source fragments already seated; its completed result remains a secondary reference.","beats":[{"id":"L09B01","motionBeat":"Search supplies material","start":40.9,"end":42.6,"visible":"The query activates three short source fragments, represented as distinct document strips.","action":"Route the fragments toward the answer slot while retaining thin links back to their sources.","camera":"Keep query, sources and result in one view.","carry":"The answer takes shape from visible source relationships.","pass":"A viewer can tell where the answer’s material came from.","fail":"Sources vanish or the answer looks like unsupported material appearing from nowhere."},{"id":"L09B02","motionBeat":"The written answer seats","start":42.6,"end":44.3,"visible":"A concise answer card settles with a small source relationship marker.","action":"Reduce the card to a few readable-looking text strokes, not a paragraph for the viewer to read. Place it at the edge of the work surface as a completed example.","camera":"Widen slightly to reveal the waiting transcription route.","carry":"Completed answer remains secondary; waveform becomes primary.","pass":"The result is visibly written language and its source relationship remains.","fail":"The shot becomes a text slide or implies every generated answer is correct."}]},{"id":"L10","part":"P2","start":44.3,"end":48.2,"narration":"A voice becomes text; a long document, a summary.","intent":"Show two different language transformations: transcription and summarization.","continuity":"Use the existing work surface; keep results linked to their source forms.","beats":[{"id":"L10B01","motionBeat":"Speech becomes text","start":44.3,"end":46.25,"visible":"A compact waveform occupies the transcription input; matching text strips emerge at its output.","action":"As each waveform phrase passes the boundary, seat a corresponding text strip. Preserve the input trace faintly until its text counterpart is established.","camera":"Tight two-sided view with a clear conversion boundary.","carry":"The text strips move into the completed-work margin.","pass":"Input speech and output text are visually distinct and connected.","fail":"The waveform simply changes color without any observable text result."},{"id":"L10B02","motionBeat":"A document becomes a summary","start":46.25,"end":48.2,"visible":"A tall document stands beside a short summary card.","action":"Highlight three source regions in sequence and carry their visual tags to three short summary lines. Keep the long source document visible.","camera":"Shift laterally within the same surface; portrait changes the active vertical row.","carry":"The source/summary relation survives into the wider work scene.","pass":"The summary retains an observable relationship to the original document.","fail":"The document is destroyed or the summary is presented as necessarily complete and lossless."}]},{"id":"L11","part":"P2","start":48.2,"end":51.2,"narration":"Millions of hours of speech become text.","intent":"Scale the already understood transcription operation without inventing a measured counter.","continuity":"The one transcription lane multiplies into parallel lanes; it remains the same mechanism.","beats":[{"id":"L11B01","motionBeat":"One transcription lane becomes several","start":48.2,"end":49.7,"visible":"Five parallel lanes, each with a waveform at a different phase of conversion.","action":"Separate the earlier lane into a small set of coordinated lanes; stagger their text outputs so the operation remains readable.","camera":"Widen to accommodate the lanes without shrinking outputs below recognition.","carry":"Each lane keeps a waveform-to-text direction.","pass":"Scale comes from repeated recognizable work.","fail":"A new microphone illustration repeats the noun while abandoning the operation."},{"id":"L11B02","motionBeat":"Parallel work resolves","start":49.7,"end":51.2,"visible":"Completed text strips accumulate in a calm output area.","action":"Finish two lanes while others continue; retire excess copies before attention moves to search.","camera":"Hold the common input/output direction.","carry":"One representative transcription result remains beside the earlier answer.","pass":"No numerical counter pretends these few lanes measure millions of actual hours.","fail":"A fabricated hours counter or racing unsupported metric appears."}]},{"id":"L12","part":"P2","start":51.2,"end":54.6,"narration":"Billions of searches are answered in written words.","intent":"Show repeated search work at scale while preserving its query/source/answer sequence.","continuity":"Return to the existing search route, now as a queue rather than another illustration.","beats":[{"id":"L12B01","motionBeat":"A queue feeds the search route","start":51.2,"end":52.9,"visible":"Several query tickets wait behind the original search boundary.","action":"Advance one ticket at a time; source fragments activate only for the leading ticket.","camera":"Frame the queue and active request together.","carry":"The active request retains its source links.","pass":"The queue adds repetition while keeping the process comprehensible.","fail":"All tickets teleport into answers or a false real-time billions counter appears."},{"id":"L12B02","motionBeat":"Answers join the results","start":52.9,"end":54.6,"visible":"Two new answer cards settle behind the first in the completed-work area.","action":"Finish the active query and retain the next waiting request; then reduce the queue’s emphasis as translation takes focus.","camera":"Ease toward the remaining language route.","carry":"A single answer stays as one member of the growing useful-work collection.","pass":"The result field shows repeated written answers, not merely many icons.","fail":"The viewer cannot distinguish incoming queries from completed responses."}]},{"id":"L13","part":"P2","start":54.6,"end":58.5,"narration":"Words written in one language are read in another.","intent":"Make translation concrete through a brief, accurate phrase pair.","continuity":"The task vocabulary persists, but the input/output language is the meaningful change.","beats":[{"id":"L13B01","motionBeat":"A phrase reaches the translation route","start":54.6,"end":56.55,"visible":"Good morning appears on one compact input card.","action":"Move the card into the translation boundary. Preserve its two-word grouping and conversational intent while the output seat is empty.","camera":"Give this short phrase enough readable space; no other text competes.","carry":"Input remains visible for comparison.","pass":"The example is readable and clearly an input object, not a narration subtitle.","fail":"The phrase is cut off, malformed or treated as character-by-character substitution."},{"id":"L13B02","motionBeat":"Meaning is carried into another language","start":56.55,"end":58.5,"visible":"Buenos días resolves on the output card opposite Good morning.","action":"Connect the two cards with a single deliberate route. Let matching structural tags show carried meaning, then join the output to the completed work.","camera":"Hold both phrases together long enough to recognize the change.","carry":"The finished translation becomes one of the demonstrated operations.","pass":"The phrase pair is correct and both sides remain visible.","fail":"An incorrect translation, fake language or unreadably fast word change undermines the example."}]},{"id":"L14","part":"P2","start":58.5,"end":66.2,"narration":"If the electron stream was a general form of energy, the token stream is a general form of intelligence.","intent":"Construct a visual analogy between physical energy infrastructure and language-processing capability without equating their physics.","continuity":"The completed language operations remain; a physical counterpart appears alongside rather than replacing them.","beats":[{"id":"L14B01","motionBeat":"Establish the physical counterpart","start":58.5,"end":60.4,"visible":"A simple electrical circuit powers a small lamp or motor on an amber physical-work side.","action":"Close the circuit and show the device operating. Keep this route materially distinct from the cobalt language route.","camera":"Widen to a balanced comparison; portrait stacks the two mechanisms.","carry":"The physical device remains in its own bounded plane.","pass":"Energy supports an observable physical action, distinct from language work.","fail":"Tokens are drawn as literal electricity or an equals sign asserts scientific equivalence."},{"id":"L14B02","motionBeat":"Show the language counterpart","start":60.4,"end":62.3,"visible":"The cobalt route supplies the established answer, transcript, summary and translation operations.","action":"Activate one already understood operation while the physical device continues. Match their compositional rhythm, not their substance.","camera":"Keep the paired views on one scale of attention, without mixing their units.","carry":"Both sides remain distinct.","pass":"The analogy compares roles while preserving different mechanisms.","fail":"The visual claims a token is a measured unit of intelligence or energy."},{"id":"L14B03","motionBeat":"Align the analogy","start":62.3,"end":64.2,"visible":"Both routes extend a person’s work; a human control point is visible at each input.","action":"Align the two operation paths and briefly synchronize their completed outcomes. Never merge the two streams into one material.","camera":"Hold the shared structure as the inference.","carry":"Human input and useful outcomes persist.","pass":"The person remains present and the analogy is recognizable as an analogy.","fail":"Autonomous machinery replaces the human or a literal physical conversion is implied."},{"id":"L14B04","motionBeat":"Carry the language side forward","start":64.2,"end":66.2,"visible":"The physical counterpart recedes while the language work expands toward a wider field.","action":"Retain one amber human marker and carry the cobalt task routes outward. Remove the analogy’s matching guides once their job is done.","camera":"Pull back through the language side, not through a generic globe.","carry":"The human-directed language operations become nodes of the wider scene.","pass":"The next scene grows from demonstrated work.","fail":"The scene cuts to an unrelated world map or treats the metaphor as proven history."}]},{"id":"L15","part":"P2","start":66.2,"end":71.3,"narration":"So humanity, with its machines, is now processing language at this scale.","intent":"Connect the demonstrated operations to a wider human-and-machine working system.","continuity":"The ne ioned on the shown context.","fail":"The next word arrives before any contextual operation or the sentence is grammatically wrong."},{"id":"L22B04","motionBeat":"Keep the model distinct","start":112.425,"end":114.3,"visible":"The completed sentence moves to a result margin; the singular model remains.","action":"Dim the demonstration links after they resolve. Do not turn the model into the whole surrounding workflow.","camera":"Recenter on the model as the next line names it.","carry":"One stable model object carries into L23.","pass":"The naming has an earned visual referent.","fail":"A second model or unexplained new machine replaces the one just demonstrated."}]},{"id":"L23","part":"P3","start":114.3,"end":121.5,"narration":"The Transformer was born: a model of a language that could learn from vast collections of text.","intent":"Consolidate the architecture into a trained model while keeping the source paper, training and later use conceptually distinct.","continuity":"The single model form is built from the mechanism already shown; the output loop is added only afterward.","beats":[{"id":"L23B01","motionBeat":"Name the architectural result","start":114.3,"end":116.1,"visible":"One dark glass model form encloses the relational structure; the small 2017 paper marker remains outside.","action":"Resolve the form’s edge and seat a restrained Transformer architecture label at the source relationship.","camera":"A controlled close view keeps boundary and internal structure legible.","carry":"The source relationship remains visible without dominating the model.","pass":"Architecture and particular model are not equated with a paper instantly becoming intelligence.","fail":"The paper physically turns into a completed trained model with no learning stage."},{"id":"L23B02","motionBeat":"Vast training collections supply examples","start":116.1,"end":117.9,"visible":"Many small source-text strips pass through the compare-and-adjust route beside the same structure.","action" function p2Travel(points,p){const lengths=[];let total=0;for(let i=1;i<points.length;i++){const l=Math.hypot(points[i][0]-points[i-1][0],points[i][1]-points[i-1][1]);lengths.push(l);total+=l}let distance=clamp(p)*total;for(let i=0;i<lengths.length;i++){if(distance<=lengths[i]||i===lengths.length-1){const q=lengths[i]?distance/lengths[i]:0;return mix(points[i],points[i+1],q)}distance-=lengths[i]}return points[0]}

const scenes=[{a:0,b:7.2,f:opening},{a:7.2,b:12.3,f:growth},{a:12.3,b:20,f:stock},{a:20,b:25.7,f:comparison},{a:25.7,b:35.6,f:repeat},{a:35.6,b:40.9,f:taskFlow},{a:40.9,b:44.3,f:answer},{a:44.3,b:48.2,f:voiceDoc},{a:48.2,b:51.2,f:transcribe},{a:51.2,b:54.6,f:searches},{a:54.6,b:58.5,f:translate},{a:58.5,b:66.2,f:energy},{a:66.2,b:71.3,f:people},{a:71.3,b:73.4,f:reflect},{a:73.4,b:81.2,f:era},{a:81.2,b:89.2,f:paper},{a:89.2,b:96.2,f:translationHistory},{a:96.2,b:102.1,f:prediction},{a:102.1,b:106.8,f:attentionStructure},{a:106.8,b:114.3,f:attention},{a:114.3,b:121.5,f:transformer},{a:121.5,b:130.7,f:toolLoop},{a:130.7,b:143.01,f:invitation}];
function activeLine(t){let idx=cue.findIndex((v,i)=>i<25&&t>=v&&t<cue[i+1]);return idx<0?24:idx}
function paintLayer(canvas,scene,t){
 g=canvas.getContext('2d');g.setTransform(pixelRatio,0,0,pixelRatio,0,0);g.globalAlpha=1;g.clearRect(0,0,W,H);scene.f(t);g=mainContext;
}
function animationTime(position){const i=activeLine(position),segment=PLAN.segments[i],q=clamp((position-segment.start)/(segment.end-segment.start));return lerp(animationCue[i],animationCue[i+1],q)}
function render(position){
 const frameStarted=performance.now();const t=animationTime(position);if(!fontsReady)return;g=mainContext;g.setTransform(pixelRatio,0,0,pixelRatio,0,0);g.globalAlpha=1;g.fillStyle=COLOR.ink;g.fillRect(0,0,W,H);
 if(t>.15)glow(W*.62,H*.47,W*.65,t<35.6?'blue':t<81.2?'amber':'blue',.06);
 const index=Math.max(0,scenes.findIndex(s=>t>=s.a&&t<s.b)),s=scenes[index],join=clamp((t-s.a)/([voiceDoc,transcribe,searches,translate].includes(s.f)?.38:.72));
 try{
  if(index>0&&join<1&&![taskFlow,answer,translationHistory,prediction,attentionStructure,attention,transformer,toolLoop].includes(s.f)){
   paintLayer(outgoingLayer,scenes[index-1],s.a-.001);paintLayer(incomingLayer,s,t+.25*(1-join));
   const q=smooth(join);g.save();g.globalAlpha=1-q;g.drawImage(outgoingLayer,0,0,W,H);g.restore();
   g.save();g.globalAlpha=q;g.drawImage(incomingLayer,0,0,W,H);g.restore();
  }else{s.f(t)}
 }catch(e){g=mainContext;renderErrors.push(String(e));$('notice').textContent='The visual renderer encountered an error. Playback is paused.';++playEpoch;starting=false;playing=false;cancelAnimationFrame(raf);if(narration)narration.pause();document.body.classList.remove('playing');$('controls').inert=false;ui(true);console.error(e)}
 const idx=activeLine(position),seg=PLAN.segments[idx],beat=seg?.beats?.find(b=>position>=b.start&&position<b.end)||seg?.beats?.at(-1);
 const frameCost=performance.now()-frameStarted;if(playing){frameStats.frames++;frameStats.totalRenderMs+=frameCost;frameStats.maxRenderMs=Math.max(frameStats.maxRenderMs,frameCost)}
 $('review-state').textContent=JSON.stringify({time:+position.toFixed(3),animationTime:+t.toFixed(3),line:seg?.id,beat:beat?.id,part:seg?.part,renderFunction:s.f.name,playing,width:W,height:H,errors:renderErrors,performance:{frames:frameStats.frames,averageRenderMs:+(frameStats.totalRenderMs/Math.max(1,frameStats.frames)).toFixed(2),maxRenderMs:+frameStats.maxRenderMs.toFixed(2),maxFrameGapMs:+frameStats.maxFrameGapMs.toFixed(2)}});document.documentElement.dataset.filmTime=position.toFixed(3);document.documentElement.dataset.filmLine=seg?.id||'';document.documentElement.dataset.filmBeat=beat?.id||'';
}
const partDefs=PLAN.parts.map((p,i)=>({s:p.start,title:['The scale','The work → the era','The origin','The invitation'][i]}));
const fmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
function ui(force=false){if(!force&&Math.abs(now-lastUI)<.12)return;lastUI=now;let part=0;partDefs.forEach((p,i)=>{if(now>=p.s)part=i});$('part-index').textContent=`Part ${String(part+1).padStart(2,'0')} / 04`;$('part-title').textContent=partDefs[part].title;$('timing').textContent=`${fmt(now)} / ${fmt(duration)}`;$('seek').value=now;$('seek').style.setProperty('--progress',now/duration*100+'%');$('seek').setAttribute('aria-valuetext',`${now.toFixed(1)} seconds, ${partDefs[part].title}`);if(document.activeElement!==$('time-entry'))$('time-entry').value=now.toFixed(1);$('chapters').value=String(partDefs[part].s);$('play').setAttribute('aria-label',now>=duration?'Replay film':'Play film');C.setAttribute('aria-label',playing?'Pause the motion film':'Play the motion film');}
function tick(ts){if(!playing)return;if(lastFrameTS)frameStats.maxFrameGapMs=Math.max(frameStats.maxFrameGapMs,ts-lastFrameTS);lastFrameTS=ts;now=clamp(narration?narration.currentTime:(ts-anchor)/1000,0,duration);render(now);ui();if(!playing)return;if(now>=duration-.015||(narration&&narration.ended)){now=duration;pause();return}raf=requestAnimationFrame(tick)}
async function play(){
 if(!fontsReady)return;if(narration&&!narrationDurationOK){$('notice').textContent=narration.readyState<1?'The narration is still loading. Please try play again shortly.':'This narration needs a matching timeline before playback.';return}const request=++playEpoch;cancelAnimationFrame(raf);starting=true;if(now>=duration)now=0;
 if(narration){try{narration.currentTime=now;await narration.play()}catch(e){if(request!==playEpoch)return;$('notice').textContent='Narration could not start. The film remains paused.';pause();return}}
 if(request!==playEpoch)return;
 if(document.hidden){starting=false;playing=false;if(narration)narration.pause();return}
 starting=false;playing=true;frameStats={frames:0,totalRenderMs:0,maxRenderMs:0,maxFrameGapMs:0};lastFrameTS=0;document.body.classList.add('playing');$('controls').inert=true;anchor=performance.now()-now*1000;raf=requestAnimationFrame(tick);C.focus({preventScroll:true});ui(true)
}
function pause(){++playEpoch;starting=false;playing=false;cancelAnimationFrame(raf);if(narration)narration.pause();document.body.classList.remove('playing');$('controls').inert=false;render(now);ui(true)}
function seek(value){now=clamp(Number(value)||0,0,duration);if(narration)narration.currentTime=now;anchor=performance.now()-now*1000;render(now);ui(true)}
function toggle(){(playing||starting)?pause():play()}
function mute(){if(!narration)return;narration.muted=!narration.muted;$('mute').textContent=narration.muted?'Sound off':'Sound on';$('mute').setAttribute('aria-pressed',String(narration.muted));$('mute').setAttribute('aria-label',narration.muted?'Unmute narration':'Mute narration')}

function fullscreen(){if(document.fullscreenElement){document.exitFullscreen?.().catch(()=>{})}else{document.documentElement.requestFullscreen?.().catch(()=>{$('notice').textContent='Full screen is unavailable here. The film already fills this window.';setTimeout(()=>$('notice').textContent='',4000)})}}
$('mute').addEventListener('click',mute);$('seek').max=duration;$('time-entry').max=duration;$('chapters').innerHTML=partDefs.map((p,i)=>`<option value="${p.s}">${String(i+1).padStart(2,'0')} · ${p.title}</option>`).join('');if(narration){narration.addEventListener('loadedmetadata',()=>{narrationDurationOK=Number.isFinite(narration.duration)&&Math.abs(narration.duration-duration)<=.25;if(!narrationDurationOK){$('notice').textContent='This narration needs a matching timeline before playback.';pause()}else $('notice').textContent=''});$('mute').hidden=false;document.querySelector('.edition').textContent=PLAN.narration.alignmentStatus==='verified'?'Motion film':'Narration audition';narration.addEventListener('error',()=>{$('notice').textContent='The narration asset is unavailable.';pause()})} $('play').addEventListener('click',play);C.addEventListener('click',toggle);$('restart').addEventListener('click',()=>{seek(0);play()});$('seek').addEventListener('input',e=>seek(e.target.value));$('chapters').addEventListener('change',e=>{const value=e.target.value;pause();seek(value)});$('time-entry').addEventListener('change',e=>{const value=e.target.value;pause();seek(value)});$('time-entry').addEventListener('input',e=>{if(e.target.value!==''&&e.target.validity.valid){const value=e.target.value;pause();seek(value)}});$('time-entry').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value!==''){e.preventDefault();const value=e.target.value;pause();seek(value);e.target.value=now.toFixed(1)}});$('fullscreen').addEventListener('click',fullscreen);
addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.key==='Escape'&&(playing||starting))pause();if(e.code==='Enter'&&e.target===C){e.preventDefault();toggle()}if(e.key==='ArrowRight'){e.preventDefault();seek(now+5)}if(e.key==='ArrowLeft'){e.preventDefault();seek(now-5)}if(e.key.toLowerCase()==='f')fullscreen();if(e.key.toLowerCase()==='m')mute();if(e.key.toLowerCase()==='r'){seek(0);play()}});
document.addEventListener('fullscreenchange',()=>{$('fullscreen').setAttribute('aria-label',document.fullscreenElement?'Exit full screen':'Enter full screen')});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(playing||starting))pause()});addEventListener('resize',resize);
Promise.all([document.fonts.load('16px FilmSerif'),document.fonts.load('16px FilmItalic'),document.fonts.load('16px FilmSans')]).then(()=>{fontsReady=true;resize();if(stillMode){now=clamp(Number(params.get('still'))||0,0,duration);$('controls').hidden=true;C.removeAttribute('role');C.tabIndex=-1;render(now);ui(true)}else{seek(Number(params.get('t'))||0);ui(true)}document.documentElement.dataset.ready='true'}).catch(e=>{$('notice').textContent='The film could not load its embedded fonts.';renderErrors.push(String(e))});
