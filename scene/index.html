function showInsp(id){ const insp=$('insp'); const rec=(DEC.words&&DEC.words[id])||{}; const ed=EDITS[id]||{}; insp.innerHTML=`<h3>${id}</h3><div class="row"><label>dx</label><input id="f-dx" type="number" value="${ed.dx||0}"> <label>dy</label><input id="f-dy" type="number" value="${ed.dy||0}"></div><div class="row"><label>start</label><input id="f-st" type="number" step="0.01" value="${ed.start!=null?ed.start:''}"> <label>end</label><input id="f-en" type="number" step="0.01" value="${ed.end!=null?ed.end:''}"></div><div class="rec">${(rec.decision||'— no record —')}</div><div><button id="b-save">Save</button><button id="b-reset">Reset word</button><button id="b-export">Export edits</button><button id="b-clear">Reset all</button></div>`;
  $('b-save').onclick=()=>{ const e=EDITS[id]||(EDITS[id]={}); e.dx=+$('f-dx').value||0; e.dy=+$('f-dy').value||0; const st=$('f-st').value, en=$('f-en').value; if(st!=='') e.start=+st; if(en!=='') e.end=+en; saveEdits(); renderAt(curT); };
  $('b-reset').onclick=()=>{ delete EDITS[id]; saveEdits(); renderAt(curT); showInsp(id); };
  $('b-export').onclick=()=>{ const blob=new Blob([JSON.stringify(EDITS,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ws01v2-edits.json'; a.click(); };
  $('b-clear').onclick=()=>{ EDITS={}; saveEdits(); renderAt(curT); };
}
if(EDIT){ document.body.classList.add('edit'); band.style.pointerEvents='auto';
  band.addEventListener('click', e=>{ const s=e.target.closest('.wd'); if(!s) return; document.querySelectorAll('.wd.sel').forEach(x=>x.classList.remove('sel')); s.classList.add('sel'); selWord=s.id; showInsp(selWord); });
  let drag=null;
  band.addEventListener('pointerdown', e=>{ const s=e.target.closest('.wd'); if(!s) return; drag={id:s.id,x:e.clientX,y:e.clientY,moved:false}; });
  window.addEventListener('pointermove', e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>4) drag.moved=true; if(drag.moved){ const ed=EDITS[drag.id]||(EDITS[drag.id]={}); const s=$(drag.id); if(s) s.style.transform=`translate(${(ed.dx||0)+dx}px,${(ed.dy||0)+dy}px)`; drag.ldx=dx; drag.ldy=dy; } });
  window.addEventListener('pointerup', e=>{ if(drag&&drag.moved){ const ed=EDITS[drag.id]||(EDITS[drag.id]={}); ed.dx=(ed.dx||0)+(drag.ldx||0); ed.dy=(ed.dy||0)+(drag.ldy||0); saveEdits(); renderAt(curT); } drag=null; });
}
window.__pkgEditor={ get edits(){ return EDITS; }, applyEdits(obj){ EDITS=obj||{}; saveEdits(); renderAt(curT); }, clearEdits(){ EDITS={}; saveEdits(); renderAt(curT); } };
// ---------- render ----------
let curT=0;
function pulseEnv(t,at){ if(t<at) return 0; const d=t-at; return d<0.15? d/0.15 : Math.max(0,1-(d-0.15)/0.55); }
function renderAt(t){
  curT=t; renderBand(t);
  const L=Object.fromEntries(PLAN.lines.map(l=>[l.id,l]));
  // C1
  const chipOut=prog(t,EV.listStart-0.1,EV.listStart+0.7);
  $('wordchip').setAttribute('opacity',(1-chipOut).toFixed(3));
  $('wordchip').setAttribute('transform',`translate(0,${(-12*chipOut).toFixed(1)})`);
  const c1out=prog(t,EV.c1out,EV.c1out+0.5);
  for(let i=0;i<5;i++){ const o=prog(t,EV.listStart+i*0.16,EV.listStart+i*0.16+0.3)*(1-c1out); $('lchip'+i).setAttribute('opacity',o.toFixed(3)); }
  $('listlabel').setAttribute('opacity',(prog(t,EV.listLabel,EV.listLabel+0.35)*(1-c1out)).toFixed(3));
  // C2
  const c2o=prog(t,L.L2.start,L.L2.start+0.3)*(1-prog(t,EV.c2out,EV.c2out+0.6));
  $('c2').setAttribute('opacity',c2o.toFixed(3));
  drawOn($('rowline'),t,EV.rowDraw,EV.rowDraw+1.0);
  SLOTS.forEach(([w])=>{ const et=EV['slot'+w]; const o=prog(t,et,et+0.35); const el=$('slot-'+w); el.setAttribute('opacity',o.toFixed(3)); el.setAttribute('transform',`translate(0,${(14*(1-o)).toFixed(1)})`); });
  const relIn=prog(t,EV.relate,EV.relate+0.5), relOut=prog(t,EV.relateCrack,EV.relateOut);
  const crack=prog(t,EV.relateCrack,EV.relateOut);
  $('relate').setAttribute('opacity',(relIn*(1-relOut)).toFixed(3));
  $('relate').setAttribute('stroke-dasharray',`10 ${(9+crack*36).toFixed(1)}`);
  $('relatelabel').setAttribute('opacity',(relIn*(1-relOut)).toFixed(3));
  // C3
  const c3o=prog(t,L.L4.start,L.L4.start+0.4)*(1-prog(t,EV.mapOut,EV.mapOut+1.3));
  $('c3').setAttribute('opacity',c3o.toFixed(3));
  drawOn($('axx'),t,EV.axx,EV.axx+0.95); drawOn($('axy'),t,EV.axy,EV.axy+0.95);
  $('labLand').setAttribute('opacity',prog(t,EV.axx+0.15,EV.axx+0.5).toFixed(3)); $('labWater').setAttribute('opacity',prog(t,EV.axx+0.35,EV.axx+0.7).toFixed(3));
  $('labLiving').setAttribute('opacity',prog(t,EV.axy+0.15,EV.axy+0.5).toFixed(3)); $('labBuilt').setAttribute('opacity',prog(t,EV.axy+0.35,EV.axy+0.7).toFixed(3));
  const ro=$('readout'); ro.textContent = t>=EV.readoutBoat ? 'BOAT → ( WATER , BUILT )' : 'CAT → ( LAND , LIVING )';
  ro.setAttribute('opacity',prog(t,EV.readoutCat,EV.readoutCat+0.3).toFixed(3));
  Object.keys(POS).forEach(id=>{ const ft=EV['fly'+id]; const p=ease(prog(t,ft,ft+0.9)); const slot=SLOTS.find(s=>s[0]===id); const fx=slot[2], fy=880; const [tx,ty]=POS[id]; const el=$('mchip-'+id); el.setAttribute('opacity',prog(t,ft-0.05,ft+0.25).toFixed(3)); el.setAttribute('transform',`translate(${lerp(fx,tx,p).toFixed(1)},${lerp(fy,ty,p).toFixed(1)})`); });
  ARROWS.forEach(([id])=>{ const at=EV['arrow'+id]; const ln=$('ar-'+id).querySelector('line'); drawOn(ln,t,at,at+(id==='CAT'?0.95:0.55)); $('arh-'+id).setAttribute('opacity',prog(t,at+(id==='CAT'?0.8:0.45),at+(id==='CAT'?1.0:0.6)).toFixed(3)); });
  const catDim=1-0.65*prog(t,EV.sphereWire+0.55,EV.sphereWire+1.1);
  $('ar-CAT').setAttribute('opacity',catDim.toFixed(3));
  $('arcSmall').setAttribute('opacity',prog(t,EV.arcSmall,EV.arcSmall+0.5).toFixed(3));
  $('relLab').setAttribute('opacity',prog(t,EV.relLab,EV.relLab+0.35).toFixed(3));
  $('arcWide').setAttribute('opacity',prog(t,EV.arcWide,EV.arcWide+0.6).toFixed(3));
  // C4 sphere
  const sphIn=prog(t,EV.sphereWire,EV.sphereWire+0.3);
  const glideP=ease(prog(t,EV.glide,EV.glide+1.7));
  const bridgeDim=1-0.7*prog(t,EV.bridge,EV.bridge+0.7);
  $('sphereG').setAttribute('opacity',(sphIn*bridgeDim).toFixed(3));
  $('sphereG').setAttribute('transform',`translate(${lerp(0,244,glideP).toFixed(1)},${lerp(0,17,glideP).toFixed(1)})`);
  drawOn($('sph1'),t,EV.sphereWire,EV.sphereWire+1.1); drawOn($('sph2'),t,EV.sphereWire+0.25,EV.sphereWire+1.35); drawOn($('sph3'),t,EV.sphereWire+0.5,EV.sphereWire+1.6);
  const sphArrowO=prog(t,EV.sphereWire+0.55,EV.sphereWire+1.05);
  $('sphArrow').setAttribute('opacity',sphArrowO.toFixed(3));
  const swingP=ease(prog(t,EV.swing,EV.swing+1.25));
  $('sphArrow').setAttribute('transform',`rotate(${(47.5*swingP).toFixed(2)},296,863)`);
  const pulse=Math.max(pulseEnv(t,EV.pulse),pulseEnv(t,EV.payoff));
  $('sphArrowLine').setAttribute('stroke-width',(8+3*pulse).toFixed(2));
  $('sphGhost').setAttribute('opacity',(0.38*prog(t,EV.swing,EV.swing+0.3)*(1-prog(t,EV.ghostOut,EV.ghostOut+0.6))).toFixed(3));
  for(let i=0;i<6;i++){ $('mini'+i).setAttribute('opacity',(0.32*prog(t,EV.minis+i*0.15,EV.minis+i*0.15+0.4)*(1-prog(t,EV.stageOut,EV.stageOut+0.9))).toFixed(3)); }
  // C5 counter
  const c5o=prog(t,L.L8.start+0.05,L.L8.start+0.45)*(1-prog(t,EV.counterOut,EV.counterOut+0.6));
  $('c5').setAttribute('opacity',c5o.toFixed(3));
  const cv=Math.round(lerp(2,3072,ease(prog(t,EV.counter,EV.counterEnd))));
  $('counter').textContent=cv.toLocaleString('en-US');
  $('counterlab').setAttribute('opacity',prog(t,EV.counterLab,EV.counterLab+0.35).toFixed(3));
  // C6 cards
  const cardFade=(id,ev,out)=>{ setOp($(id), prog(t,ev,ev+0.45)*(out!=null?1-prog(t,out,out+0.5):1)); };
  cardFade('cardSentence',EV.cardSentence,EV.cardsOut); cardFade('cardContext',EV.cardContext,EV.cardsOut);
  setOp($('cardInstruction'), prog(t,EV.cardInstruction,EV.cardInstruction+0.45)*(1-prog(t,EV.stageOut,EV.stageOut+0.9)));
  const ig=ease(prog(t,EV.instrGlide,EV.instrGlide+0.8));
  $('cardInstruction').setAttribute('transform',`translate(${(-334*ig).toFixed(1)},0)`);
  $('cardInstruction').querySelector('.cardarrow').setAttribute('opacity',(1-prog(t,EV.instrGlide,EV.instrGlide+0.3)).toFixed(3));
  $('cardInstruction').querySelector('.cardarrowhead').setAttribute('opacity',(1-prog(t,EV.instrGlide,EV.instrGlide+0.3)).toFixed(3));
  // C7 steering + check
  const c7out=1-prog(t,EV.stageOut,EV.stageOut+0.9);
  $('contLine').setAttribute('opacity',(prog(t,EV.cont,EV.cont+0.5)*c7out).toFixed(3));
  $('contHead').setAttribute('opacity',(prog(t,EV.cont,EV.cont+0.5)*c7out).toFixed(3));
  const dAng=20*ease(prog(t,EV.driftOut,EV.driftOut+0.7))*(1-ease(prog(t,EV.driftBack,EV.driftBack+0.6)));
  $('driftG').setAttribute('transform',`rotate(${dAng.toFixed(2)},798,743)`);
  const dOp=prog(t,EV.driftOut-0.05,EV.driftOut+0.25)*(1-prog(t,EV.driftBack+0.3,EV.driftBack+0.8))*c7out;
  $('driftLine').setAttribute('opacity',dOp.toFixed(3)); $('driftHead').setAttribute('opacity',dOp.toFixed(3));
  // C8 bridge
  $('bridge').setAttribute('opacity',prog(t,EV.bridge,EV.bridge+0.7).toFixed(3));
}
window.__seek = s => renderAt(s);
renderAt(0);
</script>
