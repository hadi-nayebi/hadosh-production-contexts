    el.style.pointerEvents='auto'; el.style.cursor='pointer';
    el.addEventListener('click', ()=>{
      const lid=el.dataset.lid, idx=el.dataset.idx, key=lid+':'+idx;
      const w = PLAN.lines[lid].words[idx]; const ov = overlays[key]||{};
      const ins=document.getElementById('inspector'); ins.style.display='block';
      ins.innerHTML = `<b>${lid} word ${Number(idx)+1}: &ldquo;${w.w}&rdquo;</b> &middot; decided: ${w.p?'PRINCIPAL (A59 entry, gold)':'deliberate as-is (standard entry)'} &middot; spoken at ${w.t.toFixed(2)}s (PLAN, from the measured take)<br>`+
      `start offset (s) <input id="e_dt" type="number" step="0.05" value="${ov.dt||0}"> vertical (px) <input id="e_dy" type="number" step="2" value="${ov.dy||0}"> scale <input id="e_sc" type="number" step="0.05" value="${ov.sc||1}">`+
      `<button id="e_save">Save</button><button id="e_clear">Clear all edits</button><div style="margin-top:8px;color:#9aa3b8">Edits save to this browser (localStorage) and change playback immediately; export by committing the changed values into scene.json's PLAN.</div>`;
      document.getElementById('e_save').onclick=()=>{ overlays[key]={dt:parseFloat(document.getElementById('e_dt').value)||0, dy:parseFloat(document.getElementById('e_dy').value)||0, sc:parseFloat(document.getElementById('e_sc').value)||1};
        localStorage.setItem('soa01-edit', JSON.stringify(overlays)); renderAt(PLAN.lines[lid].start+0.01); };
      document.getElementById('e_clear').onclick=()=>{ localStorage.removeItem('soa01-edit'); location.reload(); };
    });
  });
}
</script></body></html>
