<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T96 — One-palette world (recreation)</title>
<!--
  T96 — One-palette world with a single dusk break. Parameterized recreation.
  Technique: the WHOLE world (sky + buildings + amber lights + HUD) holds ONE
  blue register across a sequence of scenes; at the structural turn the sky
  warms gradually into a dusk palette and the dusk stands, while buildings,
  lights and HUD keep the blue register; the blue register returns together
  with the final scene. Phase machine: per-scene durations in CONFIG
  (scenes[].ms); the turn anchors (turn.warmStartMs, turn.duskStartMs) are
  CONFIG values on the cycle timeline and the return coincides with the
  return scene's start by construction; cycle = sum of scene durations +
  endHoldMs. ONE phase resolver returns exactly one {sceneIndex,
  paletteMode, warm, localTime, endHold} state from t (half-open intervals) —
  phase exclusivity by construction. During the warm-up span the sky color
  is a continuous interpolation between the two register skies and the sun
  disc fades in on the same progress value. Intensity separation: amber
  lights render at intensity.lights, scene fields dimmer at intensity.field.
  Scenes are code-drawn generic silhouettes (kitchen / street / skyline /
  dinner interior) generated from CONFIG geom — NOT traced. The scene ORDER
  is a labeled ALLOCATION. Seekable: render(tMs) pure. No captions, no
  specimen media. PIXEL-UNVERIFIED.
-->
<style>
  html,body{margin:0;padding:0;}
  #stage{position:relative;margin:0 auto;overflow:hidden;}
  #stage svg{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<div id="stage"></div>
<script>
'use strict';
/* ================= CONFIG (specimen values are the defaults) ================= */
const CONFIG = {
  scenes: [
    { name: "kitchen", clock: "06:15", ms: 1500 },
    { name: "street", clock: "12:00", ms: 1500 },
    { name: "exhibits", clock: "16:00", ms: 10000 },
    { name: "dinner", clock: "19:00", ms: 500 }
  ],
  palette: { sky: "#1d3f8f", building: "#274b8f", ink: "#f5f2e6", amber: "#f0c93f" },
  breakPalette: { sky: "#e8955a", sun: "#f7d774" },
  turn: { warmStartMs: 4500, duskStartMs: 6000, atScene: 2, returnScene: 3, label: "DUSK" },
  endHoldMs: 500,
  hud: { year: 2037, dayLine: "A POSSIBLE TUESDAY" },
  type: { font: "Georgia, 'Times New Roman', serif" },
  stage: { width: 360 },
  intensity: { lights: 1, field: 0.85, label: 1, plate: 0.62 },
  geom: {
    stageH: 240, groundH: 22, plateW: 267, plateH: 62, plateX: 4, plateY: 4, labelPlateW: 120, labelPlateH: 26, scenePlateW: 136,
    seed: 7, buildings: 9, bWMin: 26, bWVar: 30, bHMin: 46, bHVar: 96, bJitter: 8,
    winW: 5, winH: 7, winGapX: 11, winGapY: 13, winLitRatio: 0.42,
    sunX: 302, sunY: 44, sunR: 17, moonX: 316, moonY: 30, moonR: 10,
    hudX: 10, hudY: 8, yearPx: 16, clockPx: 30, yearSpacingPx: 1, clockGapPx: 4,
    labelPx: 17, labelY: 206, scenePx: 17, sceneY: 234,
    counterW: 120, counterH: 10, counterY: 168, tableW: 130, tableH: 8, tableY: 176,
    lampW: 4, lampH: 34, silW: 26, silH: 52, silY: 150
  }
};
/* ================= CONFIG end ================= */
function deepMerge(base, over){
  if (Array.isArray(over)) return over.slice();
  if (over && typeof over === 'object'){
    const out = {};
    for (const k of Object.keys(base)) out[k] = deepMerge(base[k], over[k]);
    for (const k of Object.keys(over)) if (!(k in out)) out[k] = over[k];
    return out;
  }
  return over === undefined ? base : over;
}
let CFG = CONFIG;
try { const q = new URLSearchParams(location.search).get('cfg'); if (q) CFG = deepMerge(CONFIG, JSON.parse(q)); } catch (e) {}
function sceneStart(i){ let s = 0; for (let k = 0; k < i; k++) s += CFG.scenes[k].ms; return s; }
const cycleMs = sceneStart(CFG.scenes.length) + CFG.endHoldMs;
function rng(seed){ let s = seed >>> 0; return function(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function hexRgb(h){ return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function lerpColor(a, b, f){
  const A = hexRgb(a), B = hexRgb(b);
  return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * f) + ',' + Math.round(A[1] + (B[1] - A[1]) * f) + ',' + Math.round(A[2] + (B[2] - A[2]) * f) + ')';
}
/* ONE phase resolver — half-open intervals, exactly one state per t. */
function phaseAt(t){
  const tt = ((t % cycleMs) + cycleMs) % cycleMs;
  const scenesMs = sceneStart(CFG.scenes.length);
  const last = CFG.scenes.length - 1;
  if (tt >= scenesMs) return { sceneIndex: last, paletteMode: "blue", warm: 0, localTime: tt - scenesMs, endHold: true };
  let idx = 0, acc = 0;
  while (tt >= acc + CFG.scenes[idx].ms){ acc += CFG.scenes[idx].ms; idx++; }
  const local = tt - acc;
  const returnStart = sceneStart(CFG.turn.returnScene);
  let mode = "blue", warm = 0;
  if (tt >= CFG.turn.warmStartMs && tt < CFG.turn.duskStartMs){ mode = "warming"; warm = (tt - CFG.turn.warmStartMs) / (CFG.turn.duskStartMs - CFG.turn.warmStartMs); }
  else if (tt >= CFG.turn.duskStartMs && tt < returnStart){ mode = "dusk"; warm = 1; }
  return { sceneIndex: idx, paletteMode: mode, warm: warm, localTime: local, endHold: false };
}
function skyline(g, P, seedOff){
  const rand = rng(g.seed + seedOff); let s = '';
  for (let i = 0; i < g.buildings; i++){
    const bw = g.bWMin + rand() * g.bWVar, bh = g.bHMin + rand() * g.bHVar;
    const bx = (CFG.stage.width / g.buildings) * i + rand() * g.bJitter, by = g.stageH - g.groundH - bh;
    s += '<rect x="' + bx.toFixed(1) + '" y="' + by + '" width="' + bw.toFixed(1) + '" height="' + bh + '" fill="' + P.building + '" opacity="' + CFG.intensity.field + '"/>';
    for (let wy = by + g.winGapY; wy < g.stageH - g.groundH - g.winH; wy += g.winGapY){
      for (let wx = bx + g.winGapX / 2; wx < bx + bw - g.winW; wx += g.winGapX){
        if (rand() < g.winLitRatio) s += '<rect x="' + wx.toFixed(1) + '" y="' + wy + '" width="' + g.winW + '" height="' + g.winH + '" fill="' + P.amber + '" opacity="' + CFG.intensity.lights + '"/>';
      }
    }
  }
  return s;
}
function sceneBody(name, g, P){
  if (name === "kitchen") return skyline(g, P, 11) + '<rect x="0" y="' + g.counterY + '" width="' + CFG.stage.width + '" height="' + g.counterH + '" fill="' + P.building + '"/><rect x="40" y="' + (g.counterY - 26) + '" width="34" height="26" fill="' + P.amber + '" opacity="' + CFG.intensity.lights + '"/>';
  if (name === "street") return skyline(g, P, 23) + '<rect x="30" y="' + (g.stageH - g.groundH - g.lampH) + '" width="' + g.lampW + '" height="' + g.lampH + '" fill="' + P.ink + '"/><circle cx="32" cy="' + (g.stageH - g.groundH - g.lampH) + '" r="5" fill="' + P.amber + '"/><rect x="290" y="' + (g.stageH - g.groundH - g.lampH) + '" width="' + g.lampW + '" height="' + g.lampH + '" fill="' + P.ink + '"/><circle cx="292" cy="' + (g.stageH - g.groundH - g.lampH) + '" r="5" fill="' + P.amber + '"/>';
  if (name === "dinner") return '<rect x="24" y="52" width="312" height="140" fill="' + P.building + '" opacity="' + CFG.intensity.field + '"/><rect x="0" y="' + g.tableY + '" width="' + CFG.stage.width + '" height="' + g.tableH + '" fill="' + P.building + '"/><rect x="70" y="96" width="46" height="34" fill="' + P.amber + '" opacity="' + CFG.intensity.lights + '"/><rect x="244" y="96" width="46" height="34" fill="' + P.amber + '" opacity="' + CFG.intensity.lights + '"/><rect x="' + (180 - g.silW / 2) + '" y="' + g.silY + '" width="' + g.silW + '" height="' + g.silH + '" fill="' + P.building + '"/>';
  return skyline(g, P, 37); /* exhibits + any CONFIG-named scene: the skyline register */
}
function buildScene(){
  const g = CFG.geom;
  document.getElementById('stage').style.cssText = 'width:' + CFG.stage.width + 'px;height:' + g.stageH + 'px;font-family:' + CFG.type.font + ';';
  window.__render = function(t){
    const ph = phaseAt(t), P = CFG.palette, scene = CFG.scenes[ph.sceneIndex];
    const sky = ph.paletteMode === "blue" ? P.sky : lerpColor(P.sky, CFG.breakPalette.sky, ph.warm);
    let s = '<svg viewBox="0 0 ' + CFG.stage.width + ' ' + g.stageH + '" xmlns="http://www.w3.org/2000/svg">';
    s += '<rect width="' + CFG.stage.width + '" height="' + g.stageH + '" fill="' + sky + '"/>';
    s += ph.paletteMode === "blue"
      ? '<circle cx="' + g.moonX + '" cy="' + g.moonY + '" r="' + g.moonR + '" fill="' + P.ink + '" opacity="' + CFG.intensity.field + '"/>'
      : '<circle cx="' + g.sunX + '" cy="' + g.sunY + '" r="' + g.sunR + '" fill="' + CFG.breakPalette.sun + '" opacity="' + ph.warm + '"/>';
    s += sceneBody(scene.name, g, P);
    s += '<rect y="' + (g.stageH - g.groundH) + '" width="' + CFG.stage.width + '" height="' + g.groundH + '" fill="' + P.building + '"/>';
    if (ph.paletteMode === "dusk") s += '<rect x="' + (CFG.stage.width / 2 - g.labelPlateW / 2) + '" y="' + (g.labelY - g.labelPx - 4) + '" width="' + g.labelPlateW + '" height="' + g.labelPlateH + '" fill="' + P.building + '" opacity="' + CFG.intensity.plate + '"/><text x="' + (CFG.stage.width / 2) + '" y="' + g.labelY + '" font-size="' + g.labelPx + '" fill="' + P.ink + '" text-anchor="middle" opacity="' + CFG.intensity.label + '" font-family="' + CFG.type.font + '">' + CFG.turn.label + '</text>';
    if (ph.paletteMode !== "blue") s += '<rect x="' + g.plateX + '" y="' + g.plateY + '" width="' + g.plateW + '" height="' + g.plateH + '" fill="' + P.building + '" opacity="' + CFG.intensity.plate + '"/>';
    s += '<rect x="' + (CFG.stage.width / 2 - g.scenePlateW / 2) + '" y="' + (g.stageH - g.groundH) + '" width="' + g.scenePlateW + '" height="' + g.groundH + '" fill="' + P.building + '" opacity="' + CFG.intensity.plate + '"/>';
    s += '<text x="' + (CFG.stage.width / 2) + '" y="' + g.sceneY + '" font-size="' + g.scenePx + '" fill="' + P.ink + '" text-anchor="middle" font-family="' + CFG.type.font + '">' + scene.name + ' · ' + scene.clock + '</text>';
    s += '<g font-family="' + CFG.type.font + '" fill="' + P.ink + '"><text x="' + g.hudX + '" y="' + (g.hudY + g.yearPx) + '" font-size="' + g.yearPx + '" letter-spacing="' + g.yearSpacingPx + '">' + CFG.hud.year + ' · ' + CFG.hud.dayLine + '</text><text x="' + g.hudX + '" y="' + (g.hudY + g.yearPx + g.clockPx + g.clockGapPx) + '" font-size="' + g.clockPx + '">' + scene.clock + '</text></g>';
    s += '</svg>';
    document.getElementById('stage').innerHTML = s;
    return ph;
  };
  window.__phaseAt = phaseAt; window.__cycleMs = cycleMs;
  window.__render(0);
}
buildScene();
if (typeof module !== 'undefined') module.exports = { phaseAt: phaseAt, cycleMs: cycleMs };
else {
  const t0 = Date.now();
  (function loop(){ window.__render(Date.now() - t0); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
