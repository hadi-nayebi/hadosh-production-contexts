<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T01 — Comparison</title>
<style>
  html,body{margin:0;padding:0;background:#111;color:#eee;font-family:system-ui,sans-serif}
  header{padding:12px 16px;font-size:15px}
  #controls{display:flex;gap:10px;padding:0 16px 12px 16px;flex-wrap:wrap}
  #controls button{font-size:16px;padding:12px 22px;border-radius:8px;border:1px solid #555;background:#222;color:#eee;cursor:pointer;min-height:48px}
  #panes{display:flex;gap:12px;padding:0 16px 16px 16px;box-sizing:border-box}
  .pane{flex:1 1 0;min-width:0}
  .pane h2{font-size:14px;margin:0 0 8px 0;font-weight:600}
  .frame{position:relative;width:100%;aspect-ratio:16/9;background:#000}
  .frame video,.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  @media (max-width:640px){ #panes{flex-direction:column} }
</style>
</head>
<body>
<header>T01 — Typewriter terminal dialogue · side-by-side comparison</header>
<div id="controls">
  <button id="btnPlay" type="button">Play</button>
  <button id="btnPause" type="button">Pause</button>
  <button id="btnRestart" type="button">Restart</button>
</div>
<div id="panes">
  <div class="pane">
    <h2>ORIGINAL — P1 @ 0:00–0:14</h2>
    <div class="frame"><video id="orig" src="segment.mp4" playsinline preload="auto"></video></div>
  </div>
  <div class="pane">
    <h2>RECREATION — T01, parameterized</h2>
    <div class="frame"><iframe id="rec" src="recreation.html" title="T01 recreation"></iframe></div>
  </div>
</div>
<script>
"use strict";
/* One shared control set: the video is the master clock; the recreation
   is seek-synced to video.currentTime and follows play/pause/restart. */
var orig = document.getElementById("orig");
var recFrame = document.getElementById("rec");
function recApi(){ try { return recFrame.contentWindow.REC_API; } catch (e) { return null; } }
function syncRec(){
  var api = recApi(); if (!api) return;
  api.seekTo(orig.currentTime * 1000);
}
document.getElementById("btnPlay").addEventListener("click", function(){
  orig.play(); var api = recApi(); if (api) { syncRec(); api.play(); }
});
document.getElementById("btnPause").addEventListener("click", function(){
  orig.pause(); var api = recApi(); if (api) api.pause();
});
document.getElementById("btnRestart").addEventListener("click", function(){
  orig.currentTime = 0; orig.play();
  var api = recApi(); if (api) { api.restart(); api.play(); }
});
orig.addEventListener("play", function(){ var api = recApi(); if (api) api.play(); });
orig.addEventListener("pause", function(){ var api = recApi(); if (api) api.pause(); });
orig.addEventListener("seeked", syncRec);
setInterval(function(){
  var api = recApi(); if (!api || orig.paused) return;
  if (Math.abs(api.getElapsed() - orig.currentTime * 1000) > 350) syncRec();
}, 500);
recFrame.addEventListener("load", syncRec);
</script>
</body>
</html>
