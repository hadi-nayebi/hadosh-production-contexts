<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T03 comparison — original vs recreation</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#eee;}
  .controls{position:sticky;top:0;background:#1c1c1c;padding:12px;display:flex;gap:10px;z-index:2;}
  .controls button{font-size:17px;padding:12px 20px;min-height:48px;cursor:pointer;}
  .pair{display:flex;gap:12px;padding:12px;box-sizing:border-box;}
  .side{flex:1;min-width:0;}
  .side h2{font-size:15px;margin:0 0 8px;}
  .side video,.side iframe{width:100%;aspect-ratio:16/9;border:1px solid #444;background:#000;display:block;}
  @media (max-width:700px){ .pair{flex-direction:column;} }
</style>
</head>
<body>
<div class="controls">
  <button id="btnPlay" type="button">Play both</button>
  <button id="btnPause" type="button">Pause both</button>
  <button id="btnRestart" type="button">Restart both</button>
</div>
<div class="pair">
  <div class="side">
    <h2>ORIGINAL — P1 @ 0:21–0:35</h2>
    <video id="orig" src="segment.mp4" playsinline preload="metadata"></video>
  </div>
  <div class="side">
    <h2>RECREATION — T03, parameterized</h2>
    <iframe id="rec" src="recreation.html" title="T03 recreation"></iframe>
  </div>
</div>
<script>
"use strict";
var orig = document.getElementById("orig");
var rec = document.getElementById("rec");
function recMsg(m){ rec.contentWindow.postMessage(m, "*"); }
document.getElementById("btnPlay").addEventListener("click", function(){ orig.play(); recMsg("play"); });
document.getElementById("btnPause").addEventListener("click", function(){ orig.pause(); recMsg("pause"); });
document.getElementById("btnRestart").addEventListener("click", function(){
  orig.currentTime = 0; orig.play();
  rec.src = rec.src.split("#")[0];
  setTimeout(function(){ recMsg("restart"); }, 300);
});
</script>
</body>
</html>
