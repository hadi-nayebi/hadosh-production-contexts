<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T04 — Waveform + step sequencer · recreation</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#050607}
  body{display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,Consolas,monospace}
  #stage{position:relative;width:100%;height:100%;min-height:220px;padding:3.5%;
         display:flex;gap:2.5%;align-items:stretch}
  .panel{background:#101216;border:1px solid #23262c;border-radius:4px;padding:2.2%;
         display:flex;flex-direction:column;min-width:0}
  #wavePanel{flex:1.25 1 0}
  #seqPanel{flex:1 1 0}
  .ptitle{font-size:clamp(8px,1.6vw,12px);color:#e8a33d;white-space:nowrap;overflow:hidden;margin-bottom:6px}
  #waveWrap{position:relative;flex:1;display:flex;align-items:center;gap:1px;min-height:60px}
  .bar{flex:1 1 0;min-width:1px;border-radius:1px}
  #playhead{position:absolute;top:0;bottom:0;width:2px;pointer-events:none}
  #seqWrap{position:relative;flex:1;display:grid;gap:3px;min-height:60px}
  .cell{border-radius:2px;background:transparent}
  #seqHead{position:absolute;top:0;bottom:0;width:2px;pointer-events:none}
  @media (max-width:520px){
    #stage{flex-direction:column}
    .panel{flex:1 1 0}
  }
</style>
</head>
<body>
<div id="stage">
  <div class="panel" id="wavePanel">
    <div class="ptitle" id="waveTitle"></div>
    <div id="waveWrap"><div id="playhead"></div></div>
  </div>
  <div class="panel" id="seqPanel">
    <div class="ptitle" id="seqTitle"></div>
    <div id="seqWrap"><div id="seqHead"></div></div>
  </div>
</div>
<script>
"use strict";
/* ===== CONFIG — every variable of the technique lives here; the logic below reads only CONFIG =====
   Timing is CHECKPOINT-PRICED: the sequencer's active step is decided by the beatTimesMs
   checkpoint table (the last checkpoint at or before the current time), never by assuming
   one global cadence inside the animation logic. Change bpm/beatMs and the table rebuilds. */
const CONFIG = {
  durationMs: 8000,                 /* technique window 0:21-0:29 = 8 s */
  bpm: 120,
  beatTimesMs: [0,500,1000,1500,2000,2500,3000,3500,4000,4500,5000,5500,6000,6500,7000,7500],
  barCount: 64,
  seed: 1234,
  minBarPct: 14,                    /* bar height floor, % of panel height */
  bg: "#050607",
  panelBg: "#101216",
  playedColor: "#f59a3c",           /* orange — the played portion */
  unplayedColor: "#8a8f98",         /* grey — the unplayed portion */
  playheadColor: "#3ddc84",
  seqHeadColor: "#f59a3c",
  cellColor: "#5b8f63",             /* idle pattern cell (dim green) */
  activeCellColor: "#7dff9a",       /* pattern cell in the live step column (bright) */
  activeEmptyColor: "#2c3a2e",      /* empty cell in the live step column (faint wash) */
  waveTitle: "agent-1 look_what_i_can_do.wav",
  seqTitle: "agent-2 beat.mid",
  seqRows: 5,
  seqCols: 16,
  /* pattern cells as [row, col] — specimen-like scatter read from the evidence frames */
  seqPattern: [[2,0],[4,4],[4,5],[0,6],[3,8],[2,9],[3,9],[3,10],[4,11],[1,12],[4,15]]
};

/* URL overrides (swap test / reuse):
   ?bpm=90  or  ?beatMs=667  ·  ?played=%2337c8ff&unplayed=%23555f6b  ·  ?bars=48&seed=77
   ?seqRows=4&seqCols=12&pattern=0.0;1.3;3.7  ·  ?durationMs=6000 */
(function applyOverrides(){
  const q = new URLSearchParams(window.location.search);
  const num = (k) => { const v = parseFloat(q.get(k)); return isFinite(v) ? v : null; };
  if (num("durationMs") !== null) CONFIG.durationMs = Math.max(500, num("durationMs"));
  if (num("bars") !== null) CONFIG.barCount = Math.max(4, Math.floor(num("bars")));
  if (num("seed") !== null) CONFIG.seed = Math.floor(num("seed"));
  if (q.get("played")) CONFIG.playedColor = q.get("played");
  if (q.get("unplayed")) CONFIG.unplayedColor = q.get("unplayed");
  if (q.get("playhead")) CONFIG.playheadColor = q.get("playhead");
  if (q.get("cell")) CONFIG.cellColor = q.get("cell");
  if (q.get("activeCell")) CONFIG.activeCellColor = q.get("activeCell");
  if (q.get("waveTitle")) CONFIG.waveTitle = q.get("waveTitle");
  if (q.get("seqTitle")) CONFIG.seqTitle = q.get("seqTitle");
  if (num("seqRows") !== null) CONFIG.seqRows = Math.max(1, Math.floor(num("seqRows")));
  if (num("seqCols") !== null) CONFIG.seqCols = Math.max(1, Math.floor(num("seqCols")));
  if (q.get("pattern")) {
    CONFIG.seqPattern = q.get("pattern").split(";").map(s => s.split(".").map(Number))
      .filter(p => p.length === 2 && isFinite(p[0]) && isFinite(p[1]));
  }
  /* beat checkpoints: an explicit beatMs wins; else bpm; the table is rebuilt, not assumed */
  if (num("bpm") !== null) CONFIG.bpm = num("bpm");
  const stepMs = num("beatMs") || (num("bpm") !== null ? 60000 / CONFIG.bpm : null);
  if (stepMs) {
    CONFIG.beatTimesMs = [];
    for (let t = 0; t < CONFIG.durationMs; t += stepMs) CONFIG.beatTimesMs.push(Math.round(t));
  }
})();

/* Deterministic seeded heights — the waveform shape is code, regenerated from CONFIG.seed. */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function barHeights(count, seed, minPct){
  const rnd = mulberry32(seed); const out = [];
  for (let i = 0; i < count; i++){
    const env = 0.55 + 0.45 * Math.sin((i / Math.max(1, count - 1)) * Math.PI); /* phrase arc */
    out.push(minPct + (100 - minPct) * Math.min(1, rnd() * 1.15 * env + 0.08));
  }
  return out;
}

/* Pure state from time — the checkpoint table decides the sequencer step. */
function computeState(tMs, cfg){
  const t = ((tMs % cfg.durationMs) + cfg.durationMs) % cfg.durationMs;
  const progress = t / cfg.durationMs;
  let step = -1;
  for (let i = 0; i < cfg.beatTimesMs.length; i++){ if (cfg.beatTimesMs[i] <= t) step = i; else break; }
  const playedBars = Math.floor(progress * cfg.barCount + 0.0001);
  return { t: t, progress: progress, step: step, playedBars: playedBars };
}

const heights = barHeights(CONFIG.barCount, CONFIG.seed, CONFIG.minBarPct);
const patternSet = new Set(CONFIG.seqPattern.map(p => p[0] + "," + p[1]));

const waveWrap = document.getElementById("waveWrap");
const seqWrap = document.getElementById("seqWrap");
const playhead = document.getElementById("playhead");
const seqHead = document.getElementById("seqHead");
document.getElementById("waveTitle").textContent = CONFIG.waveTitle;
document.getElementById("seqTitle").textContent = CONFIG.seqTitle;
document.body.style.background = CONFIG.bg;

const barEls = [];
for (let i = 0; i < CONFIG.barCount; i++){
  const b = document.createElement("div");
  b.className = "bar";
  b.style.height = heights[i].toFixed(1) + "%";
  b.style.background = CONFIG.unplayedColor;
  waveWrap.appendChild(b); barEls.push(b);
}
playhead.style.background = CONFIG.playheadColor;
waveWrap.appendChild(playhead);

seqWrap.style.gridTemplateRows = "repeat(" + CONFIG.seqRows + ", 1fr)";
seqWrap.style.gridTemplateColumns = "repeat(" + CONFIG.seqCols + ", 1fr)";
const cellEls = [];
for (let r = 0; r < CONFIG.seqRows; r++){
  cellEls.push([]);
  for (let c = 0; c < CONFIG.seqCols; c++){
    const d = document.createElement("div");
    d.className = "cell";
    if (patternSet.has(r + "," + c)) d.style.background = CONFIG.cellColor;
    seqWrap.appendChild(d); cellEls[r].push(d);
  }
}
seqHead.style.background = CONFIG.seqHeadColor;
seqWrap.appendChild(seqHead);

let lastStep = -2, lastPlayed = -1;
function render(tMs){
  const s = computeState(tMs, CONFIG);
  if (s.playedBars !== lastPlayed){
    for (let i = 0; i < barEls.length; i++)
      barEls[i].style.background = i < s.playedBars ? CONFIG.playedColor : CONFIG.unplayedColor;
    lastPlayed = s.playedBars;
  }
  playhead.style.left = (s.progress * 100).toFixed(3) + "%";
  if (s.step !== lastStep){
    for (let r = 0; r < CONFIG.seqRows; r++)
      for (let c = 0; c < CONFIG.seqCols; c++){
        const has = patternSet.has(r + "," + c);
        cellEls[r][c].style.background =
          c === s.step ? (has ? CONFIG.activeCellColor : CONFIG.activeEmptyColor)
                       : (has ? CONFIG.cellColor : "transparent");
      }
    if (s.step >= 0) seqHead.style.left = ((s.step + 0.5) / CONFIG.seqCols * 100).toFixed(3) + "%";
    lastStep = s.step;
  }
  return s;
}

let playing = false, startStamp = 0, pausedAt = 0, rafId = null;
function nowMs(){ return (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now(); }
function tick(){ if (!playing) return; render(nowMs() - startStamp); rafId = requestAnimationFrame(tick); }
function play(){ if (playing) return; playing = true; startStamp = nowMs() - pausedAt; tick(); }
function pause(){ if (!playing) return; pausedAt = nowMs() - startStamp; playing = false; if (rafId) cancelAnimationFrame(rafId); rafId = null; }
function restart(){ pausedAt = 0; lastStep = -2; lastPlayed = -1; if (playing){ startStamp = nowMs(); } else { render(0); } }

window.addEventListener("message", function(e){
  if (!e.data || typeof e.data !== "object") return;
  if (e.data.cmd === "play") play();
  if (e.data.cmd === "pause") pause();
  if (e.data.cmd === "restart") restart();
});
render(0);
play();
</script>
</body>
</html>
