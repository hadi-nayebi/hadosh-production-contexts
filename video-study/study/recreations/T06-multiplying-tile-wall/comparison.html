<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T06 — Comparison: Multiplying tile wall</title>
<style>
  html,body{margin:0;padding:0;background:#111;color:#eee;font-family:ui-monospace,Menlo,Consolas,monospace;}
  body{padding:14px;box-sizing:border-box;}
  h1{font-size:16px;margin:0 0 12px;}
  #wrap{display:flex;gap:14px;align-items:flex-start;}
  .side{flex:1 1 0;min-width:0;}
  .side h2{font-size:13px;margin:0 0 8px;line-height:1.5;}
  video,iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:6px;background:#000;display:block;}
  #controls{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap;}
  #controls button{font:14px ui-monospace,monospace;padding:12px 20px;border-radius:6px;border:1px solid #555;background:#222;color:#eee;cursor:pointer;min-height:48px;}
  #clock{font-size:13px;color:#aaa;align-self:center;}
  @media (max-width:700px){ #wrap{flex-direction:column;} .side{width:100%;} }
</style>
</head>
<body>
<h1>T06 — Multiplying tile wall · side-by-side comparison</h1>
<div id="controls">
  <button id="btnPlay" type="button">Play both</button>
  <button id="btnPause" type="button">Pause both</button>
  <button id="btnRestart" type="button">Restart both</button>
  <span id="clock">0.0s / 23.0s</span>
</div>
<div id="wrap">
  <div class="side">
    <h2>ORIGINAL — "Look What I Can Do" @ 0:31–0:53</h2>
    <video id="orig" src="segment.mp4" preload="auto" playsinline></video>
  </div>
  <div class="side">
    <h2>RECREATION — T06 Multiplying tile wall, parameterized</h2>
    <iframe id="rec" src="recreation.html" title="T06 recreation"></iframe>
  </div>
</div>
<script>
"use strict";
const orig = document.getElementById("orig");
const rec = document.getElementById("rec");
const clockEl = document.getElementById("clock");
function recApi(){ try { return rec.contentWindow && rec.contentWindow.RECREATION; } catch(e){ return null; } }
function sync(){
  const api = recApi();
  if (api && !orig.paused) api.setTime(orig.currentTime * 1000);
  clockEl.textContent = orig.currentTime.toFixed(1) + "s / " + (orig.duration ? orig.duration.toFixed(1) : "23.0") + "s";
  requestAnimationFrame(sync);
}
requestAnimationFrame(sync);
orig.addEventListener("seeked", ()=>{ const api = recApi(); if (api) api.setTime(orig.currentTime*1000); });
document.getElementById("btnPlay").addEventListener("click", ()=>{ orig.play(); const api = recApi(); if (api) api.play(); });
document.getElementById("btnPause").addEventListener("click", ()=>{ orig.pause(); const api = recApi(); if (api) api.pause(); });
document.getElementById("btnRestart").addEventListener("click", ()=>{ orig.currentTime = 0; orig.play(); const api = recApi(); if (api) api.restart(); });
</script>
</body>
</html>
