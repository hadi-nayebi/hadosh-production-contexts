<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T102 — Definition card (parameterized recreation)</title>
<style>
  html,body{margin:0;padding:0;background:#11142e;}
  #stage{position:relative;overflow:hidden;margin:0 auto;}
  #card{position:absolute;box-sizing:border-box;transform-origin:50% 50%;}
  #textBack{position:absolute;box-sizing:border-box;}
  #title{position:absolute;left:0;right:0;text-align:center;}
  #rule{position:absolute;}
  #body{position:absolute;left:0;right:0;text-align:center;}
  #footerSvg{position:absolute;left:0;bottom:0;}
  #err{position:absolute;left:0;top:0;right:0;display:none;color:#fff;background:#a00;font:12px monospace;padding:4px;}
</style>
</head>
<body>
<div id="stage">
  <div id="card">
    <div id="textBack"></div>
    <div id="title"></div>
    <div id="rule"></div>
    <div id="body"></div>
    <svg id="footerSvg" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
  </div>
  <div id="err"></div>
</div>
<script>
"use strict";
/* ============ CONFIG — every content / timing / palette / font / geometry value lives here ============ */
const CONFIG = {
  card: {title: "TRANSITIONS", body: "Animated changes between two scenes to provide visual continuity"},
  gradient: {stops: ["#22d3ee", "#3b5bdb", "#7c3aed", "#ef4444"], angleDeg: 135},
  palette: {field: "#3f47c5", ink: "#ffffff"},
  footer: {motif: "dotted-path+capsule"},
  landMs: 1100,
  holdMs: 12900,
  stage: {width: 360},
  geom: {
    stageAspectW: 9, stageAspectH: 11,
    cardWFrac: 0.78, cardHFrac: 0.94,
    textBackX: 0.06, textBackY: 0.03, textBackWFrac: 0.88, textBackHFrac: 0.52, textBackRadius: 10,
    titleYFrac: 0.07, ruleYFrac: 0.30, ruleWFrac: 0.84, ruleHFrac: 0.012,
    bodyYFrac: 0.36, bodyWFrac: 0.94, bodyLineHFrac: 1.32
  },
  type: {
    font: "Arial, Helvetica, sans-serif",
    titlePx: 27, titleWeight: 800, titleLetterSpacingPx: 0.5,
    bodyPx: 15, bodyWeight: 400
  },
  textBack: {color: "#0a0e2e", opacity: 0.55},
  footerGeom: {
    svgWFrac: 0.46, svgHFrac: 0.30,
    capsuleX: 0.42, capsuleWFrac: 0.20, capsuleHFrac: 0.52, capsuleTopFrac: 0.48,
    capsuleFrom: "#f5e13d", capsuleTo: "#3ddc28",
    pathColor: "#22d3ee", pathWidthFrac: 0.035, pathDashFrac: 0.09,
    archX0: 0.10, archX1: 0.52, archTopFrac: 0.16, archBaseFrac: 1.0
  },
  motion: {fromScale: 0.92, fromOpacity: 0.0, fromRisePx: 14}
};
const TOP_KEYS = ["card","gradient","palette","footer","landMs","holdMs","stage","geom","type","textBack","footerGeom","motion"];

/* ============ override (?cfg= JSON) ============ */
function deepMerge(base, over){
  if (Array.isArray(over)){
    if (!Array.isArray(base)) return over.slice();
    const merged = base.map(function(b, i){ return i < over.length ? deepMerge(b, over[i]) : b; });
    for (let i = base.length; i < over.length; i++) merged.push(over[i]);
    return merged;
  }
  if (over && typeof over === "object"){
    const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
    for (const k of Object.keys(over)) out[k] = deepMerge(base ? base[k] : undefined, over[k]);
    return out;
  }
  return over;
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function resolveConfig(raw){
  if (raw === null || raw === undefined || raw === "") return {cfg: clone(CONFIG), errors: []};
  let over;
  try { over = JSON.parse(raw); } catch(e){ return {cfg: null, errors: ["cfg: malformed JSON"]}; }
  if (!over || typeof over !== "object" || Array.isArray(over)) return {cfg: null, errors: ["cfg: expected object"]};
  return {cfg: deepMerge(clone(CONFIG), over), errors: []};
}

/* ============ pure logic (node-testable) ============ */
function cycleMs(cfg){ return cfg.landMs + cfg.holdMs; }
function easeOutCubic(p){ return 1 - Math.pow(1 - p, 3); }
function phaseAt(t, cfg){
  const cyc = cycleMs(cfg);
  const u = ((t % cyc) + cyc) % cyc;
  if (u < cfg.landMs){
    const p = easeOutCubic(u / cfg.landMs);
    return {phase: "LAND", u: u, p: p,
      scale: cfg.motion.fromScale + (1 - cfg.motion.fromScale) * p,
      opacity: cfg.motion.fromOpacity + (1 - cfg.motion.fromOpacity) * p,
      risePx: cfg.motion.fromRisePx * (1 - p)};
  }
  return {phase: "HOLD", u: u, p: 1, scale: 1, opacity: 1, risePx: 0};
}
function gradientCSS(cfg){
  return "linear-gradient(" + cfg.gradient.angleDeg + "deg, " + cfg.gradient.stops.join(", ") + ")";
}
function hexRGB(h){
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
function relLum(rgb){
  function f(c){ c = c/255; return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); }
  return 0.2126*f(rgb[0]) + 0.7152*f(rgb[1]) + 0.0722*f(rgb[2]);
}
function contrastRatio(fgHex, bgRGB){
  const l1 = relLum(hexRGB(fgHex)), l2 = relLum(bgRGB);
  const hi = Math.max(l1,l2), lo = Math.min(l1,l2);
  return (hi + 0.05) / (lo + 0.05);
}
function blendOver(topHex, opacity, botRGB){
  const t = hexRGB(topHex);
  return [0,1,2].map(function(i){ return opacity*t[i] + (1-opacity)*botRGB[i]; });
}
/* Worst-case ink contrast: ink over the text backing composited on every
   gradient stop and every interpolated midpoint between consecutive stops. */
function worstCaseContrast(cfg){
  const stops = cfg.gradient.stops.map(hexRGB);
  const samples = stops.slice();
  for (let i = 0; i < stops.length - 1; i++)
    for (const f of [0.25, 0.5, 0.75])
      samples.push([0,1,2].map(function(k){ return stops[i][k] + f*(stops[i+1][k]-stops[i][k]); }));
  let worst = Infinity;
  for (const s of samples){
    const bg = blendOver(cfg.textBack.color, cfg.textBack.opacity, s);
    worst = Math.min(worst, contrastRatio(cfg.palette.ink, bg));
  }
  return worst;
}
/* Character width model (Arial advance widths, em fractions) for the fit harness. */
const CHAR_W = {upper: 0.68, lower: 0.52, space: 0.278, digit: 0.556, punct: 0.30};
function textWidthPx(text, fontPx, weight){
  let em = 0;
  for (const ch of text){
    if (ch === " ") em += CHAR_W.space;
    else if (ch >= "A" && ch <= "Z") em += CHAR_W.upper;
    else if (ch >= "0" && ch <= "9") em += CHAR_W.digit;
    else if (".,;:!?'’-—".indexOf(ch) >= 0) em += CHAR_W.punct;
    else em += CHAR_W.lower;
  }
  if (weight >= 700) em *= 1.06;
  return em * fontPx;
}
function wrapLines(text, fontPx, weight, maxW){
  const words = text.split(" ");
  const lines = []; let cur = "";
  for (const w of words){
    const trial = cur === "" ? w : cur + " " + w;
    if (textWidthPx(trial, fontPx, weight) <= maxW || cur === "") cur = trial;
    else { lines.push(cur); cur = w; }
  }
  if (cur !== "") lines.push(cur);
  return lines;
}
function layoutModel(cfg){
  const W = cfg.stage.width;
  const H = Math.round(W * cfg.geom.stageAspectH / cfg.geom.stageAspectW);
  const cardW = Math.round(W * cfg.geom.cardWFrac), cardH = Math.round(H * cfg.geom.cardHFrac);
  const cardX = Math.round((W - cardW) / 2), cardY = Math.round((H - cardH) / 2);
  const bodyMaxW = cardW * cfg.geom.bodyWFrac;
  const bodyLines = wrapLines(cfg.card.body, cfg.type.bodyPx, cfg.type.bodyWeight, bodyMaxW);
  const titleW = textWidthPx(cfg.card.title, cfg.type.titlePx, cfg.type.titleWeight) + cfg.type.titleLetterSpacingPx * Math.max(0, cfg.card.title.length - 1);
  return {stageW: W, stageH: H, cardX: cardX, cardY: cardY, cardW: cardW, cardH: cardH,
    bodyLines: bodyLines, bodyMaxW: bodyMaxW, titleW: titleW,
    titleInkH: cfg.type.titlePx * 0.716, bodyInkH: cfg.type.bodyPx * 0.75,
    cycle: cycleMs(cfg)};
}

/* ============ DOM construction ============ */
function build(cfg){
  const L = layoutModel(cfg);
  const g = cfg.geom, fg = cfg.footerGeom;
  const stage = document.getElementById("stage");
  stage.style.width = L.stageW + "px";
  stage.style.height = L.stageH + "px";
  stage.style.background = cfg.palette.field;
  stage.style.fontFamily = cfg.type.font;
  const card = document.getElementById("card");
  card.style.left = L.cardX + "px"; card.style.top = L.cardY + "px";
  card.style.width = L.cardW + "px"; card.style.height = L.cardH + "px";
  card.style.background = gradientCSS(cfg);
  const tb = document.getElementById("textBack");
  tb.style.left = (L.cardW * g.textBackX) + "px"; tb.style.top = (L.cardH * g.textBackY) + "px";
  tb.style.width = (L.cardW * g.textBackWFrac) + "px"; tb.style.height = (L.cardH * g.textBackHFrac) + "px";
  tb.style.borderRadius = g.textBackRadius + "px";
  tb.style.background = cfg.textBack.color; tb.style.opacity = String(cfg.textBack.opacity);
  const title = document.getElementById("title");
  title.textContent = cfg.card.title;
  title.style.top = (L.cardH * g.titleYFrac) + "px";
  title.style.color = cfg.palette.ink;
  title.style.fontSize = cfg.type.titlePx + "px";
  title.style.fontWeight = String(cfg.type.titleWeight);
  title.style.letterSpacing = cfg.type.titleLetterSpacingPx + "px";
  const rule = document.getElementById("rule");
  rule.style.left = (L.cardW * (1 - g.ruleWFrac) / 2) + "px";
  rule.style.top = (L.cardH * g.ruleYFrac) + "px";
  rule.style.width = (L.cardW * g.ruleWFrac) + "px";
  rule.style.height = Math.max(1, L.cardH * g.ruleHFrac) + "px";
  rule.style.background = cfg.palette.ink;
  const body = document.getElementById("body");
  body.style.top = (L.cardH * g.bodyYFrac) + "px";
  body.style.color = cfg.palette.ink;
  body.style.fontSize = cfg.type.bodyPx + "px";
  body.style.fontWeight = String(cfg.type.bodyWeight);
  body.style.lineHeight = String(g.bodyLineHFrac);
  body.style.paddingLeft = (L.cardW * (1 - g.bodyWFrac) / 2) + "px";
  body.style.paddingRight = (L.cardW * (1 - g.bodyWFrac) / 2) + "px";
  body.textContent = cfg.card.body;
  /* Footer motif: dotted arch path + gradient capsule, inside the card unit.
     The motif key is the application branch: only the named motif renders. */
  const svg = document.getElementById("footerSvg");
  if (cfg.footer.motif !== "dotted-path+capsule"){ svg.style.display = "none"; return L; }
  const sw = L.cardW * fg.svgWFrac, sh = L.cardH * fg.svgHFrac;
  svg.setAttribute("width", String(sw)); svg.setAttribute("height", String(sh));
  svg.setAttribute("viewBox", "0 0 " + sw + " " + sh);
  const capW = sw * fg.capsuleWFrac, capH = sh * fg.capsuleHFrac;
  const capX = sw * fg.capsuleX, capY = sh * fg.capsuleTopFrac;
  const archTop = sh * fg.archTopFrac, archBase = sh * fg.archBaseFrac;
  const ax0 = sw * fg.archX0, ax1 = sw * fg.archX1;
  const path = "M " + ax0 + " " + archBase + " L " + ax0 + " " + (archTop + (ax1-ax0)/2) +
    " A " + ((ax1-ax0)/2) + " " + ((ax1-ax0)/2) + " 0 0 1 " + ax1 + " " + (archTop + (ax1-ax0)/2) +
    " L " + ax1 + " " + archBase;
  svg.innerHTML =
    '<defs><linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="' + fg.capsuleFrom + '"/><stop offset="1" stop-color="' + fg.capsuleTo + '"/></linearGradient></defs>' +
    '<path d="' + path + '" fill="none" stroke="' + fg.pathColor + '" stroke-width="' + (sw * fg.pathWidthFrac) +
    '" stroke-dasharray="' + (sw * fg.pathDashFrac) + ' ' + (sw * fg.pathDashFrac) + '" stroke-linecap="round"/>' +
    '<rect x="' + capX + '" y="' + capY + '" width="' + capW + '" height="' + capH + '" rx="' + (capW/2) + '" fill="url(#capGrad)"/>';
  return L;
}
function applyFrame(cfg, t){
  const ph = phaseAt(t, cfg);
  const card = document.getElementById("card");
  card.style.transform = "scale(" + ph.scale + ") translateY(" + ph.risePx + "px)";
  card.style.opacity = String(ph.opacity);
  return ph;
}
if (typeof document !== "undefined"){
  const params = new URLSearchParams(location.search);
  const res = resolveConfig(params.get("cfg"));
  if (!res.cfg){
    const e = document.getElementById("err");
    e.style.display = "block"; e.textContent = res.errors.join("; ");
  } else {
    const cfg = res.cfg;
    build(cfg);
    let start = performance.now();
    let frozen = null;
    window.addEventListener("message", function(ev){
      if (ev.data === "pause" && frozen === null) frozen = performance.now() - start;
      if (ev.data === "play" && frozen !== null){ start = performance.now() - frozen; frozen = null; }
    });
    function tick(now){ applyFrame(cfg, frozen !== null ? frozen : now - start); requestAnimationFrame(tick); }
    requestAnimationFrame(tick);
    window.__t102 = {cfg: cfg, phaseAt: phaseAt, layout: layoutModel(cfg), worstCaseContrast: worstCaseContrast(cfg)};
  }
}
if (typeof module !== "undefined" && module.exports){
  module.exports = {CONFIG: CONFIG, resolveConfig: resolveConfig, phaseAt: phaseAt, cycleMs: cycleMs,
    gradientCSS: gradientCSS, worstCaseContrast: worstCaseContrast, layoutModel: layoutModel, wrapLines: wrapLines, textWidthPx: textWidthPx};
}
</script>
</body>
</html>
