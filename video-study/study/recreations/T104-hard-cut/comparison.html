<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T104 — Hard cut · comparison</title>
<style>
  html,body{margin:0;padding:0;background:#181818;color:#fff;font-family:Arial,sans-serif;}
  #wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:12px;}
  .side{flex:0 1 360px;max-width:100%;}
  .lbl{font-size:13px;margin:0 0 6px 0;}
  video,iframe{display:block;width:360px;max-width:100%;height:203px;border:0;background:#000;}
  #ctl{display:flex;gap:10px;justify-content:center;padding:12px;}
  button{font-size:15px;padding:10px 18px;min-height:44px;}
</style>
</head>
<body>
<div id="ctl">
  <button id="playBtn" type="button">Play</button>
  <button id="restartBtn" type="button">Restart</button>
</div>
<div id="wrap">
  <div class="side">
    <p class="lbl">ORIGINAL — School of Motion @ 14–28s</p>
    <video id="orig" src="segment.mp4" preload="auto" playsinline></video>
  </div>
  <div class="side">
    <p class="lbl">RECREATION — Hard cut, parameterized</p>
    <iframe id="rec" src="recreation.html" title="T104 recreation"></iframe>
  </div>
</div>
<script>
"use strict";
const vid = document.getElementById("orig");
const rec = document.getElementById("rec");
const playBtn = document.getElementById("playBtn");
let raf = null;
function recRender(ms){
  const w = rec.contentWindow;
  if (w && typeof w.__render === "function") w.__render(ms);
}
function tick(){
  recRender(vid.currentTime * 1000);
  if (!vid.paused && !vid.ended) raf = requestAnimationFrame(tick);
}
playBtn.addEventListener("click", function(){
  if (vid.paused) { vid.play(); playBtn.textContent = "Pause"; tick(); }
  else { vid.pause(); playBtn.textContent = "Play"; if (raf) cancelAnimationFrame(raf); }
});
document.getElementById("restartBtn").addEventListener("click", function(){
  vid.currentTime = 0; recRender(0); vid.play(); playBtn.textContent = "Pause"; tick();
});
vid.addEventListener("ended", function(){ playBtn.textContent = "Play"; recRender(14000); });
rec.addEventListener("load", function(){ recRender(0); });
</script>
</body>
</html>
