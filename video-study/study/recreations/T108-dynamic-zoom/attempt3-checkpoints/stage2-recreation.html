<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T108 — Dynamic / infinite zoom · recreation</title>
<style>
  html,body{margin:0;padding:0;background:#111;font-family:Arial,sans-serif;}
  #stage{position:relative;overflow:hidden;margin:0 auto;}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;}
  .laptop{position:absolute;box-sizing:border-box;}
  .base{position:absolute;box-sizing:border-box;display:flex;align-items:center;justify-content:center;}
  .screen{position:absolute;overflow:hidden;box-sizing:border-box;}
  .content{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-direction:column;align-items:center;}
  .ptitle{box-sizing:border-box;text-align:center;}
  .pill{box-sizing:border-box;display:flex;align-items:center;justify-content:center;}
  .row{box-sizing:border-box;display:flex;align-items:center;}
  .cursor{position:absolute;box-sizing:border-box;}
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
const CONFIG = {
  inner: {title:"Webpage", lines:["Motion Design Training","Result one","Result two"]},
  screenRect: {x:82, y:43, w:177, h:113},
  startScale: 0.65,
  zoomMs: 2600,
  holdBeforeMs: 1400,
  holdAfterMs: 3200,
  cycleMs: 14000,
  ease: "easeInOutCubic-single",
  loopFadeMs: 500,
  cameraTravelMs: 750,
  settle: {fromScale:0.94, fromDy:5, attackFraction:0.35, pillGrow:{offsetFraction:0.1429, spanFraction:0.2857, fromFraction:0.35}, rowOnsets:[0.45,0.62], rowSpanFraction:0.2, rowRise:4},
  cursor: {w:15, h:20, color:"#ffffff", fadeMs:220,
    polygon:[[0,0],[100,62],[58,68],[78,100],[58,100],[40,72],[0,100]],
    path:[{seg:"distant",u:0,x:330,y:55},{seg:"distant",u:1,x:275,y:80},{seg:"camera",u:0.6,x:235,y:93},{seg:"camera",u:1,x:170.5,y:99.5}]},
  laptop: {bezel:12, baseH:12, radius:6},
  innerLayout: {titleSize:9, pillTextSize:7.5, lineSize:8.0, pillW:118, pillH:13, rowW:130, rowH:11, gap:5, titleWeight:700, pillRadius:7, rowRadius:3, rowPad:6, pillPadX:8, titleLineHeight:1.3},
  palette: {field:"#e75480", body:"#3b4a6b", screen:"#7fe7d2", ink:"#22304a", pill:"#ffc93c", row:"#ffffff"},
  type: {font:"Arial, Helvetica, sans-serif"},
  stage: {width:360, height:203}
};

/* ---------- validation: malformed CONFIG is loud in __layout.errors, never silent ---------- */
const validationErrors = [];
function numField(obj, key, fallback){
  const v = obj[key];
  if (typeof v === "number" && isFinite(v)) return v;
  if (typeof v === "string" && v.trim() !== "" && isFinite(Number(v))){ validationErrors.push("type:"+key+" string-numeric coerced"); obj[key] = Number(v); return obj[key]; }
  validationErrors.push("invalid:"+key+" -> fallback "+fallback); obj[key] = fallback; return fallback;
}
numField(CONFIG.screenRect,"x",82); numField(CONFIG.screenRect,"y",43); numField(CONFIG.screenRect,"w",177); numField(CONFIG.screenRect,"h",113);
numField(CONFIG,"startScale",0.65); numField(CONFIG,"zoomMs",2600); numField(CONFIG,"holdBeforeMs",1400);
numField(CONFIG,"holdAfterMs",3200); numField(CONFIG,"cycleMs",14000); numField(CONFIG,"loopFadeMs",500);
numField(CONFIG,"cameraTravelMs",750);
if (!(CONFIG.cameraTravelMs>0 && CONFIG.cameraTravelMs<CONFIG.zoomMs)){ validationErrors.push("range:cameraTravelMs outside (0,zoomMs) -> 750"); CONFIG.cameraTravelMs = 750; }
if (!(CONFIG.zoomMs>0)){ validationErrors.push("range:zoomMs non-positive -> 2600"); CONFIG.zoomMs = 2600; }
if (!Array.isArray(CONFIG.inner.lines)){ validationErrors.push("invalid:inner.lines not an array -> []"); CONFIG.inner.lines = []; }
if (CONFIG.inner.lines.length === 0){ validationErrors.push("empty:inner.lines has no pill line"); }

/* ---------- text measurement (canvas metric; estimate fallback) ---------- */
const measureCtx = (function(){ try { const c = document.createElement("canvas"); return c.getContext("2d"); } catch(e){ return null; } })();
function measureW(text, sizePx, weight){
  if (measureCtx){ measureCtx.font = (weight?weight+" ":"") + sizePx + "px " + CONFIG.type.font; return measureCtx.measureText(String(text)).width; }
  return String(text).length * sizePx * 0.52;
}

/* ---------- derived geometry (recomputed from CONFIG on every load) ---------- */
const cameraFraction = CONFIG.cameraTravelMs / CONFIG.zoomMs;
const insideT = CONFIG.holdBeforeMs + CONFIG.cameraTravelMs;
const segBounds = {distant:[0,CONFIG.holdBeforeMs], camera:[CONFIG.holdBeforeMs, insideT], settle:[insideT, CONFIG.holdBeforeMs+CONFIG.zoomMs], hold:[CONFIG.holdBeforeMs+CONFIG.zoomMs, CONFIG.cycleMs]};
const resolvedPath = CONFIG.cursor.path.map(function(pt){ const b = segBounds[pt.seg] || segBounds.distant; return {t:b[0]+pt.u*(b[1]-b[0]), x:pt.x, y:pt.y}; });
const endScale = CONFIG.stage.width / CONFIG.screenRect.w;
const screenCx = CONFIG.screenRect.x + CONFIG.screenRect.w/2;
const screenCy = CONFIG.screenRect.y + CONFIG.screenRect.h/2;
const stageCx = CONFIG.stage.width/2, stageCy = CONFIG.stage.height/2;
const visibleW = CONFIG.stage.width / endScale;
const visibleH = CONFIG.stage.height / endScale;
const visTop = (CONFIG.screenRect.h - visibleH)/2;
const rowCount = Math.max(0, CONFIG.inner.lines.length - 1);
const titleW = measureW(CONFIG.inner.title, CONFIG.innerLayout.titleSize, CONFIG.innerLayout.titleWeight);
const pillTextW = CONFIG.inner.lines.length ? measureW(CONFIG.inner.lines[0], CONFIG.innerLayout.pillTextSize, 400) : 0;
let rowTextW = 0;
for (let i=1;i<CONFIG.inner.lines.length;i++) rowTextW = Math.max(rowTextW, measureW(CONFIG.inner.lines[i], CONFIG.innerLayout.lineSize, 400));
const effPillW = Math.max(CONFIG.innerLayout.pillW, pillTextW + 2*CONFIG.innerLayout.pillPadX);
const effRowW = Math.max(CONFIG.innerLayout.rowW, rowTextW + CONFIG.innerLayout.rowPad + CONFIG.innerLayout.pillPadX);
const naturalH = CONFIG.innerLayout.titleSize*CONFIG.innerLayout.titleLineHeight + CONFIG.innerLayout.pillH + rowCount*CONFIG.innerLayout.rowH + (rowCount+1)*CONFIG.innerLayout.gap;
const naturalW = Math.max(titleW, effPillW, effRowW);
const fitScale = Math.min(1, visibleH/naturalH, visibleW/naturalW);
const aspectValid = visibleH <= CONFIG.screenRect.h + 1e-9;
if (!aspectValid) validationErrors.push("aspect:visibleH "+visibleH.toFixed(1)+" exceeds screenRect.h "+CONFIG.screenRect.h+" — device would show at hold under width-derived scale");
const phaseTable = [
  {phase:"distant", from:0, to:CONFIG.holdBeforeMs},
  {phase:"zoom", from:CONFIG.holdBeforeMs, to:CONFIG.holdBeforeMs+CONFIG.zoomMs},
  {phase:"arrived", from:CONFIG.holdBeforeMs+CONFIG.zoomMs, to:CONFIG.holdBeforeMs+CONFIG.zoomMs+CONFIG.holdAfterMs},
  {phase:"extended", from:CONFIG.holdBeforeMs+CONFIG.zoomMs+CONFIG.holdAfterMs, to:CONFIG.cycleMs}
];

/* ---------- construction (reads ONLY CONFIG) ---------- */
const stage = document.getElementById("stage");
stage.style.width = CONFIG.stage.width + "px";
stage.style.height = CONFIG.stage.height + "px";
stage.style.background = CONFIG.palette.field;
document.body.style.fontFamily = CONFIG.type.font;

const world = document.createElement("div");
world.id = "world";
world.style.width = CONFIG.stage.width + "px";
world.style.height = CONFIG.stage.height + "px";
world.style.background = CONFIG.palette.field;
stage.appendChild(world);

function el(cls, parent){ const d=document.createElement("div"); d.className=cls; parent.appendChild(d); return d; }

const bz = CONFIG.laptop.bezel;
const laptop = el("laptop", world);
laptop.style.left = (CONFIG.screenRect.x-bz)+"px";
laptop.style.top = (CONFIG.screenRect.y-bz)+"px";
laptop.style.width = (CONFIG.screenRect.w+2*bz)+"px";
laptop.style.height = (CONFIG.screenRect.h+bz+CONFIG.laptop.baseH)+"px";
laptop.style.background = CONFIG.palette.body;
laptop.style.borderRadius = CONFIG.laptop.radius+"px";
const base = el("base", laptop);
base.style.left = "0px";
base.style.top = (CONFIG.screenRect.h+bz)+"px";
base.style.width = (CONFIG.screenRect.w+2*bz)+"px";
base.style.height = CONFIG.laptop.baseH+"px";

const screen = el("screen", world);
screen.style.left = CONFIG.screenRect.x+"px";
screen.style.top = CONFIG.screenRect.y+"px";
screen.style.width = CONFIG.screenRect.w+"px";
screen.style.height = CONFIG.screenRect.h+"px";
screen.style.background = CONFIG.palette.screen;

const content = el("content", screen);
content.style.width = CONFIG.screenRect.w+"px";
content.style.height = CONFIG.screenRect.h+"px";
content.style.justifyContent = "center";
content.style.gap = CONFIG.innerLayout.gap+"px";
content.style.transform = "scale("+fitScale+")";
content.style.left = ((CONFIG.screenRect.w - CONFIG.screenRect.w*fitScale)/2)+"px";
content.style.top = ((visTop + visibleH/2) - (CONFIG.screenRect.h*fitScale)/2)+"px";

const ptitle = el("ptitle", content);
ptitle.textContent = CONFIG.inner.title;
ptitle.style.fontSize = CONFIG.innerLayout.titleSize+"px";
ptitle.style.fontWeight = CONFIG.innerLayout.titleWeight;
ptitle.style.lineHeight = String(CONFIG.innerLayout.titleLineHeight);
ptitle.style.flexShrink = "0";
ptitle.style.color = CONFIG.palette.ink;
const pill = el("pill", content);
pill.style.width = effPillW+"px";
pill.style.height = CONFIG.innerLayout.pillH+"px";
pill.style.background = CONFIG.palette.pill;
pill.style.borderRadius = CONFIG.innerLayout.pillRadius+"px";
pill.style.color = CONFIG.palette.ink;
pill.style.fontSize = CONFIG.innerLayout.pillTextSize+"px";
pill.style.flexShrink = "0";
pill.textContent = "";
const rowEls = [];
CONFIG.inner.lines.slice(1).forEach(function(txt){
  const r = el("row", content);
  rowEls.push(r);
  r.style.width = effRowW+"px";
  r.style.flexShrink = "0";
  r.style.height = CONFIG.innerLayout.rowH+"px";
  r.style.background = CONFIG.palette.row;
  r.style.borderRadius = CONFIG.innerLayout.rowRadius+"px";
  r.style.color = CONFIG.palette.ink;
  r.style.fontSize = CONFIG.innerLayout.lineSize+"px";
  r.style.paddingLeft = CONFIG.innerLayout.rowPad+"px";
  r.textContent = txt;
});

const cursor = el("cursor", world);
cursor.style.width = CONFIG.cursor.w+"px";
cursor.style.height = CONFIG.cursor.h+"px";
cursor.style.background = CONFIG.cursor.color;
cursor.style.clipPath = "polygon(" + CONFIG.cursor.polygon.map(function(pt){ return pt[0]+"% "+pt[1]+"%"; }).join(", ") + ")";
cursor.style.left = resolvedPath[0].x+"px";
cursor.style.top = resolvedPath[0].y+"px";

/* ---------- camera: ONE transform, ONE ease family, single clock ---------- */
function easeInOutCubic(u){ return u<0.5 ? 4*u*u*u : 1-Math.pow(-2*u+2,3)/2; }
const EASES = {"easeInOutCubic-single": easeInOutCubic};
function smooth(q){ return q*q*(3-2*q); }
function cursorPosAt(t){
  const P = resolvedPath;
  if (t <= P[0].t) return {x:P[0].x, y:P[0].y};
  for (let i=0;i<P.length-1;i++){
    if (t < P[i+1].t){
      const q = smooth((t-P[i].t)/(P[i+1].t-P[i].t));
      return {x:P[i].x+(P[i+1].x-P[i].x)*q, y:P[i].y+(P[i+1].y-P[i].y)*q};
    }
  }
  return {x:P[P.length-1].x, y:P[P.length-1].y};
}
/* entry event: first cycle time the cursor hotspot (its path point, the glyph tip)
   lies inside the screen rectangle, both in world coordinates */
let entryT = null;
for (let t=0;t<=CONFIG.holdBeforeMs+CONFIG.zoomMs;t++){
  const p = cursorPosAt(t);
  if (p.x>=CONFIG.screenRect.x && p.x<=CONFIG.screenRect.x+CONFIG.screenRect.w && p.y>=CONFIG.screenRect.y && p.y<=CONFIG.screenRect.y+CONFIG.screenRect.h){ entryT = t; break; }
}
function pose(tms){
  const t = ((tms % CONFIG.cycleMs) + CONFIG.cycleMs) % CONFIG.cycleMs;
  const zoomStart = CONFIG.holdBeforeMs, zoomEnd = zoomStart + CONFIG.zoomMs;
  const arrivedEnd = zoomEnd + CONFIG.holdAfterMs;
  let raw = 0, cam = 0, phase;
  if (t < zoomStart){ raw = 0; cam = 0; phase = "distant"; }
  else if (t < zoomEnd){ raw = (t-zoomStart)/CONFIG.zoomMs; cam = EASES[CONFIG.ease](Math.min(raw/cameraFraction,1)); phase = "zoom"; }
  else if (t < arrivedEnd){ raw = 1; cam = 1; phase = "arrived"; }
  else { raw = 1; cam = 1; phase = "extended"; }
  /* settle: inside the zoom window, after the camera sub-span */
  let settleScale = 1, settleDy = 0;
  if (phase === "zoom" && t > insideT){
    const sp = (t-insideT)/(zoomEnd-insideT);
    let disp;
    if (sp < CONFIG.settle.attackFraction){ disp = smooth(sp/CONFIG.settle.attackFraction); }
    else { disp = 1 - smooth((sp-CONFIG.settle.attackFraction)/(1-CONFIG.settle.attackFraction)); }
    settleScale = 1 + (CONFIG.settle.fromScale-1)*disp;
    settleDy = CONFIG.settle.fromDy*disp;
  }
  let pillProg = 0; const rowProg = [];
  if (t >= insideT){
    const sp2 = Math.min(Math.max((t-insideT)/(zoomEnd-insideT),0),1);
    pillProg = Math.min(Math.max((sp2-CONFIG.settle.pillGrow.offsetFraction)/CONFIG.settle.pillGrow.spanFraction,0),1);
    for (let i=0;i<rowCount;i++){ const on = CONFIG.settle.rowOnsets[Math.min(i,CONFIG.settle.rowOnsets.length-1)]; rowProg.push(Math.min(Math.max((sp2-on)/CONFIG.settle.rowSpanFraction,0),1)); }
  }
  const cp = cursorPosAt(t);
  let txTarget = screenCx, tyTarget = screenCy;
  if (entryT !== null && t >= entryT){
    const q = smooth(Math.min((t-entryT)/Math.max(insideT-entryT,1),1));
    txTarget = screenCx + (cp.x-screenCx)*q;
    tyTarget = screenCy + (cp.y-screenCy)*q;
  }
  const s = CONFIG.startScale + (endScale - CONFIG.startScale)*cam;
  const tx = stageCx - txTarget*s;
  const ty = stageCy - tyTarget*s;
  const edge = Math.min(t, CONFIG.cycleMs - t);
  const opacity = edge < CONFIG.loopFadeMs ? edge/CONFIG.loopFadeMs : 1;
  let cursorOpacity;
  if (t < insideT - CONFIG.cursor.fadeMs) cursorOpacity = 1;
  else if (t >= insideT) cursorOpacity = 0;
  else cursorOpacity = 1 - (t-(insideT-CONFIG.cursor.fadeMs))/CONFIG.cursor.fadeMs;
  const pillFull = CONFIG.inner.lines.length ? CONFIG.inner.lines[0] : "";
  return {s:s, tx:tx, ty:ty, u:cam, raw:raw, opacity:opacity, cursorOpacity:cursorOpacity,
          cursorX:cp.x, cursorY:cp.y, targetX:txTarget, targetY:tyTarget,
          settleScale:settleScale, settleDy:settleDy, phase:phase, entryT:entryT,
          pillProg:pillProg, pillChars:Math.floor(pillProg*pillFull.length), rowProg:rowProg};
}
function render(tms){
  const p = pose(tms);
  world.style.transform = "translate("+p.tx+"px,"+p.ty+"px) scale("+p.s+")";
  world.style.opacity = String(p.opacity);
  world.dataset.phase = p.phase;
  cursor.style.opacity = String(p.cursorOpacity);
  cursor.style.left = p.cursorX+"px";
  cursor.style.top = p.cursorY+"px";
  const pillFullText = CONFIG.inner.lines.length ? CONFIG.inner.lines[0] : "";
  pill.style.width = (effPillW * (CONFIG.settle.pillGrow.fromFraction + (1-CONFIG.settle.pillGrow.fromFraction)*p.pillProg))+"px";
  pill.textContent = pillFullText.slice(0, p.pillChars);
  rowEls.forEach(function(r, i){ const q = p.rowProg[i] || 0; r.style.opacity = String(q); r.style.transform = "translateY("+((1-q)*CONFIG.settle.rowRise)+"px)"; });
  const eff = fitScale * p.settleScale;
  content.style.transform = "scale("+eff+")";
  content.style.left = ((CONFIG.screenRect.w - CONFIG.screenRect.w*eff)/2)+"px";
  content.style.top = ((visTop + visibleH/2) - (CONFIG.screenRect.h*eff)/2 + p.settleDy)+"px";
}
window.__render = render;
window.__pose = pose;
window.__config = CONFIG;
window.__layout = {endScale:endScale, visibleW:visibleW, visibleH:visibleH, visTop:visTop, fitScale:fitScale, naturalH:naturalH, naturalW:naturalW, rowCount:rowCount, titleW:titleW, effPillW:effPillW, effRowW:effRowW, aspectValid:aspectValid, errors:validationErrors, phaseTable:phaseTable, entryT:entryT, cameraFraction:cameraFraction, insideT:insideT, resolvedPath:resolvedPath};
let start = null;
function frame(ts){
  if (start === null) start = ts;
  render(ts - start);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
