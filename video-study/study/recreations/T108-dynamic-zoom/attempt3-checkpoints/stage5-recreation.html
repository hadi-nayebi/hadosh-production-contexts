  cursor:{w:15, h:20, color:"#ffffff", fadeMs:220, polygon:[[0,0],[100,62],[58,68],[78,100],[58,100],[40,72],[0,100]], path:[{seg:"distant",u:0,x:330,y:55},{seg:"distant",u:1,x:275,y:80},{seg:"camera",u:0.6,x:235,y:93},{seg:"camera",u:1}]},

/* ---------- validation: a single schema pass BEFORE any derivation or construction.

const validationErrors = [];
function isObj(v){ return !!v && typeof v === "object" && !Array.isArray(v); }
function numV(obj, key, fb){

  validationErrors.push("invalid:"+key+" -> default"); obj[key] = fb; return fb;
}
["inner","screenRect","settle","cursor","laptop","innerLayout","palette","type","stage","fit","measure"].forEach(function(k){

function isNum(v){ return typeof v === "number" && isFinite(v); }

}

numV(CONFIG.screenRect,"w",DEFAULTS.screenRect.w); numV(CONFIG.screenRect,"h",DEFAULTS.screenRect.h);
numV(CONFIG,"startScale",DEFAULTS.startScale); numV(CONFIG,"zoomMs",DEFAULTS.zoomMs); numV(CONFIG,"holdBeforeMs",DEFAULTS.holdBeforeMs);
numV(CONFIG,"cycleMs",DEFAULTS.cycleMs); numV(CONFIG,"loopFadeMs",DEFAULTS.loopFadeMs); numV(CONFIG,"cameraTravelMs",DEFAULTS.cameraTravelMs);
numV(CONFIG.fit,"maxScale",DEFAULTS.fit.maxScale); numV(CONFIG.measure,"weight",DEFAULTS.measure.weight); numV(CONFIG.measure,"fallbackCharRatio",DEFAULTS.measure.fallbackCharRatio);
numV(CONFIG.settle,"fromScale",DEFAULTS.settle.fromScale); numV(CONFIG.settle,"fromDy",DEFAULTS.settle.fromDy); numV(CONFIG.settle,"attackFraction",DEFAULTS.settle.attackFraction);
numV(CONFIG.settle.pillGrow,"offsetFraction",DEFAULTS.settle.pillGrow.offsetFraction); numV(CONFIG.settle.pillGrow,"spanFraction",DEFAULTS.settle.pillGrow.spanFraction); numV(CONFIG.settle.pillGrow,"fromFraction",DEFAULTS.settle.pillGrow.fromFraction);
numV(CONFIG.settle,"rowSpanFraction",DEFAULTS.settle.rowSpanFraction); numV(CONFIG.settle,"rowRise",DEFAULTS.settle.rowRise);
numV(CONFIG.cursor,"w",DEFAULTS.cursor.w); numV(CONFIG.cursor,"h",DEFAULTS.cursor.h); numV(CONFIG.cursor,"fadeMs",DEFAULTS.cursor.fadeMs);

["titleSize","pillTextSize","lineSize","pillW","pillH","rowW","rowH","gap","titleWeight","pillRadius","rowRadius","rowPad","pillPadX","titleLineHeight"].forEach(function(k){ numV(CONFIG.innerLayout,k,DEFAULTS.innerLayout[k]); });

}
["page","field","body","screen","ink","pill","row"].forEach(function(k){ if (typeof CONFIG.palette[k] !== "string"){ validationErrors.push("invalid:palette."+k+" -> default"); CONFIG.palette[k] = DEFAULTS.palette[k]; } });

numV(CONFIG.stage,"width",DEFAULTS.stage.width); numV(CONFIG.stage,"height",DEFAULTS.stage.height);
/* range rules, applied to the validated values */
if (!(CONFIG.screenRect.w >= 1 && CONFIG.screenRect.h >= 1)){ validationErrors.push("range:screenRect dimensions -> default"); CONFIG.screenRect.w = DEFAULTS.screenRect.w; CONFIG.screenRect.h = DEFAULTS.screenRect.h; }

if (!(CONFIG.holdBeforeMs >= 0) || !(CONFIG.loopFadeMs >= 0) || !(CONFIG.cursor.fadeMs >= 0)){ validationErrors.push("range:negative duration -> defaults"); if (!(CONFIG.holdBeforeMs >= 0)) CONFIG.holdBeforeMs = DEFAULTS.holdBeforeMs; if (!(CONFIG.loopFadeMs >= 0)) CONFIG.loopFadeMs = DEFAULTS.loopFadeMs; if (!(CONFIG.cursor.fadeMs >= 0)) CONFIG.cursor.fadeMs = DEFAULTS.cursor.fadeMs; }

  validationErrors.push("range:timing set inconsistent -> defaults"); CONFIG.zoomMs = DEFAULTS.zoomMs; CONFIG.cameraTravelMs = DEFAULTS.cameraTravelMs;
  if (!(CONFIG.cycleMs > CONFIG.holdBeforeMs + CONFIG.zoomMs) || CONFIG.cycleMs > 3600000 || CONFIG.holdBeforeMs > 3600000){ CONFIG.cycleMs = DEFAULTS.cycleMs; CONFIG.holdBeforeMs = DEFAULTS.holdBeforeMs; CONFIG.zoomMs = DEFAULTS.zoomMs; }
}
if (!(CONFIG.settle.attackFraction > 0 && CONFIG.settle.attackFraction < 1)){ validationErrors.push("range:settle.attackFraction -> default"); CONFIG.settle.attackFraction = DEFAULTS.settle.attackFraction; }
if (!(CONFIG.settle.pillGrow.offsetFraction >= 0 && CONFIG.settle.pillGrow.spanFraction > 0 && CONFIG.settle.pillGrow.offsetFraction + CONFIG.settle.pillGrow.spanFraction <= 1 && CONFIG.settle.pillGrow.fromFraction >= 0 && CONFIG.settle.pillGrow.fromFraction <= 1)){
  validationErrors.push("range:settle.pillGrow -> default"); CONFIG.settle.pillGrow = deepCopy(DEFAULTS.settle.pillGrow);
}
if (!(CONFIG.settle.rowSpanFraction > 0 && CONFIG.settle.rowSpanFraction <= 1)){ validationErrors.push("range:settle.rowSpanFraction -> default"); CONFIG.settle.rowSpanFraction = DEFAULTS.settle.rowSpanFraction; }
if (!(CONFIG.settle.fromScale > 0)){ validationErrors.push("range:settle.fromScale -> default"); CONFIG.settle.fromScale = DEFAULTS.settle.fromScale; }
if (!CONFIG.settle.rowOnsets.every(function(on){ return on + CONFIG.settle.rowSpanFraction <= 1; })){ validationErrors.push("range:settle.rowOnsets+span exceed window -> default"); CONFIG.settle.rowOnsets = deepCopy(DEFAULTS.settle.rowOnsets); }
/* path segment / fraction / chronology rules, priced on the validated timing values:
   segment names must be known keys, fractions inside [0,1], resolved times non-decreasing */
(function(){
  const B = {distant:[0,CONFIG.holdBeforeMs], camera:[CONFIG.holdBeforeMs, CONFIG.holdBeforeMs+CONFIG.cameraTravelMs], settle:[CONFIG.holdBeforeMs+CONFIG.cameraTravelMs, CONFIG.holdBeforeMs+CONFIG.zoomMs], hold:[CONFIG.holdBeforeMs+CONFIG.zoomMs, CONFIG.cycleMs]};
  let ok = true, prev = -Infinity;
  CONFIG.cursor.path.forEach(function(pt){
    if (!Object.prototype.hasOwnProperty.call(B, pt.seg) || !(pt.u >= 0 && pt.u <= 1)){ ok = false; return; }
    const t = B[pt.seg][0] + pt.u*(B[pt.seg][1]-B[pt.seg][0]);
    if (t < prev) ok = false;
    prev = t;
  });
  if (!ok){ validationErrors.push("invalid:cursor.path segment/fraction/order -> default"); CONFIG.cursor.path = deepCopy(DEFAULTS.cursor.path); }
})();
if (!(CONFIG.fit.maxScale > 0)){ validationErrors.push("range:fit.maxScale -> default"); CONFIG.fit.maxScale = DEFAULTS.fit.maxScale; }
if (!Object.prototype.hasOwnProperty.call(EASES, CONFIG.ease)){ validationErrors.push("invalid:ease -> default"); CONFIG.ease = DEFAULTS.ease; }

/* ---------- text measurement (canvas metric; estimate fallback) ---------- */
const measureCtx = (function(){ try { const c = document.createElement("canvas"); return c.getContext("2d"); } catch(e){ return null; } })();
function measureW(text, sizePx, weight){
  if (measureCtx){ measureCtx.font = (weight?weight+" ":"") + sizePx + "px " + CONFIG.type.font; return measureCtx.measureText(String(text)).width; }
  return String(text).length * sizePx * CONFIG.measure.fallbackCharRatio;
}

/* ---------- derived geometry (recomputed from CONFIG on every load) ---------- */
const cameraFraction = CONFIG.cameraTravelMs / CONFIG.zoomMs;
const insideT = CONFIG.holdBeforeMs + CONFIG.cameraTravelMs;
const segBounds = {distant:[0,CONFIG.holdBeforeMs], camera:[CONFIG.holdBeforeMs, insideT], settle:[insideT, CONFIG.holdBeforeMs+CONFIG.zoomMs], hold:[CONFIG.holdBeforeMs+CONFIG.zoomMs, CONFIG.cycleMs]};
const screenCx = CONFIG.screenRect.x + CONFIG.screenRect.w/2;
const screenCy = CONFIG.screenRect.y + CONFIG.screenRect.h/2;
/* the path's final waypoint IS the screen centre by construction: its configured
   coordinates are the default-geometry expression of that centre, and the resolved
   path snaps the final point to the centre of whatever screenRect is configured,
   so a geometry swap keeps the camera endpoint centred */
const resolvedPath = CONFIG.cursor.path.map(function(pt, i, arr){ const b = Object.prototype.hasOwnProperty.call(segBounds, pt.seg) ? segBounds[pt.seg] : segBounds.distant; const last = i === arr.length-1; return {t:b[0]+pt.u*(b[1]-b[0]), x:last?screenCx:pt.x, y:last?screenCy:pt.y}; });
const endScale = Math.max(CONFIG.stage.width / CONFIG.screenRect.w, CONFIG.stage.height / CONFIG.screenRect.h);
const stageCx = CONFIG.stage.width/2, stageCy = CONFIG.stage.height/2;
const visibleW = CONFIG.stage.width / endScale;
const visibleH = CONFIG.stage.height / endScale;
const visTop = (CONFIG.screenRect.h - visibleH)/2;
const rowCount = Math.max(0, CONFIG.inner.lines.length - 1);
const titleW = measureW(CONFIG.inner.title, CONFIG.innerLayout.titleSize, CONFIG.innerLayout.titleWeight);
const pillTextW = CONFIG.inner.lines.length ? measureW(CONFIG.inner.lines[0], CONFIG.innerLayout.pillTextSize, CONFIG.measure.weight) : 0;
let rowTextW = 0;
for (let i=1;i<CONFIG.inner.lines.length;i++) rowTextW = Math.max(rowTextW, measureW(CONFIG.inner.lines[i], CONFIG.innerLayout.lineSize, CONFIG.measure.weight));
const effPillW = Math.max(CONFIG.innerLayout.pillW, pillTextW + 2*CONFIG.innerLayout.pillPadX);
const effRowW = Math.max(CONFIG.innerLayout.rowW, rowTextW + CONFIG.innerLayout.rowPad + CONFIG.innerLayout.pillPadX);
function wrapLines(text, sizePx, weight, availW){
  const words = String(text).split(/\s+/).filter(function(w){ return w.length > 0; });
  if (!words.length) return {lines:1, maxW:0};
  const spaceW = measureW(" ", sizePx, weight);
  let lines = 1, cur = 0, maxW = 0;
  words.forEach(function(w){
    const ww = measureW(w, sizePx, weight);

    else if (cur + spaceW + ww <= availW){ cur += spaceW + ww; }

const titleLines = titleWrap.lines;

  {phase:"zoom", from:CONFIG.holdBeforeMs, to:CONFIG.holdBeforeMs+CONFIG.zoomMs},

  for (let i=0;i<P.length-1;i++){
    if (t < P[i+1].t){
      const q = smooth((t-P[i].t)/(P[i+1].t-P[i].t));
      return {x:P[i].x+(P[i+1].x-P[i].x)*q, y:P[i].y+(P[i+1].y-P[i].y)*q};
    }
  }

}
/* entry event: first cycle time the cursor hotspot (its path point, the glyph tip)
   lies inside the screen rectangle, both in world coordinates */
let entryT = null;
const entryStep = Math.max(1, Math.ceil((CONFIG.holdBeforeMs+CONFIG.zoomMs)/20000));
for (let t=0;t<=CONFIG.holdBeforeMs+CONFIG.zoomMs;t+=entryStep){
  const p = cursorPosAt(t);
  if (p.x>=CONFIG.screenRect.x && p.x<=CONFIG.screenRect.x+CONFIG.screenRect.w && p.y>=CONFIG.screenRect.y && p.y<=CONFIG.screenRect.y+CONFIG.screenRect.h){ entryT = t; break; }
}
function pose(tms){
  const t = ((tms % CONFIG.cycleMs) + CONFIG.cycleMs) % CONFIG.cycleMs;
  const zoomStart = CONFIG.holdBeforeMs, zoomEnd = zoomStart + CONFIG.zoomMs;
  let raw = 0, cam = 0, phase;
  if (t < zoomStart){ raw = 0; cam = 0; phase = "distant"; }
  else if (t < zoomEnd){ raw = (t-zoomStart)/CONFIG.zoomMs; cam = EASES[CONFIG.ease](Math.min(raw/cameraFraction,1)); phase = "zoom"; }
  else { raw = 1; cam = 1; phase = "hold"; }
  /* settle: inside the zoom window, after the camera sub-span (sp measures progress
     across that post-arrival portion). The envelope is neutral at arrival, rises
     smoothly to its peak displacement, and returns to neutral at the window's
     end — no step anywhere in it */
  let settleScale = 1, settleDy = 0;
  if (phase === "zoom" && t > insideT){
    const sp = (t-insideT)/(zoomEnd-insideT);
    let disp;
    if (sp < CONFIG.settle.attackFraction){ disp = smooth(sp/CONFIG.settle.attackFraction); }
    else { disp = 1 - smooth((sp-CONFIG.settle.attackFraction)/(1-CONFIG.settle.attackFraction)); }

    settleDy = CONFIG.settle.fromDy*disp;

  let pillProg = 0; const rowProg = [];
  if (t >= insideT){
    const sp2 = Math.min(Math.max((t-insideT)/(zoomEnd-insideT),0),1);
    pillProg = Math.min(Math.max((sp2-CONFIG.settle.pillGrow.offsetFraction)/CONFIG.settle.pillGrow.spanFraction,0),1);
    for (let i=0;i<rowCount;i++){ const on = CONFIG.settle.rowOnsets[Math.min(i,CONFIG.settle.rowOnsets.length-1)]; rowProg.push(Math.min(Math.max((sp2-on)/CONFIG.settle.rowSpanFraction,0),1)); }
  }
  const cp = cursorPosAt(t);
  /* camera target: the screen centre until the cursor enters the screen, then a
     smooth blend from the centre to the cursor; the blend completes at arrival,
     where the path's final waypoint is the centre, so the target ends centred */
  let txTarget = screenCx, tyTarget = screenCy;
  if (entryT !== null && t >= entryT){
    const q = smooth(Math.min((t-entryT)/Math.max(insideT-entryT,1),1));
    txTarget = screenCx + (cp.x-screenCx)*q;
    tyTarget = screenCy + (cp.y-screenCy)*q;
  }
  const s = CONFIG.startScale + (endScale - CONFIG.startScale)*cam;
  const tx = stageCx - txTarget*s;
  const ty = stageCy - tyTarget*s;
  const edge = Math.min(t, CONFIG.cycleMs - t);
  const opacity = edge < CONFIG.loopFadeMs ? edge/CONFIG.loopFadeMs : 1;
  let cursorOpacity;
  if (t < insideT - CONFIG.cursor.fadeMs) cursorOpacity = 1;
  else if (t >= insideT) cursorOpacity = 0;
  else cursorOpacity = 1 - (t-(insideT-CONFIG.cursor.fadeMs))/CONFIG.cursor.fadeMs;
  const pillFull = CONFIG.inner.lines.length ? CONFIG.inner.lines[0] : "";
  return {s:s, tx:tx, ty:ty, u:cam, raw:raw, opacity:opacity, cursorOpacity:cursorOpacity,
          cursorX:cp.x, cursorY:cp.y, targetX:txTarget, targetY:tyTarget,
          settleScale:settleScale, settleDy:settleDy, phase:phase, entryT:entryT,
          pillProg:pillProg, pillChars:Math.floor(pillProg*pillFull.length), rowProg:rowProg};
}
function render(tms){
  const p = pose(tms);
  world.style.transform = "translate("+p.tx+"px,"+p.ty+"px) scale("+p.s+")";
  world.style.opacity = String(p.opacity);
  world.dataset.phase = p.phase;
  cursor.style.opacity = String(p.cursorOpacity);
  cursor.style.left = p.cursorX+"px";
  cursor.style.top = p.cursorY+"px";
  const pillFullText = CONFIG.inner.lines.length ? CONFIG.inner.lines[0] : "";
  pill.style.width = (effPillW * (CONFIG.settle.pillGrow.fromFraction + (1-CONFIG.settle.pillGrow.fromFraction)*p.pillProg))+"px";
  pill.textContent = pillFullText.slice(0, p.pillChars);
  rowEls.forEach(function(r, i){ const q = p.rowProg[i] || 0; r.style.opacity = String(q); r.style.transform = "translateY("+((1-q)*CONFIG.settle.rowRise)+"px)"; });

  content.style.transform = "scale("+eff+")";
  content.style.left = ((CONFIG.screenRect.w - CONFIG.screenRect.w*eff)/2)+"px";

window.__render = render;
window.__pose = pose;
window.__config = CONFIG;
window.__layout = {endScale:endScale, visibleW:visibleW, visibleH:visibleH, visTop:visTop, fitScale:fitScale, naturalH:naturalH, naturalW:naturalW, rowCount:rowCount, titleW:titleW, titleLines:titleLines, titleWrapW:titleWrap.maxW, titleAvailW:titleAvailW, holdMs:holdMs, effPillW:effPillW, effRowW:effRowW, aspectValid:aspectValid, errors:validationErrors, phaseTable:phaseTable, entryT:entryT, cameraFraction:cameraFraction, insideT:insideT, resolvedPath:resolvedPath};
let start = null;
function frame(ts){
  if (start === null) start = ts;
  render(ts - start);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
