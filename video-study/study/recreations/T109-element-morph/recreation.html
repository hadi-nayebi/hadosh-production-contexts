<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T109 — Element morph / scene morph · recreation</title>
<style>
  html,body{margin:0;padding:0;background:#111;}
  #stage{position:relative;overflow:hidden;margin:0 auto;}
  .abs{position:absolute;box-sizing:border-box;}
  .txt{position:absolute;box-sizing:border-box;white-space:nowrap;}
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
const CONFIG = {
  sceneA: {kind:"webpage", title:"Motion Design Training", geometry:{searchBar:{x:180,y:30,w:200,h:22}, cardTop:{x:180,y:66,w:170,h:44}, cardMid:{x:180,y:122,w:170,h:36}, cardLow:{x:180,y:166,w:170,h:30}}},
  sceneB: {kind:"logoMark", triangles:[{color:"#e8443a",cx:158,cy:92,s:26},{color:"#3ac95c",cx:180,cy:84,s:26},{color:"#3a6fe8",cx:202,cy:92,s:26}], triClip:"polygon(50% 0%, 100% 100%, 0% 100%)"},
  correspondence: [
    {a:"cardTop", b:"triangleCluster", mode:"deform-to-cluster", stagger:0},
    {a:"searchBar", b:"none", mode:"collapse-to-point", stagger:0},
    {a:"cardMid", b:"none", mode:"collapse-down", stagger:120},
    {a:"cardLow", b:"none", mode:"collapse-down", stagger:240},
    {a:"field", b:"fieldBlack", mode:"color-interpolate", stagger:0}
  ],
  countdown: {label:"Scene morph", steps:[3,2,1], stepMs:1000, joiner:" in "},
  holdAMs: 2400, morphMs: 2000, settleMs: 900, holdBMs: 2600, loopFadeMs: 600, cycleMs: 14000,
  ease: "smoothstep",
  palette: {field:"#57c8b4", black:"#0a0a0a", ink:"#ffffff", cardA:"#3b4a6b", cardB:"#8a93a6", accent:"#ffd23c"},
  outline: {color:"#e8443a", width:2, inset:6},
  morph: {clusterW:72, clusterH:52, centroidX:180, centroidY:90, sinkPx:10, radiusMax:24, yieldStart:0.9, settleAmp:0.06, titlePadX:8, countTopOffset:34, prepFraction:0.35, reveal:{clearanceEnd:0.30, firstTriangleOnset:0.30, clusterOnset:0.55}},
  stage: {width:360, height:224},
  type: {font:"Arial, Helvetica, sans-serif", titleSize:16, countSize:22, titleWeight:400, countWeight:700}
};
const SUPPORTED_KINDS = ["webpage", "logoMark"];
function validateConfig(cfg){
  const problems = [];
  if (SUPPORTED_KINDS.indexOf(cfg.sceneA.kind) < 0) problems.push("sceneA.kind unsupported: " + cfg.sceneA.kind);
  if (SUPPORTED_KINDS.indexOf(cfg.sceneB.kind) < 0) problems.push("sceneB.kind unsupported: " + cfg.sceneB.kind);
  const sum = cfg.holdAMs + cfg.countdown.steps.length * cfg.countdown.stepMs + cfg.morphMs + cfg.settleMs + cfg.holdBMs + cfg.loopFadeMs;
  if (sum > cfg.cycleMs) problems.push("phase sum " + sum + " exceeds cycleMs " + cfg.cycleMs);
  cfg.correspondence.forEach(function(en){
    if (en.stagger >= cfg.morphMs) problems.push("stagger >= morphMs for " + en.a);
    if (en.mode.indexOf("collapse") === 0){
      const f = cfg.morph.prepFraction;
      if (en.stagger * f >= cfg.countdown.stepMs) problems.push("stagger*prepFraction >= stepMs for " + en.a);
      if (en.stagger * (1 - f) >= cfg.morphMs * cfg.morph.reveal.clearanceEnd) problems.push("stagger*(1-prepFraction) >= clearance span for " + en.a);
    }
  });
  return problems;
}
const VALIDATION = validateConfig(CONFIG);
const RESIDUAL = CONFIG.cycleMs - (CONFIG.holdAMs + CONFIG.countdown.steps.length * CONFIG.countdown.stepMs + CONFIG.morphMs + CONFIG.settleMs + CONFIG.holdBMs + CONFIG.loopFadeMs);
const stage = document.getElementById("stage");
stage.style.width = CONFIG.stage.width + "px";
stage.style.height = CONFIG.stage.height + "px";
stage.style.fontFamily = CONFIG.type.font;
function el(cls, parent){ const d = document.createElement("div"); d.className = cls; parent.appendChild(d); return d; }
function box(parent, cx, cy, w, h, bg){
  const d = el("abs", parent);
  d.style.left = (cx - w/2) + "px"; d.style.top = (cy - h/2) + "px";
  d.style.width = w + "px"; d.style.height = h + "px";
  if (bg) d.style.background = bg;
  return d;
}
function hexRgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function mix(a, b, p){
  const A = hexRgb(a), B = hexRgb(b);
  return "rgb(" + Math.round(A[0]+(B[0]-A[0])*p) + "," + Math.round(A[1]+(B[1]-A[1])*p) + "," + Math.round(A[2]+(B[2]-A[2])*p) + ")";
}
function easeFn(name, x){ if (name === "smoothstep") return x * x * (3 - 2 * x); return x; }
function clamp01(x){ return x < 0 ? 0 : (x > 1 ? 1 : x); }
const G = CONFIG.sceneA.geometry, P = CONFIG.palette, TY = CONFIG.type;
const field = box(stage, CONFIG.stage.width/2, CONFIG.stage.height/2, CONFIG.stage.width, CONFIG.stage.height, P.field);
const searchBar = box(field, G.searchBar.x, G.searchBar.y, G.searchBar.w, G.searchBar.h, P.accent);
searchBar.style.borderRadius = (G.searchBar.h/2) + "px";
const titleTxt = el("txt", searchBar);
titleTxt.textContent = CONFIG.sceneA.title;
titleTxt.style.left = CONFIG.morph.titlePadX + "px"; titleTxt.style.top = "0px";
titleTxt.style.fontSize = TY.titleSize + "px"; titleTxt.style.fontWeight = String(TY.titleWeight);
titleTxt.style.lineHeight = G.searchBar.h + "px"; titleTxt.style.color = P.black;
titleTxt.style.fontFamily = TY.font;
const cardTop = box(field, G.cardTop.x, G.cardTop.y, G.cardTop.w, G.cardTop.h, P.cardA);
const cardMid = box(field, G.cardMid.x, G.cardMid.y, G.cardMid.w, G.cardMid.h, P.cardB);
const cardLow = box(field, G.cardLow.x, G.cardLow.y, G.cardLow.w, G.cardLow.h, P.cardB);
const outline = el("abs", field);
outline.style.border = CONFIG.outline.width + "px solid " + CONFIG.outline.color;
outline.style.left = (G.cardTop.x - G.cardTop.w/2 - CONFIG.outline.inset) + "px";
outline.style.top = (G.cardTop.y - G.cardTop.h/2 - CONFIG.outline.inset) + "px";
outline.style.width = (G.cardTop.w + CONFIG.outline.inset*2) + "px";
outline.style.height = (G.cardTop.h + CONFIG.outline.inset*2) + "px";
outline.style.opacity = "0";
const tris = CONFIG.sceneB.triangles.map(function(t){
  const d = box(field, t.cx, t.cy, t.s, t.s, t.color);
  d.style.clipPath = CONFIG.sceneB.triClip;
  d.style.opacity = "0";
  return d;
});
const centroid = {x:CONFIG.morph.centroidX, y:CONFIG.morph.centroidY};
const countTxt = el("txt", field);
countTxt.style.left = "0px"; countTxt.style.width = CONFIG.stage.width + "px";
countTxt.style.textAlign = "center"; countTxt.style.top = (CONFIG.stage.height - CONFIG.morph.countTopOffset) + "px";
countTxt.style.fontSize = TY.countSize + "px"; countTxt.style.fontWeight = String(TY.countWeight);
countTxt.style.color = P.ink; countTxt.style.fontFamily = TY.font;
countTxt.style.opacity = "0";
const C0 = CONFIG.holdAMs;
const C1 = C0 + CONFIG.countdown.steps.length * CONFIG.countdown.stepMs;
const C2 = C1 + CONFIG.morphMs;
const C3 = C2 + CONFIG.settleMs;
const C4 = C3 + CONFIG.holdBMs;
const C5 = C4 + CONFIG.loopFadeMs;
const CYCLE = CONFIG.cycleMs;
function staggerOf(key){
  for (let i = 0; i < CONFIG.correspondence.length; i++) if (CONFIG.correspondence[i].a === key) return CONFIG.correspondence[i].stagger;
  return 0;
}
const P0 = C1 - CONFIG.countdown.stepMs;
const P1 = C1;
const P2 = C2;
function trajQ(t, s){
  const f = CONFIG.morph.prepFraction, stepMs = CONFIG.countdown.stepMs;
  const span = CONFIG.morphMs * CONFIG.morph.reveal.clearanceEnd;
  if (t < P0) return 0;
  if (t < P1) return f * clamp01((t - P0 - s * f) / (stepMs - s * f));
  if (t <= P2) return f + (1 - f) * clamp01((t - P1 - s * (1 - f)) / (span - s * (1 - f)));
  return 1;
}
function morphP(t, s){
  if (t < C1) return 0;
  if (t >= C2) return 1;
  return easeFn(CONFIG.ease, clamp01((t - C1 - s) / (CONFIG.morphMs - s)));
}
function progressFor(t, key){
  return morphP(t, staggerOf(key));
}
function topP(t, s){
  if (t < C1) return 0;
  if (t >= C2) return 1;
  const raw = clamp01((t - C1 - s) / (CONFIG.morphMs - s));
  return easeFn(CONFIG.ease, clamp01(raw / CONFIG.morph.reveal.clearanceEnd));
}
function triGrowth(t, i){
  if (t < C1) return 0;
  if (t >= C2) return 1;
  const mp = clamp01((t - C1) / CONFIG.morphMs), R = CONFIG.morph.reveal;
  if (i === 0) return clamp01((mp - R.firstTriangleOnset) / (1 - R.firstTriangleOnset));
  return clamp01((mp - R.clusterOnset) / (1 - R.clusterOnset));
}
const ELS = {cardTop: cardTop, searchBar: searchBar, cardMid: cardMid, cardLow: cardLow, field: field};
const GEOS = {cardTop: G.cardTop, searchBar: G.searchBar, cardMid: G.cardMid, cardLow: G.cardLow};
const BEHAVIOURS = {
  "deform-to-cluster": function(entry, tF){
    const p = topP(tF, entry.stagger), g = GEOS[entry.a], d = ELS[entry.a];
    let tw = g.w, th = g.h, tx = g.x, ty = g.y;
    if (entry.b === "triangleCluster"){ tw = CONFIG.morph.clusterW; th = CONFIG.morph.clusterH; tx = centroid.x; ty = centroid.y; }
    const cW = g.w + (tw - g.w) * p, cH = g.h + (th - g.h) * p;
    const cX = g.x + (tx - g.x) * p, cY = g.y + (ty - g.y) * p;
    d.style.left = (cX - cW/2) + "px"; d.style.top = (cY - cH/2) + "px";
    d.style.width = cW + "px"; d.style.height = cH + "px";
    d.style.borderRadius = (p * CONFIG.morph.radiusMax) + "px";
    d.style.background = mix(P.cardA, P.black, p);
    d.style.opacity = String(p < CONFIG.morph.yieldStart ? 1 : 1 - (p - CONFIG.morph.yieldStart) / (1 - CONFIG.morph.yieldStart));
  },
  "collapse-to-point": function(entry, tF){
    const q = trajQ(tF, entry.stagger), g = GEOS[entry.a], d = ELS[entry.a];
    const w = g.w * (1 - q), h = g.h * (1 - q);
    d.style.left = (g.x - w/2) + "px"; d.style.top = (g.y - h/2) + "px";
    d.style.width = w + "px"; d.style.height = h + "px";
    d.style.opacity = String(1 - q);
    if (entry.a === "searchBar") titleTxt.style.opacity = String(1 - q);
  },
  "collapse-down": function(entry, tF){
    const q = trajQ(tF, entry.stagger), g = GEOS[entry.a], d = ELS[entry.a];
    const centre = g.y + CONFIG.morph.sinkPx * q;
    const h = g.h * (1 - q);
    d.style.width = g.w + "px";
    d.style.left = (g.x - g.w/2) + "px";
    d.style.height = h + "px";
    d.style.top = (centre - h/2) + "px";
    d.style.opacity = String(1 - q);
  },
  "color-interpolate": function(entry, tF){
    const p = morphP(tF, entry.stagger);
    const target = entry.b === "fieldBlack" ? P.black : P.field;
    field.style.background = mix(P.field, target, p);
  }
};
function render(t){
  t = ((t % CYCLE) + CYCLE) % CYCLE;
  if (VALIDATION.length > 0){ window.__state = {p: 0, phase: "invalid", problems: VALIDATION}; return window.__state; }
  let tF = t;
  if (t >= C4 && t < C5){
    const rp = easeFn(CONFIG.ease, clamp01((t - C4) / CONFIG.loopFadeMs));
    tF = P0 + (1 - rp) * (P2 - P0);
  } else if (t >= C5) tF = 0;
  CONFIG.correspondence.forEach(function(entry){
    const fn = BEHAVIOURS[entry.mode];
    if (fn) fn(entry, tF);
  });
  const p = topP(tF, staggerOf("cardTop"));
  if (t >= C0 && t < C1){
    const idx = Math.floor((t - C0) / CONFIG.countdown.stepMs);
    countTxt.textContent = CONFIG.countdown.label + CONFIG.countdown.joiner + CONFIG.countdown.steps[idx];
    countTxt.style.opacity = "1";
    outline.style.opacity = (idx === CONFIG.countdown.steps.length - 1) ? "1" : "0";
  } else { countTxt.style.opacity = "0"; outline.style.opacity = "0"; }
  let settle = 0;
  if (t >= C2 && t < C3) settle = Math.sin((t - C2) / CONFIG.settleMs * Math.PI) * CONFIG.morph.settleAmp * (1 - (t - C2) / CONFIG.settleMs);
  tris.forEach(function(d, i){
    const tt = CONFIG.sceneB.triangles[i];
    const g = triGrowth(tF, i);
    const s = tt.s * g * (1 + settle);
    const cx = centroid.x + (tt.cx - centroid.x) * g, cy = centroid.y + (tt.cy - centroid.y) * g;
    d.style.left = (cx - s/2) + "px"; d.style.top = (cy - s/2) + "px";
    d.style.width = s + "px"; d.style.height = s + "px";
    d.style.opacity = String(g > 0 ? 1 : 0);
  });
  window.__state = {p: p, phase: t < C0 ? "holdA" : t < C1 ? "countdown" : t < C2 ? "morph" : t < C3 ? "settle" : t < C4 ? "holdB" : t < C5 ? "return" : "residualA"};
  return window.__state;
}
window.__render = render;
window.__config = CONFIG;
window.__validation = VALIDATION;
window.__residual = RESIDUAL;
window.__trajQ = trajQ;
window.__morphP = morphP;
window.__topP = topP;
window.__triGrowth = triGrowth;
window.__bounds = {P0: P0, P1: P1, P2: P2, C0: C0, C1: C1, C2: C2, C3: C3, C4: C4, C5: C5};
window.__els = {searchBar: searchBar, cardTop: cardTop, cardMid: cardMid, cardLow: cardLow, tris: tris, countTxt: countTxt, titleTxt: titleTxt, field: field};
render(0);
if (typeof requestAnimationFrame === "function"){
  const t0 = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
  const tick = function(){
    const now = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
    render(now - t0);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
