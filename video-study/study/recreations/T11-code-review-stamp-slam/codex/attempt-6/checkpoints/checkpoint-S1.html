<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T11 — Code-review UI + stamp slam · recreation</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#0b0e11}
  #stage{position:relative;width:100%;height:100%;min-height:300px;overflow:hidden;
         color:var(--fg);padding:8px}
  #card{height:100%;display:flex;flex-direction:column;gap:6px;will-change:transform,filter}
  .pr-head{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-width:0}
  .pr-num{color:var(--muted);font-weight:700}
  .pr-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .open-pill{border:1px solid var(--green);color:var(--green);border-radius:999px;padding:1px 7px}
  .stats{display:flex;gap:14px;color:var(--muted);align-items:center}
  .stats b{color:var(--fg)}
  .counter{display:inline-flex;overflow:hidden;vertical-align:middle}
  .digit{overflow:hidden;display:inline-block}
  .digit-strip{display:flex;flex-direction:column;will-change:transform}
  .digit-strip span{display:block;text-align:center;font-weight:700;color:var(--fg)}
  .main{flex:1;display:flex;gap:8px;min-height:0}
  .checks{border:1px solid var(--panel-border);border-radius:8px;padding:7px;background:var(--panel);align-self:flex-start}
  .checks h3{margin:0 0 5px}
  .check{display:flex;justify-content:space-between;gap:4px;padding:2px 0;flex-wrap:wrap}
  .ok{color:var(--ok)}.bad{color:var(--bad);font-weight:700}.warn{color:var(--warn)}
  .fixed-pill{display:inline-block;margin-top:5px;border-radius:999px;font-weight:700;padding:2px 8px}
  .arch-wrap{flex:1;display:flex;align-items:flex-start;justify-content:center;min-width:0}
  #arch{margin:0;white-space:pre}
  #arch .g-band{color:var(--arch-band)} #arch .g-dark{color:var(--arch-dark)} #arch .g-base{color:var(--arch-base)}
  .reviewers{display:flex;flex-wrap:wrap;gap:2px 5px;min-height:26px;align-content:flex-start}
  .fig{display:inline-flex;flex-direction:column;align-items:center}
  .fig .head{border-radius:50%;color:var(--green);text-align:center}
  .fig .arms{display:block}
  .fig .body{display:block}
  .fig .legs{display:block}
  #stamp{position:absolute;font-weight:900;letter-spacing:.08em;border-radius:8px;opacity:0;pointer-events:none}
</style>
</head>
<body>

  <div id="card">
    <div class="pr-head"><span class="pr-num" id="prNum"></span><span class="pr-title" id="prTitle"></span><span class="open-pill" id="openPill"></span></div>

    <div class="main">

      <div class="arch-wrap"><pre id="arch" aria-hidden="true"></pre></div>
    </div>
    <div class="reviewers" id="reviewers"></div>
  </div>
  <div id="stamp"></div>
</div>

function computeTimeline(c){

function digitsOf(c, value){
  const out = [];
  for (let i = c.counterDigits - 1; i >= 0; i--){ const place = Math.pow(c.digitBase, i); out.push(Math.floor(value / place) % c.digitBase); }
  return out;
}
function rollPositions(c, value, fromValue){
  const out = [];
  const base0 = fromValue === undefined ? 0 : fromValue;
  for (let i = c.counterDigits - 1; i >= 0; i--){ const place = Math.pow(c.digitBase, i);
    if (place === 1){ out.push(value - c.digitBase * Math.floor(base0 / c.digitBase)); continue; }
    const q = value / place, fl = Math.floor(q), frac = q - fl;
    let e = 0; const w = c.rollCarryFrac;
    if (frac > 1 - w){ const t = (frac - (1 - w)) / w; e = t * t * (3 - 2 * t); }
    out.push((fl + e) % c.digitBase);
  }
  return out;
}
function archCell(c, x, y){
  const A = c.arch, C = c.archCols, R = c.archRows;
  const nx = (x - C/2) / (C/2), ny = y / R;
  const halfW = ny < A.knee ? (A.halfBase + (A.halfTop - A.halfBase) * Math.pow(ny / A.knee, A.crownExp)) : A.halfTop;
  const inside = Math.abs(nx) < halfW;
  let legGap = false;
  if (ny > A.innerTopStart){ const t = (ny - A.innerTopStart) / (1 - A.innerTopStart);
    const hw = A.legGap * (A.innerTopRatio + (1 - A.innerTopRatio) * Math.pow(t, A.innerCurveExp));
    legGap = Math.abs(nx) < hw; }
  if (!inside || legGap) return { filled: false, cls: "", glyph: " " };
  const band = Math.sin(ny * A.bandFreq + x * A.bandPhase) > A.bandThreshold;
  const dark = (x * A.darkMulX + y * A.darkMulY) % A.darkMod < A.darkRem;
  if (band) return { filled: true, cls: "g-band", glyph: A.glyphBand };
  if (dark) return { filled: true, cls: "g-dark", glyph: A.glyphDark };
  return { filled: true, cls: "g-base", glyph: A.glyphBase };
}
function stateAt(c, tl, phase){
  const n = c.prs.length;
  let cardIdx = 0, tx = 0, blur = 0, streak = 0, skew = 0, whipping = false, whipProgress = 0;
  for (let i = 0; i < n; i++){ if (phase >= tl.starts[i]) cardIdx = i; }
  const whips = [];
  for (let i = 1; i < n; i++) whips.push({ at: tl.starts[i], from: i - 1, to: i });
  whips.push({ at: c.loopMs, from: n - 1, to: 0 });
  for (const w of whips){
    let p0 = phase - (w.at - c.whipMs/2);
    if (w.at === c.loopMs && phase < c.whipMs/2) p0 = phase + c.loopMs - (w.at - c.whipMs/2);
    if (p0 >= 0 && p0 < c.whipMs){
      whipping = true; whipProgress = p0 / c.whipMs;
      const p = whipProgress;
      blur = c.whipBlurPx * Math.sin(Math.PI * p);
      streak = c.whipStreakPx * Math.sin(Math.PI * p);
      skew = -c.whipSkewDeg * Math.sin(Math.PI * p);
      if (p < 0.5){ cardIdx = w.from; tx = -c.whipDistancePx * (p * 2); }
      else { cardIdx = w.to; tx = c.whipDistancePx * (1 - (p - 0.5) * 2); }
    }
  }
  const cs = tl.counterStarts[cardIdx], cp = Math.max(0, Math.min(1, (phase - cs) / tl.counterSpans[cardIdx]));
  const pr = c.prs[cardIdx];
  const approvalsFloat = pr.approvalsFrom + (pr.approvalsTo - pr.approvalsFrom) * cp;
  const approvals = Math.round(approvalsFloat);
  const digits = digitsOf(c, approvals);
  const roll = rollPositions(c, approvalsFloat, pr.approvalsFrom);
  let stampState = "idle", stampScale = c.stampStartScale, stampOpacity = 0, stamped = false;
  const st = tl.stamps.find(s=> s.cardIdx === cardIdx);
  if (st){
    if (phase >= st.at && phase < st.slamEnd){ stampState = "slamming"; const k = (phase - st.at) / c.slamMs; stampScale = c.stampStartScale + (1 - c.stampStartScale) * k; stampOpacity = 1; stamped = true; }
    else if (phase >= st.slamEnd && phase < st.holdEnd){ stampState = "held"; stampScale = 1; stampOpacity = 1; stamped = true; }
    else if (phase >= st.holdEnd && phase < st.hideEnd){ stampState = "hiding"; stampScale = 1; stampOpacity = Math.max(0, 1 - (phase - st.holdEnd) / c.stampHideMs); stamped = true; }
  }
  return { cardIdx, tx, blur, streak, skew, whipping, whipProgress, counterProgress: cp, approvals, approvalsFloat,
           digits, roll, checksIdx: cardIdx, stamped, stampState, stampScale, stampOpacity, opacity: 1 };
}
/* URL overrides (swap test / reuse): ?titles=A|B&stamp=MERGED&cardMs=900&accent=%23ffd75e&bg=%23000000 */
function parseOverrides(c, getAll, getKeys){
  try { return parseOverridesInner(c, getAll, getKeys); }
  catch (e) { return { candidate: null, errs: ["override parsing failed safely: " + (e && e.message)], any: true }; }
}
function parseOverridesInner(c, getAll, getKeys){
  const errs = [];
  const keys = ["titles","stamp","cardMs","accent","bg"];
  const present = {}; let any = false;
  keys.forEach(k=>{ const all = getAll(k); if (all !== null && all !== undefined){ present[k] = all; any = true; } });
  if (getKeys) getKeys().forEach(k=>{ if (!keys.includes(k)){ errs.push("unknown parameter: " + k); any = true; } });
  if (!any) return { candidate: null, errs, any: false };
  if (errs.length) return { candidate: null, errs, any: true };
  keys.forEach(k=>{ if (!(k in present)) return; const all = present[k];
    if (all.length > 1) errs.push(k + " duplicate parameter");
    if (all.length && all[0] === "") errs.push(k + " empty value"); });
  if (errs.length) return { candidate: null, errs, any: true };
  const candidate = JSON.parse(JSON.stringify(c));
  if (present.titles){ const t = present.titles[0].split("|");
    if (t.length > candidate.prs.length) errs.push("titles excess entries");
    t.forEach((v,i)=>{ if (candidate.prs[i]) candidate.prs[i].title = v; }); }
  if (present.stamp) candidate.stampText = present.stamp[0];
  if (present.cardMs){ if (/^\d+$/.test(present.cardMs[0])){ const ms = parseInt(present.cardMs[0], 10);
      candidate.cardDurationsMs = candidate.prs.map(()=> ms); candidate.loopMs = ms * candidate.prs.length; }
    else errs.push("cardMs not an unsigned integer"); }
  if (present.accent){ if (!candidate.palette || typeof candidate.palette !== "object") errs.push("palette unavailable for accent override"); else { candidate.stampColor = present.accent[0]; candidate.palette.green = present.accent[0]; } }
  if (present.bg){ if (!candidate.palette || typeof candidate.palette !== "object") errs.push("palette unavailable for bg override"); else candidate.palette.bg = present.bg[0]; }
  const lim = (c && c.overrideLimits && typeof c.overrideLimits === "object") ? c.overrideLimits : null;
  if (!lim) errs.push("overrideLimits unavailable for length checks");
  else { if (candidate.stampText && candidate.stampText.length > lim.maxStampLen) errs.push("stamp text too long");
    if (Array.isArray(candidate.prs)) candidate.prs.forEach(p=>{ if (p && typeof p.title === "string" && p.title.length > lim.maxTitleLen) errs.push("title too long"); }); }
  if (errs.length) return { candidate: null, errs, any: true };
  const verrs = validateConfig(candidate);
  if (verrs.length) return { candidate: null, errs: verrs, any: true };
  return { candidate, errs: [], any: true };
}
/*PURE-END*/
const STARTUP_ERRS = validateConfig(CONFIG);
if (STARTUP_ERRS.length) REJECTED.push({ errs: STARTUP_ERRS, at: "startup" });
const HALTED = STARTUP_ERRS.length > 0;
if (!HALTED) (function applyOverrides(){
  const q = new URLSearchParams(window.location.search);
  const res = parseOverrides(CONFIG, k=> q.has(k) ? q.getAll(k) : null, ()=> Array.from(q.keys()));
  if (!res.any) return;
  if (res.errs.length){ REJECTED.push({ errs: res.errs, at: "overrides" }); }
  else { Object.keys(CONFIG).forEach(k=> delete CONFIG[k]); Object.assign(CONFIG, res.candidate); }
})();
window.__T11_REJECTED__ = REJECTED;
let TL = HALTED ? null : computeTimeline(CONFIG);
const $ = id => document.getElementById(id);
const stage=$("stage"), cardEl=$("card"), stampEl=$("stamp");
function applyVars(){
  const r = document.documentElement.style, p = CONFIG.palette;
  r.setProperty("--fg", p.fg); r.setProperty("--muted", p.muted); r.setProperty("--green", p.green);
  r.setProperty("--panel", p.panel); r.setProperty("--panel-border", p.panelBorder);
  r.setProperty("--ok", CONFIG.checkStates.ok); r.setProperty("--bad", CONFIG.checkStates.bad); r.setProperty("--warn", CONFIG.checkStates.warn);
  r.setProperty("--arch-band", p.archRed); r.setProperty("--arch-dark", p.archDark); r.setProperty("--arch-base", p.archLight);
  stage.style.background = p.bg;
  stage.style.minHeight = CONFIG.stage.minHeightPx+"px";
  stage.style.padding = CONFIG.stage.paddingPx+"px";
  stage.style.fontFamily = CONFIG.type.fontStack;
  document.querySelector(".checks").style.borderWidth = CONFIG.stage.panelBorderPx+"px";
  document.querySelector(".pr-num").style.fontSize = CONFIG.type.prPx+"px";
  document.querySelector(".pr-title").style.fontSize = CONFIG.type.prPx+"px";
  document.querySelector(".open-pill").style.fontSize = CONFIG.type.openPillPx+"px";
  document.querySelector(".stats").style.fontSize = CONFIG.type.statsPx+"px";
  document.querySelectorAll(".stats b").forEach(b=> b.style.fontSize = CONFIG.type.statsBPx+"px");
  document.querySelector(".checks").style.width = CONFIG.stage.checksWidthPct+"%";
  document.querySelector(".checks h3").style.fontSize = CONFIG.type.checksHeadPx+"px";
  $("openPill").textContent = CONFIG.labels.openPill;
  $("checksHeading").textContent = CONFIG.labels.checksHeading;
  $("approvalsLabel").textContent = CONFIG.labels.approvals;
  $("linesLabel").textContent = CONFIG.labels.linesRead;
  stampEl.textContent = CONFIG.stampText;
  stampEl.style.color = CONFIG.stampColor;
  stampEl.style.border = CONFIG.stamp.borderPx+"px solid "+CONFIG.stampColor;
  stampEl.style.fontSize = CONFIG.stampFontPx+"px";
  stampEl.style.fontFamily = CONFIG.stamp.fontStack;
  stampEl.style.background = CONFIG.stamp.bg;
  stampEl.style.left = CONFIG.stamp.leftPct+"%";
  stampEl.style.top = CONFIG.stamp.topPct+"%";
  stampEl.style.padding = CONFIG.stamp.padYPx+"px "+CONFIG.stamp.padXPx+"px";
  stampEl.style.transition = "none";
}
if (!HALTED) applyVars();
(function buildCounter(){
  if (HALTED) return;
  const wrap = $("approvals");
  for (let col = 0; col < CONFIG.counterDigits; col++){
    const d = document.createElement("span"); d.className = "digit";
    d.style.height = CONFIG.counterDigitPx+"px"; d.style.width = CONFIG.counterDigitPx+"px";
    const strip = document.createElement("span"); strip.className = "digit-strip";
    const reps = col === CONFIG.counterDigits - 1 ? CONFIG.onesStripReps : 2;
    for (let rep = 0; rep < reps; rep++) for (let v = 0; v < CONFIG.digitBase; v++){
      const s = document.createElement("span"); s.textContent = v;
      s.style.height = CONFIG.counterDigitPx+"px"; s.style.lineHeight = CONFIG.counterDigitPx+"px";
      s.style.fontSize = CONFIG.type.statsBPx+"px";
      strip.appendChild(s);
    }
    d.appendChild(strip); wrap.appendChild(d);
  }
})();
(function drawArch(){
  if (HALTED) return;
  const C=CONFIG.archCols, R=CONFIG.archRows, frag=document.createDocumentFragment();
  for(let y=0;y<R;y++){
    for(let x=0;x<C;x++){
      const cell = archCell(CONFIG, x, y);
      const span=document.createElement("span");
      if (cell.cls) span.className = cell.cls;
      span.textContent = cell.glyph;
      frag.appendChild(span);
    }
    frag.appendChild(document.createTextNode("\n"));
  }
  const arch=$("arch"); arch.appendChild(frag);
  arch.style.fontSize = CONFIG.arch.fontPx+"px"; arch.style.lineHeight = CONFIG.arch.lineHeight;
})();
function drawReviewers(n){
  const w=$("reviewers"); w.innerHTML=""; const F=CONFIG.figure;
  for(let i=0;i<n;i++){
    const f=document.createElement("span"); f.className="fig"; f.style.width=F.widthPx+"px";
    f.innerHTML='<span class="head" style="width:'+F.headPx+'px;height:'+F.headPx+'px;border:'+F.strokePx+'px solid '+CONFIG.palette.fg+';font-size:'+F.headFontPx+'px;line-height:'+F.headPx+'px">' + CONFIG.marks.ok + '</span>'
      +'<span class="arms" style="width:'+F.armsPx+'px;height:'+F.armsHPx+'px;background:'+CONFIG.palette.fg+'"></span>'
      +'<span class="body" style="width:'+F.bodyWPx+'px;height:'+F.bodyHPx+'px;background:'+CONFIG.palette.fg+'"></span>'
      +'<span class="legs" style="width:'+F.legsWPx+'px;height:'+F.legsHPx+'px;border-left:'+F.legsStrokePx+'px solid '+CONFIG.palette.fg+';border-right:'+F.legsStrokePx+'px solid '+CONFIG.palette.fg+'"></span>';
    w.appendChild(f);
  }
}
function drawChecks(idx, stamped){
  const rows = CONFIG.checksCycle[idx % CONFIG.checksCycle.length];
  $("checkList").innerHTML = rows.map(r=>{
    const cls = r[1], mark = r[1]==="ok"?CONFIG.marks.ok:(r[1]==="bad"?CONFIG.marks.bad:CONFIG.marks.warn);
    return '<div class="check" style="font-size:'+CONFIG.type.checksPx+'px"><span class="'+cls+'">'+mark+" "+r[0]+'</span><span class="'+cls+'">'+r[2]+"</span></div>";
  }).join("");
  const pill=$("statusPill"), entry = stamped ? CONFIG.mergePill : CONFIG.statusPills[idx % CONFIG.statusPills.length];
  const tone = CONFIG.pillTones[entry.tone] || CONFIG.pillTones.good;
  pill.textContent=entry.text; pill.style.background=tone.bg; pill.style.color=tone.fg; pill.style.fontSize=CONFIG.type.pillPx+"px";
}
let renderedCard = -1, renderedStamped = null;
function render(st){
  if (st.cardIdx !== renderedCard || st.stamped !== renderedStamped){
    renderedCard = st.cardIdx; renderedStamped = st.stamped;
    const pr=CONFIG.prs[st.cardIdx];
    $("prNum").textContent=pr.number; $("prTitle").textContent=pr.title;
    drawReviewers(CONFIG.reviewersPerCard[st.cardIdx % CONFIG.reviewersPerCard.length]);
    drawChecks(st.checksIdx, st.stamped);
  }
  $("lines").textContent = CONFIG.prs[st.cardIdx].linesRead;
  const strips = $("approvals").querySelectorAll(".digit-strip");
  strips.forEach((strip, i)=>{ strip.style.transform = "translateY("+(-st.roll[i] * CONFIG.counterDigitPx)+"px)"; });
  cardEl.style.transform = "translateX("+st.tx+"px) scaleX("+(1 + st.streak/CONFIG.whipStreakDivisor)+") skewX("+st.skew+"deg)";
  cardEl.style.filter = st.blur ? "blur("+st.blur+"px)" : "none";
  cardEl.style.opacity = "1";
  stampEl.style.opacity = st.stampOpacity;
  stampEl.style.transform = "translate(-50%,-50%) rotate("+CONFIG.stampAngleDeg+"deg) scale("+st.stampScale+")";
  stampEl.style.transition = "none";
}
let playing=false, t0=0, pausedPhase=0, rafId=null;
function frame(now){
  if(!playing) return;
  const phase = (now - t0) % CONFIG.loopMs;
  render(stateAt(CONFIG, TL, phase));
  rafId = requestAnimationFrame(frame);
}
function play(){ if(playing) return; playing=true; t0 = performance.now() - pausedPhase; rafId = requestAnimationFrame(frame); }
function pause(){ if(!playing) return; pausedPhase = (performance.now() - t0) % CONFIG.loopMs; playing=false; if(rafId) cancelAnimationFrame(rafId); rafId=null; }
function restart(){ playing=false; if(rafId) cancelAnimationFrame(rafId); pausedPhase=0; renderedCard=-1; renderedStamped=null; play(); }
window.addEventListener("message", function(e){
  if(!e.data||typeof e.data!=="object") return;
  if(e.data.cmd==="play") play(); if(e.data.cmd==="pause") pause(); if(e.data.cmd==="restart") restart();
});
if (!HALTED) play();
</script>
