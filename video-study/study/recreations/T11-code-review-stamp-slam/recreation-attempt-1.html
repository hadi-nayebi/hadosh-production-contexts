<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T11 — Code-review UI + stamp slam · recreation</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#0b0e11}
  #stage{position:relative;width:100%;height:100%;min-height:300px;overflow:hidden;
         font-family:ui-monospace,Menlo,Consolas,monospace;color:#e6edf3;padding:8px}
  #card{transition:transform .18s ease,filter .18s ease;height:100%;display:flex;flex-direction:column;gap:6px}
  #card.whip-out{transform:translateX(-46px);filter:blur(7px);opacity:.35}
  #card.whip-in{transform:translateX(46px);filter:blur(7px);opacity:.35}
  .pr-head{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-width:0}
  .pr-num{color:#8b949e;font-size:13px;font-weight:700}
  .pr-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .open-pill{border:1px solid #3fb950;color:#3fb950;border-radius:999px;font-size:10px;padding:1px 7px}
  .stats{display:flex;gap:14px;font-size:11px;color:#8b949e}
  .stats b{color:#e6edf3;font-size:14px}
  .main{flex:1;display:flex;gap:8px;min-height:0}
  .checks{width:42%;border:1px solid #30363d;border-radius:8px;padding:7px;background:#0d1117;align-self:flex-start}
  .checks h3{margin:0 0 5px;font-size:12px}
  .check{display:flex;justify-content:space-between;gap:4px;font-size:10.5px;padding:2px 0}
  .ok{color:#3fb950}.bad{color:#f85149;font-weight:700}.warn{color:#d29922}
  .fixed-pill{display:inline-block;margin-top:5px;background:#3fb950;color:#04150a;border-radius:999px;
               font-size:10px;font-weight:700;padding:2px 8px}
  .arch-wrap{flex:1;display:flex;align-items:flex-start;justify-content:center;min-width:0}
  #arch{margin:0;font-size:4.6px;line-height:1.05;letter-spacing:0;white-space:pre}
  .reviewers{display:flex;flex-wrap:wrap;gap:2px 5px;min-height:26px;align-content:flex-start}
  .fig{display:inline-flex;flex-direction:column;align-items:center;width:13px}
  .fig .head{width:9px;height:9px;border:1.4px solid #e6edf3;border-radius:50%;color:#3fb950;
             font-size:7px;line-height:9px;text-align:center}
  .fig .body{width:2px;height:8px;background:#e6edf3}
  .fig .legs{width:9px;height:6px;border-left:2px solid #e6edf3;border-right:2px solid #e6edf3}
  #stamp{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) rotate(-14deg) scale(3.2);
         border:4px solid #3fb950;color:#3fb950;font-family:Arial,Helvetica,sans-serif;font-weight:900;
         font-size:34px;letter-spacing:.08em;padding:4px 14px;border-radius:8px;opacity:0;pointer-events:none;
         background:rgba(4,21,10,.25)}
  #stamp.slam{opacity:1;transform:translate(-50%,-50%) rotate(-14deg) scale(1);
              transition:transform .13s cubic-bezier(.2,2.4,.4,1),opacity .05s}
  #stamp.hide{opacity:0;transition:opacity .2s}
</style>
</head>
<body>
<div id="stage">
  <div id="card">
    <div class="pr-head"><span class="pr-num" id="prNum"></span><span class="pr-title" id="prTitle"></span><span class="open-pill">Open</span></div>
    <div class="stats"><span>approvals <b id="approvals">0</b></span><span>lines read <b id="lines">0</b></span></div>
    <div class="main">
      <div class="checks"><h3>Checks</h3><div id="checkList"></div><span class="fixed-pill" id="statusPill">● fixed</span></div>
      <div class="arch-wrap"><pre id="arch" aria-hidden="true"></pre></div>
    </div>
    <div class="reviewers" id="reviewers"></div>
  </div>
  <div id="stamp">LGTM</div>
</div>
<script>
"use strict";
/* ===== CONFIG — every variable of the technique lives here; logic below reads only CONFIG ===== */
const CONFIG = {
  prs: [
    { number: "#1111", title: "ship: please-hold.mp4", approvalsFrom: 111, approvalsTo: 214, linesRead: 0 },
    { number: "#1115", title: "ship: asking-for-a-friend.mp4", approvalsFrom: 214, approvalsTo: 388, linesRead: 0 },
    { number: "#1113", title: "ship: rage-against-the-ml.mp4", approvalsFrom: 388, approvalsTo: 560, linesRead: 0 },
    { number: "#1119", title: "ship: final-final-v2.mp4", approvalsFrom: 560, approvalsTo: 800, linesRead: 0 }
  ],
  cardIntervalMs: 1300,
  whipMs: 180,
  counterMs: 950,
  loopMs: 10000,
  stampAtMs: 8600,
  stampText: "LGTM",
  stampAngleDeg: -14,
  stampColor: "#3fb950",
  checksCycle: [
    [ ["build","ok","pass"], ["tests","ok","pass"], ["prod","ok","hotfix"] ],
    [ ["build","ok","pass"], ["tests","warn","0 ran"], ["prod","bad","prod is down"] ],
    [ ["build","ok","pass"], ["tests","ok","pass"], ["prod","ok","hotfix"] ],
    [ ["build","ok","pass"], ["tests","ok","pass"], ["prod","ok","ready"] ]
  ],
  statusPills: ["● fixed","● prod is down","● fixed","● ready to merge"],
  reviewersPerCard: [4, 8, 12, 16],
  archCols: 44, archRows: 34,
  palette: { bg:"#0b0e11", panel:"#0d1117", fg:"#e6edf3", muted:"#8b949e", green:"#3fb950", red:"#f85149", amber:"#d29922", archRed:"#c93a3a", archLight:"#d8d3c3", archDark:"#3a3f45" }
};
/* URL overrides (swap test / reuse): ?titles=A|B&stamp=MERGED&cardMs=900&accent=%23ffd75e&bg=%23000000 */
(function applyOverrides(){
  const q = new URLSearchParams(window.location.search);
  if (q.get("titles")) { const t=q.get("titles").split("|").filter(s=>s.length);
    t.forEach((v,i)=>{ if(CONFIG.prs[i]) CONFIG.prs[i].title=v; }); }
  if (q.get("stamp")) CONFIG.stampText = q.get("stamp");
  if (q.get("cardMs")) CONFIG.cardIntervalMs = Math.max(300, parseInt(q.get("cardMs"),10)||CONFIG.cardIntervalMs);
  if (q.get("accent")) { CONFIG.stampColor=q.get("accent"); CONFIG.palette.green=q.get("accent"); }
  if (q.get("bg")) CONFIG.palette.bg = q.get("bg");
})();

const $ = id => document.getElementById(id);
const stage=$("stage"), cardEl=$("card"), stampEl=$("stamp");
stage.style.background = CONFIG.palette.bg;
stampEl.textContent = CONFIG.stampText;
stampEl.style.color = CONFIG.stampColor; stampEl.style.borderColor = CONFIG.stampColor;
stampEl.style.transform = "translate(-50%,-50%) rotate("+CONFIG.stampAngleDeg+"deg) scale(3.2)";

/* ASCII / pointillist arch — code-drawn from a shape function, no image, no tracing */
(function drawArch(){
  const C=CONFIG.archCols, R=CONFIG.archRows, out=[];
  for(let y=0;y<R;y++){
    let row="";
    for(let x=0;x<C;x++){
      const nx=(x-C/2)/(C/2), ny=y/R;
      const halfW = ny<0.28 ? (0.18+ny*1.9) : 0.72;         /* pointed-arch profile */
      const inside = Math.abs(nx) < halfW;
      const legGap = ny>0.62 && Math.abs(nx)<0.16;
      if(!inside||legGap){ row+=" "; continue; }
      const band = Math.sin(ny*22+x*0.35)>0.55, dark=(x*7+y*13)%9<3;
      row += band ? "▓" : (dark ? "░" : "▒");
    }
    out.push(row);
  }
  $("arch").textContent = out.join("\n");
  $("arch").style.color = CONFIG.palette.archLight;
})();

function drawReviewers(n){
  const w=$("reviewers"); w.innerHTML="";
  for(let i=0;i<n;i++){
    const f=document.createElement("span"); f.className="fig";
    f.innerHTML='<span class="head">✓</span><span class="body"></span><span class="legs"></span>';
    w.appendChild(f);
  }
}
function drawChecks(idx){
  const rows = CONFIG.checksCycle[idx % CONFIG.checksCycle.length];
  $("checkList").innerHTML = rows.map(r=>{
    const cls = r[1]==="ok"?"ok":(r[1]==="bad"?"bad":"warn");
    const mark = r[1]==="ok"?"✓":(r[1]==="bad"?"✕":"◐");
    return '<div class="check"><span class="'+cls+'">'+mark+" "+r[0]+'</span><span class="'+cls+'">'+r[2]+"</span></div>";
  }).join("");
  const pill=$("statusPill"); pill.textContent=CONFIG.statusPills[idx % CONFIG.statusPills.length];
  const isBad = pill.textContent.indexOf("down")>=0;
  pill.style.background = isBad ? CONFIG.palette.red : CONFIG.palette.green;
}
let cardIdx=0, timers=[], rafId=null, startStamp=0;
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; if(rafId) cancelAnimationFrame(rafId); rafId=null; }
function animateCounter(pr){
  const t0=performance.now(), el=$("approvals");
  el.style.filter="blur(1.1px)";                       /* digits spin: motion-blurred while counting */
  (function tick(now){
    const k=Math.min(1,(now-t0)/CONFIG.counterMs);
    el.textContent = Math.round(pr.approvalsFrom + (pr.approvalsTo-pr.approvalsFrom)*k);
    $("lines").textContent = pr.linesRead;
    if(k<1) rafId=requestAnimationFrame(tick); else el.style.filter="";
  })(t0);
}
function showCard(i){
  const pr=CONFIG.prs[i % CONFIG.prs.length];
  $("prNum").textContent=pr.number; $("prTitle").textContent=pr.title;
  drawChecks(i); drawReviewers(CONFIG.reviewersPerCard[i % CONFIG.reviewersPerCard.length]);
  animateCounter(pr);
}
function cycle(){
  showCard(cardIdx);
  /* Card period is exactly cardIntervalMs, show-to-show: the whip-out starts
     whipMs before the period ends, so the swap lands on the beat. */
  timers.push(setTimeout(function whip(){
    cardEl.classList.add("whip-out");
    timers.push(setTimeout(()=>{
      cardIdx=(cardIdx+1)%CONFIG.prs.length; showCard(cardIdx);
      cardEl.classList.remove("whip-out"); cardEl.classList.add("whip-in");
      timers.push(setTimeout(()=>cardEl.classList.remove("whip-in"), CONFIG.whipMs));
      timers.push(setTimeout(whip, CONFIG.cardIntervalMs - CONFIG.whipMs));
    }, CONFIG.whipMs));
  }, CONFIG.cardIntervalMs - CONFIG.whipMs));
}
let playing=false;
function scheduleStamp(){
  /* Reset first, every loop: the slam must re-fire, never persist from the last loop. */
  stampEl.classList.remove("slam","hide");
  stampEl.style.transform="translate(-50%,-50%) rotate("+CONFIG.stampAngleDeg+"deg) scale(3.2)";
  timers.push(setTimeout(()=>{ drawChecks(3);           /* merge state arrives WITH the stamp */
    stampEl.classList.add("slam");
    stampEl.style.transform="translate(-50%,-50%) rotate("+CONFIG.stampAngleDeg+"deg) scale(1)"; }, CONFIG.stampAtMs));
  timers.push(setTimeout(()=>{ stampEl.classList.add("hide"); }, CONFIG.loopMs-300));
}
function play(){ if(playing) return; playing=true; cycle(); scheduleStamp();
  timers.push(setTimeout(()=>{ pause(); play(); }, CONFIG.loopMs)); }
function pause(){ playing=false; clearTimers(); }
function restart(){ pause(); cardIdx=0; stampEl.classList.remove("slam"); play(); }
window.addEventListener("message", function(e){
  if(!e.data||typeof e.data!=="object") return;
  if(e.data.cmd==="play") play(); if(e.data.cmd==="pause") pause(); if(e.data.cmd==="restart") restart();
});
play();
</script>
</body>
</html>
