<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T11 — Code-review UI + stamp slam · recreation</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#0b0e11}
  #stage{position:relative;width:100%;height:100%;min-height:300px;overflow:hidden;
         font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--fg);padding:8px}
  #card{height:100%;display:flex;flex-direction:column;gap:6px;will-change:transform,filter}
  .pr-head{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-width:0}
  .pr-num{color:var(--muted);font-weight:700}
  .pr-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .open-pill{border:1px solid var(--green);color:var(--green);border-radius:999px;padding:1px 7px}
  .stats{display:flex;gap:14px;color:var(--muted)}
  .stats b{color:var(--fg)}
  .main{flex:1;display:flex;gap:8px;min-height:0}
  .checks{border:1px solid var(--panel-border);border-radius:8px;padding:7px;background:var(--panel);align-self:flex-start}
  .checks h3{margin:0 0 5px}
  .check{display:flex;justify-content:space-between;gap:4px;padding:2px 0}
  .ok{color:var(--ok)}.bad{color:var(--bad);font-weight:700}.warn{color:var(--warn)}
  .fixed-pill{display:inline-block;margin-top:5px;border-radius:999px;font-weight:700;padding:2px 8px}
  .arch-wrap{flex:1;display:flex;align-items:flex-start;justify-content:center;min-width:0}
  #arch{margin:0;white-space:pre}
  #arch .g-band{color:var(--arch-band)} #arch .g-dark{color:var(--arch-dark)} #arch .g-base{color:var(--arch-base)}
  .reviewers{display:flex;flex-wrap:wrap;gap:2px 5px;min-height:26px;align-content:flex-start}
  .fig{display:inline-flex;flex-direction:column;align-items:center}
  .fig .head{border-radius:50%;color:var(--green);text-align:center}
  .fig .arms{display:block}
  .fig .body{display:block}
  .fig .legs{display:block}
  #stamp{position:absolute;left:50%;top:46%;font-family:Arial,Helvetica,sans-serif;font-weight:900;
         letter-spacing:.08em;padding:4px 14px;border-radius:8px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <div id="card">
    <div class="pr-head"><span class="pr-num" id="prNum"></span><span class="pr-title" id="prTitle"></span><span class="open-pill">Open</span></div>
    <div class="stats"><span>approvals <b id="approvals">0</b></span><span>lines read <b id="lines">0</b></span></div>
    <div class="main">
      <div class="checks"><h3>Checks</h3><div id="checkList"></div><span class="fixed-pill" id="statusPill">● fixed</span></div>
      <div class="arch-wrap"><pre id="arch" aria-hidden="true"></pre></div>
    </div>
    <div class="reviewers" id="reviewers"></div>
  </div>
  <div id="stamp">LGTM</div>
</div>
<script>
"use strict";
/* ===== CONFIG — every variable of the technique lives here; logic below reads only CONFIG ===== */
/*PURE-BEGIN*/
const CONFIG = {
  prs: [
    { number: "#1111", title: "ship: please-hold.mp4", approvalsFrom: 111, approvalsTo: 200, linesRead: 0 },
    { number: "#1112", title: "ship: i-have-a-blocker.mp4", approvalsFrom: 200, approvalsTo: 320, linesRead: 0 },
    { number: "#1113", title: "ship: rage-against-the-ml.mp4", approvalsFrom: 320, approvalsTo: 450, linesRead: 0 },
    { number: "#1115", title: "ship: asking-for-a-friend.mp4", approvalsFrom: 450, approvalsTo: 560, linesRead: 0 },
    { number: "#1119", title: "ship: final-final-v2.mp4", approvalsFrom: 560, approvalsTo: 680, linesRead: 0 },
    { number: "#1116", title: "ship: dont-wait.mp4", approvalsFrom: 680, approvalsTo: 750, linesRead: 0 },
    { number: "#1120", title: "ship: ship-it-good.mp4", approvalsFrom: 750, approvalsTo: 800, linesRead: 0 }
  ],
  cardIntervalMs: 1300,
  whipMs: 360,
  whipDistancePx: 120,
  whipBlurPx: 7,
  whipStreakPx: 18,
  counterMs: 950,
  counterBlurPx: 0.6,
  counterBlurFraction: 0.6,
  loopMs: 10000,
  checksReadyGapMs: 50,
  stampGapMs: 100,
  stampHideLeadMs: 100,
  stampText: "LGTM",
  stampAngleDeg: -14,
  stampColor: "#3fb950",
  stampStartScale: 3.2,
  slamMs: 130,
  stampHideMs: 200,
  stampEasing: "cubic-bezier(.2,2.4,.4,1)",
  stampFontPx: 34,
  checksCycle: [
    [ ["build","ok","pass"], ["tests","ok","pass"], ["prod","ok","hotfix"] ],
    [ ["build","ok","pass"], ["tests","warn","0 ran"], ["prod","bad","prod is down"] ],
    [ ["build","ok","pass"], ["tests","ok","pass"], ["prod","ok","hotfix"] ],
    [ ["build","ok","pass"], ["tests","ok","pass"], ["prod","ok","ready"] ],
    [ ["build","ok","pass"], ["tests","warn","0 ran"], ["prod","ok","hotfix"] ],
    [ ["build","ok","pass"], ["tests","ok","pass"], ["prod","bad","prod is down"] ],
    [ ["build","ok","pass"], ["tests","ok","pass"], ["prod","ok","hotfix"] ],
    [ ["build","ok","pass"], ["tests","ok","pass"], ["prod","ok","ready"] ]
  ],
  mergeChecksIndex: 7,
  statusPills: [
    { text: "● fixed", tone: "good" }, { text: "● prod is down", tone: "bad" },
    { text: "● fixed", tone: "good" }, { text: "● ready to merge", tone: "good" },
    { text: "● fixed", tone: "good" }, { text: "● prod is down", tone: "bad" },
    { text: "● fixed", tone: "good" }, { text: "● ready to merge", tone: "good" }
  ],
  pillTones: { good: { bg: "#3fb950", fg: "#04150a" }, bad: { bg: "#f85149", fg: "#1a0505" } },
  checkStates: { ok: "#3fb950", bad: "#f85149", warn: "#d29922" },
  reviewersPerCard: [4, 6, 8, 10, 12, 14, 16],
  archCols: 44, archRows: 34,
  arch: { knee: 0.28, halfBase: 0.18, halfTop: 0.72, legStart: 0.62, legGap: 0.16,
          bandFreq: 22, bandPhase: 0.35, bandThreshold: 0.55, darkMod: 9, darkRem: 3,
          glyphBand: "▓", glyphDark: "░", glyphBase: "▒", fontPx: 4.6, lineHeight: 1.05 },
  type: { prPx: 13, statsPx: 11, statsBPx: 14, checksPx: 12, checksHeadPx: 13, pillPx: 11, openPillPx: 10 },
  figure: { widthPx: 15, headPx: 9, headFontPx: 7, armsPx: 11, bodyWPx: 2, bodyHPx: 8, legsWPx: 9, legsHPx: 6 },
  stage: { paddingPx: 8, checksWidthPct: 42, panelBorderPx: 1, minHeightPx: 300 },
  palette: { bg:"#0b0e11", panel:"#0d1117", panelBorder:"#30363d", fg:"#e6edf3", muted:"#8b949e", green:"#3fb950", archRed:"#c93a3a", archLight:"#d8d3c3", archDark:"#3a3f45" }
};
const DEFAULT_CONFIG_JSON = JSON.stringify(CONFIG);
const REJECTED = [];
function isHex(s){ return typeof s==="string" && /^#[0-9a-fA-F]{6}$/.test(s); }
function validateConfig(c){
  const errs = [];
  if (!Array.isArray(c.prs) || !c.prs.length) errs.push("prs empty");
  if (!Array.isArray(c.checksCycle) || !c.checksCycle.length) errs.push("checksCycle empty");
  if (!Array.isArray(c.statusPills) || !c.statusPills.length) errs.push("statusPills empty");
  if (!Array.isArray(c.reviewersPerCard) || !c.reviewersPerCard.length) errs.push("reviewersPerCard empty");
  if (!(c.mergeChecksIndex >= 0 && c.mergeChecksIndex < c.checksCycle.length)) errs.push("mergeChecksIndex out of range");
  ["cardIntervalMs","whipMs","counterMs","loopMs","slamMs"].forEach(k=>{ if(!(isFinite(c[k]) && c[k]>=0)) errs.push(k+" invalid"); });
  if (c.counterMs >= c.loopMs) errs.push("counterMs>=loopMs");
  if (!isHex(c.stampColor)) errs.push("stampColor not hex");
  Object.keys(c.palette||{}).forEach(k=>{ if(!isHex(c.palette[k])) errs.push("palette."+k+" not hex"); });
  Object.keys(c.checkStates||{}).forEach(k=>{ if(!isHex(c.checkStates[k])) errs.push("checkStates."+k+" not hex"); });
  if (!(c.archCols>0 && c.archRows>0)) errs.push("arch dims invalid");
  if (errs.length) return errs;
  const tl = computeTimeline(c);
  if (tl.counterSpanMs <= 0) errs.push("counter span <=0");
  if (!(tl.checksReadyAt < tl.stampAt)) errs.push("checksReady!<stampAt");
  if (tl.holdMs < 800) errs.push("stamp hold <800ms");
  if (tl.stampAt + c.slamMs > c.loopMs) errs.push("stamp crosses loop");
  return errs;
}
function computeTimeline(c){
  const n = c.prs.length;
  const starts = c.prs.map((_,i)=> i * c.cardIntervalMs);
  const counterSpanMs = Math.min(c.counterMs, c.cardIntervalMs - c.whipMs/2);
  const counterStarts = starts.map(s=> s);
  const counterEnds = counterStarts.map(s=> s + counterSpanMs);
  const lastStart = starts[n-1];
  const checksReadyAt = counterEnds[n-1] + c.checksReadyGapMs;
  const stampAt = checksReadyAt + c.stampGapMs;
  const stampHideAt = c.loopMs - c.stampHideLeadMs;
  const holdMs = stampHideAt - stampAt - c.slamMs;
  const events = [];
  starts.forEach((s,i)=> events.push({ at: s, kind: "cardStart", idx: i }));
  counterStarts.forEach((s,i)=> events.push({ at: s, kind: "counterStart", idx: i }));
  counterEnds.forEach((s,i)=> events.push({ at: s, kind: "counterEnd", idx: i }));
  events.push({ at: checksReadyAt, kind: "checksReady" });
  events.push({ at: stampAt, kind: "stamp" });
  events.push({ at: stampHideAt, kind: "stampHide" });
  events.push({ at: c.loopMs, kind: "loop" });
  events.sort((a,b)=> a.at - b.at);
  return { starts, counterStarts, counterEnds, counterSpanMs, checksReadyAt, stampAt, stampHideAt, holdMs, events };
}
/* Deterministic state reconstruction (CA-2): state is a pure function of phase.
   A frame that skips several checkpoints lands on exactly the state those
   checkpoints would have produced, in event-table order. */
function stateAt(c, tl, phase){
  const n = c.prs.length;
  let cardIdx = 0, tx = 0, blur = 0, streak = 0, whipping = false, whipProgress = 0;
  for (let i = 1; i < n; i++){
    const s = tl.starts[i], w0 = s - c.whipMs/2, w1 = s + c.whipMs/2;
    if (phase >= w0 && phase < w1){
      whipping = true; whipProgress = (phase - w0) / c.whipMs;
      const p = whipProgress;
      blur = c.whipBlurPx * Math.sin(Math.PI * p);
      streak = c.whipStreakPx * Math.sin(Math.PI * p);
      if (p < 0.5){ cardIdx = i - 1; tx = -c.whipDistancePx * (p * 2); }
      else { cardIdx = i; tx = c.whipDistancePx * (1 - (p - 0.5) * 2); }
    } else if (phase >= w1){ cardIdx = i; }
  }
  const cs = tl.counterStarts[cardIdx], cp = Math.max(0, Math.min(1, (phase - cs) / tl.counterSpanMs));
  const pr = c.prs[cardIdx];
  const approvals = Math.round(pr.approvalsFrom + (pr.approvalsTo - pr.approvalsFrom) * cp);
  const counterBlur = cp < c.counterBlurFraction ? c.counterBlurPx : 0;
  const checksIdx = phase >= tl.checksReadyAt ? c.mergeChecksIndex : cardIdx;
  let stampState = "idle", stampScale = c.stampStartScale, stampOpacity = 0;
  if (phase >= tl.stampAt && phase < tl.stampAt + c.slamMs){ stampState = "slamming"; const k = (phase - tl.stampAt) / c.slamMs; stampScale = c.stampStartScale + (1 - c.stampStartScale) * k; stampOpacity = 1; }
  else if (phase >= tl.stampAt + c.slamMs && phase < tl.stampHideAt){ stampState = "held"; stampScale = 1; stampOpacity = 1; }
  else if (phase >= tl.stampHideAt){ stampState = "hiding"; stampScale = 1; stampOpacity = Math.max(0, 1 - (phase - tl.stampHideAt) / c.stampHideMs); }
  return { cardIdx, tx, blur, streak, whipping, whipProgress, counterProgress: cp, approvals,
           counterBlur, checksIdx, stampState, stampScale, stampOpacity, opacity: 1 };
}
/*PURE-END*/
/* URL overrides (swap test / reuse): ?titles=A|B&stamp=MERGED&cardMs=900&accent=%23ffd75e&bg=%23000000 */
(function applyOverrides(){
  const q = new URLSearchParams(window.location.search);
  if (q.get("titles")) { const t=q.get("titles").split("|").filter(s=>s.length);
    t.forEach((v,i)=>{ if(CONFIG.prs[i]) CONFIG.prs[i].title=v; }); }
  if (q.get("stamp")) CONFIG.stampText = q.get("stamp");
  if (q.get("cardMs")) CONFIG.cardIntervalMs = Math.max(300, parseInt(q.get("cardMs"),10)||CONFIG.cardIntervalMs);
  if (q.get("accent")) { CONFIG.stampColor=q.get("accent"); CONFIG.palette.green=q.get("accent"); }
  if (q.get("bg")) CONFIG.palette.bg = q.get("bg");
  const errs = validateConfig(CONFIG);
  if (errs.length){ REJECTED.push({ errs, at: "overrides" });
    const d = JSON.parse(DEFAULT_CONFIG_JSON); Object.keys(CONFIG).forEach(k=>delete CONFIG[k]); Object.assign(CONFIG, d); }
})();
window.__T11_REJECTED__ = REJECTED;
let TL = computeTimeline(CONFIG);
const $ = id => document.getElementById(id);
const stage=$("stage"), cardEl=$("card"), stampEl=$("stamp");
function applyVars(){
  const r = document.documentElement.style, p = CONFIG.palette;
  r.setProperty("--fg", p.fg); r.setProperty("--muted", p.muted); r.setProperty("--green", p.green);
  r.setProperty("--panel", p.panel); r.setProperty("--panel-border", p.panelBorder);
  r.setProperty("--ok", CONFIG.checkStates.ok); r.setProperty("--bad", CONFIG.checkStates.bad); r.setProperty("--warn", CONFIG.checkStates.warn);
  r.setProperty("--arch-band", p.archRed); r.setProperty("--arch-dark", p.archDark); r.setProperty("--arch-base", p.archLight);
  stage.style.background = p.bg;
  stage.style.minHeight = CONFIG.stage.minHeightPx+"px";
  stage.style.padding = CONFIG.stage.paddingPx+"px";
  document.querySelector(".checks").style.borderWidth = CONFIG.stage.panelBorderPx+"px";
  document.querySelector(".pr-num").style.fontSize = CONFIG.type.prPx+"px";
  document.querySelector(".pr-title").style.fontSize = CONFIG.type.prPx+"px";
  document.querySelector(".open-pill").style.fontSize = CONFIG.type.openPillPx+"px";
  document.querySelector(".stats").style.fontSize = CONFIG.type.statsPx+"px";
  document.querySelectorAll(".stats b").forEach(b=> b.style.fontSize = CONFIG.type.statsBPx+"px");
  document.querySelector(".checks").style.width = CONFIG.stage.checksWidthPct+"%";
  document.querySelector(".checks h3").style.fontSize = CONFIG.type.checksHeadPx+"px";
  stampEl.textContent = CONFIG.stampText;
  stampEl.style.color = CONFIG.stampColor; stampEl.style.border = "4px solid "+CONFIG.stampColor;
  stampEl.style.fontSize = CONFIG.stampFontPx+"px";
  stampEl.style.background = "rgba(4,21,10,.25)";
}
applyVars();
/* Pointillist arch — code-drawn from a shape function, per-glyph classes, no image, no tracing */
(function drawArch(){
  const C=CONFIG.archCols, R=CONFIG.archRows, A=CONFIG.arch, frag=document.createDocumentFragment();
  for(let y=0;y<R;y++){
    for(let x=0;x<C;x++){
      const nx=(x-C/2)/(C/2), ny=y/R;
      const halfW = ny<A.knee ? (A.halfBase + ny*(A.halfTop-A.halfBase)/A.knee) : A.halfTop;
      const inside = Math.abs(nx) < halfW;
      const legGap = ny>A.legStart && Math.abs(nx)<A.legGap;
      const span=document.createElement("span");
      if(!inside||legGap){ span.textContent=" "; }
      else {
        const band = Math.sin(ny*A.bandFreq+x*A.bandPhase)>A.bandThreshold, dark=(x*7+y*13)%A.darkMod<A.darkRem;
        span.className = band ? "g-band" : (dark ? "g-dark" : "g-base");
        span.textContent = band ? A.glyphBand : (dark ? A.glyphDark : A.glyphBase);
      }
      frag.appendChild(span);
    }
    frag.appendChild(document.createTextNode("\n"));
  }
  const arch=$("arch"); arch.appendChild(frag);
  arch.style.fontSize = A.fontPx+"px"; arch.style.lineHeight = A.lineHeight;
})();
function drawReviewers(n){
  const w=$("reviewers"); w.innerHTML=""; const F=CONFIG.figure;
  for(let i=0;i<n;i++){
    const f=document.createElement("span"); f.className="fig"; f.style.width=F.widthPx+"px";
    f.innerHTML='<span class="head" style="width:'+F.headPx+'px;height:'+F.headPx+'px;border:1.4px solid '+CONFIG.palette.fg+';font-size:'+F.headFontPx+'px;line-height:'+F.headPx+'px">✓</span>'
      +'<span class="arms" style="width:'+F.armsPx+'px;height:2px;background:'+CONFIG.palette.fg+'"></span>'
      +'<span class="body" style="width:'+F.bodyWPx+'px;height:'+F.bodyHPx+'px;background:'+CONFIG.palette.fg+'"></span>'
      +'<span class="legs" style="width:'+F.legsWPx+'px;height:'+F.legsHPx+'px;border-left:2px solid '+CONFIG.palette.fg+';border-right:2px solid '+CONFIG.palette.fg+'"></span>';
    w.appendChild(f);
  }
}
function drawChecks(idx){
  const rows = CONFIG.checksCycle[idx % CONFIG.checksCycle.length];
  $("checkList").innerHTML = rows.map(r=>{
    const cls = r[1], mark = r[1]==="ok"?"✓":(r[1]==="bad"?"✕":"◐");
    return '<div class="check" style="font-size:'+CONFIG.type.checksPx+'px"><span class="'+cls+'">'+mark+" "+r[0]+'</span><span class="'+cls+'">'+r[2]+"</span></div>";
  }).join("");
  const pill=$("statusPill"), entry=CONFIG.statusPills[idx % CONFIG.statusPills.length];
  const tone = CONFIG.pillTones[entry.tone] || CONFIG.pillTones.good;
  pill.textContent=entry.text; pill.style.background=tone.bg; pill.style.color=tone.fg; pill.style.fontSize=CONFIG.type.pillPx+"px";
}
let renderedCard = -1, renderedChecks = -1, generation = 0;
function render(st){
  if (st.cardIdx !== renderedCard){ renderedCard = st.cardIdx; generation++;
    const pr=CONFIG.prs[st.cardIdx];
    $("prNum").textContent=pr.number; $("prTitle").textContent=pr.title;
    drawReviewers(CONFIG.reviewersPerCard[st.cardIdx % CONFIG.reviewersPerCard.length]);
  }
  if (st.checksIdx !== renderedChecks){ renderedChecks = st.checksIdx; drawChecks(st.checksIdx); }
  const gen = generation;
  if (gen === generation){ $("approvals").textContent = st.approvals; $("lines").textContent = CONFIG.prs[st.cardIdx].linesRead; }
  $("approvals").style.filter = st.counterBlur ? "blur("+st.counterBlur+"px)" : "none";
  cardEl.style.transform = "translateX("+st.tx+"px) scaleX("+(1 + st.streak/600)+")";
  cardEl.style.filter = st.blur ? "blur("+st.blur+"px)" : "none";
  cardEl.style.opacity = "1";
  stampEl.style.opacity = st.stampOpacity;
  stampEl.style.transform = "translate(-50%,-50%) rotate("+CONFIG.stampAngleDeg+"deg) scale("+st.stampScale+")";
  stampEl.style.transition = st.stampState==="slamming" ? "transform "+CONFIG.slamMs+"ms "+CONFIG.stampEasing+",opacity .05s" : "none";
}
/* Absolute timeline scheduler (CA-2): t0 origin; pause stores the phase and
   resume shifts the origin by exactly the paused span; loop rollover is
   phase modulo, so a resumed tab reconstructs state from phase alone. */
let playing=false, t0=0, pausedPhase=0, rafId=null;
function frame(now){
  if(!playing) return;
  const phase = (now - t0) % CONFIG.loopMs;
  render(stateAt(CONFIG, TL, phase));
  rafId = requestAnimationFrame(frame);
}
function play(){ if(playing) return; playing=true; t0 = performance.now() - pausedPhase; rafId = requestAnimationFrame(frame); }
function pause(){ if(!playing) return; pausedPhase = (performance.now() - t0) % CONFIG.loopMs; playing=false; if(rafId) cancelAnimationFrame(rafId); rafId=null; }
function restart(){ playing=false; if(rafId) cancelAnimationFrame(rafId); pausedPhase=0; renderedCard=-1; renderedChecks=-1; play(); }
window.addEventListener("message", function(e){
  if(!e.data||typeof e.data!=="object") return;
  if(e.data.cmd==="play") play(); if(e.data.cmd==="pause") pause(); if(e.data.cmd==="restart") restart();
});
play();
</script>
</body>
</html>
