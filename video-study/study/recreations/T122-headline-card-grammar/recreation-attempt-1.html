<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>T122 headline-card grammar — recreation</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05070f;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Arial,Helvetica,sans-serif}
#stage{position:relative;overflow:hidden}
.headline{position:absolute;left:0;right:0;font-weight:800;color:#fff;line-height:1.25;padding:0 18px}
.headline .blue{color:var(--blue)}
.headline .chip{display:inline-block;border-radius:6px;padding:1px 7px}
.support{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center}
.card{border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center}
.check{display:flex;flex-direction:column}
.checkrow{display:flex;align-items:center;border-radius:8px}
.warn{border-radius:8px;text-align:center}
.beat{position:absolute;inset:0;opacity:0;pointer-events:none}
.beat.on{opacity:1}
</style></head><body>
<div id="stage"></div>
<script>
const CONFIG={
 stage:{w:360,h:203},
 cycleMs:14000,
 grid:{cellPx:24},
 enterMs:450,
 headline:{top:18,fontPx:20,chipRadius:6},
 support:{top:86},
 insert:{w:250,h:62,fontPx:11,pad:10},
 check:{w:210,rowH:24,gap:6,fontPx:12,offsets:[0,600,1200],warnAt:1800,warnFontPx:12},
 font:"Arial, Helvetica, sans-serif",
 beats:[
  {headline:[{t:"I'll show you "},{t:"step by step",style:"chip"}],support:{kind:"insertCard",label:"HEIR TO AUSTRIAN THRONE ASSASSINATED"}},
  {headline:[{t:"Follow these "},{t:"exact steps",style:"blue"}],support:{kind:"none"}},
  {headline:[{t:"Or the quality "},{t:"won't match",style:"chip"}],support:{kind:"checklist",items:["Step 1","Step 2","Step 3"],warning:"Skip a step \u2192 lower quality results"}},
  {headline:[{t:"Don't skip "},{t:"any part",style:"chip"}],support:{kind:"none"}}
 ],
 atMs:[0,4000,7000,11000],
 palette:{field:"#0b1026",grid:"rgba(120,140,255,0.07)",ink:"#ffffff",blue:"#3b82f6",chipBg:"#ffffff",chipInk:"#10131f",card:"#131a33",cardEdge:"#3b82f6",warnBg:"#3a1420",warnInk:"#ffb3c1"}
};
const stage=document.getElementById('stage');
stage.style.width=CONFIG.stage.w+'px';stage.style.height=CONFIG.stage.h+'px';
stage.style.backgroundColor=CONFIG.palette.field;
stage.style.setProperty('--blue',CONFIG.palette.blue);
const gp=CONFIG.grid.cellPx;
stage.style.backgroundImage='linear-gradient('+CONFIG.palette.grid+' 1px, transparent 1px),linear-gradient(90deg,'+CONFIG.palette.grid+' 1px, transparent 1px)';
stage.style.backgroundSize=gp+'px '+gp+'px';
stage.style.fontFamily=CONFIG.font;
const beatEls=CONFIG.beats.map((b,bi)=>{
 const el=document.createElement('div');el.className='beat';el.style.transition='opacity '+CONFIG.enterMs+'ms ease';
 const h=document.createElement('div');h.className='headline';h.style.top=CONFIG.headline.top+'px';h.style.fontSize=CONFIG.headline.fontPx+'px';
 b.headline.forEach(s=>{const sp=document.createElement('span');sp.textContent=s.t;if(s.style==='blue'){sp.className='blue';}if(s.style==='chip'){sp.className='chip';sp.style.background=CONFIG.palette.chipBg;sp.style.color=CONFIG.palette.chipInk;sp.style.borderRadius=CONFIG.headline.chipRadius+'px';}h.appendChild(sp);});
 el.appendChild(h);
 const sup=document.createElement('div');sup.className='support';sup.style.top=CONFIG.support.top+'px';
 if(b.support.kind==='insertCard'){const c=document.createElement('div');c.className='card';c.style.width=CONFIG.insert.w+'px';c.style.height=CONFIG.insert.h+'px';c.style.background=CONFIG.palette.card;c.style.border='2px solid '+CONFIG.palette.cardEdge;c.style.color=CONFIG.palette.ink;c.style.fontSize=CONFIG.insert.fontPx+'px';c.style.padding=CONFIG.insert.pad+'px';c.textContent=b.support.label;sup.appendChild(c);}
 if(b.support.kind==='checklist'){
   const wrap=document.createElement('div');wrap.className='check';wrap.style.gap=CONFIG.check.gap+'px';wrap.dataset.beat=bi;
   b.support.items.forEach((it,i)=>{const r=document.createElement('div');r.className='checkrow';r.dataset.idx=i;r.style.width=CONFIG.check.w+'px';r.style.height=CONFIG.check.rowH+'px';r.style.background=CONFIG.palette.card;r.style.border='1px solid '+CONFIG.palette.cardEdge;r.style.color=CONFIG.palette.ink;r.style.fontSize=CONFIG.check.fontPx+'px';r.style.padding='0 10px';r.style.opacity='0';r.textContent='\u2713  '+it;wrap.appendChild(r);});
   const w=document.createElement('div');w.className='warn';w.dataset.warn='1';w.style.width=CONFIG.check.w+'px';w.style.background=CONFIG.palette.warnBg;w.style.color=CONFIG.palette.warnInk;w.style.fontSize=CONFIG.check.warnFontPx+'px';w.style.padding='5px 8px';w.style.opacity='0';w.textContent=b.support.warning;wrap.appendChild(w);
   sup.appendChild(wrap);
 }
 el.appendChild(sup);stage.appendChild(el);return el;
});
let start=performance.now();
function tick(now){
 const t=(now-start)%CONFIG.cycleMs;
 let cur=0;CONFIG.atMs.forEach((a,i)=>{if(t>=a)cur=i;});
 beatEls.forEach((el,i)=>el.classList.toggle('on',i===cur));
 const b=CONFIG.beats[cur];
 if(b.support.kind==='checklist'){
   const local=t-CONFIG.atMs[cur];
   const wrap=beatEls[cur].querySelector('.check');
   if(wrap){wrap.querySelectorAll('.checkrow').forEach(r=>{const idx=+r.dataset.idx;r.style.opacity=local>=CONFIG.check.offsets[idx]?'1':'0';});
   const w=wrap.querySelector('[data-warn]');if(w)w.style.opacity=local>=CONFIG.check.warnAt?'1':'0';}
 }
 requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
// expose for harness / comparison sync
window.__T122={CONFIG,seek(ms){start=performance.now()-ms;}};
</script></body></html>
