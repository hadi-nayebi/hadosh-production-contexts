<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T124 — Strikethrough negation list (parameterized recreation)</title>
<style>
  html,body{margin:0;padding:0;background:#070a1a;}
  #stage{position:relative;overflow:hidden;margin:0 auto;}
  #headline{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;}
  #headline .chip{display:inline-block;}
  #list{position:absolute;left:0;right:0;}
  .card{position:absolute;box-sizing:border-box;}
  .cardText{position:relative;display:inline-block;white-space:nowrap;}
  .strike{position:absolute;}
  #err{position:absolute;left:0;top:0;right:0;display:none;color:#fff;background:#a00;font:12px monospace;padding:4px;}
</style>
</head>
<body>
<div id="stage">
  <div id="headline"></div>
  <div id="list"></div>
  <div id="err"></div>
</div>
<script>
"use strict";
/* ============ CONFIG — every content / timing / palette / font / geometry value lives here ============ */
const CONFIG = {
  headline: [{t: "You "}, {t: "don't", style: "blue"}, {t: " need to manually…"}],
  flipHeadline: [{t: "Claude handles "}, {t: "all of that", style: "chip"}],
  tasks: ["Arrange the images", "Create animations", "Add anything on a timeline"],
  atMs: [5000, 7000, 10000],
  headlineAtMs: 4000,
  strikeDelayMs: 800,
  strikeMs: 700,
  flipAtMs: 11500,
  cycleMs: 14000,
  enterMs: 350,
  flipFadeMs: 400,
  card: {w: 250, h: 34, padX: 14, gap: 10, radius: 8},
  strike: {thicknessPx: 3, overshootPx: 3, yFracOfLine: 0.54},
  strikeColor: "#3b82f6",
  stage: {w: 360, h: 203},
  grid: {cellPx: 24},
  layout: {headlineTopPx: 14, listTopPx: 64, enterRisePx: 6},
  type: {font: "Arial, Helvetica, sans-serif", headlinePx: 20, headlineWeight: 800, cardPx: 15, cardWeight: 700, lineHFrac: 1.3, chipPadX: 8, chipRadius: 5},
  palette: {field: "#0b1026", grid: "rgba(120,140,255,0.07)", ink: "#ffffff", blue: "#3b82f6", chipBg: "#ffffff", chipInk: "#10131f", card: "#131a33", cardEdge: "#3b82f6"}
};
const TOP_KEYS = ["headline","flipHeadline","tasks","atMs","headlineAtMs","strikeDelayMs","strikeMs","flipAtMs","cycleMs","enterMs","flipFadeMs","card","strike","strikeColor","stage","grid","layout","type","palette"];

/* ============ override (?cfg= JSON) ============ */
function deepMerge(base, over){
  if (Array.isArray(over)){
    if (!Array.isArray(base)) return over.slice();
    const merged = base.map(function(b, i){ return i < over.length ? deepMerge(b, over[i]) : b; });
    for (let i = base.length; i < over.length; i++) merged.push(over[i]);
    return merged;
  }
  if (over && typeof over === "object"){
    const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
    for (const k of Object.keys(over)) out[k] = deepMerge(base ? base[k] : undefined, over[k]);
    return out;
  }
  return over;
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function resolveConfig(raw){
  if (raw === null || raw === undefined || raw === "") return {cfg: clone(CONFIG), errors: []};
  let over;
  try { over = JSON.parse(raw); } catch(e){ return {cfg: null, errors: ["cfg: malformed JSON"]}; }
  if (!over || typeof over !== "object" || Array.isArray(over)) return {cfg: null, errors: ["cfg: expected object"]};
  return {cfg: deepMerge(clone(CONFIG), over), errors: []};
}

/* ============ pure logic (node-testable) ============ */
function easeOutCubic(p){ return 1 - Math.pow(1 - p, 3); }
function clamp01(x){ return x < 0 ? 0 : (x > 1 ? 1 : x); }
/* Character width model (Arial advance widths, em fractions) — the fit
   harness's measurement model; the strike endpoints derive from it. */
const CHAR_W = {upper: 0.68, lower: 0.52, space: 0.278, digit: 0.556, punct: 0.30};
function textWidthPx(text, fontPx, weight){
  let em = 0;
  for (const ch of text){
    if (ch === " ") em += CHAR_W.space;
    else if (ch >= "A" && ch <= "Z") em += CHAR_W.upper;
    else if (ch >= "0" && ch <= "9") em += CHAR_W.digit;
    else if (".,;:!?'’-—…".indexOf(ch) >= 0) em += CHAR_W.punct;
    else em += CHAR_W.lower;
  }
  if (weight >= 700) em *= 1.06;
  return em * fontPx;
}
function spansWidthPx(spans, fontPx, weight, cfg){
  let w = 0;
  for (const s of spans){
    w += textWidthPx(s.t, fontPx, weight);
    if (s.style === "chip") w += 2 * cfg.type.chipPadX;
  }
  return w;
}
function layoutModel(cfg){
  const cardX = Math.round((cfg.stage.w - cfg.card.w) / 2);
  const cards = cfg.tasks.map(function(task, i){
    const inkW = textWidthPx(task, cfg.type.cardPx, cfg.type.cardWeight);
    const lineH = cfg.type.cardPx * cfg.type.lineHFrac;
    return {
      task: task,
      x: cardX,
      y: cfg.layout.listTopPx + i * (cfg.card.h + cfg.card.gap),
      w: cfg.card.w, h: cfg.card.h,
      textX: cardX + cfg.card.padX,
      inkW: inkW,
      inkH: cfg.type.cardPx * 0.75,
      innerW: cfg.card.w - 2 * cfg.card.padX,
      strikeX: cardX + cfg.card.padX - cfg.strike.overshootPx,
      strikeFullW: inkW + 2 * cfg.strike.overshootPx,
      strikeY: cfg.layout.listTopPx + i * (cfg.card.h + cfg.card.gap) + (cfg.card.h - lineH) / 2 + lineH * cfg.strike.yFracOfLine - cfg.strike.thicknessPx / 2,
      strikeH: cfg.strike.thicknessPx
    };
  });
  return {
    stageW: cfg.stage.w, stageH: cfg.stage.h,
    headlineW: spansWidthPx(cfg.headline, cfg.type.headlinePx, cfg.type.headlineWeight, cfg),
    flipHeadlineW: spansWidthPx(cfg.flipHeadline, cfg.type.headlinePx, cfg.type.headlineWeight, cfg),
    headlineInkH: cfg.type.headlinePx * 0.716,
    cards: cards,
    listBottom: cfg.layout.listTopPx + cfg.tasks.length * cfg.card.h + (cfg.tasks.length - 1) * cfg.card.gap
  };
}
/* ONE elapsed-time schedule derives every state (phase exclusivity):
   headline: hidden → entering → shown → flipped at flipAtMs.
   per card: waiting → entering (enterMs) → landed → striking
   (strike starts strikeDelayMs after the card's atMs; enterMs <
   strikeDelayMs by construction, so the strike never starts before
   the landing completes) → struck; at flipAtMs the list fades out
   over flipFadeMs (the measured flip clears the list). */
function stateAt(t, cfg){
  const u = ((t % cfg.cycleMs) + cfg.cycleMs) % cfg.cycleMs;
  const flipped = u >= cfg.flipAtMs;
  let headline;
  if (u < cfg.headlineAtMs) headline = {mode: "hidden", opacity: 0, risePx: cfg.layout.enterRisePx, flipped: false};
  else if (u < cfg.headlineAtMs + cfg.enterMs){
    const p = easeOutCubic((u - cfg.headlineAtMs) / cfg.enterMs);
    headline = {mode: "entering", opacity: p, risePx: cfg.layout.enterRisePx * (1 - p), flipped: false};
  } else headline = {mode: flipped ? "flipped" : "shown", opacity: 1, risePx: 0, flipped: flipped};
  const listFade = flipped ? 1 - clamp01((u - cfg.flipAtMs) / cfg.flipFadeMs) : 1;
  const cards = cfg.tasks.map(function(task, i){
    const at = cfg.atMs[i];
    const strikeStart = at + cfg.strikeDelayMs;
    let mode, opacity, risePx;
    if (u < at){ mode = "waiting"; opacity = 0; risePx = cfg.layout.enterRisePx; }
    else if (u < at + cfg.enterMs){
      const p = easeOutCubic((u - at) / cfg.enterMs);
      mode = "entering"; opacity = p; risePx = cfg.layout.enterRisePx * (1 - p);
    } else if (u < strikeStart){ mode = "landed"; opacity = 1; risePx = 0; }
    else if (u < strikeStart + cfg.strikeMs){ mode = "striking"; opacity = 1; risePx = 0; }
    else { mode = "struck"; opacity = 1; risePx = 0; }
    const strikeP = clamp01((u - strikeStart) / cfg.strikeMs);
    return {mode: mode, opacity: opacity * listFade, risePx: risePx, strikeP: strikeP};
  });
  return {u: u, headline: headline, cards: cards, listFade: listFade};
}

/* ============ DOM construction ============ */
function renderSpans(el, spans, cfg){
  el.textContent = "";
  for (const s of spans){
    const sp = document.createElement("span");
    sp.textContent = s.t;
    if (s.style === "blue") sp.style.color = cfg.palette.blue;
    else if (s.style === "chip"){
      sp.className = "chip";
      sp.style.background = cfg.palette.chipBg;
      sp.style.color = cfg.palette.chipInk;
      sp.style.paddingLeft = cfg.type.chipPadX + "px";
      sp.style.paddingRight = cfg.type.chipPadX + "px";
      sp.style.borderRadius = cfg.type.chipRadius + "px";
    } else sp.style.color = cfg.palette.ink;
    el.appendChild(sp);
  }
}
function build(cfg){
  const L = layoutModel(cfg);
  const stage = document.getElementById("stage");
  stage.style.width = L.stageW + "px";
  stage.style.height = L.stageH + "px";
  stage.style.backgroundColor = cfg.palette.field;
  stage.style.backgroundImage =
    "linear-gradient(to right, " + cfg.palette.grid + " 1px, transparent 1px)," +
    "linear-gradient(to bottom, " + cfg.palette.grid + " 1px, transparent 1px)";
  stage.style.backgroundSize = cfg.grid.cellPx + "px " + cfg.grid.cellPx + "px";
  stage.style.fontFamily = cfg.type.font;
  const headline = document.getElementById("headline");
  headline.style.top = cfg.layout.headlineTopPx + "px";
  headline.style.fontSize = cfg.type.headlinePx + "px";
  headline.style.fontWeight = String(cfg.type.headlineWeight);
  headline.style.lineHeight = String(cfg.type.lineHFrac);
  renderSpans(headline, cfg.headline, cfg);
  const list = document.getElementById("list");
  list.textContent = "";
  const cardEls = [];
  cfg.tasks.forEach(function(task, i){
    const lay = L.cards[i];
    const card = document.createElement("div");
    card.className = "card";
    card.style.left = lay.x + "px";
    card.style.top = lay.y + "px";
    card.style.width = lay.w + "px";
    card.style.height = lay.h + "px";
    card.style.background = cfg.palette.card;
    card.style.border = "1px solid " + cfg.palette.cardEdge;
    card.style.borderRadius = cfg.card.radius + "px";
    const wrap = document.createElement("span");
    wrap.className = "cardText";
    wrap.textContent = task;
    wrap.style.left = cfg.card.padX + "px";
    wrap.style.top = ((cfg.card.h - cfg.type.cardPx * cfg.type.lineHFrac) / 2) + "px";
    wrap.style.color = cfg.palette.ink;
    wrap.style.fontSize = cfg.type.cardPx + "px";
    wrap.style.fontWeight = String(cfg.type.cardWeight);
    wrap.style.lineHeight = String(cfg.type.lineHFrac);
    const strike = document.createElement("div");
    strike.className = "strike";
    strike.style.left = (-cfg.strike.overshootPx) + "px";
    strike.style.top = (cfg.type.cardPx * cfg.type.lineHFrac * cfg.strike.yFracOfLine - cfg.strike.thicknessPx / 2) + "px";
    strike.style.height = cfg.strike.thicknessPx + "px";
    strike.style.width = "0px";
    strike.style.background = cfg.strikeColor;
    strike.style.borderRadius = (cfg.strike.thicknessPx / 2) + "px";
    wrap.appendChild(strike);
    card.appendChild(wrap);
    list.appendChild(card);
    cardEls.push({card: card, strike: strike, fullW: lay.strikeFullW});
  });
  return {layout: L, cardEls: cardEls, headlineFlipped: null};
}
function applyFrame(cfg, view, t){
  const st = stateAt(t, cfg);
  const headline = document.getElementById("headline");
  if (view.headlineFlipped !== st.headline.flipped){
    renderSpans(headline, st.headline.flipped ? cfg.flipHeadline : cfg.headline, cfg);
    view.headlineFlipped = st.headline.flipped;
  }
  headline.style.opacity = String(st.headline.opacity);
  headline.style.transform = "translateY(" + st.headline.risePx + "px)";
  view.cardEls.forEach(function(ce, i){
    const cs = st.cards[i];
    ce.card.style.opacity = String(cs.opacity);
    ce.card.style.transform = "translateY(" + cs.risePx + "px)";
    ce.card.style.visibility = cs.mode === "waiting" ? "hidden" : "visible";
    ce.strike.style.width = (cs.strikeP * ce.fullW) + "px";
  });
  return st;
}
if (typeof document !== "undefined"){
  const params = new URLSearchParams(location.search);
  const res = resolveConfig(params.get("cfg"));
  if (!res.cfg){
    const e = document.getElementById("err");
    e.style.display = "block"; e.textContent = res.errors.join("; ");
  } else {
    const cfg = res.cfg;
    const view = build(cfg);
    let start = performance.now();
    let frozen = null;
    window.addEventListener("message", function(ev){
      if (ev.data === "pause" && frozen === null) frozen = performance.now() - start;
      if (ev.data === "play" && frozen !== null){ start = performance.now() - frozen; frozen = null; }
    });
    function tick(now){ applyFrame(cfg, view, frozen !== null ? frozen : now - start); requestAnimationFrame(tick); }
    requestAnimationFrame(tick);
    window.__t124 = {cfg: cfg, stateAt: stateAt, layout: layoutModel(cfg)};
  }
}
if (typeof module !== "undefined" && module.exports){
  module.exports = {CONFIG: CONFIG, resolveConfig: resolveConfig, stateAt: stateAt, layoutModel: layoutModel, textWidthPx: textWidthPx, spansWidthPx: spansWidthPx};
}
</script>
</body>
</html>
