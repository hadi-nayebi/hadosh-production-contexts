<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T128 — Title-card chaptering, parameterized recreation</title>
<style>
  html,body{margin:0;padding:0;}
  #stage{position:relative;overflow:hidden;margin:0 auto;}
  .exhibit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;}
  .exhibit .mono{font-weight:bold;}
  .eyebrow{position:absolute;left:0;width:100%;text-align:center;font-weight:bold;}
  .mainline{position:absolute;left:0;width:100%;text-align:center;font-weight:bold;}
  .mainline .w{display:inline-block;}
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
/* T128 — title-card chaptering (Packet #6, Grow With Kaz, product playback).
   Construction: DOM, CONFIG-driven, JS-clock phase machine.
   Phases (segment-anchored, segment = source 385-399 s):
     EXHIBIT  exhibit.atMs .. exhibit.untilMs  code-drawn typographic exhibit card
     DARKEN   exhibit.untilMs .. eyebrowAtMs   field darkens, exhibit gone
     EYEBROW  eyebrowAtMs .. mainAtMs          small tracked accent caps fade in
     MAIN     mainAtMs .. + wordMs per word    large serif line builds word by word
     HOLD     last word .. cycle end           full card holds, then loops
   Cycle is DERIVED: mainAtMs + (mainWords.length-1)*wordMs + holdMs.
   No external assets; no specimen imagery; the title text IS the technique. */
const CONFIG = {
  exhibit: { label: "ARCHDUKE FRANZ FERDINAND", sub: "28 JUNE 1914", atMs: 0, untilMs: 7500,
             wPx: 300, hPx: 128, padPx: 12, tiltDeg: -2, mono: "FF", monoPx: 26,
             labelPx: 16, subPx: 15.5, fadeMs: 400, borderPx: 3 },
  eyebrow: "NOT JUST A MURDER…",
  mainWords: ["A", "SPARK."],
  eyebrowAtMs: 8000,
  mainAtMs: 10000,
  wordMs: 1100,
  holdMs: 4500,
  eyebrowFadeMs: 600,
  wordFadeMs: 400,
  darkenMs: 500,
  serif: "Georgia, 'Times New Roman', serif",
  type: { eyebrowPx: 16, eyebrowTrackingPx: 3, mainPx: 44, mainGapPx: 12 },
  geom: { eyebrowTopPx: 62, mainTopPx: 92 },
  palette: { field: "#10201e", fieldDark: "#0a1514", ink: "#f5f0e6", accent: "#c0392b",
             exhibitBg: "#e8e0cc", exhibitInk: "#20241f", exhibitEdge: "#f5f0e6" },
  stage: { w: 360, h: 203 }
};
/* ?cfg= JSON override (swap-test route) */
function applyOverride(cfg){
  try{
    const q = new URLSearchParams(location.search).get("cfg");
    if(q){ const o = JSON.parse(q);
      for(const k of Object.keys(o)){ if(k==="palette"||k==="type"||k==="geom"||k==="exhibit"||k==="stage"){ Object.assign(cfg[k], o[k]); } else { cfg[k]=o[k]; } } }
  }catch(e){}
  return cfg;
}
if (typeof location !== "undefined") applyOverride(CONFIG);

function cycleMs(cfg){ return cfg.mainAtMs + (cfg.mainWords.length-1)*cfg.wordMs + cfg.holdMs; }

/* Deterministic text-width model (Georgia caps advance ~0.62em, mixed ~0.52em; LOGIC level). */
function measureText(text, px, trackingPx){
  let adv = 0;
  for(const ch of text){ adv += (ch===" " ? 0.30 : (ch==="…" ? 0.78 : (ch===ch.toUpperCase() && ch!==ch.toLowerCase() ? 0.62 : 0.52))); }
  return adv*px + trackingPx*(text.length);
}
function fitRows(cfg){
  const ew = measureText(cfg.eyebrow, cfg.type.eyebrowPx, cfg.type.eyebrowTrackingPx);
  let mw = 0; cfg.mainWords.forEach((w,i)=>{ mw += measureText(w, cfg.type.mainPx, 0) + (i? cfg.type.mainGapPx:0); });
  const lw = measureText(cfg.exhibit.label, cfg.exhibit.labelPx, 0);
  const sw = measureText(cfg.exhibit.sub, cfg.exhibit.subPx, 0);
  return {
    eyebrow: { text: cfg.eyebrow, inkW: ew, inkH: cfg.type.eyebrowPx*0.72, boxW: cfg.stage.w },
    main: { text: cfg.mainWords.join(" "), inkW: mw, inkH: cfg.type.mainPx*0.72, boxW: cfg.stage.w },
    exhibitLabel: { text: cfg.exhibit.label, inkW: lw, inkH: cfg.exhibit.labelPx*0.72, boxW: cfg.exhibit.wPx - 2*cfg.exhibit.padPx },
    exhibitSub: { text: cfg.exhibit.sub, inkW: sw, inkH: cfg.exhibit.subPx*0.72, boxW: cfg.exhibit.wPx - 2*cfg.exhibit.padPx }
  };
}
/* Phase machine — exclusive states, pure function of t (ms, cycle-relative). */
function stateAt(cfg, t){
  const cyc = cycleMs(cfg); const tt = ((t % cyc) + cyc) % cyc;
  const ex = cfg.exhibit;
  let exhibitO = 0;
  if (tt >= ex.atMs && tt < ex.untilMs - ex.fadeMs) exhibitO = 1;
  else if (tt >= ex.untilMs - ex.fadeMs && tt < ex.untilMs) exhibitO = 1 - (tt-(ex.untilMs-ex.fadeMs))/ex.fadeMs;
  const darken = tt < ex.untilMs ? 0 : Math.min(1, (tt-ex.untilMs)/cfg.darkenMs);
  const eyebrowO = tt < cfg.eyebrowAtMs ? 0 : Math.min(1, (tt-cfg.eyebrowAtMs)/cfg.eyebrowFadeMs);
  const words = cfg.mainWords.map((w,i)=>{
    const at = cfg.mainAtMs + i*cfg.wordMs;
    return tt < at ? 0 : Math.min(1, (tt-at)/cfg.wordFadeMs);
  });
  const phase = tt < ex.untilMs ? "EXHIBIT" : (tt < cfg.eyebrowAtMs ? "DARKEN" : (tt < cfg.mainAtMs ? "EYEBROW" : (words.some(o=>o<1) ? "MAIN" : "HOLD")));
  return { t: tt, phase, exhibitO, darken, eyebrowO, words };
}

if (typeof document !== "undefined"){
  const cfg = CONFIG, P = cfg.palette;
  document.body.style.background = P.fieldDark;
  const stage = document.getElementById("stage");
  stage.style.width = cfg.stage.w+"px"; stage.style.height = cfg.stage.h+"px";
  stage.style.background = P.field; stage.style.fontFamily = cfg.serif;
  const exEl = document.createElement("div"); exEl.className="exhibit";
  exEl.style.width = cfg.exhibit.wPx+"px"; exEl.style.height = cfg.exhibit.hPx+"px";
  exEl.style.padding = cfg.exhibit.padPx+"px"; exEl.style.background = P.exhibitBg;
  exEl.style.border = cfg.exhibit.borderPx+"px solid "+P.exhibitEdge; exEl.style.color = P.exhibitInk;
  exEl.style.transform = "translate(-50%,-50%) rotate("+cfg.exhibit.tiltDeg+"deg)";
  const mono = document.createElement("div"); mono.className="mono"; mono.textContent = cfg.exhibit.mono;
  mono.style.fontSize = cfg.exhibit.monoPx+"px";
  const lab = document.createElement("div"); lab.textContent = cfg.exhibit.label; lab.style.fontSize = cfg.exhibit.labelPx+"px"; lab.style.fontWeight="bold";
  const sub = document.createElement("div"); sub.textContent = cfg.exhibit.sub; sub.style.fontSize = cfg.exhibit.subPx+"px";
  exEl.appendChild(mono); exEl.appendChild(lab); exEl.appendChild(sub); stage.appendChild(exEl);
  const ebEl = document.createElement("div"); ebEl.className="eyebrow"; ebEl.textContent = cfg.eyebrow;
  ebEl.style.top = cfg.geom.eyebrowTopPx+"px"; ebEl.style.fontSize = cfg.type.eyebrowPx+"px";
  ebEl.style.letterSpacing = cfg.type.eyebrowTrackingPx+"px"; ebEl.style.color = P.accent;
  stage.appendChild(ebEl);
  const mainEl = document.createElement("div"); mainEl.className="mainline";
  mainEl.style.top = cfg.geom.mainTopPx+"px"; mainEl.style.fontSize = cfg.type.mainPx+"px"; mainEl.style.color = P.ink;
  const wordEls = cfg.mainWords.map((w,i)=>{
    const s = document.createElement("span"); s.className="w"; s.textContent = w;
    if(i) s.style.marginLeft = cfg.type.mainGapPx+"px";
    mainEl.appendChild(s); return s;
  });
  stage.appendChild(mainEl);
  function hexRgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
  function mix(a,b,f){ const A=hexRgb(a),B=hexRgb(b); return "rgb("+A.map((v,i)=>Math.round(v+(B[i]-v)*f)).join(",")+")"; }
  let start = performance.now(), paused = false, pauseT = 0;
  function render(now){
    const t = paused ? pauseT : now - start;
    const s = stateAt(cfg, t);
    exEl.style.opacity = s.exhibitO; exEl.style.display = s.exhibitO<=0 ? "none":"flex";
    stage.style.background = mix(P.field, P.fieldDark, s.darken);
    ebEl.style.opacity = s.eyebrowO;
    wordEls.forEach((el,i)=>{ el.style.opacity = s.words[i]; });
    if(!paused) requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
  window.addEventListener("message", (ev)=>{
    const d = ev.data||{};
    if(d.cmd==="pause"){ paused = true; pauseT = performance.now()-start; }
    if(d.cmd==="play"){ if(paused){ start = performance.now()-pauseT; paused=false; requestAnimationFrame(render);} }
    if(d.cmd==="restart"){ start = performance.now(); paused=false; requestAnimationFrame(render); }
  });
}
</script>
</body>
</html>
