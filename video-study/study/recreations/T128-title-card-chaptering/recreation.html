<title>T128 — Title-card chaptering, parameterized recreation</title>
<style>

</style>

<body>
<div id="stage"></div>
<script>
"use strict";
/* T128 — title-card chaptering. Construction: DOM, CONFIG-driven, JS-clock phase machine.
   One pure stateAt() function of cycle-relative time; the cycle is derived, never a literal.
   Reveal convention: a typed string of N glyphs with onset O and per-glyph interval C shows
   glyph k at O + (k-1)*C, so it completes at O + (N-1)*C. The full-opacity hold is measured
   from the main line's completion. The exhibit is present from cycle t=0 by definition. No external assets; no specimen imagery. */
const CONFIG = {
  exhibit: { label: "ARCHDUKE FRANZ FERDINAND", sub: "28 JUNE 1914",
             exitAtMs: 4600, exitMs: 200, exitDxPx: -280, exitDyPx: -160, exitScale: 0.5,
             wPx: 300, hPx: 128, padPx: 12, tiltDeg: -2, mono: "FF", monoPx: 26,

  map: { label: "AUSTRO-HUNGARIAN EMPIRE", labelPx: 16, labelTopPx: 30, labelTrackingPx: 2, fadeTo: 0.22, labelO: 1, revealMs: 200, vignetteStrength: 0.55, vignetteInnerPct: 55, vignetteOuterPct: 100, strokeWidthPx: 1.25, contourO: [0.16, 0.11, 0.09, 0.09],
         contours: ["M-10,150 C60,120 90,170 160,140 C230,110 260,160 370,120", "M-10,90 C70,70 120,110 200,80 C270,55 310,95 370,60", "M40,-10 C60,60 30,120 70,213", "M300,-10 C280,70 320,130 290,213"] },
  eyebrow: "NOT JUST A MURDER.",
  mainText: "A SPARK.",
  mainFinalCharAccent: true,
  eyebrowAtMs: 5450, eyebrowCharMs: 60,
  strikeAtMs: 7600, strikeMs: 400,
  mainAtMs: 9250, mainCharMs: 70,
  holdMs: 3400, exitMs: 400, exitStrikeLead: 2, segmentMs: 14000,
  serif: "Georgia, 'Times New Roman', serif",
  type: { eyebrowPx: 20, eyebrowTrackingPx: 3, mainPx: 44,
          eyebrowStack: "\"Courier New\", Courier, monospace",
          eyebrowWeight: 700, mainWeight: 700, exhibitWeight: 700, /*DONLY*/
          lineHeightEyebrow: 1.2, lineHeightMain: 1.15, lineHeightExhibit: 1.3, mapLabelWeight: 700, mapLabelLineHeight: 1.2, exhibitSubWeight: 700, exhibitSubLineHeight: 1.3, /*DONLY*/
          strikePx: 2 },
  geom: { eyebrowTopPx: 78, mainTopPx: 100 },
  palette: { field: "#10201e", fieldDark: "#0a1514", ink: "#e9ebe6", strike: "#cd6053",

/* Measurement instrument coefficients (fit model only; they shape the model, not the subject):

   monospace advance 0.60 for every glyph; cap-height ratios — serif 0.72, monospace 0.565. */
function glyphCount(s){ return [...String(s)].length; }
function eyebrowCompleteMs(cfg){ return cfg.eyebrowAtMs + (glyphCount(cfg.eyebrow)-1)*cfg.eyebrowCharMs; }

function cycleMs(cfg){ return mainCompleteMs(cfg) + cfg.holdMs + cfg.exitMs; }

function charsAt(onset, charMs, n, t){ return t<onset ? 0 : Math.min(n, Math.floor((t-onset)/charMs)+1); }
function isMono(cfg){ return cfg.type.eyebrowStack.indexOf("monospace")>=0; }
function measureText(text, px, trackingPx, mono){
  let adv = 0;

    if(mono) adv += 0.60;

    else if(ch==="."||ch===","||ch==="-"||ch==="…") adv += 0.28;
    else if(ch===ch.toUpperCase() && ch!==ch.toLowerCase()) adv += 0.62;

function inkHeightPx(px, mono){ return px*(mono?0.565:0.72); }
function strikeWidthPx(cfg){ return measureText(cfg.eyebrow, cfg.type.eyebrowPx, cfg.type.eyebrowTrackingPx, isMono(cfg)); }

  const mn = (s)=>measureText(s, cfg.type.mainPx, 0, false);

    eyebrow: { text: cfg.eyebrow, inkW: eb(cfg.eyebrow), inkH: inkHeightPx(cfg.type.eyebrowPx, mono), boxW: cfg.stage.w },

    eyebrow12: { text: cfg.eyebrow.slice(0,12), inkW: eb(cfg.eyebrow.slice(0,12)), inkH: inkHeightPx(cfg.type.eyebrowPx, mono), boxW: cfg.stage.w },
    main: { text: cfg.mainText, inkW: mn(cfg.mainText), inkH: inkHeightPx(cfg.type.mainPx, false), boxW: cfg.stage.w },
    main1: { text: cfg.mainText.slice(0,1), inkW: mn(cfg.mainText.slice(0,1)), inkH: inkHeightPx(cfg.type.mainPx, false), boxW: cfg.stage.w },
    main4: { text: cfg.mainText.slice(0,4), inkW: mn(cfg.mainText.slice(0,4)), inkH: inkHeightPx(cfg.type.mainPx, false), boxW: cfg.stage.w },
    exhibitLabel: { text: cfg.exhibit.label, inkW: measureText(cfg.exhibit.label, cfg.exhibit.labelPx, 0, false), inkH: inkHeightPx(cfg.exhibit.labelPx, false), boxW: cfg.exhibit.wPx - 2*cfg.exhibit.padPx },
    exhibitSub: { text: cfg.exhibit.sub, inkW: measureText(cfg.exhibit.sub, cfg.exhibit.subPx, 0, false), inkH: inkHeightPx(cfg.exhibit.subPx, false), boxW: cfg.exhibit.wPx - 2*cfg.exhibit.padPx },
    mapLabel: { text: cfg.map.label, inkW: measureText(cfg.map.label, cfg.map.labelPx, cfg.map.labelTrackingPx, false), inkH: inkHeightPx(cfg.map.labelPx, false), boxW: cfg.stage.w }

}
function hexToRgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }

}
function labelContrastAt(cfg, t){

  const vf = vignetteFactorAt(cfg) * cfg.map.vignetteStrength * st.gate;
  bg = bg.map((v)=> v * (1 - vf));

function lum(hex){

/* Phase machine — exactly one phase per t, pure function of cycle-relative t. */

    exhibit: { w: cfg.exhibit.wPx, h: cfg.exhibit.hPx, pad: cfg.exhibit.padPx, border: cfg.exhibit.borderPx, tilt: cfg.exhibit.tiltDeg, exitDx: cfg.exhibit.exitDxPx, exitDy: cfg.exhibit.exitDyPx, exitScale: cfg.exhibit.exitScale, lineHeight: cfg.type.lineHeightExhibit, mono: cfg.exhibit.mono, monoPx: cfg.exhibit.monoPx, monoWeight: cfg.type.exhibitWeight, label: cfg.exhibit.label, labelPx: cfg.exhibit.labelPx, labelWeight: cfg.type.exhibitWeight, sub: cfg.exhibit.sub, subPx: cfg.exhibit.subPx, subWeight: cfg.type.exhibitSubWeight, subLineHeight: cfg.type.exhibitSubLineHeight, bg: cfg.palette.exhibitBg, color: cfg.palette.exhibitInk, edge: cfg.palette.exhibitEdge },

    main: { text: cfg.mainText, top: cfg.geom.mainTopPx, fontSize: cfg.type.mainPx, fontWeight: cfg.type.mainWeight, lineHeight: cfg.type.lineHeightMain, color: cfg.palette.ink, accent: cfg.mainFinalCharAccent, accentColor: cfg.palette.strike }

function segmentStateAt(cfg, t){

}
/*VALIDATOR-BEGIN*/
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
const SCHEMA = {
  groups: {
    exhibit: { label:"str", sub:"str", exitAtMs:"ms", exitMs:"pos", exitDxPx:"num", exitDyPx:"num", exitScale:"unit", wPx:"pos", hPx:"pos", padPx:"num", tiltDeg:"num", mono:"str", monoPx:"pos", labelPx:"pos", subPx:"pos", borderPx:"num" },
    map: { label:"str", labelPx:"pos", labelTopPx:"num", labelTrackingPx:"num", fadeTo:"unit", labelO:"unit", revealMs:"pos", vignetteStrength:"unit", vignetteInnerPct:"pct", vignetteOuterPct:"pct", strokeWidthPx:"pos", contourO:"arrUnit", contours:"arrStr" },
    type: { eyebrowPx:"pos", eyebrowTrackingPx:"num", mainPx:"pos", eyebrowStack:"str", eyebrowWeight:"pos", mainWeight:"pos", exhibitWeight:"pos", lineHeightEyebrow:"pos", lineHeightMain:"pos", lineHeightExhibit:"pos", strikePx:"pos", mapLabelWeight:"pos", mapLabelLineHeight:"pos", exhibitSubWeight:"pos", exhibitSubLineHeight:"pos" },
    geom: { eyebrowTopPx:"num", mainTopPx:"num" },
    palette: { field:"hex", fieldDark:"hex", ink:"hex", strike:"hex", exhibitBg:"hex", exhibitInk:"hex", exhibitEdge:"hex" },
    stage: { w:"pos", h:"pos" }

  top: { segmentMs:"pos", eyebrow:"text", mainText:"text", mainFinalCharAccent:"bool", eyebrowAtMs:"ms", eyebrowCharMs:"pos", strikeAtMs:"ms", strikeMs:"pos", mainAtMs:"ms", mainCharMs:"pos", holdMs:"ms", exitMs:"pos", exitStrikeLead:"pos", serif:"str" }
