const OVERRIDE_OUTCOMES = [];
let SPECIMEN_CONFIG = true;
function parseStrictNum(raw){
  if (raw === null || raw === undefined) return null;
  const s = String(raw).trim();
  if (s === "") return null;
  const v = Number(s);
  return isFinite(v) ? v : null;
}
function segmentGraphemes(text){
  if (typeof Intl !== "undefined" && typeof Intl.Segmenter === "function") {
    const seg = new Intl.Segmenter(undefined, { granularity: "grapheme" });
    return Array.from(seg.segment(text), function(s){ return s.segment; });
  }

}
function segmentClustersFallback(text){
  const cps = Array.from(text);
  const clusters = [];
  let cur = null;
  function isAttach(cp){
    return /[\p{Mn}\p{Me}\p{Mc}]|[\uFE00-\uFE0F]|[\u{1F3FB}-\u{1F3FF}]|\u20E3/u.test(cp);
  }
  function isRI(cp){ const n = cp.codePointAt(0); return n >= 0x1F1E6 && n <= 0x1F1FF; }
  for (let i = 0; i < cps.length; i++) {
    const cp = cps[i];
    if (cur === null) { cur = cp; continue; }
    if (isAttach(cp)) { cur += cp; continue; }
    if (cp === "\u200D") { cur += cp; if (i + 1 < cps.length) { cur += cps[i + 1]; i++; } continue; }
    if (isRI(cp)) {
      const prev = Array.from(cur);
      if (prev.length === 1 && isRI(prev[0])) { cur += cp; continue; }
    }
    clusters.push(cur); cur = cp;
  }
  if (cur !== null) clusters.push(cur);

}
function graphemeRangeOf(haystack, needle){
  if (!needle) return null;
  const h = segmentGraphemes(haystack), n = segmentGraphemes(needle);
  for (let i = 0; i + n.length <= h.length; i++) {
    let ok = true;
    for (let j = 0; j < n.length; j++) if (h[i + j] !== n[j]) { ok = false; break; }
    if (ok) return { start: i, end: i + n.length };
  }
  return null;
}

  if ("mwMW@#%".indexOf(ch) >= 0) return E.wide;

  const shown = ce.graphemes.slice(0, typedCount);
  const r = ce.hlRange;
  const hlShown = r ? Math.max(0, Math.min(typedCount, r.end) - r.start) : 0;
  if (r && typedCount > r.start && hlShown > 0) {
    const before = shown.slice(0, r.start).join("");
    const hl = shown.slice(r.start, r.start + hlShown).join("");
    const after = shown.slice(r.start + hlShown).join("");
    if (before) ce.title.appendChild(document.createTextNode(before));
    const m = document.createElement("mark"); m.textContent = hl;
    m.style.background = P.highlightBg; m.style.color = P.highlightInk;
    ce.title.appendChild(m);
    if (after) ce.title.appendChild(document.createTextNode(after));
  } else if (shown.length) {
    ce.title.appendChild(document.createTextNode(shown.join("")));
  }
  ce.title.appendChild(ce.caret);
}

function cardColorsAt(i, t){
  const s = SCHEDULE.cards[i];
  if (t >= s.typeEnd) {
    const q = landingProgressAt(t, s.typeEnd);
    const fromBg = s.preLanded ? P.cardBg : P.cardBgTyping;
    return { bg: colorLerp(fromBg, P.cardBgLanded, q), border: colorLerp(P.accent, P.cardBorderLanded, q), q: q };
  }
  if (t >= s.typeStart || s.preTyped) return { bg: P.cardBgTyping, border: P.accent, q: 0 };
  return { bg: P.cardBg, border: P.accent, q: 0 };
}

function render(t){
  if (FROZEN) return;
  const L = CONFIG.layout[(stage.clientWidth > 0 && stage.clientWidth <= CONFIG.narrowBreakpointPx) ? "narrow" : "wide"];
  CONFIG.cards.forEach(function(c, i){
    const s = SCHEDULE.cards[i];
    const ce = cardEls[i];
    const b = CONFIG.beats[i];
    if (t < s.appearStart) {
      ce.el.style.opacity = "0";
      ce.el.style.transform = "translateY(" + L.entranceDy + ")";
      if (ce.shown !== -1) { ce.title.textContent = ""; ce.shown = -1; }
      ce.caret.style.display = "none";
      return;
    }
    const p = b.appearMs > 0 ? Math.min(1, Math.max(0, (t - s.appearStart) / b.appearMs)) : 1;
    ce.el.style.opacity = String(p);
    ce.el.style.transform = "translateY(" + scaledToken(L.entranceDy, 1 - p) + ")";
    let typed = 0;
    if (t >= s.typeEnd) typed = s.count;
    else if (s.preTyped) typed = Math.min(s.count, s.preTyped + Math.floor(Math.max(0, t) / b.charMs));
    else if (t > s.typeStart) typed = Math.min(s.count, Math.floor((t - s.typeStart) / b.charMs));
    else typed = s.preTyped || 0;
    const landed = t >= s.typeEnd;
    if (typed !== ce.shown) {
      ce.shown = typed;
      renderTitle(ce, c, typed);
    }
    const cols = cardColorsAt(i, t);
    ce.el.style.background = cols.bg;
    ce.el.style.borderLeftColor = cols.border;
    if (landed) {
      ce.caret.style.display = "none";
      ce.el.classList.add("landed");
    } else {
      ce.el.classList.remove("landed");
      ce.caret.style.display = "inline-block";
      ce.caret.style.opacity = String(caretOpacityAt(t));
    }
  });
}

/* --- Clock: free-running, externally slaveable for comparison.html --- */
let playing = !FROZEN, basePerf = 0, baseStamp = performance.now();
function perfNow(){
  let t = playing ? basePerf + (performance.now() - baseStamp) : basePerf;
  if (t > SCHEDULE.endMs) { t = SCHEDULE.endMs; if (playing) { playing = false; basePerf = t; } }
  return t;
}
applyLayout();
if (typeof window !== "undefined" && window.addEventListener) window.addEventListener("resize", applyLayout);
if (!FROZEN) (function loop(){ render(perfNow()); requestAnimationFrame(loop); })();
window.T13 = {
  scheduleEndMs: SCHEDULE.endMs,
  openingOffsetMs: CONFIG.opening.offsetMs,
  validationErrors: VALIDATION_ERRORS,
  overrideOutcomes: OVERRIDE_OUTCOMES,
  windowAccounting: WINDOW_ACCOUNTING,
  frozen: FROZEN,
  modelFor: modelFor,
  graphemes: segmentGraphemes,
  graphemeRangeOf: graphemeRangeOf,
  config: CONFIG,
  setTime: function(ms){
    if (FROZEN) return;
    basePerf = Math.max(0, Math.min(ms, SCHEDULE.endMs)); baseStamp = performance.now(); render(basePerf);
  },
  play: function(){ if (FROZEN) return; if (!playing) { playing = true; baseStamp = performance.now(); } },
  pause: function(){ if (FROZEN) return; if (playing) { basePerf = perfNow(); playing = false; } },
  restart: function(){
    if (FROZEN) return;
    basePerf = 0; baseStamp = performance.now(); playing = true;
    cardEls.forEach(function(ce){ ce.shown = -1; });
    render(0);
  },
  isPlaying: function(){ return playing; },
  testing: {
    buildScheduleFor: buildScheduleFor,
    validateConfig: validateConfig,
    fitLines: fitLines,
    caretOpacityAt: caretOpacityAt,
    landingProgressAt: landingProgressAt,
    cardColorsAt: cardColorsAt,
    colorLerp: colorLerp,
    estimateWidthPx: estimateWidthPx,
    parseUnitToken: parseUnitToken,
    lenPx: lenPx,
    scaledToken: scaledToken,
    markRangeFor: markRangeFor,
    normalizeWs: normalizeWs,
    isHexColor: isHexColor,
    fitPath: function(){ return FIT_PATH; },
    cardEls: function(){ return cardEls; },
    applyLayout: applyLayout,
    render: render
  }
};
</script>
</body>
