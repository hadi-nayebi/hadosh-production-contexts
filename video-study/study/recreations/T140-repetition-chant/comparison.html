<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T140 — Comparison</title>
<style>
  body { margin:0; padding:12px; background:#181818; color:#eee; font-family:Arial, Helvetica, sans-serif; }
  .wrap { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  figure { margin:0; width:360px; max-width:100%; }
  figcaption { font-size:13px; padding:6px 2px; line-height:1.35; }
  video, iframe { width:360px; max-width:100%; height:203px; border:0; display:block; background:#000; }
  .controls { display:flex; gap:10px; justify-content:center; padding:14px 0; flex-wrap:wrap; }
  button { font-size:16px; padding:12px 20px; min-height:48px; cursor:pointer; }
  @media (max-width:760px) { .wrap { flex-direction:column; align-items:center; } }
</style>
</head>
<body>
<div class="controls">
  <button id="playBtn" type="button">Play</button>
  <button id="pauseBtn" type="button">Pause</button>
  <button id="restartBtn" type="button">Restart</button>
</div>
<div class="wrap">
  <figure>
    <video id="orig" src="segment.mp4" playsinline preload="auto"></video>
    <figcaption>ORIGINAL — Honda Keep Up @ 32.04–33.52</figcaption>
  </figure>
  <figure>
    <iframe id="rec" src="recreation.html" title="T140 recreation"></iframe>
    <figcaption>RECREATION — T140 Repetition chant, parameterized</figcaption>
  </figure>
</div>
<script>
"use strict";
var video = document.getElementById("orig");
var rec = document.getElementById("rec");
function syncRec() {
  if (rec.contentWindow && rec.contentWindow.__seek) {
    var ms = video.currentTime * 1000 - 500;
    if (ms < 0) ms = 0;
    rec.contentWindow.__seek(ms);
  }
}
video.addEventListener("timeupdate", syncRec);
video.addEventListener("seeked", syncRec);
document.getElementById("playBtn").addEventListener("click", function () { video.play(); syncRec(); });
document.getElementById("pauseBtn").addEventListener("click", function () { video.pause(); syncRec(); });
document.getElementById("restartBtn").addEventListener("click", function () { video.currentTime = 0; video.play(); syncRec(); });
rec.addEventListener("load", syncRec);
</script>
</body>
</html>
