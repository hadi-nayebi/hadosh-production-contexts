<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>T156 recreation</title>
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}#stage{position:relative;width:100vw;height:56.25vw;max-height:100vh;overflow:hidden}#scene{position:absolute;inset:0}</style></head><body>
<div id="stage"><svg id="scene" viewBox="0 0 720 405" preserveAspectRatio="none" width="100%" height="100%">
<rect id="bg" x="0" y="0"/>
<g id="cloudsBack"></g><g id="tileG"></g><g id="els"></g><g id="rocketG"></g><g id="cloudsFront"></g>
</svg></div>
<script>
var CONFIG = {
 "stageW": 720, "stageH": 405, "cycleMs": 25000, "enterMs": 400, "easePow": 3,
 "bg": "#87c5e8",
 "tile": {"originX": 360, "originY": 36, "tileW": 84, "tileH": 42, "cols": 6, "rows": 6},
 "palette": {"grass": "#79c25f", "grassDark": "#5da34a", "grassEdge": "#5da34a", "hutWall": "#4a90d9", "hutRoof": "#f2b13c", "field": "#8a6d3b", "fieldRow": "#e8dcc0", "path": "#e8dcc0", "pen": "#a05a2c", "tree": "#3e8e4f", "teepee": "#e8dcc0", "fire": "#f26d3c", "sheep": "#ffffff", "figure": "#333333", "cloud": "#ffffff", "trunk": "#6b4423", "fireCore": "#ffd75e", "rocketTip": "#e0339b", "rocketStroke": "#999999", "generic": "#999999"},
 "elements": [
  {"kind": "tree", "gx": 0, "gy": 1, "onsetMs": 0},
  {"kind": "tree", "gx": 1, "gy": 0, "onsetMs": 300},
  {"kind": "tree", "gx": 5, "gy": 2, "onsetMs": 600},
  {"kind": "tree", "gx": 2, "gy": 5, "onsetMs": 900},
  {"kind": "teepee", "gx": 1, "gy": 1, "onsetMs": 1200},
  {"kind": "fire", "gx": 2, "gy": 1, "onsetMs": 1600},
  {"kind": "hut", "gx": 1, "gy": 2, "onsetMs": 2300},
  {"kind": "hut", "gx": 2, "gy": 2, "onsetMs": 3100},
  {"kind": "hut", "gx": 3, "gy": 1, "onsetMs": 3900},
  {"kind": "hut", "gx": 2, "gy": 3, "onsetMs": 5200},
  {"kind": "hut", "gx": 4, "gy": 2, "onsetMs": 6000},
  {"kind": "field", "gx": 1, "gy": 3, "onsetMs": 6800},
  {"kind": "field", "gx": 3, "gy": 3, "onsetMs": 7600},
  {"kind": "field", "gx": 4, "gy": 3, "onsetMs": 8400},
  {"kind": "path", "gx": 3, "gy": 2, "onsetMs": 9200},
  {"kind": "pen", "gx": 4, "gy": 4, "onsetMs": 10000},
  {"kind": "sheep", "gx": 4, "gy": 4, "onsetMs": 10400, "dx": -12, "dy": 0},
  {"kind": "sheep", "gx": 5, "gy": 4, "onsetMs": 10800},
  {"kind": "sheep", "gx": 4, "gy": 5, "onsetMs": 11200},
  {"kind": "figure", "gx": 2, "gy": 4, "onsetMs": 11600},
  {"kind": "figure", "gx": 3, "gy": 4, "onsetMs": 12200}
 ],
 "rocket": {"padGx": 4, "padGy": 1, "riseStartMs": 15000, "riseMs": 5000, "w": 16, "h": 34, "flame": "#f26d3c", "body": "#e8e8e8", "travelPx": 195, "easePow": 1, "tipHRatio": 0.35, "flameLenRatio": 0.7352941176470588, "flameWRatio": 0.3125},
 "clouds": [
  {"x": 60, "y": 52, "r": 40, "layer": "back"}, {"x": 160, "y": 38, "r": 52, "layer": "back"}, {"x": 265, "y": 58, "r": 44, "layer": "back"},
  {"x": 360, "y": 34, "r": 58, "layer": "back"}, {"x": 460, "y": 54, "r": 42, "layer": "back"}, {"x": 560, "y": 40, "r": 50, "layer": "back"}, {"x": 655, "y": 56, "r": 38, "layer": "back"},
  {"x": 486, "y": 60, "r": 40, "layer": "front"}, {"x": 600, "y": 96, "r": 34, "layer": "front"}
 ],
 "cloudTravelPx": 130, "cloudRyRatio": 0.45, "cloudOpacity": 0.85,
 "glyphScale": {"sheepRx": 13, "sheepRy": 8, "sheepHeadR": 4.5, "figureHeadR": 6, "figureBodyTop": 18, "figureBodyLen": 10, "fireR": 11, "fireCoreR": 5.5},
 "fieldRows": {"y1": -4, "y2": 8, "x1": 13, "x2": 9, "strokeW": 3}
};
function clamp01(v){return v<0?0:(v>1?1:v);}
function easeOut(p,cfg){return 1-Math.pow(1-p,cfg.easePow);}
function gridToScreen(cfg,gx,gy){var t=cfg.tile;return {x:t.originX+(gx-gy)*t.tileW/2, y:t.originY+(gx+gy)*t.tileH/2};}
function elementState(cfg,e,ms){var p=clamp01((ms-e.onsetMs)/cfg.enterMs);var pos=gridToScreen(cfg,e.gx,e.gy);var dx=e.dx||0,dy=e.dy||0;return {kind:e.kind,gx:e.gx,gy:e.gy,onsetMs:e.onsetMs,enterP:p,scale:easeOut(p,cfg),visible:ms>=e.onsetMs,x:pos.x+dx,y:pos.y+dy};}
function rocketState(cfg,ms){var r=cfg.rocket;var p=clamp01((ms-r.riseStartMs)/r.riseMs);var rc={};for(var k in cfg)rc[k]=cfg[k];rc.easePow=r.easePow;var e=easeOut(p,rc);var pad=gridToScreen(cfg,r.padGx,r.padGy);return {riseP:p,eased:e,padX:pad.x,padY:pad.y,x:pad.x,y:pad.y-e*r.travelPx,visible:ms>=r.riseStartMs,exited:p>=1,flame:ms>=r.riseStartMs&&p<1};}
function stateAt(cfg,ms){
 var els=[];for(var i=0;i<cfg.elements.length;i++)els.push(elementState(cfg,cfg.elements[i],ms));
 var rk=rocketState(cfg,ms);
 var cloudOff=rk.riseP*cfg.cloudTravelPx;
 var maxOnset=0;for(var j=0;j<cfg.elements.length;j++)if(cfg.elements[j].onsetMs>maxOnset)maxOnset=cfg.elements[j].onsetMs;
 return {ms:ms,elements:els,elementCount:cfg.elements.length,visibleCount:els.filter(function(e){return e.visible;}).length,rocket:rk,cloudOffsetY:cloudOff,cloudCount:cfg.clouds.length,hutWall:cfg.palette.hutWall,holding:ms>=cfg.rocket.riseStartMs+cfg.rocket.riseMs,fillComplete:ms>=maxOnset+cfg.enterMs};
}
function glyphPath(kind,cfg){
 // parameterized glyphs drawn in a -20..20 x, -30..0 y local box; returns SVG inner markup string built from palette (no per-element literals)
 var p=cfg.palette;
 if(kind==="tree")return '<circle cx="0" cy="-22" r="11" fill="'+p.tree+'"/><rect x="-2" y="-12" width="4" height="10" fill="'+p.trunk+'"/>';
 if(kind==="teepee")return '<polygon points="0,-28 -13,0 13,0" fill="'+p.teepee+'" stroke="'+p.field+'"/><polygon points="0,-28 -3,0 3,0" fill="'+p.field+'"/>';
 if(kind==="fire")return '<circle cx="0" cy="-6" r="'+cfg.glyphScale.fireR+'" fill="'+p.fire+'"/><circle cx="0" cy="-4" r="'+cfg.glyphScale.fireCoreR+'" fill="'+p.fireCore+'"/>';
 if(kind==="hut")return '<rect x="-13" y="-14" width="26" height="14" fill="'+p.hutWall+'"/><polygon points="-16,-14 16,-14 0,-28" fill="'+p.hutRoof+'"/>';
 if(kind==="field")return '<polygon points="0,-10 -20,0 0,10 20,0" fill="'+p.field+'"/><line x1="-'+cfg.fieldRows.x1+'" y1="'+cfg.fieldRows.y1+'" x2="'+cfg.fieldRows.x1+'" y2="'+cfg.fieldRows.y1+'" stroke="'+p.fieldRow+'" stroke-width="'+cfg.fieldRows.strokeW+'"/><line x1="-'+cfg.fieldRows.x2+'" y1="'+cfg.fieldRows.y2+'" x2="'+cfg.fieldRows.x2+'" y2="'+cfg.fieldRows.y2+'" stroke="'+p.fieldRow+'" stroke-width="'+cfg.fieldRows.strokeW+'"/>';
 if(kind==="path")return '<polygon points="0,-10 -20,0 0,10 20,0" fill="'+p.path+'"/>';
 if(kind==="pen")return '<polygon points="0,-10 -20,0 0,10 20,0" fill="none" stroke="'+p.pen+'" stroke-width="3"/>';
 if(kind==="sheep")return '<ellipse cx="0" cy="-8" rx="'+cfg.glyphScale.sheepRx+'" ry="'+cfg.glyphScale.sheepRy+'" fill="'+p.sheep+'"/><circle cx="'+(cfg.glyphScale.sheepRx-2)+'" cy="-9" r="'+cfg.glyphScale.sheepHeadR+'" fill="'+p.figure+'"/>';
 if(kind==="figure")return '<circle cx="0" cy="-'+(cfg.glyphScale.figureBodyTop+cfg.glyphScale.figureHeadR)+'" r="'+cfg.glyphScale.figureHeadR+'" fill="'+p.figure+'"/><line x1="0" y1="-'+cfg.glyphScale.figureBodyTop+'" x2="0" y2="-'+(cfg.glyphScale.figureBodyTop-cfg.glyphScale.figureBodyLen)+'" stroke="'+p.figure+'" stroke-width="3"/>';
 return '<circle cx="0" cy="-8" r="6" fill="'+p.generic+'"/>';
}
if(typeof document!=="undefined"){
(function(){
 var cfg=CONFIG, SVGNS="http://www.w3.org/2000/svg";
 function el(n,a){var nd=document.createElementNS(SVGNS,n);for(var k in a)nd.setAttribute(k,a[k]);return nd;}
 var scene=document.getElementById("scene"); scene.setAttribute("viewBox","0 0 "+cfg.stageW+" "+cfg.stageH);
 var bg=document.getElementById("bg"); bg.setAttribute("width",cfg.stageW); bg.setAttribute("height",cfg.stageH); bg.setAttribute("fill",cfg.bg);
 // tile diamond corners: grid points offset by half a tile
 function gp(gx,gy){return gridToScreen(cfg,gx,gy);}
 var pts=[gp(-0.5,-0.5),gp(cfg.tile.cols+0.5,-0.5),gp(cfg.tile.cols+0.5,cfg.tile.rows+0.5),gp(-0.5,cfg.tile.rows+0.5)];
 var tileG=document.getElementById("tileG");
 var poly=el("polygon",{points:pts.map(function(q){return q.x+","+q.y;}).join(" "),fill:cfg.palette.grass,stroke:cfg.palette.grassEdge,"stroke-width":3});
 tileG.appendChild(poly);
 // grid lines: column lines bounded by cols with endpoints from rows; row lines bounded by rows with endpoints from cols
 for(var ci=0;ci<=cfg.tile.cols;ci++){var a1=gp(ci,-0.5),a2=gp(ci,cfg.tile.rows+0.5);tileG.appendChild(el("line",{x1:a1.x,y1:a1.y,x2:a2.x,y2:a2.y,stroke:cfg.palette.grassDark,"stroke-width":0.7,opacity:0.5}));}
 for(var ri=0;ri<=cfg.tile.rows;ri++){var b1=gp(-0.5,ri),b2=gp(cfg.tile.cols+0.5,ri);tileG.appendChild(el("line",{x1:b1.x,y1:b1.y,x2:b2.x,y2:b2.y,stroke:cfg.palette.grassEdge,"stroke-width":0.7,opacity:0.5}));}
 var elsG=document.getElementById("els");
 var sorted=cfg.elements.slice().sort(function(a,b){return (a.gx+a.gy)-(b.gx+b.gy);});
 var built=[];
 sorted.forEach(function(e0){var g=el("g",{});g.innerHTML=glyphPath(e0.kind,cfg);elsG.appendChild(g);built.push({g:g,e:e0});});
 var rocketG=document.getElementById("rocketG");
 var rg=el("g",{});rocketG.appendChild(rg);
 function drawRocket(st){
   rg.innerHTML='';
   if(!st.visible)return;
   var r=cfg.rocket;
   var flameBase=st.y+r.h/2, flameTip=flameBase+r.h*r.flameLenRatio*(0.68+0.32*st.riseP);
   var flame=el("polygon",{points:(st.x-r.w*r.flameWRatio)+","+flameBase+" "+(st.x+r.w*r.flameWRatio)+","+flameBase+" "+st.x+","+flameTip,fill:r.flame});
   var body=el("rect",{x:st.x-r.w/2,y:st.y-r.h/2,width:r.w,height:r.h,rx:7,fill:r.body,stroke:cfg.palette.rocketStroke});
   var tip=el("polygon",{points:(st.x-r.w/2)+","+(st.y-r.h/2)+" "+(st.x+r.w/2)+","+(st.y-r.h/2)+" "+st.x+","+(st.y-r.h/2-r.h*r.tipHRatio),fill:cfg.palette.rocketTip});
   if(st.flame)rg.appendChild(flame); rg.appendChild(body); rg.appendChild(tip);
 }
 function drawClouds(off){
   [["cloudsBack","back"],["cloudsFront","front"]].forEach(function(pair){
     var g=document.getElementById(pair[0]); while(g.firstChild)g.removeChild(g.firstChild);
     cfg.clouds.forEach(function(c){if(c.layer!==pair[1])return;var gr=el("g",{opacity:cfg.cloudOpacity});gr.appendChild(el("ellipse",{cx:c.x,cy:c.y+off,rx:c.r,ry:c.r*cfg.cloudRyRatio,fill:cfg.palette.cloud}));g.appendChild(gr);});
   });
 }
 var offset=0,start=performance.now();
 function frame(now){var elMs=offset+(now-start);var cyc=((elMs%cfg.cycleMs)+cfg.cycleMs)%cfg.cycleMs;var st=stateAt(cfg,cyc);
   built.forEach(function(b){var s=st.elements[cfg.elements.indexOf(b.e)]; if(!s.visible){b.g.setAttribute("display","none");}else{b.g.removeAttribute("display");b.g.setAttribute("transform","translate("+s.x+" "+s.y+") scale("+Math.max(0.01,s.scale)+")");}});
   drawRocket(st.rocket); drawClouds(st.cloudOffsetY);
   requestAnimationFrame(frame);}
 requestAnimationFrame(frame);
 window.__seek=function(ms){offset=ms;start=performance.now();};
 window.__config=CONFIG; window.__state=function(ms){return stateAt(CONFIG,ms);};
})();
}
if(typeof module!=="undefined"){module.exports={CONFIG:CONFIG,stateAt:stateAt,elementState:elementState,rocketState:rocketState,gridToScreen:gridToScreen,glyphPath:glyphPath};}
</script></body></html>
