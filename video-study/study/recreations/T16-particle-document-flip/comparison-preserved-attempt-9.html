<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T16 — Particle Document Flip · Comparison</title>
<style>
  html,body{margin:0;padding:0;background:#0b0e13;color:#eef2f7;font-family:Arial,Helvetica,sans-serif}
  header{padding:14px 16px 6px}
  h1{font-size:19px;margin:0 0 4px}
  p.sub{margin:0;color:#9fb0c3;font-size:13px}
  .row{display:flex;gap:14px;padding:12px 16px;align-items:flex-start}
  .side{flex:1 1 0;min-width:0}
  .lab{font-size:12px;letter-spacing:.08em;font-weight:700;margin:0 0 6px;color:#cfe0f2}
  .frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:1px solid #26313f}
  .frame video,.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  .controls{position:sticky;bottom:0;background:#0b0e13;padding:12px 16px 18px;border-top:1px solid #26313f;display:flex;gap:10px}
  button{flex:1;padding:14px 10px;font-size:16px;font-weight:700;border:0;border-radius:8px;background:#2b6cb0;color:#fff;cursor:pointer}
  button.secondary{background:#33475e}
  @media (max-width:640px){ .row{flex-direction:column} .side{width:100%} }
</style>
</head>
<body>
<header>
  <h1>T16 — Particle document flip</h1>
  <p class="sub">One synchronized control set drives both sides. The recreation is parameterized HTML/canvas — no specimen media inside it.</p>
</header>
<div class="row">
  <div class="side">
    <p class="lab">ORIGINAL — “Look What I Can Do” @ 1:35–1:40</p>
    <div class="frame"><video id="orig" src="segment.mp4" muted loop playsinline preload="auto"></video></div>
  </div>
  <div class="side">
    <p class="lab">RECREATION — T16 Particle document flip, parameterized</p>
    <div class="frame"><iframe id="rec" src="recreation.html" title="T16 recreation"></iframe></div>
  </div>
</div>
<div class="controls">
  <button id="playBtn">Play</button>
  <button id="pauseBtn" class="secondary">Pause</button>
  <button id="restartBtn" class="secondary">Restart</button>
</div>
<script>
"use strict";
const orig = document.getElementById("orig"), rec = document.getElementById("rec");
function post(cmd){ try { rec.contentWindow.postMessage({cmd:cmd}, "*"); } catch(e){} }
document.getElementById("playBtn").addEventListener("click", () => { orig.play(); post("play"); });
document.getElementById("pauseBtn").addEventListener("click", () => { orig.pause(); post("pause"); });
document.getElementById("restartBtn").addEventListener("click", () => { orig.currentTime = 0; orig.play(); post("restart"); });
</script>
</body>
</html>
