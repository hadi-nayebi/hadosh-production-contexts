<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T16 — Particle Document Flip (recreation)</title>
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden}
  #wrap{position:relative;width:100%;height:100%}
  canvas{display:block;width:100%;height:100%}
  .dom{position:absolute;font-family:Arial,Helvetica,sans-serif;color:#fff;pointer-events:none}
  #counter{right:12%;top:34%;text-align:left;opacity:0}
  #counter .lab{font-size:15px;letter-spacing:.14em;color:#a9c6de;font-family:"Courier New",monospace}
  #counter .num{font-size:64px;font-weight:900;line-height:1.05}
  #tlabel{left:13%;top:37%;font-family:"Courier New",monospace;font-size:22px;color:#a9c6de;opacity:0}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="stage"></canvas>
  <div class="dom" id="counter"><div class="lab"></div><div class="num"></div></div>
  <div class="dom" id="tlabel"></div>
</div>
<script>
"use strict";
/* ================================================================
   T16 — PARTICLE DOCUMENT FLIP
   A stack of pages rendered in particles flips through its page
   counter, the page disperses into the stream, and a title line
   condenses out of the stream with a ring above it. The cycle then
   holds, disperses the title and ring during a dedicated seam
   interval, and begins again with no borrowed particles carried
   across the seam.

   PARAMETERIZED, NOT TRACED: every content / timing / palette value
   is read from CONFIG below. Page, title and ring targets are
   obtained by RUNTIME SAMPLING of config-rendered content on
   offscreen canvases. No content value appears in markup or logic
   outside CONFIG: the counter and label elements start empty and
   are filled from CONFIG at initialization, and the checkpoint
   schedule is derived from the resolved page count and flip
   duration unless an explicitly supplied, strictly validated
   checkpoint list replaces it.

   Motion model — ONE constant flow field, integrated:
   - Every particle carries a stream velocity (vx, vy) assigned at
     creation, and a stream OFFSET that accumulates that velocity
     every frame, in every state, without exception. The rendered
     position is anchor + offset. The anchor is the only thing the
     lifecycle moves, and it moves only through profiles whose
     derivative is zero at both ends, so the trajectory velocity
     (anchor velocity + stream velocity) is continuous across
     capture, settlement and release.
   - The SETTLED REFERENCE FRAME is the target frame: a settled
     borrowed particle's anchor equals its target plus a small
     continuous jitter whose amplitude fades in with the same
     zero-end-derivative profile that carries the travel, and fades
     out smoothly after release before the anchor freezes.
   - FORMING = BORROWING particles onto targets. A borrowed particle
     first streams for its stagger delay (anchor held at its free
     anchor, offset accumulating); its travel anchor origin is
     captured at the moment the delay elapses, from the rendered
     position it actually occupies then.
   - Page flips RETARGET rather than re-borrow: a particle whose
     target exists on the next page keeps that assignment (outline
     and header targets are identical on every page and form a
     persistent set); changed line targets are filled by
     nearest-target reassignment; only genuinely new targets borrow
     from the free pool, and only vanished targets release.
   - PAGE TURN: during a flip window the FRONT page's anchors
     (outline, header, lines) rotate around the page's left edge:
     their x coordinate compresses toward the pivot by a
     zero-end-derivative profile that reaches a named minimum
     factor at mid-window and returns. The backing stack's anchors
     do not take part: front and backing move separately, the turn
     changes no assignment, and the stack stays distinguishable
     throughout (its settled intensity differs from the travelling
     intensity, and its anchors never move with the turn).
   - DISSOLVING = RELEASING: the borrowed flag clears, the jitter
     amplitude fades out, the anchor freezes, and the particle
     rejoins the stream from its current position. Release adds NO
     field component: dispersal rides the constant stream field
     alone. The priced model is therefore exact: after release the
     silhouette translates at the stream velocity and spreads only
     through the per-particle drift variation, at a rate bounded by
     the drift ranges in CONFIG. There is no separate dispersal
     guarantee, because the constant field does not provide one.
   - Intensity rides state, with named distinct values: travelling
     (stagger pending, travelling, or turning) renders at the
     travelling intensity; a settled backing-stack particle renders
     at the settled stack intensity, which is a different value;
     settled page/title particles render at foreground intensity
     and the ring at its own intensity. Unborrowed particles render
     at surplus or reserve intensity; a CONFIG reserve fraction is
     never borrowed.
   - Phases run sequentially — flip, release, form, hold, seam —
     one lifecycle owns the stage at a time. The seam interval sits
     at the end of the cycle: the title and ring release there, and
     no page target is borrowed until the seam has completed.
   - Text fitting prices BOTH dimensions: header and title are
     fitted against a width box AND a height box. If the text still
     exceeds a box at the named minimum font size, the named
     no-fit policy applies: CONDENSE-AT-FLOOR — the text is drawn
     with a horizontal (and, if needed, vertical) condensation
     transform that brings its rendered bounds inside the box.
     Overflow is never silent.
   - Configuration validation runs before any sampling: checkpoint
     lists must carry finite number types, integer pages within
     range, and strictly increasing pages and times, or the derived
     schedule is used with a recorded warning; numeric, array and
     colour values are type- and range-checked with recorded
     warnings; the schedule budget (travel + maximum stagger +
     reserved settled hold against the minimum page interval) is
     enforced by reducing flip travel in steps until it holds.
   URL overrides (swap test): ?title=DATA+WIZARD&pageCount=9
     &flipMs=1800&colorA=%23ffd75e&titleLabel=role:
   ================================================================ */
const CONFIG = {
  pageCount: 14,                 // total pages in the stack
  pageHeader: "RÉSUMÉ",          // header word rendered on each page
  pageLinePattern: [0.55,0.92,0.85,0.60,0.30,0.88,0.79,0.95,0.70,0.28,0.90,0.82,0.66], // text-line widths (fraction of inner page width)
  pageLinesTopRatio: 0.30,       // where text lines start on the page (fraction of page height)
  pageLineGapRatio: 0.052,       // vertical spacing of text lines
  pageXR: 0.17, pageYR: 0.13,    // page position (fraction of stage)
  pageWR: 0.33, pageHR: 0.74,    // page size (fraction of stage)
  pageHeaderTopRatio: 0.07,      // header offset from page top
  pageHeaderWidthRatio: 0.84,    // header fitted within this fraction of page width
  pageHeaderHeightRatio: 0.17,   // header fitted within this fraction of page height
  pageHeaderFontRatio: 0.21,     // header font size as a fraction of page width
  headerMinFontPx: 10,           // header fit floor
  headerShrink: 0.92,            // header fit shrink step
  pageInnerXRatio: 0.12,         // text lines start this far into the page
  pageInnerWRatio: 0.76,         // text-line field width (fraction of page width)
  pageLineThicknessRatio: 0.016, // text-line thickness (fraction of page height)
  lineMinThicknessPx: 2,         // text-line thickness floor
  pageLineJitter: 0.14,          // per-page seeded variation of line widths
  lineMinFraction: 0.18,         // jittered line-width floor (fraction)
  pageStrokePx: 3,               // page outline stroke width
  stackCount: 2,                 // pages visible behind the front page
  stackOffsetPx: 11,             // per-page stack offset
  stackOffsetYFactor: 0.6,       // stack vertical offset as a fraction of the horizontal offset
  stackAlpha: 0.60,              // settled intensity of stack-outline particles
  titleLabel: "title:",          // small solid label beside the title
  titleText: "AI GURU",          // the condensing title words
  titleFontPx: 150,              // shrunk to fit the title box
  titleCyRatio: 0.56,            // title vertical centre (fraction of stage height)
  maxWidthRatio: 0.86,           // title box width (fraction of stage width)
  titleMaxHeightRatio: 0.30,     // title box height (fraction of stage height)
  titleMinFontPx: 14,            // title fit floor
  titleShrink: 0.94,             // title fit shrink step
  haloRxR: 0.17, haloRyR: 0.055, // ring ellipse radii (fractions of stage w/h)
  haloCyR: 0.30,                 // ring centre height (fraction of stage h)
  haloStrokePx: 7,               // ring stroke width
  haloColor: "#ffd98a",          // ring particle colour (warm gold)
  haloAlpha: 0.95,
  fontFamily: "Arial, Helvetica, sans-serif",
  fontWeight: 900,
  sampleGap: 4,                  // px between sampled targets for filled content (lower = denser)
  outlineGap: 3,                 // px between sampled targets for outline / stack strokes (denser, so edge points do not drop at any alignment)
  sampleAlphaThreshold: 110,     // alpha above which a sampled pixel becomes a target
  particleRadius: 1.6,
  colorA: "#f6f9fd",             // particle colour range A (bright) ...
  colorB: "#93a7bd",             // ... to B (dim silver-blue)
  background: "#000000",
  counterColor: "#ffffff",
  counterLabelText: "page",
  counterLabelColor: "#a9c6de",
  counterRightRatio: 0.12, counterTopRatio: 0.34,
  counterLabelPx: 15, counterNumPx: 64,
  labelColor: "#a9c6de",
  labelLeftRatio: 0.13, labelTopRatio: 0.37, labelPx: 22,
  labelFadeMs: 400,              // title label fade-in window during form
  /* Checkpoint schedule: derived from the resolved pageCount and
     flipMs through these anchor fractions unless an explicitly
     supplied checkpoint list passes strict validation.
     Middle anchor: page fraction 5/13 of the way through the page
     range, at time fraction 1500/2600 of the flip phase; final
     anchor: the last page at time fraction 2200/2600. */
  flipCheckpoints: null,         // null = derive from the anchors below
  checkpointMidPageFraction: 5/13,
  checkpointMidTimeFraction: 1500/2600,
  checkpointEndTimeFraction: 2200/2600,
  flipMs: 2600,                  // flipping phase total (last page holds briefly)
  releaseMs: 500,                // page disperses back into the stream
  formMs: 1500,                  // title (+ ring) condenses out of the stream
  haloDelayMs: 350,              // ring starts forming this long after the title
  holdMs: 1100,                  // title + ring hold
  seamReleaseMs: 300,            // dedicated interval at cycle end: title + ring release before any page borrowing
  travelFlipMs: 28,              // particle travel time when a page flips
  staggerFlipFraction: 0.30,     // max stagger delay as a fraction of flip travel
  travelFormMs: 950,             // particle travel time when the title forms
  staggerFormFraction: 0.45,     // max stagger delay as a fraction of form travel
  haloTravelMultiplier: 0.8,     // ring travel time relative to title travel
  minSettledHoldMs: 20,          // settled dwell reserved inside every page interval
  turnCosMin: 0.15,              // minimum horizontal factor of the front page at mid-turn (pivot: page left edge)
  easingExponent: 3,             // exponent of the zero-end-derivative travel profile
  windX: 26, windY: -9,          // constant stream velocity (px/s)
  driftX: 7, driftY: 5,          // per-particle velocity variation range (px/s)
  jitter: 0.35,                  // px of life while borrowed on target
  jitterPeriodXMs: 280, jitterPeriodYMs: 340,
  jitterReleaseDecayMs: 400,     // jitter amplitude fade-out window after release
  reserveFraction: 0.22,         // pool share never borrowed
  foregroundAlpha: 1.0,          // settled borrowed intensity (page / title)
  travelAlpha: 0.38,             // borrowed intensity while staggering / travelling / turning
  reserveAlpha: 0.28,            // reserve intensity
  surplusAlpha: 0.16,
  wrapMarginPx: 6,               // rendered-position wrap margin around the stage
  minStageW: 320, minStageH: 240,
  seed: 20261
};
/* ---------- validation warnings (recorded, exposed for checks) ---------- */
const WARNINGS = [];
function warn(msg){ WARNINGS.push(msg); }
/* ---------- URL overrides (the swap-test mechanism) ----------
   Numeric overrides are parsed STRICTLY: a value that is not
   entirely a number is ignored with a recorded warning. */
(function applyUrlOverrides(){
  const q = new URLSearchParams(location.search);
  if (q.has("title")) CONFIG.titleText = q.get("title");
  if (q.has("titleLabel")) CONFIG.titleLabel = q.get("titleLabel");
  if (q.has("pageHeader")) CONFIG.pageHeader = q.get("pageHeader");
  const num = ["pageCount","flipMs","releaseMs","formMs","holdMs","seamReleaseMs","sampleGap","outlineGap","reserveFraction"];
  for (const k of num) if (q.has(k)) {
    const raw = q.get(k);
    if (/^[+-]?(\d+\.?\d*|\.\d+)$/.test(raw.trim())) CONFIG[k] = parseFloat(raw);
    else warn("url override " + k + " rejected: not a strict number");
  }
  const str = ["colorA","colorB","haloColor","background"];
  for (const k of str) if (q.has(k)) CONFIG[k] = q.get(k);
  if (q.has("flipCheckpoints")) { try { const c = JSON.parse(q.get("flipCheckpoints")); if (Array.isArray(c)) CONFIG.flipCheckpoints = c; else warn("url flipCheckpoints rejected: not an array"); } catch(e){ warn("url flipCheckpoints rejected: unparseable"); } }
})();
/* ---------- configuration validation (runs before any sampling) ---------- */
function isNum(v){ return typeof v === "number" && isFinite(v); }
function validColor(v){ return typeof v === "string" && /^#[0-9a-fA-F]{6}$/.test(v); }
function validateConfig(){
  if (!isNum(CONFIG.pageCount) || CONFIG.pageCount < 1) { CONFIG.pageCount = 14; warn("pageCount reset to default"); }
  CONFIG.pageCount = Math.round(CONFIG.pageCount);
  for (const k of ["sampleGap","outlineGap"]) {
    if (!isNum(CONFIG[k]) || CONFIG[k] < 1) { CONFIG[k] = (k === "sampleGap" ? 4 : 3); warn(k + " reset to default (invalid sampling gap)"); }
    CONFIG[k] = Math.min(12, Math.max(2, CONFIG[k]));
  }
  if (!isNum(CONFIG.reserveFraction)) { CONFIG.reserveFraction = 0.22; warn("reserveFraction reset to default"); }
  CONFIG.reserveFraction = Math.min(0.6, Math.max(0.05, CONFIG.reserveFraction));
  for (const k of ["flipMs","releaseMs","formMs","holdMs","seamReleaseMs"]) {
    if (!isNum(CONFIG[k])) { CONFIG[k] = 500; warn(k + " reset (not a number)"); }
    CONFIG[k] = Math.max(50, CONFIG[k]);
  }
  for (const k of ["travelFlipMs","travelFormMs"]) {
    if (!isNum(CONFIG[k]) || CONFIG[k] < 5) { CONFIG[k] = (k === "travelFlipMs" ? 28 : 950); warn(k + " reset to default"); }
  }
  for (const k of ["staggerFlipFraction","staggerFormFraction"]) {
    if (!isNum(CONFIG[k]) || CONFIG[k] < 0 || CONFIG[k] > 1) { CONFIG[k] = 0.3; warn(k + " reset to default"); }
  }
  for (const k of ["haloRxR","haloRyR"]) {
    if (!isNum(CONFIG[k]) || CONFIG[k] <= 0) { CONFIG[k] = (k === "haloRxR" ? 0.17 : 0.055); warn(k + " reset to default (non-positive radius)"); }
  }
  if (!Array.isArray(CONFIG.pageLinePattern) || !CONFIG.pageLinePattern.length ||
      !CONFIG.pageLinePattern.every(v => isNum(v) && v > 0 && v <= 1)) {
    CONFIG.pageLinePattern = [0.55,0.92,0.85,0.60,0.30,0.88,0.79,0.95,0.70,0.28,0.90,0.82,0.66];
    warn("pageLinePattern reset to default (malformed entries)");
  }
  for (const k of ["colorA","colorB","haloColor","background","counterColor","counterLabelColor","labelColor"]) {
    if (!validColor(CONFIG[k])) { warn("colour " + k + " invalid, kept value may not render as intended: " + CONFIG[k]); if (!validColor(CONFIG[k])) CONFIG[k] = "#ffffff"; }
  }
  for (const k of ["jitterPeriodXMs","jitterPeriodYMs","jitterReleaseDecayMs"]) {
    if (!isNum(CONFIG[k]) || CONFIG[k] <= 0) { CONFIG[k] = 300; warn(k + " reset to default"); }
  }
  for (const k of ["foregroundAlpha","travelAlpha","stackAlpha","haloAlpha","reserveAlpha","surplusAlpha"]) {
    if (!isNum(CONFIG[k])) { CONFIG[k] = 0.5; warn(k + " reset (not a number)"); }
    CONFIG[k] = Math.min(1, Math.max(0, CONFIG[k]));
  }
  if (!isNum(CONFIG.easingExponent) || CONFIG.easingExponent <= 1) { CONFIG.easingExponent = 3; warn("easingExponent reset to default"); }
  if (!isNum(CONFIG.turnCosMin) || CONFIG.turnCosMin < 0 || CONFIG.turnCosMin >= 1) { CONFIG.turnCosMin = 0.15; warn("turnCosMin reset to default"); }
}
/* ---------- checkpoint model ----------
   Derivation: three anchors — first page at 0, a middle page at
   the configured page/time fractions, the last page at the
   configured end-time fraction — so any resolved pageCount /
   flipMs pair produces a coherent schedule whose last page is
   reached before the flip phase ends. An explicitly supplied list
   is used only if EVERY entry is strictly valid: object with
   number-typed finite fields, integer page within range, pages
   and times strictly increasing, first entry at time 0, last time
   before the flip phase ends. Any violation derives the schedule
   instead, with a recorded warning. */
function deriveCheckpoints(){
  const pc = CONFIG.pageCount, fm = CONFIG.flipMs;
  const midPage = Math.min(pc, Math.max(2, 1 + Math.round((pc - 1) * CONFIG.checkpointMidPageFraction)));
  const cps = [ {page:1, atMs:0},
                {page:midPage, atMs: Math.round(fm * CONFIG.checkpointMidTimeFraction)},
                {page:pc, atMs: Math.round(fm * CONFIG.checkpointEndTimeFraction)} ];
  return cps.filter((c, i) => i === 0 || (c.page > cps[i-1].page && c.atMs > cps[i-1].atMs));
}
function strictCheckpoints(cps){
  if (!Array.isArray(cps) || cps.length < 1) return null;
  for (const c of cps) {
    if (!c || typeof c !== "object") return null;
    if (!isNum(c.page) || !isNum(c.atMs)) return null;
    if (!Number.isInteger(c.page) || c.page < 1 || c.page > CONFIG.pageCount) return null;
    if (c.atMs < 0) return null;
  }
  if (cps[0].atMs !== 0) return null;
  for (let i = 1; i < cps.length; i++) {
    if (!(cps[i].atMs > cps[i-1].atMs) || !(cps[i].page > cps[i-1].page)) return null;
  }
  if (cps[cps.length-1].atMs >= CONFIG.flipMs) return null;
  return cps;
}
let RESOLVED_CHECKPOINTS = null;
function resolveCheckpoints(){
  if (CONFIG.flipCheckpoints === null || CONFIG.flipCheckpoints === undefined) {
    RESOLVED_CHECKPOINTS = deriveCheckpoints();
  } else {
    const ok = strictCheckpoints(CONFIG.flipCheckpoints);
    if (ok) RESOLVED_CHECKPOINTS = ok;
    else { RESOLVED_CHECKPOINTS = deriveCheckpoints(); warn("supplied checkpoint list failed strict validation; derived schedule used"); }
  }
  return RESOLVED_CHECKPOINTS;
}
function pageAtTime(t){
  const cps = RESOLVED_CHECKPOINTS || resolveCheckpoints();
  if (t <= cps[0].atMs) return Math.min(CONFIG.pageCount, Math.max(1, cps[0].page));
  for (let i = 1; i < cps.length; i++){
    if (t <= cps[i].atMs){
      const a = cps[i-1], b = cps[i];
      const f = (t - a.atMs) / Math.max(1, b.atMs - a.atMs);
      return Math.min(CONFIG.pageCount, Math.max(1, Math.floor(a.page + (b.page - a.page)*f)));
    }
  }
  return CONFIG.pageCount;
}
/* Schedule derivation: page-change instants, per-page intervals,
   the minimum interval, and the settled dwell of each page (its
   interval minus flip travel and maximum stagger). */
function computeSchedule(cfg){
  const saveCps = CONFIG.flipCheckpoints, savePc = CONFIG.pageCount, saveFm = CONFIG.flipMs, saveRes = RESOLVED_CHECKPOINTS;
  if (cfg) { if (cfg.flipCheckpoints !== undefined) CONFIG.flipCheckpoints = cfg.flipCheckpoints; if (cfg.pageCount) CONFIG.pageCount = cfg.pageCount; if (cfg.flipMs) CONFIG.flipMs = cfg.flipMs; }
  RESOLVED_CHECKPOINTS = null; resolveCheckpoints();
  const changes = [{page: pageAtTime(0), atMs: 0}];
  let prev = changes[0].page;
  const fm = cfg && cfg.flipMs ? cfg.flipMs : CONFIG.flipMs;
  for (let t = 0.5; t <= fm; t += 0.5){
    const pg = pageAtTime(t);
    if (pg !== prev){ changes.push({page: pg, atMs: t}); prev = pg; }
  }
  const c = cfg || CONFIG;
  const maxStagger = c.travelFlipMs * c.staggerFlipFraction;
  const dwellTable = changes.map((ch, i) => {
    const end = (i + 1 < changes.length) ? changes[i+1].atMs : fm;
    const intervalMs = end - ch.atMs;
    return { page: ch.page, atMs: ch.atMs, intervalMs: intervalMs,
             dwellMs: Math.max(0, intervalMs - c.travelFlipMs - maxStagger) };
  });
  let minInterval = Infinity;
  for (const d of dwellTable) if (d.intervalMs > 0 && d.intervalMs < minInterval) minInterval = d.intervalMs;
  const out = { changes: changes, dwellTable: dwellTable, minIntervalMs: minInterval,
           maxStaggerMs: maxStagger,
           budgetMs: c.travelFlipMs + maxStagger + c.minSettledHoldMs,
           budgetOk: c.travelFlipMs + maxStagger + c.minSettledHoldMs <= minInterval,
           checkpoints: (RESOLVED_CHECKPOINTS || []).map(x => ({page:x.page, atMs:x.atMs})) };
  CONFIG.flipCheckpoints = saveCps; CONFIG.pageCount = savePc; CONFIG.flipMs = saveFm; RESOLVED_CHECKPOINTS = saveRes;
  return out;
}
/* Budget enforcement: travel is reduced in steps until the budget
   holds against the resolved schedule's minimum interval. */
function enforceBudget(){
  let sched = computeSchedule();
  let guard = 0;
  while (!sched.budgetOk && CONFIG.travelFlipMs > 5 && guard < 40) {
    CONFIG.travelFlipMs = Math.max(5, CONFIG.travelFlipMs * 0.8);
    warn("travelFlipMs reduced to " + CONFIG.travelFlipMs + " to satisfy the schedule budget");
    sched = computeSchedule(); guard++;
  }
  return sched;
}

/* ---------- deterministic RNG (restart determinism) ---------- */
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }

/* ---------- offscreen sampling (config-rendered content) ---------- */
function makeCanvas(w,h){ const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
function sampleDrawn(ctx, w, h, gap){
  const img = ctx.getImageData(0,0,w,h).data, out = [];
  for (let y = 0; y < h; y += gap) for (let x = 0; x < w; x += gap)
    if (img[(y*w + x)*4 + 3] > CONFIG.sampleAlphaThreshold) out.push({x:x, y:y});
  return out;
}
function sampleDrawnRegion(ctx, rx, ry, rw, rh, W, H, gap){
  const x0 = Math.max(0, Math.floor(rx)-4), y0 = Math.max(0, Math.floor(ry)-4);
  const x1 = Math.min(W, Math.ceil(rx+rw)+4), y1 = Math.min(H, Math.ceil(ry+rh)+4);
  const img = ctx.getImageData(x0,y0,x1-x0,y1-y0).data, out = [];
  for (let y = y0; y < y1; y += gap) for (let x = x0; x < x1; x += gap)
    if (img[((y-y0)*(x1-x0) + (x-x0))*4 + 3] > CONFIG.sampleAlphaThreshold) out.push({x:x, y:y});
  return out;
}
/* Text fitting against a width box AND a height box. Returns the
   fitted font size plus the condensation factors the no-fit policy
   (CONDENSE-AT-FLOOR) applies when the floor size still exceeds a
   box: sx brings the rendered width inside the box, sy the height. */
function fitText(ctx, text, startFs, minFs, shrink, boxW, boxH){
  let fs = startFs;
  const setF = () => { ctx.font = CONFIG.fontWeight + " " + fs + "px " + CONFIG.fontFamily; };
  const measure = () => { const m = ctx.measureText(text);
    const hgt = ((m.actualBoundingBoxAscent || fs*0.8) + (m.actualBoundingBoxDescent || fs*0.2));
    return { w: m.width, h: hgt }; };
  setF();
  let d = measure();
  while ((d.w > boxW || d.h > boxH) && fs > minFs){ fs = Math.max(minFs, fs * shrink); setF(); d = measure(); }
  const sx = d.w > boxW ? boxW / d.w : 1;
  const sy = d.h > boxH ? boxH / d.h : 1;
  return { fs: fs, sx: sx, sy: sy, w: d.w, h: d.h, condensed: (sx < 1 || sy < 1) };
}
function drawFittedText(ctx, text, cx, cy, fit, baseline){
  ctx.save();
  ctx.translate(cx, cy);
  if (fit.sx !== 1 || fit.sy !== 1) ctx.transform(fit.sx, 0, 0, fit.sy, 0, 0);
  ctx.textAlign = "center"; ctx.textBaseline = baseline;
  ctx.fillText(text, 0, 0);
  ctx.restore();
}
/* Page targets are sampled element by element so every target
   carries a stable identity key: outline, stack and header targets
   are identical on every page (the persistent set); line targets
   are keyed by line index and column, so a line point that survives
   a page change keeps its key while a point past a shortened line
   end vanishes. Outline and stack strokes are sampled at the
   denser outline gap. */
function samplePageTargets(W, H, page){
  const pw = CONFIG.pageWR*W, ph = CONFIG.pageHR*H, px = CONFIG.pageXR*W, py = CONFIG.pageYR*H;
  const off = makeCanvas(W,H), ctx = off.getContext("2d");
  ctx.clearRect(0,0,W,H); ctx.strokeStyle = "#fff"; ctx.fillStyle = "#fff"; ctx.lineWidth = CONFIG.pageStrokePx;
  const targets = [];
  for (let s = CONFIG.stackCount; s >= 1; s--){
    const ox = px + s*CONFIG.stackOffsetPx, oy = py - s*CONFIG.stackOffsetPx*CONFIG.stackOffsetYFactor;
    ctx.strokeRect(ox, oy, pw, ph);
    const pts = sampleDrawnRegion(ctx, ox, oy, pw, ph, W, H, CONFIG.outlineGap);
    for (const p of pts) targets.push({x:p.x, y:p.y, kind:"stack", key:"stack:" + p.x + ":" + p.y, persistent:true});
    ctx.clearRect(0,0,W,H);
  }
  ctx.strokeRect(px, py, pw, ph);
  const outline = sampleDrawn(ctx, W, H, CONFIG.outlineGap);
  for (const p of outline) targets.push({x:p.x, y:p.y, kind:"page", key:"outline:" + p.x + ":" + p.y, persistent:true});
  ctx.clearRect(0,0,W,H);
  const hFit = fitText(ctx, CONFIG.pageHeader, pw*CONFIG.pageHeaderFontRatio, CONFIG.headerMinFontPx, CONFIG.headerShrink, pw*CONFIG.pageHeaderWidthRatio, ph*CONFIG.pageHeaderHeightRatio);
  drawFittedText(ctx, CONFIG.pageHeader, px + pw/2, py + ph*CONFIG.pageHeaderTopRatio, hFit, "top");
  const header = sampleDrawn(ctx, W, H, CONFIG.sampleGap);
  for (const p of header) targets.push({x:p.x, y:p.y, kind:"page", key:"header:" + p.x + ":" + p.y, persistent:true});
  ctx.clearRect(0,0,W,H);
  const rngL = mulberry32(CONFIG.seed + page*7919);
  const innerX = px + pw*CONFIG.pageInnerXRatio, innerW = pw*CONFIG.pageInnerWRatio;
  let ly = py + ph*CONFIG.pageLinesTopRatio;
  CONFIG.pageLinePattern.forEach((frac, li) => {
    const jittered = Math.max(CONFIG.lineMinFraction, Math.min(1, frac + (rngL()-0.5)*CONFIG.pageLineJitter));
    ctx.clearRect(0,0,W,H);
    ctx.fillRect(innerX, ly, innerW*jittered, Math.max(CONFIG.lineMinThicknessPx, ph*CONFIG.pageLineThicknessRatio));
    const pts = sampleDrawn(ctx, W, H, CONFIG.sampleGap);
    for (const p of pts) targets.push({x:p.x, y:p.y, kind:"line", key:"line:" + li + ":" + p.x, persistent:false});
    ly += ph*CONFIG.pageLineGapRatio;
  });
  return targets;
}
/* Title targets: the big words, fitted in width AND height against
   the title box, sampled the same way. The fitted result is exposed
   so checks can assert the rendered bounds. */
let lastTitleFit = null;
function sampleTitleTargets(W, H){
  const off = makeCanvas(W,H), ctx = off.getContext("2d");
  ctx.clearRect(0,0,W,H); ctx.fillStyle = "#fff";
  const fit = fitText(ctx, CONFIG.titleText, CONFIG.titleFontPx, CONFIG.titleMinFontPx, CONFIG.titleShrink, W*CONFIG.maxWidthRatio, H*CONFIG.titleMaxHeightRatio);
  drawFittedText(ctx, CONFIG.titleText, W/2, H*CONFIG.titleCyRatio, fit, "middle");
  lastTitleFit = { fs: fit.fs, sx: fit.sx, sy: fit.sy, w: fit.w * fit.sx, h: fit.h * fit.sy,
                   boxW: W*CONFIG.maxWidthRatio, boxH: H*CONFIG.titleMaxHeightRatio, condensed: fit.condensed };
  return sampleDrawn(ctx, W, H, CONFIG.sampleGap).map(p => ({x:p.x, y:p.y, kind:"title", key:"title:" + p.x + ":" + p.y, persistent:false}));
}
/* Ring targets: an ellipse rendered on its own offscreen canvas. */
function sampleHaloTargets(W, H){
  const off = makeCanvas(W,H), ctx = off.getContext("2d");
  ctx.clearRect(0,0,W,H); ctx.strokeStyle = "#fff"; ctx.lineWidth = CONFIG.haloStrokePx;
  ctx.beginPath(); ctx.ellipse(W/2, H*CONFIG.haloCyR, W*CONFIG.haloRxR, H*CONFIG.haloRyR, 0, 0, Math.PI*2); ctx.stroke();
  return sampleDrawn(ctx, W, H, CONFIG.sampleGap).map(p => ({x:p.x, y:p.y, kind:"halo", key:"halo:" + p.x + ":" + p.y, persistent:false}));
}

/* ---------- particle pool: ONE constant flow field, integrated ----------
   Particle state: anchor (ax, ay) + stream offset (ox, oy).
   Rendered position = anchor + offset, wrapped at the stage edge
   (wrapping adjusts the anchor so the rendered position stays
   continuous apart from the wrap jump itself). */
const stage = document.getElementById("stage"), sctx = stage.getContext("2d");
let W = 0, H = 0, particles = [], rng = mulberry32(CONFIG.seed);
function hexRgb(h){ const n = parseInt(h.slice(1), 16); return [n>>16 & 255, n>>8 & 255, n & 255]; }
let cA = [246,249,253], cB = [147,167,189], cHalo = [255,217,138];
function refreshColors(){ cA = hexRgb(CONFIG.colorA); cB = hexRgb(CONFIG.colorB); cHalo = hexRgb(CONFIG.haloColor); }
function newParticle(borrowable){
  const mix = rng();
  const ax = rng()*W, ay = rng()*H;
  return { ax: ax, ay: ay, ox: 0, oy: 0, x: ax, y: ay,
    ax0: ax, ay0: ay, tx: 0, ty: 0, kind:"", key:"", persistent:false,
    borrowed:false, borrowable:borrowable,
    vx: CONFIG.windX + (rng()-0.5)*CONFIG.driftX, vy: CONFIG.windY + (rng()-0.5)*CONFIG.driftY,
    delay:0, travel:600, t0:0, captured:false, lastCapture:null,
    cueT0:-1e9, relT:-1e9, jitAmp: 0,
    col: [Math.round(cA[0]+(cB[0]-cA[0])*mix), Math.round(cA[1]+(cB[1]-cA[1])*mix), Math.round(cA[2]+(cB[2]-cA[2])*mix)],
    ph: rng()*Math.PI*2, renderAlpha: CONFIG.reserveAlpha };
}
/* The pool is sized once, at build: the largest simultaneous demand
   — the MAXIMUM over every page's target count, or title + ring
   together — grossed up by the reserve fraction. The pool never
   grows afterwards, and assignment completeness is asserted
   against this sizing. */
function buildPool(){
  particles = [];
  let pageNeed = 0;
  for (let pg = 1; pg <= CONFIG.pageCount; pg++) pageNeed = Math.max(pageNeed, samplePageTargets(W, H, pg).length);
  const formNeed = sampleTitleTargets(W, H).length + sampleHaloTargets(W, H).length;
  const needTotal = Math.ceil(Math.max(pageNeed, formNeed) / (1 - CONFIG.reserveFraction));
  for (let i = 0; i < needTotal; i++) particles.push(newParticle(true));
  const reserveNeed = Math.floor(particles.length * CONFIG.reserveFraction);
  for (let i = 0; i < reserveNeed; i++) particles[i].borrowable = false;
  diagnostics.pageNeed = pageNeed; diagnostics.formNeed = formNeed;
}
function startTravel(p, t, now, travelMs, maxDelayMs){
  p.tx = t.x; p.ty = t.y; p.kind = t.kind; p.key = t.key; p.persistent = !!t.persistent;
  p.borrowed = true; p.t0 = now; p.delay = rng()*maxDelayMs; p.travel = travelMs;
  p.captured = false; p.cueT0 = -1e9;
}
function releaseParticle(p, now){ p.borrowed = false; p.captured = false; p.cueT0 = -1e9; p.relT = now; }
function releaseAll(now){ for (const p of particles) if (p.borrowed) releaseParticle(p, now); }
function borrowFresh(targets, now, travelMs, staggerFraction){
  const free = particles.filter(p => p.borrowable && !p.borrowed);
  const n = Math.min(free.length, targets.length);
  for (let i = 0; i < n; i++) startTravel(free[i], targets[i], now, travelMs, travelMs*staggerFraction);
  return n;
}
/* Retarget the borrowed set onto a new page's targets.
   Returns the transition record, including any target that could
   not be assigned (unassigned must be zero under the pool sizing). */
const transitions = [];
function retargetPage(targets, now, page){
  const current = particles.filter(p => p.borrowed);
  const byKey = new Map();
  for (const p of current) if (!byKey.has(p.key)) byKey.set(p.key, p);
  const used = new Set(), unmatched = [];
  let persisted = 0, reassigned = 0, fresh = 0, released = 0, unassigned = 0;
  for (const t of targets){
    const p = byKey.get(t.key);
    if (p && !used.has(p)){
      used.add(p); persisted++;
      if (p.tx === t.x && p.ty === t.y){ p.cueT0 = now; }
      else startTravel(p, t, now, CONFIG.travelFlipMs, CONFIG.travelFlipMs*CONFIG.staggerFlipFraction);
    } else unmatched.push(t);
  }
  const spare = current.filter(p => !used.has(p));
  for (const t of unmatched){
    let best = null, bestD = Infinity;
    for (const p of spare){
      if (used.has(p) || p.persistent) continue;
      const d = (p.tx - t.x)*(p.tx - t.x) + (p.ty - t.y)*(p.ty - t.y);
      if (d < bestD){ bestD = d; best = p; }
    }
    if (best){ used.add(best); reassigned++; startTravel(best, t, now, CONFIG.travelFlipMs, CONFIG.travelFlipMs*CONFIG.staggerFlipFraction); }
    else {
      const freeP = particles.find(p => p.borrowable && !p.borrowed);
      if (freeP){ used.add(freeP); fresh++; startTravel(freeP, t, now, CONFIG.travelFlipMs, CONFIG.travelFlipMs*CONFIG.staggerFlipFraction); }
      else unassigned++;
    }
  }
  for (const p of current) if (!used.has(p)){ releaseParticle(p, now); released++; }
  const rec = { page: page, atMs: Math.round(now), targets: targets.length,
    persisted: persisted, reassigned: reassigned, fresh: fresh, released: released,
    unassigned: unassigned, churn: reassigned + released };
  transitions.push(rec);
  return rec;
}

/* ---------- scheduler: sequential phases, one lifecycle at a time ----------
   Cycle: flip [0, flipMs) · release · form · hold · seam. The seam is
   the final seamReleaseMs of the 6000 ms cycle, immediately after the
   hold window; the title and ring release at the seam's start and no
   page target is borrowed until the next cycle begins. */
const TOTAL = () => CONFIG.flipMs + CONFIG.releaseMs + CONFIG.formMs + CONFIG.holdMs + CONFIG.seamReleaseMs;
let simT = 0, phase = "", curPage = 0, trace = [], titleBorrowed = false, haloBorrowed = false;
let formTargets = null;
const diagnostics = { seamViolations: 0, seamChecks: 0, lastSpread: null, pageNeed: 0, formNeed: 0 };
const counterEl = document.getElementById("counter"), counterNum = counterEl.querySelector(".num"),
      counterLab = counterEl.querySelector(".lab"), labelEl = document.getElementById("tlabel");
function initDom(){
  counterEl.style.color = CONFIG.counterColor; counterEl.style.right = (CONFIG.counterRightRatio*100) + "%";
  counterEl.style.top = (CONFIG.counterTopRatio*100) + "%";
  counterLab.textContent = CONFIG.counterLabelText; counterLab.style.color = CONFIG.counterLabelColor;
  counterLab.style.fontSize = CONFIG.counterLabelPx + "px"; counterNum.style.fontSize = CONFIG.counterNumPx + "px";
  counterNum.textContent = "1/" + CONFIG.pageCount;
  labelEl.style.color = CONFIG.labelColor; labelEl.style.left = (CONFIG.labelLeftRatio*100) + "%";
  labelEl.style.top = (CONFIG.labelTopRatio*100) + "%"; labelEl.style.fontSize = CONFIG.labelPx + "px";
  labelEl.textContent = CONFIG.titleLabel;
}
function setPhase(name, t){ phase = name; trace.push({event:name, t:Math.round(t)}); }
function spreadOfBorrowed(){
  let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity, n=0;
  for (const p of particles) if (p.borrowed){ n++; if (p.x<x0)x0=p.x; if (p.x>x1)x1=p.x; if (p.y<y0)y0=p.y; if (p.y>y1)y1=p.y; }
  return n ? {w: x1-x0, h: y1-y0} : null;
}
function step(dtMs){
  simT += dtMs; const t = simT % TOTAL();
  const F = CONFIG.flipMs, R = F + CONFIG.releaseMs, Fo = R + CONFIG.formMs, Ho = Fo + CONFIG.holdMs;
  if (t < F){
    if (phase !== "flip"){
      setPhase("flip", simT);
      diagnostics.seamChecks++;
      if (particles.some(p => p.borrowed && (p.kind === "title" || p.kind === "halo"))) diagnostics.seamViolations++;
      titleBorrowed = false; haloBorrowed = false; formTargets = null; curPage = 0;
    }
    const pg = pageAtTime(t);
    if (pg !== curPage){
      const targets = samplePageTargets(W, H, pg);
      if (curPage === 0) borrowFresh(targets, simT, CONFIG.travelFlipMs, CONFIG.staggerFlipFraction);
      else retargetPage(targets, simT, pg);
      curPage = pg;
    }
    counterEl.style.opacity = 1; counterNum.textContent = curPage + "/" + CONFIG.pageCount; labelEl.style.opacity = 0;
  } else if (t < R){
    if (phase !== "release"){ setPhase("release", simT); diagnostics.lastSpread = spreadOfBorrowed(); releaseAll(simT); }
    counterEl.style.opacity = Math.max(0, 1 - (t-F)/CONFIG.releaseMs); labelEl.style.opacity = 0;
  } else if (t < Fo){
    if (phase !== "form"){
      setPhase("form", simT);
      formTargets = { title: sampleTitleTargets(W, H), halo: sampleHaloTargets(W, H) };
    }
    counterEl.style.opacity = 0; labelEl.style.opacity = Math.min(1, (t-R)/CONFIG.labelFadeMs);
    if (!titleBorrowed){ titleBorrowed = true; borrowFresh(formTargets.title, simT, CONFIG.travelFormMs, CONFIG.staggerFormFraction); }
    if (!haloBorrowed && t - R >= CONFIG.haloDelayMs){ haloBorrowed = true; borrowFresh(formTargets.halo, simT, CONFIG.travelFormMs*CONFIG.haloTravelMultiplier, CONFIG.staggerFormFraction); }
  } else if (t < Ho){
    if (phase !== "hold"){ setPhase("hold", simT); }
    if (!haloBorrowed && formTargets){ haloBorrowed = true; borrowFresh(formTargets.halo, simT, CONFIG.travelFormMs*CONFIG.haloTravelMultiplier, CONFIG.staggerFormFraction); }
    labelEl.style.opacity = 1;
  } else {
    if (phase !== "seam"){ setPhase("seam", simT); diagnostics.lastSpread = spreadOfBorrowed(); releaseAll(simT); titleBorrowed = false; haloBorrowed = false; }
    counterEl.style.opacity = 0; labelEl.style.opacity = Math.max(0, 1 - (t-Ho)/CONFIG.seamReleaseMs);
  }
  updateParticles(dtMs);
}
/* Dispersal measurement under the constant-field model: the spread
   of the most recently released silhouette relative to its spread
   at release, and its centroid displacement. The model prices the
   expected behaviour exactly: centroid displacement equals the
   stream velocity times elapsed time; spread growth is bounded by
   the drift ranges times elapsed time. */
function releaseSpreadRatio(){
  const s = diagnostics.lastSpread;
  if (!s) return null;
  let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity, n=0;
  for (const p of particles) if (!p.borrowed && p.relT > 0 && simT - p.relT <= CONFIG.releaseMs + 60){
    n++; if (p.x<x0)x0=p.x; if (p.x>x1)x1=p.x; if (p.y<y0)y0=p.y; if (p.y>y1)y1=p.y;
  }
  if (!n) return null;
  return Math.max((x1-x0)/s.w, (y1-y0)/s.h);
}
function releaseModelBound(elapsedMs){
  const s = diagnostics.lastSpread;
  if (!s) return null;
  const dt = elapsedMs/1000;
  return Math.max((s.w + CONFIG.driftX*dt)/s.w, (s.h + CONFIG.driftY*dt)/s.h);
}
function isSettled(p, now){
  if (!p.borrowed) return false;
  if (now - p.cueT0 < p.travel) return false;
  if (!p.captured) return false;
  return (now - p.t0 - p.delay) >= p.travel;
}
/* Zero-end-derivative travel profile: s(f) with s(0)=0, s(1)=1 and
   s'(0)=s'(1)=0, so anchor velocity starts and ends at zero and the
   trajectory velocity (anchor + stream) is continuous at capture
   and settlement. */
function easeProfile(f){
  const e = CONFIG.easingExponent;
  const a = Math.pow(f, e), b = Math.pow(1-f, e);
  return a / (a + b || 1);
}
function updateParticles(dtMs){
  const dt = dtMs/1000, now = simT;
  const pivotX = CONFIG.pageXR*W;
  for (const p of particles){
    /* the stream offset accumulates in EVERY state, every frame */
    p.ox += p.vx*dt; p.oy += p.vy*dt;
    if (p.borrowed){
      if (!p.captured){
        /* stagger window: the anchor holds; the particle streams on
           its offset; the travel anchor origin is captured only once
           the delay has elapsed, from the rendered position then */
        if (now - p.t0 >= p.delay){
          p.ax0 = p.x - p.ox; p.ay0 = p.y - p.oy; p.captured = true;
          p.lastCapture = { t: now, x: p.x, y: p.y };
        }
        p.renderAlpha = CONFIG.travelAlpha;
      } else {
        const el = now - p.t0 - p.delay;
        const f = Math.min(1, Math.max(0, el / p.travel));
        const s = easeProfile(f);
        p.jitAmp = s;
        let ax = p.ax0 + (p.tx - p.ax0)*s + Math.sin(now/CONFIG.jitterPeriodXMs + p.ph)*CONFIG.jitter*p.jitAmp;
        let ay = p.ay0 + (p.ty - p.ay0)*s + Math.cos(now/CONFIG.jitterPeriodYMs + p.ph)*CONFIG.jitter*p.jitAmp;
        /* page turn: front-page anchors rotate around the left edge
           during the flip window; backing-stack anchors never turn */
        const turning = (p.kind === "page" || p.kind === "line") && (
          (f < 1) || (now - p.cueT0 >= 0 && now - p.cueT0 < p.travel));
        if (turning){
          const tf = (f < 1) ? f : Math.min(1, Math.max(0, (now - p.cueT0) / p.travel));
          const prof = Math.sin(Math.PI*tf);
          const factor = 1 - (1 - CONFIG.turnCosMin) * prof * prof;
          ax = pivotX + (ax - pivotX) * factor;
          p.renderAlpha = CONFIG.travelAlpha;
        } else if (f < 1) {
          p.renderAlpha = CONFIG.travelAlpha;
        } else {
          p.renderAlpha = p.kind === "stack" ? CONFIG.stackAlpha : (p.kind === "halo" ? CONFIG.haloAlpha : CONFIG.foregroundAlpha);
        }
        p.ax = ax; p.ay = ay;
      }
    } else {
      /* released / free: the anchor freezes once the jitter amplitude
         has faded out smoothly; the offset carries the particle */
      if (p.jitAmp > 0){
        const dec = Math.min(1, Math.max(0, (now - p.relT) / CONFIG.jitterReleaseDecayMs));
        const fade = 0.5 + 0.5*Math.cos(Math.PI*dec);
        p.ax = p.tx + Math.sin(now/CONFIG.jitterPeriodXMs + p.ph)*CONFIG.jitter*p.jitAmp*fade;
        p.ay = p.ty + Math.cos(now/CONFIG.jitterPeriodYMs + p.ph)*CONFIG.jitter*p.jitAmp*fade;
        if (dec >= 1) p.jitAmp = 0;
      }
      p.renderAlpha = p.borrowable ? CONFIG.surplusAlpha : CONFIG.reserveAlpha;
    }
    p.x = p.ax + p.ox; p.y = p.ay + p.oy;
    const m = CONFIG.wrapMarginPx;
    if (p.x < -m) p.ax += W + 2*m - 1; if (p.x > W + m) p.ax -= W + 2*m - 1;
    if (p.y < -m) p.ay += H + 2*m - 1; if (p.y > H + m) p.ay -= H + 2*m - 1;
    p.x = p.ax + p.ox; p.y = p.ay + p.oy;
  }
}
function draw(){
  sctx.fillStyle = CONFIG.background; sctx.fillRect(0,0,W,H);
  const sorted = particles.slice().sort((a,b) => (a.borrowed?2:(a.borrowable?1:0)) - (b.borrowed?2:(b.borrowable?1:0)));
  for (const p of sorted){
    const c = (p.borrowed && p.kind === "halo") ? cHalo : p.col;
    sctx.fillStyle = "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + p.renderAlpha + ")";
    sctx.beginPath(); sctx.arc(p.x, p.y, CONFIG.particleRadius, 0, Math.PI*2); sctx.fill();
  }
}
/* ---------- sizing + restart + main loop + comparison hooks ----------
   Restart resets ALL run state: simulation time, phase, current
   page, trace, transition records, diagnostics, scheduler flags,
   the animation timestamp, and the particle pool (re-seeded), so a
   restarted run stepped with a controlled timestep sequence equals
   a fresh load stepped with the same sequence. */
let last = null, playing = true;
function resetRun(){
  rng = mulberry32(CONFIG.seed); simT = 0; phase = ""; curPage = 0; trace = []; titleBorrowed = false; haloBorrowed = false;
  formTargets = null; transitions.length = 0;
  diagnostics.seamViolations = 0; diagnostics.seamChecks = 0; diagnostics.lastSpread = null;
  last = null;
  buildPool();
}
function resize(){
  const r = stage.parentElement.getBoundingClientRect();
  W = Math.max(CONFIG.minStageW, Math.floor(r.width)); H = Math.max(CONFIG.minStageH, Math.floor(r.height));
  stage.width = W; stage.height = H;
  resetRun();
}
function frame(ts){
  if (last === null) last = ts;
  const dt = Math.min(50, ts - last); last = ts;
  if (playing) step(dt);
  draw();
  requestAnimationFrame(frame);
}
window.addEventListener("resize", resize);
window.addEventListener("message", e => {
  if (!e.data || typeof e.data !== "object") return;
  if (e.data.cmd === "play") playing = true;
  if (e.data.cmd === "pause") playing = false;
  if (e.data.cmd === "restart"){ resetRun(); playing = true; }
});
window.T16_API = { CONFIG, WARNINGS, samplePageTargets, sampleTitleTargets, sampleHaloTargets, pageAtTime,
  computeSchedule, deriveCheckpoints, strictCheckpoints, resolveCheckpoints,
  releaseSpreadRatio, releaseModelBound, isSettled, fitText,
  get lastTitleFit(){ return lastTitleFit; },
  get checkpoints(){ return RESOLVED_CHECKPOINTS; },
  get particles(){ return particles; }, get phase(){ return phase; }, get trace(){ return trace; },
  get transitions(){ return transitions; }, get diagnostics(){ return diagnostics; },
  get simT(){ return simT; },
  step, resize, resetRun };
validateConfig();
refreshColors();
resolveCheckpoints();
enforceBudget();
initDom();
resize();
requestAnimationFrame(frame);
</script>
</body>
