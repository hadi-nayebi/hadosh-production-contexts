function clamp01(v){return v<0?0:v>1?1:v;}
function lerp(a,b,q){return a+(b-a)*q;}
function animFraction(fig,cfg){const c=cfg||CONFIG; return Math.max(c.timing.animFractionFloor,(fig.dur-c.timing.minHoldSec)/fig.dur);}
function animQ(p,fig,cfg){return clamp01(p/animFraction(fig,cfg));}
function collapseN(p,fig,cfg){
  const range=fig.counterStart-fig.counterEnd; if(range<=0) return clamp01(p);
  const a=fig.preCliffDrop/range, end=animFraction(fig,cfg), cliff=fig.cliffAt;
  if(p<=0) return 0; if(p>=end) return 1;
  if(p<cliff) return a*(p/cliff);
  const q=(p-cliff)/(end-cliff); return a+(1-a)*Math.pow(q,fig.cliffExponent);
}
function counterValueAt(p,fig,cfg){return fig.counterStart + collapseN(p,fig,cfg)*(fig.counterEnd-fig.counterStart);}
function counterTextAt(p,fig,cfg){return Math.round(counterValueAt(p,fig,cfg)).toLocaleString((cfg||CONFIG).formatting.counterLocale);}
function graphYAt(p,fig,geom,cfg){return geom.y0 + collapseN(p,fig,cfg)*(geom.y1-geom.y0);}
function polylineLength(points,geom){
  let len=0,px=null,py=null;
  for(const pt of points){const x=geom.x0+pt[0]*geom.w, y=geom.yBase-pt[1]*geom.h; if(px!==null) len+=Math.hypot(x-px,y-py); px=x; py=y;}
  return len;
}
function lineChartState(fig,q,cfg){const T=(cfg||CONFIG).timing; return {drawQ:clamp01(q/T.drawEnd)};}
function summaryTiming(fig,cfg){const T=(cfg||CONFIG).timing;
  const holdSec=Math.max(T.minHoldSec, fig.summaryText.length*T.readMsPerChar/1000);
  return { holdSec:holdSec, readSec:fig.summaryText.length*T.readMsPerChar/1000, typeStartSec:T.typeStartSec,
           typeDurSec:fig.dur-T.typeStartSec-holdSec, fillSec:T.fillSec, completionSec:T.typeStartSec+(fig.dur-T.typeStartSec-holdSec) };}
function waffleState(fig,p,cfg){const st=summaryTiming(fig,cfg); const tSec=clamp01(p)*fig.dur;
  const filled=Math.floor(clamp01(tSec/st.fillSec)*fig.waffleTotal);
  const sq=clamp01((tSec-st.typeStartSec)/st.typeDurSec);
  return {filled:Math.min(fig.waffleTotal,filled), youVisible:filled>fig.youIndex, summaryChars:Math.floor(sq*fig.summaryText.length), holdSec:st.holdSec};}
function stackState(fig,q,cfg){const T=(cfg||CONFIG).timing;
  const perUnit=T.stackEnd/fig.stackCount, arrivalDur=perUnit*T.stackArrivalSpan;
  const arrivals=[]; let units=0;
  for(let i=0;i<fig.stackCount;i++){ const start=(i+1)*perUnit-arrivalDur; const ai=clamp01((q-start)/arrivalDur);
    const e=1-Math.pow(1-ai,T.stackEasePow); if(ai>=1) units++;
    arrivals.push({visible:ai>0, arrival:ai, ty:-( (cfg||CONFIG).layout.stackArrivalOffsetPx )*(1-e), opacity:ai>0?1:0}); }
  return {units:units, arrivals:arrivals, barQ:clamp01(q/T.barsEnd), donutQ:clamp01(q/T.barsEnd)};}
function nodeThresholds(fig,cfg){const T=(cfg||CONFIG).timing; const out=[]; for(let i=0;i<fig.nodes.length;i++) out.push(T.nodeStart+(i+1)*((T.nodeEnd-T.nodeStart)/fig.nodes.length)); return out;}
function orgState(fig,q,cfg){const T=(cfg||CONFIG).timing; const th=nodeThresholds(fig,cfg);
  const badgeQ=clamp01((q-T.badgeAt)/T.badgeDur); const badgeE=1-Math.pow(1-badgeQ,T.badgeEasePow); return {ceo:q>=T.ceoAt, nodes:th.map(t=>q>=t), badge:q>=T.badgeAt, badgeQ:badgeQ, badgeE:badgeE};}
function stampScaleAt(sq,T,cap){ const from=(cap!=null?cap:T.stampFrom);
  if(sq<=0) return from;
  if(sq<T.stampApproach){ const u=sq/T.stampApproach; const e=1-Math.pow(1-u,T.stampEasePowIn); return lerp(from,T.stampOvershoot,e); }
  if(sq<T.stampReboundEnd){ const u=(sq-T.stampApproach)/(T.stampReboundEnd-T.stampApproach); return lerp(T.stampOvershoot,T.stampCompress,u); }
  const u=(sq-T.stampReboundEnd)/(1-T.stampReboundEnd); return lerp(T.stampCompress,1,1-Math.pow(1-u,T.stampEasePowOut));
}
function noteStarts(fig,cfg){const T=(cfg||CONFIG).timing; const n=fig.notes.length; if(!n) return [];
  const step=(1-T.noteStart-T.noteFade)/n; const out=[]; for(let i=0;i<n;i++) out.push(T.noteStart+i*step); return out;}
function correctionState(fig,q,cfg,cap){const T=(cfg||CONFIG).timing;
  const sq=clamp01((q-T.stampAt)/T.stampDur); const starts=noteStarts(fig,cfg);
  return {corr:q>=T.corrAt, stampVisible:q>=T.stampAt, stampScale:stampScaleAt(sq,T,cap), stampSq:sq,
          notes:fig.notes.map((n,i)=>clamp01((q-starts[i])/T.noteFade)), noteStarts:starts};}
function barRects(fig,geom,q,cfg){const B=(cfg||CONFIG).layout.barGeom;
  const n=fig.bars.length, slot=(geom.w*B.slotFrac)/n, bw=slot*B.barFrac, base=geom.h-B.basePad, maxH=geom.h-B.topPad;
  return fig.bars.map((v,i)=>{const h=v*maxH*q; return {x:B.xPad+i*slot+(slot-bw)/2, y:base-h, w:bw, h, labelX:B.xPad+i*slot+slot/2};});
}
function stateAt(t,figures,duration){
  const tt=Math.max(0,Math.min(duration,t));
  for(let i=0;i<figures.length;i++){const f=figures[i]; const last=i===figures.length-1;
    if(tt>=f.start && (tt<f.start+f.dur || (last && tt<=duration))) return {index:i, p:clamp01((tt-f.start)/f.dur)};}
  let idx=0; figures.forEach((f,i)=>{if(tt>=f.start) idx=i;});
  return {index:idx, p:clamp01((tt-figures[idx].start)/figures[idx].dur)};
}
function computeLayout(w,cfg){const c=cfg||CONFIG; const F=c.typeFloors, LH=c.layout.lineHeights, TS=c.layout.typeScale, TC=c.layout.typeCaps, phone=w<=c.layout.phoneBreakpoint;
  const mastPx=Math.max(F.masthead, Math.min(TC.mast, w*TS.mast));
  const titlePx=Math.max(F.figureTitle, Math.min(TC.title, w*TS.title));
  const bodyPx=Math.max(F.body, Math.min(TC.body, w*TS.body));
  const labelPx=Math.max(F.label, Math.min(TC.label, w*TS.label));
  const bigPx=Math.max(F.bigCounter, Math.min(TC.big, w*TS.big));
  const handPx=Math.max(F.hand, Math.min(TC.hand, w*TS.hand));
  const padX=phone?c.layout.padXPhone:c.layout.padXDesktop, padTop=phone?c.layout.padTopPhone:c.layout.padTopDesktop;
  const metaTexts=[c.dateLine,c.clockStart,c.price];
  const metaWidths=metaTexts.map(t=>t.length*labelPx*c.layout.charWidthLabel);
  const metaAvail=w-2*c.layout.metaPadX;
  const metaRows=(metaWidths.reduce((a,b)=>a+b,0)+2*c.layout.metaMinGapPx<=metaAvail)?1:2;
  const metaH=metaRows*(labelPx*LH.label+10)+(metaRows-1)*2;
  const headerH=padTop + mastPx*LH.mast + 13 + metaH + 4;
  const contentW=w-2*padX, stageH=phone?null:w*9/16;
  const contentH=phone?null:stageH-headerH;
  const headSrcReserve=labelPx*LH.label + 2*titlePx*LH.title + (c.layout.headingMarginTopPx+c.layout.headingMarginBottomPx) + (labelPx*LH.label+c.layout.srcMarginTopPx);
  const availBlockH=phone?(c.layout.phoneStageBudgetPx-headerH-c.layout.bottomClearancePx):contentH;
  return {w, phone, mastPx, titlePx, bodyPx, labelPx, bigPx, handPx, padX, padTop, headerH, contentW, stageH, contentH, metaRows, metaWidths, metaAvail, headSrcReserve, availBlockH};
}
function charsPerLine(widthPx,fontPx,cfg){const c=cfg||CONFIG; return Math.max(1,Math.floor(widthPx/(fontPx*c.layout.charWidthBody)));}
function textLines(text,widthPx,fontPx,cfg){return Math.max(1,Math.ceil(text.length/charsPerLine(widthPx,fontPx,cfg)));}
function headingLines(title,L,cfg){return textLines(title, L.contentW, L.titlePx, cfg);}
function stampMetrics(fig,L,cfg){const c=cfg||CONFIG; const T=c.timing, lay=c.layout;
  const w=fig.stamp.length*L.bodyPx*lay.stampCharWidth + lay.stampPadX;
  const h=L.bodyPx + lay.stampPadY;
  const rad=Math.abs(T.stampRotationDeg)*Math.PI/180, cos=Math.cos(rad), sin=Math.sin(rad);
  const aabbW1=w*cos+h*sin, aabbH1=w*sin+h*cos;
  return {w:w, h:h, aabbW1:aabbW1, aabbH1:aabbH1};
}
function stampCap(fig,L,cfg){const c=cfg||CONFIG; const m=stampMetrics(fig,L,c);
  const corrW=Math.min(c.layout.corrMaxW,L.contentW);
  return Math.min(c.timing.stampFrom, corrW/m.aabbW1, c.layout.stampAreaBudgetPx/m.aabbH1);
}
function stampAabbAt(fig,L,scale,cfg){const c=cfg||CONFIG; const m=stampMetrics(fig,L,c); const cap=stampCap(fig,L,c);
  const aabbW=m.aabbW1*scale, aabbH=m.aabbH1*scale; const offsetX=Math.max(0, m.aabbW1*cap/2 - m.w/2);
  const cx=offsetX + m.w/2; const corrW=Math.min(c.layout.corrMaxW,L.contentW);
  return {offsetX:offsetX, aabbW:aabbW, aabbH:aabbH, left:cx-aabbW/2, right:cx+aabbW/2, corrW:corrW};}
function lineLabelBounds(fig,L,cfg){const c=cfg||CONFIG; const g=figureGeom(fig,L,c);
  const geom={x0:c.layout.chartPadLeft, w:g.chartW-c.layout.chartPadLeft-c.layout.chartPadRight};
  const n=fig.xLabels.length;
  return fig.xLabels.map((lab,i)=>{ const halfW=lab.length*L.labelPx*c.layout.charWidthLabel/2;
    const cx=geom.x0+geom.w*(n>1?i/(n-1):0);
    const anchor=i===0?'start':(i===n-1?'end':'middle');
    const left=anchor==='start'?cx:(anchor==='end'?cx-2*halfW:cx-halfW);
    const right=anchor==='start'?cx+2*halfW:(anchor==='end'?cx:cx+halfW);
    return {text:lab, anchor:anchor, cx:cx, halfW:halfW, left:left, right:right, chartW:g.chartW}; });
}
function figureGeom(fig,L,cfg){const c=cfg||CONFIG; const LH=c.layout.lineHeights; const cw=L.contentW;
  if(fig.type==="lineChart"){const chartW=L.phone?cw:Math.min(c.layout.chartMaxW,cw*c.layout.chartWidthFrac.line), chartH=L.phone?c.layout.chartHeights.linePhone:c.layout.chartHeights.lineDesktop;
    const cardW=L.phone?cw:cw-chartW-c.layout.rowGapPx, cardH=textLines(fig.cardText,cardW-24,L.bodyPx,c)*L.bodyPx*LH.body+24;
    const titleH=L.labelPx*LH.label+4;
    return {chartW,chartH,cardW,cardH,titleH, blockH:L.phone?cardH+c.layout.rowGapPx+titleH+chartH:Math.max(cardH,titleH+chartH), maxW:cw};}
  if(fig.type==="waffle"){const gap=c.layout.waffleGapPx, dot=Math.max(c.layout.waffleDotMin,Math.min(c.layout.waffleDotMax,Math.floor((cw*c.layout.waffleGridFrac)/fig.waffleCols)-gap));
    const rows=Math.ceil(fig.waffleTotal/fig.waffleCols), gridW=fig.waffleCols*(dot+gap)-gap, gridH=rows*(dot+gap)-gap;
    const sumH=textLines(fig.summaryText,cw-24,L.bodyPx,c)*L.bodyPx*LH.body+24;
    return {dot,gap,rows,gridW,gridH,sumH, blockH:gridH+6+L.bodyPx*c.layout.waffleLabelH+8+sumH, maxW:cw};}
  if(fig.type==="stackBars"){const chartW=L.phone?cw:Math.min(c.layout.chartMaxW,cw*c.layout.chartWidthFrac.stack), chartH=L.phone?c.layout.chartHeights.stackPhone:c.layout.chartHeights.stackDesktop;
    const gap=c.layout.fig22GapPx, unitGap=c.layout.stackUnitGapPx, arrival=c.layout.stackArrivalOffsetPx;
    const counterH=L.bodyPx*LH.stackCounter;
    const stackBudget=L.phone ? (L.availBlockH - L.headSrcReserve) - counterH - gap - chartH - arrival
                              : (L.availBlockH - L.headSrcReserve) - counterH - arrival;
    const unitFloor=L.labelPx+2;
    const unitHRaw=Math.floor(stackBudget/fig.stackCount)-unitGap;
    const unitH=Math.min(c.layout.stackUnitMaxH, Math.max(unitFloor, unitHRaw));
    const stackH=fig.stackCount*(unitH+unitGap)+arrival;
    return {chartW,chartH,unitH,unitHRaw,unitFloor,unitHOver:unitHRaw<unitFloor,stackH,counterH,stackBudget,arrivalReserve:arrival, blockH:L.phone?counterH+stackH+gap+chartH:Math.max(stackH+counterH,chartH), maxW:cw};}
  if(fig.type==="orgChart"){const longest=Math.max.apply(null,fig.nodes.map(n=>n.length));
    const nodeW=longest*L.labelPx*c.layout.charWidthLabel+c.layout.nodePadX; let perRow=Math.max(1,Math.floor(cw/nodeW)); while(perRow>1 && perRow*nodeW+(perRow-1)*c.layout.orgRowGapPx>cw) perRow--; const rows=Math.ceil(fig.nodes.length/perRow);
    const ceoH=L.bodyPx*LH.body+24, nodesH=rows*(L.bodyPx*LH.body+10);
    const badgeText=fig.onlyNote+c.formatting.badgeStarSep+fig.badgeName+c.formatting.badgeDashSep+fig.badge;
    const badgeH=textLines(badgeText,cw,L.bodyPx,c)*L.bodyPx*LH.body+8;
    return {nodeW,perRow,rows,ceoH,nodesH,badgeH, blockH:ceoH+c.layout.orgRowMarginTop+nodesH+c.layout.badgeMarginTop+badgeH, maxW:cw};}
  if(fig.type==="counterGraph"){const chartW=L.phone?cw:Math.min(c.layout.chartMaxW,cw*c.layout.chartWidthFrac.counter), chartH=L.phone?c.layout.chartHeights.counterPhone:c.layout.chartHeights.counterDesktop;
    const cardW=L.phone?cw:cw-chartW-c.layout.counterGapPx;
    const cardH=textLines(fig.counterLabel,cardW-24,L.labelPx,c)*L.labelPx*LH.label + L.bigPx*c.layout.bigLineH + textLines(fig.counterSub,cardW-24,L.bodyPx,c)*L.bodyPx*LH.body + 24;

function validateConfig(cfg){
  const errs=[]; if(!cfg||typeof cfg!=="object"){errs.push("config absent"); return errs;}
  const B=cfg.bounds, T=cfg.timing;
  if(!isFinite(cfg.duration)||cfg.duration<=0) errs.push("duration must be a positive finite number");
  if(!T||!isFinite(T.minHoldSec)||!isFinite(T.readMsPerChar)||T.readMsPerChar<=0) errs.push("timing values must be finite with a positive reading rate");
  if(T&&(T.fillSec<T.minFillSec)) errs.push("timing: fill duration below its named minimum");
  if(!Array.isArray(cfg.figures)||cfg.figures.length<1||cfg.figures.length>B.maxFigures) errs.push("figures count outside supported boundary 1.."+B.maxFigures);
  (cfg.figures||[]).forEach(f=>{
    if(!f||typeof f!=="object"){errs.push("figure record absent"); return;}
    if(!isFinite(f.start)||!isFinite(f.dur)) errs.push(f.id+": figure window values must be finite");
    if(!(f.dur>cfg.timing.minHoldSec)) errs.push(f.id+": window must exceed the minimum hold");
    if(f.type==="waffle"){ if(f.waffleTotal>B.maxWaffle) errs.push(f.id+": waffleTotal "+f.waffleTotal+" exceeds supported boundary "+B.maxWaffle);
      if(typeof f.summaryText!=="string"||!f.summaryText.length) errs.push(f.id+": summary text absent");
      else { const st=summaryTiming(f,cfg); if(st.typeDurSec<T.minTypeSec) errs.push(f.id+": summary of "+f.summaryText.length+" chars cannot type in at least "+T.minTypeSec+"s and still hold for reading inside its window"); } }
    if(f.type==="stackBars"){ if(f.bars.length>B.maxBars) errs.push(f.id+": bars "+f.bars.length+" exceeds supported boundary "+B.maxBars);
      if(f.stackCount>B.maxStack) errs.push(f.id+": stackCount "+f.stackCount+" exceeds supported boundary "+B.maxStack);
      if(f.bars.length!==f.barLabels.length) errs.push(f.id+": barLabels length must match bars length");
      if(f.bars.some(v=>!isFinite(v))) errs.push(f.id+": bar values must be finite");
      const L360=computeLayout(cfg.layout.phoneProbeWidth,cfg); const g360=figureGeom(f,L360,cfg);
      if(g360.unitHOver) errs.push(f.id+": stackCount "+f.stackCount+" cannot hold the unit legibility floor at phone width"); }
    if(f.type==="orgChart"&&f.nodes.length>B.maxNodes) errs.push(f.id+": nodes "+f.nodes.length+" exceeds supported boundary "+B.maxNodes);
    if(f.type==="correction"&&f.notes.length>B.maxNotes) errs.push(f.id+": notes "+f.notes.length+" exceeds supported boundary "+B.maxNotes);
    if(f.type==="lineChart"){ if(f.points.length>B.maxPoints) errs.push(f.id+": points "+f.points.length+" exceeds supported boundary "+B.maxPoints);
      if(f.points.some(pt=>!pt||!isFinite(pt[0])||!isFinite(pt[1]))) errs.push(f.id+": point coordinates must be finite"); }
    if(f.type==="counterGraph"){ if(!(f.counterStart>f.counterEnd)) errs.push(f.id+": counterStart must exceed counterEnd");
      if(!isFinite(f.counterStart)||!isFinite(f.counterEnd)||!isFinite(f.cliffAt)) errs.push(f.id+": counter values must be finite");
      if(!(f.cliffAt>B.cliffMin)) errs.push(f.id+": cliffAt outside supported boundary "+B.cliffMin+"..animation fraction");
      else { const lim=animFraction(f,cfg)-T.cliffBudgetMargin; if(!(f.cliffAt<lim)) errs.push(f.id+": cliffAt "+f.cliffAt+" must sit below the animation fraction minus the named margin ("+lim.toFixed(3)+")"); }
      if(!(f.preCliffDrop>0&&f.preCliffDrop<(f.counterStart-f.counterEnd)*0.05)) errs.push(f.id+": preCliffDrop outside supported boundary (0, 5% of counter range)"); }
  });
  const knownTypes=["lineChart","waffle","stackBars","orgChart","counterGraph","correction"];
  (cfg.figures||[]).forEach(f=>{ if(f && knownTypes.indexOf(f.type)<0) errs.push(f.id+": unsupported figure type "+f.type); });
  const schedFigs=cfg.figures||[];
  for(let si=1;si<schedFigs.length;si++){ const prevF=schedFigs[si-1], curF=schedFigs[si]; if(Math.abs(curF.start-(prevF.start+prevF.dur))>1e-9) errs.push("schedule: figure "+curF.id+" start "+curF.start+" does not equal previous figure end "+(prevF.start+prevF.dur)+" (overlap or gap)"); }
  if(schedFigs.length){ const lastF=schedFigs[schedFigs.length-1]; if(Math.abs(lastF.start+lastF.dur-cfg.duration)>1e-9) errs.push("schedule: last figure end "+(lastF.start+lastF.dur)+" does not equal total duration "+cfg.duration); }
  return errs;
}

  stageEl.style.background=P.paper; stageEl.style.color=P.ink;
  stageEl.style.setProperty('--warn',P.red); stageEl.style.setProperty('--muted',P.muted); stageEl.style.setProperty('--secondary',P.secondary); stageEl.style.setProperty('--srcmt',cfg.layout.srcMarginTopPx+'px');
  stageEl.style.setProperty('--card-tint',P.cardTint);
  stageEl.style.setProperty('--font-serif',deps.fonts.serif); stageEl.style.setProperty('--font-sans',deps.fonts.sans); stageEl.style.setProperty('--font-hand',deps.fonts.hand);
  stageEl.style.setProperty('--metapad',cfg.layout.metaPadX+'px');
  stageEl.style.setProperty('--lh-mast',cfg.layout.lineHeights.mast); stageEl.style.setProperty('--lh-title',cfg.layout.lineHeights.title);
  stageEl.style.setProperty('--fw-normal',cfg.layout.fontWeights.normal); stageEl.style.setProperty('--fw-black',cfg.layout.fontWeights.black);
  const mast=el('div','mast'); mast.appendChild(el('h1','',cfg.masthead)); stageEl.appendChild(mast);
  stageEl.appendChild(el('div','rule'));
  const meta=el('div','meta');
  const dateS=el('span','',cfg.dateLine);
  const clockS=el('span','',cfg.clockStart); clockS.style.color=P.red;
  const priceS=el('span','',cfg.price);
  if(L.metaRows===2){ priceS.style.flexBasis='100%'; priceS.style.textAlign='right'; }
  meta.append(dateS, clockS, priceS); stageEl.appendChild(meta);
  const problems=validateConfig(cfg);
  const globalProblems=problems.filter(x=>!cfg.figures.some(f=>x.indexOf(f.id+':')===0));
  if(globalProblems.length){ const gw=el('div','warn globalwarn','Validation: '+globalProblems.join('; ')); stageEl.appendChild(gw); }
  const mounted=[];
  cfg.figures.forEach(f=>{
    const root=el('section','fig'); root.id=f.id;
    const num=el('div','fignum',f.num); num.style.color=P.red; root.appendChild(num);
    const h=el('h2','',f.title); h.style.minHeight=(headingLines(f.title,L,cfg)*L.titlePx*cfg.layout.lineHeights.title)+'px'; root.appendChild(h);
    const body=el('div'); root.appendChild(body);
    root.appendChild(el('div','src',f.source));
    stageEl.appendChild(root);
    const figProblems=problems.filter(x=>x.indexOf(f.id+':')===0);
    let draw=null;
    if(figProblems.length){ const warn=el('div','warn','Unsupported data — '+figProblems.join('; ')); body.appendChild(warn); if(window.console) console.warn('T17 validation: '+figProblems.join('; ')); }
    else if(BUILDERS[f.type]) draw=BUILDERS[f.type]({root:root,body:body},f,deps);
    mounted.push({fig:f,root:root,draw:draw});
  });
  return mounted;
}

const stage=document.getElementById('stage');
document.body.style.background=CONFIG.palette.pageBg;
document.getElementById('clock').style.color=CONFIG.palette.controlInk;
let mounted=[], lastT=0;
function buildAll(){
  mounted.forEach(m=>m.root.remove()); mounted=[];
  const mastOld=stage.querySelectorAll('.mast,.rule,.meta,.globalwarn'); mastOld.forEach(n=>n.remove());
  const w=stage.clientWidth||960, L=computeLayout(w,CONFIG);
  stage.classList.toggle('phone',L.phone);
  stage.style.setProperty('--mast',L.mastPx+'px'); stage.style.setProperty('--title',L.titlePx+'px');
  stage.style.setProperty('--label',L.labelPx+'px'); stage.style.setProperty('--padx',L.padX+'px');
  stage.style.setProperty('--padtop',L.padTop+'px'); stage.style.setProperty('--figpadtop',CONFIG.layout.figPadTopPx+'px'); stage.style.setProperty('--headmt',CONFIG.layout.headingMarginTopPx+'px'); stage.style.setProperty('--headmb',CONFIG.layout.headingMarginBottomPx+'px'); stage.style.setProperty('--figtop',Math.round(L.headerH)+'px');
  if(L.phone) stage.style.height=Math.round(L.headerH+Math.max.apply(null,CONFIG.figures.map(f=>figureRequired(f,L,CONFIG).required))+CONFIG.layout.bottomClearancePx)+'px';
  else stage.style.height='';
  const deps={config:CONFIG, palette:CONFIG.palette, timing:CONFIG.timing, layout:L, dom:browserDom(), fonts:CONFIG.fonts, stageEl:stage};
  mounted=createScene(deps);
  render(lastT);
}
function render(t){
  lastT=Math.max(0,Math.min(CONFIG.duration,t)); window.__lastT=lastT;
  document.getElementById('clock').textContent=lastT.toFixed(2)+'s / '+CONFIG.duration+'s';
  const st=stateAt(lastT,CONFIG.figures,CONFIG.duration);
  mounted.forEach((m,i)=>{ const active=i===st.index; m.root.classList.toggle('on',active); if(active&&m.draw) m.draw(st.p); });
}
let playing=false, startStamp=0, offset=0, raf=0;
function tick(now){ if(!playing)return; const t=offset+(now-startStamp)/1000; if(t>=CONFIG.duration){render(CONFIG.duration);playing=false;return;} render(t); raf=requestAnimationFrame(tick); }
window.T17={ config:CONFIG, render:render, fitReport:function(w){return fitReport(w||stage.clientWidth||960, CONFIG.figures, CONFIG);},
  validate:function(){return validateConfig(CONFIG);},
  setTime:function(t){offset=t;render(t);}, get time(){return offset;},
  play:function(){ if(!playing){playing=true;startStamp=performance.now();raf=requestAnimationFrame(tick);} },
  pause:function(){ playing=false; offset=window.__lastT||offset; cancelAnimationFrame(raf); },
  restart:function(){ offset=0; playing=true; startStamp=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); } };
document.getElementById('play').onclick=()=>{ playing?window.T17.pause():window.T17.play(); };
document.getElementById('restart').onclick=()=>window.T17.restart();
window.addEventListener('resize',buildAll);
buildAll();
</script></body></html>
