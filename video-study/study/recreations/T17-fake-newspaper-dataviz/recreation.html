function computeLayout(w,cfg){const c=cfg||CONFIG; const F=c.typeFloors, LH=c.layout.lineHeights, TS=c.layout.typeScale, TC=c.layout.typeCaps, phone=w<=c.layout.phoneBreakpoint;

    if(figProblems.length){ const warn=el('div','warn','Unsupported data — '+figProblems.join('; ')); body.appendChild(warn); if(window.console) console.warn('T17 validation: '+figProblems.join('; ')); }
    else if(BUILDERS[f.type]) draw=BUILDERS[f.type]({root:root,body:body},f,deps);
    mounted.push({fig:f,root:root,draw:draw});
  });
  } catch(e){ appended.forEach(r=>r.remove()); throw e; }
  return mounted;
}

const stage=document.getElementById('stage');
document.body.style.background=CONFIG.palette.pageBg;
document.getElementById('clock').style.color=CONFIG.palette.controlInk;
let mounted=[], lastT=0;
function applyStagePresentation(stageEl,cfg,L){
  stageEl.style.setProperty('--stagew',cfg.layout.stageWidthPx+'px');
  if(stageEl===stage) document.documentElement.style.setProperty('--stagew',cfg.layout.stageWidthPx+'px');
  stageEl.classList.toggle('phone',L.phone);
  stageEl.style.setProperty('--mast',L.mastPx+'px'); stageEl.style.setProperty('--title',L.titlePx+'px');
  stageEl.style.setProperty('--label',L.labelPx+'px'); stageEl.style.setProperty('--padx',L.padX+'px');
  stageEl.style.setProperty('--padtop',L.padTop+'px'); stageEl.style.setProperty('--figpadtop',cfg.layout.figPadTopPx+'px'); stageEl.style.setProperty('--headmt',cfg.layout.headingMarginTopPx+'px'); stageEl.style.setProperty('--headmb',cfg.layout.headingMarginBottomPx+'px'); stageEl.style.setProperty('--figtop',Math.round(L.headerH)+'px');
  stageEl.style.setProperty('--cardpad',cfg.layout.cardPaddingPx+'px'); stageEl.style.setProperty('--cardborder',cfg.layout.cardBorderPx+'px'); stageEl.style.setProperty('--cardradius',cfg.layout.cardRadiusPx+'px');
  stageEl.style.setProperty('--dotborder',cfg.layout.dotBorderPx+'px'); stageEl.style.setProperty('--stampborder',cfg.layout.stampBorderPx+'px'); stageEl.style.setProperty('--stampradius',cfg.layout.stampRadiusPx+'px'); stageEl.style.setProperty('--stamppadx',(cfg.layout.stampPadX/2)+'px'); stageEl.style.setProperty('--stamppady',(cfg.layout.stampPadY/2)+'px');
  stageEl.style.setProperty('--stamp-ls',cfg.layout.stampLetterSpacingEm+'em'); stageEl.style.setProperty('--lh-label',cfg.layout.lineHeights.label);
  stageEl.style.setProperty('--stagear',cfg.layout.stageAspectW+'/'+cfg.layout.stageAspectH);
  if(L.phone) stageEl.style.height=Math.round(fitReport(L.w,cfg.figures,cfg).stageH)+'px';
  else stageEl.style.height='';
}
const STAGE_VARS=['--warn','--muted','--secondary','--srcmt','--card-tint','--font-serif','--font-sans','--font-hand','--metapad','--lh-mast','--lh-title','--fw-normal','--fw-black','--ls-mast','--ls-meta','--ls-fignum','--rulemt','--ruleh','--rulebt','--rulebb','--metapy','--metabb','--headmeta'];
function buildDetached(cfg,W){
  const L=computeLayout(W,cfg);
  const holder=document.createElement('div');
  applyStagePresentation(holder,cfg,L);
  const deps={config:cfg, palette:cfg.palette, timing:cfg.timing, layout:L, dom:browserDom(), fonts:cfg.fonts, stageEl:holder};
  const m=createScene(deps);
  return {L:L, holder:holder, mounted:m};
}
function commitBuilt(built,cfg){
  while(stage.children.length) stage.children[0].remove();
  applyStagePresentation(stage,cfg,built.L);
  stage.style.background=built.holder.style.background; stage.style.color=built.holder.style.color;
  STAGE_VARS.forEach(k=>{ const v=built.holder.style.getPropertyValue(k); if(v) stage.style.setProperty(k,v); });
  while(built.holder.children.length) stage.appendChild(built.holder.children[0]);
  document.body.style.background=cfg.palette.pageBg; document.getElementById('clock').style.color=cfg.palette.controlInk;
  mounted=built.mounted;
}
function buildAll(){
  const W=stage.clientWidth||CONFIG.layout.stageWidthPx;
  const errs=validateConfig(CONFIG);
  const fit=errs.length?null:fitReport(W,CONFIG.figures,CONFIG);
  if(errs.length||!fit||!fit.ok){ const msg=(errs.length?errs:["fit check failed at width "+W]).join('; '); window.__lastGateError=msg; if(window.console) console.warn('T17 resize gate: '+msg); const gw=document.createElement('div'); gw.className='warn globalwarn'; gw.textContent='Validation: '+msg; stage.appendChild(gw); return; }
  window.__lastGateError=null;
  const built=buildDetached(CONFIG,W);
  commitBuilt(built,CONFIG);
  render(lastT);
}
function render(t){
  lastT=Math.max(0,Math.min(CONFIG.duration,t)); window.__lastT=lastT;
  document.getElementById('clock').textContent=lastT.toFixed(2)+'s / '+CONFIG.duration+'s';
  const tr=transitionState(lastT,CONFIG.figures,CONFIG);
  mounted.forEach((m,i)=>{ let op=0, ty=0;
    if(i===tr.index){ op=tr.inOpacity; ty=tr.inTy; if(m.draw) m.draw(tr.inP); }
    else if(i===tr.prevIndex){ op=tr.outOpacity; ty=tr.outTy; if(m.draw) m.draw(tr.outP); }
    m.root.classList.toggle('on', op>0);
    m.root.style.opacity=op;
    m.root.style.transform=ty?('translateY('+ty+'px)'):'';
  });
}
let playing=false, startStamp=0, offset=0, raf=0;
function tick(now){ if(!playing)return; const t=offset+(now-startStamp)/1000; if(t>=CONFIG.duration){render(CONFIG.duration);playing=false;return;} render(t); raf=requestAnimationFrame(tick); }
window.T17={ config:CONFIG, render:render, fitReport:function(w){return fitReport(w||stage.clientWidth||CONFIG.layout.stageWidthPx, CONFIG.figures, CONFIG);},
  validate:function(){return validateConfig(CONFIG);},
  setTime:function(t){offset=t;render(t);}, get time(){return offset;}, get playing(){return playing;},
  play:function(){ if(!playing){playing=true;startStamp=performance.now();raf=requestAnimationFrame(tick);} },
  pause:function(){ playing=false; offset=window.__lastT||offset; cancelAnimationFrame(raf); },
  restart:function(){ offset=0; playing=true; startStamp=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); },
  rebuild:function(next){
    let candidate; try{ candidate=JSON.parse(JSON.stringify(next||CONFIG)); }catch(e){ return {ok:false, errors:["rebuild candidate cloning failed: "+((e&&e.message)||e)]}; }
    let errs; try{ errs=validateConfig(candidate); }catch(e){ return {ok:false, errors:["rebuild validation failed: "+((e&&e.message)||e)]}; }
    if(errs.length) return {ok:false, errors:errs};
    const W=(candidate.layout&&candidate.layout.stageWidthPx&&candidate.layout.stageWidthPx!==CONFIG.layout.stageWidthPx)?candidate.layout.stageWidthPx:(stage.clientWidth||candidate.layout.stageWidthPx);
    let fit; try{ fit=fitReport(W,candidate.figures,candidate); }catch(e){ return {ok:false, errors:["rebuild fit evaluation failed: "+((e&&e.message)||e)]}; }
    if(!fit.ok) return {ok:false, fit:fit, errors:["candidate fit check failed"]};
    let built; try{ built=buildDetached(candidate,W); }catch(e){ return {ok:false, errors:["rebuild construction failed: "+((e&&e.message)||e)]}; }
    const snapChildren=stage.children.slice(); const snapConfig=JSON.parse(JSON.stringify(CONFIG)); const snapMounted=mounted; const snapT=lastT; const snapOffset=offset; const snapPlaying=playing;
    try{
      Object.keys(CONFIG).forEach(k=>{ delete CONFIG[k]; }); Object.keys(candidate).forEach(k=>{ CONFIG[k]=candidate[k]; });
      commitBuilt(built,CONFIG);
      render(lastT);
    }catch(e){
      Object.keys(CONFIG).forEach(k=>{ delete CONFIG[k]; }); Object.keys(snapConfig).forEach(k=>{ CONFIG[k]=snapConfig[k]; });
      while(stage.children.length) stage.children[0].remove();
      snapChildren.forEach(ch=>stage.appendChild(ch));
      mounted=snapMounted; lastT=snapT; offset=snapOffset; playing=snapPlaying;
      try{ render(lastT); }catch(e2){}
      return {ok:false, errors:["rebuild publication failed and the prior scene was restored: "+((e&&e.message)||e)]};
    }
    return {ok:true, fit:fit, errors:[]}; } };
document.getElementById('play').onclick=()=>{ playing?window.T17.pause():window.T17.play(); };
document.getElementById('restart').onclick=()=>window.T17.restart();
window.addEventListener('resize',buildAll);
buildAll();
if(window===window.top){ window.T17.play(); }
</script></body></html>
