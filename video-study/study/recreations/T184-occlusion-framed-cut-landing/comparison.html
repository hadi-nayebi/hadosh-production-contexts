<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T184 — comparison</title>
<style>
  body { margin:0; font-family:system-ui,sans-serif; background:#111; color:#eee; }
  .wrap { max-width:1200px; margin:0 auto; padding:12px; }
  .controls { display:flex; gap:8px; margin:10px 0; }
  .controls button { min-height:44px; min-width:44px; padding:8px 16px; font-size:16px; }
  .sides { display:flex; gap:12px; }
  .side { flex:1; }
  .side video, .side iframe { width:100%; aspect-ratio:16/9; border:0; background:#000; display:block; }
  .label { margin:6px 0; font-size:14px; }
  @media (max-width:640px){ .sides{ flex-direction:column; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="controls">
    <button id="btnPlay" type="button">Play</button>
    <button id="btnPause" type="button">Pause</button>
    <button id="btnRestart" type="button">Restart</button>
  </div>
  <div class="sides">
    <div class="side">
      <p class="label">ORIGINAL — Watchtower of Turkey @ 100.90–104.40 (cut at 102.40)</p>
      <video id="orig" src="segment.mp4" playsinline muted></video>
    </div>
    <div class="side">
      <p class="label">RECREATION — T184 occlusion-framed cut landing, parameterized</p>
      <iframe id="rec" src="recreation.html" title="T184 recreation"></iframe>
    </div>
  </div>
</div>
<script>
"use strict";
var orig = document.getElementById("orig");
var rec = document.getElementById("rec");
function recWin() { return rec.contentWindow; }
function syncToVideo() {
  var w = recWin();
  if (w && w.__rec) w.__rec.seek(orig.currentTime * 1000);
}
orig.addEventListener("timeupdate", syncToVideo);
orig.addEventListener("seeked", syncToVideo);
document.getElementById("btnPlay").addEventListener("click", function () {
  orig.play();
  var w = recWin(); if (w && w.__rec) { w.__rec.seek(orig.currentTime * 1000); w.__rec.play(); }
});
document.getElementById("btnPause").addEventListener("click", function () {
  orig.pause();
  var w = recWin(); if (w && w.__rec) w.__rec.pause();
});
document.getElementById("btnRestart").addEventListener("click", function () {
  orig.currentTime = 0;
  var w = recWin(); if (w && w.__rec) w.__rec.seek(0);
  orig.play();
  var w2 = recWin(); if (w2 && w2.__rec) w2.__rec.play();
});
rec.addEventListener("load", syncToVideo);
</script>
</body>
</html>
