<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T19 — Droste recursion · recreation</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:100%;height:100%;overflow:hidden}
  #zoomWrap{position:absolute;inset:0}
  .scene{position:absolute;inset:0;overflow:hidden}
  .abs{position:absolute}
  .frameInterior{position:absolute;overflow:hidden}
  #diagnostics{position:absolute;left:4px;bottom:4px;z-index:5;display:none;background:#10182e;color:#e9cf8f;
    font-family:monospace;font-size:10px;padding:2px 6px;border:1px solid #d9b96a;max-width:96%}
</style>
</head>
<body>
<div id="stage"><div id="zoomWrap"></div><div id="diagnostics"></div></div>
<script>
"use strict";
/* ===== CONFIG — the shaping defaults of the technique live here, in named groups:
   palette · geometry (stage placement) · components (intra-element shaping) ·
   typography · flicker · checkpoints + checkpointPolicy. Scene-shaping
   defaults live in CONFIG; the measured exceptions are named, not claimed:
   STRUCTURAL CONSTANTS (0%/100% full-bleed fills, the 50% radius that makes a
   box a circle, pure arithmetic identities) stay in code, and the
   #diagnostics badge's own CSS literals (playback UI, not scene construction:
   hex #10182e / #e9cf8f / #d9b96a, 10px font, 2px/6px padding, 1px border,
   4px offsets, 96% max-width) stay in the style block — both classes are
   listed per-literal in the build record's literal census whitelist.
   Construction: ONE pure scene renderer builds the candlelit hall; the framed
   picture's interior is rendered by CALLING THE SAME RENDERER recursively to
   CONFIG depth — genuine Droste recursion from a single scene definition. Motion
   is CHECKPOINT-PRICED: a slow push-in toward the frame's centre, then a hold;
   the final interval is a CONTINUED HOLD. Playback mode "once" (the default)
   RETAINS the terminal state at durationMs — no snap back to zoomStart;
   restart is an explicit playback action. Mode "loop" wraps at durationMs.
   Timing basis: the specimen segment runs 14 s and contains several shots;
   the Droste shot inside it is observed from frame samples at segment
   approx. 3.5 s to approx. 7.19 s (hall onset, framed-picture onset,
   interior populate, a wide populated hold, an enlarged-insert cluster,
   wide again, shot end). This reconstruction is timed against that observed
   shot interval in shot-local time: durationMs spans the shot to its last
   confirmed hall sample, and the checkpoint rows are selected from the
   sampled event windows they cite. The push itself is an authored
   continuous movement across the observed wide hold, which shows no
   measurable scale change; the enlarged-insert cluster is bounded by the
   hold rows and is not reproduced as inserts. The zoom range is an
   authored allocation. */
const CONFIG = {
  durationMs: 3625,                  /* shot-local span of the observed Droste shot (segment approx. 3.5-7.19 s) */
  playbackMode: "once",              /* "once": push plays once, terminal state retained, restart is explicit · "loop": wraps at durationMs */
  labelText: "THIS VIDEO",           /* the framed picture's header bar text */
  depth: 3,                          /* recursion depth rendered by the one renderer */
  candleCount: 3,
  figureButtons: 3,
  checkpoints: { pushStartMs: 500, anchorMs: 875, pushEndMs: 2500, holdEndMs: 3100 },  /* anchorMs is an OBSERVATION MARKER naming the observed interior-populate event; diagnostics and checkpoint repair consume it, the playback curve does not */
  checkpointPolicy: { minSeparationMs: 250 },  /* repair enforces at least this gap, roles preserved, never sorted */
  zoomStart: 0.94,
  zoomEnd: 1.20,
  /* The recursion scale and the zoom anchor are NOT literals in this table:
     resolveConfig derives them from geometry at resolution time and every
     consumer reads only the derived values. */
  labelFontFactor: 0.05,             /* label font px per px of THAT LEVEL's scene width (applied exactly once) */
  labelMinPx: 11,                    /* legibility floor enforced at depths 0 and 1 at phone width */
  medallionText: "✶",
  typography: { letterSpacingEm: 0.08, lineHeight: 1.0, medallionFactor: 0.8, medallionMinPx: 6,
                glyphAdvanceEm: 0.62, medallionAdvanceEm: 0.62,
                fontFamily: "Georgia, 'Times New Roman', serif" },
  flicker: { amp: 0,                 /* DEFAULT ZERO: the observation establishes candlelight,
                                        not synchronized flame pulsing */
             periodDivisorMs: 170,   /* sine divisor when amp > 0 */
             phaseStepRad: 2.1 },    /* per-candle phase step: enabling amp desynchronizes by construction */
  palette: {
    bg: "#07050a", hall: "#171019", drape: "#7e1f2b", drapeDark: "#4a121d", drapeFold: "#5d1724",
    candleBody: "#e8dcc0", flame: "#ffca7a", flameCore: "#fff3d0", glow: "#ffb35c",
    staffWood: "#6e3b22", staffOrb: "#ffc46b", robe: "#2c3a5e", robeShade: "#1d2742",
    hood: "#14100e", face: "#f0d7ae", faceRim: "#caa06a", button: "#ffd98c",
    table: "#3d1420", frameBg: "#10182e", frameBorder: "#d9b96a", frameInner: "#05070f",
    curtain: "#8e2434", label: "#e9cf8f"
  },
  geometry: {
    drapeLeftPercent: 55, drapeWidthPercent: 45, drapeTransitionOffsetPercent: 6, drapeFoldPeriodPx: 18,
    backdropGradientDeg: 90, drapeGradientDeg: 90, drapeSplitPercent: 50,
    stageAspectW: 16, stageAspectH: 9,
    candleLeftPercent: 33, candleTopPercent: 10, candleWidthPercent: 9, candleHeightPercent: 34,
    staffLeftPercent: 43, staffTopPercent: 10, staffWidthPercent: 2.2, staffHeightPercent: 46,
    figureRightPercent: 3, figureTopPercent: 6, figureWidthPercent: 36, figureHeightPercent: 82,
    tableLeftPercent: 0, tableTopPercent: 86, tableWidthPercent: 62, tableHeightPercent: 14,
    frameLeftPercent: 5, frameTopPercent: 38, frameWidthPercent: 54, frameHeightPercent: 52,
    frameHeaderPercent: 28, curtainWidthPercent: 5, frameBorderPx: 2, frameBorderMinPx: 1,
    tableRadiusPercent: 50
  },
  components: {
    candle: { stepCapPercent: 30, widthPercent: 22, baseHeightPercent: 62, altHeightDeltaPercent: 16,
              borderRadiusPercent: 12, flameLeftPercent: 22, flameTopPercent: -26, flameWidthPercent: 56,
              flameHeightPercent: 24, flameGradientStopPercent: 62 },
    staff: { borderRadiusPercent: 40, orbLeftPercent: -90, orbTopPercent: -7, orbSizePercent: 280,
             orbGradientStopPercent: 55 },
    robe: { leftPercent: 6, topPercent: 34, widthPercent: 88, heightPercent: 66, radiusTopPercent: 44, gradientDeg: 180 },
    hood: { leftPercent: 14, topPercent: 0, widthPercent: 72, heightPercent: 46, radiusBottomPercent: 46,
            radiusTopLeftPercent: 50, radiusTopRightPercent: 50 },
    face: { leftPercent: 27, topPercent: 9, widthPercent: 46, heightPercent: 30, gradientStopPercent: 58 },
    button: { leftPercent: 47, topStartPercent: 56, stepCapPercent: 11, sizePercent: 6, maxTopPercent: 92 }
  }
};
/* Single source for defaults: the fallback checkpoint table and the full
   defaults snapshot are DERIVED from the CONFIG literal above at declaration
   (deep copies, frozen) — never re-entered as a second literal table. The
   snapshot is captured BEFORE any URL override runs, so a fallback always
   returns to the authored defaults and its provenance is printable. */
const DEFAULT_CHECKPOINTS = Object.freeze(Object.assign({}, CONFIG.checkpoints));
const CONFIG_DEFAULTS = JSON.parse(JSON.stringify(CONFIG));

/* URL overrides (swap test / reuse):
   ?label=...&depth=2|3|4  subject + recursion  ·  ?pushStart=...&pushEnd=...&holdEnd=...&durationMs=...
   ?zoomStart=...&zoomEnd=...  push range  ·  ?drape=%23...&face=%23...&robe=%23...  palette
   ?candles=5  count  ·  invalid values are ignored and reported in window.__T19_DIAGNOSTICS */
const OVERRIDE_DIAGNOSTICS = [];
(function applyOverrides(){
  /* Each URL parameter is read ONCE and parsed STRICTLY: a value must be a
     complete finite number ("4junk" is rejected and reported, never truncated
     to 4). Truncation/clamping of integer fields reports requested vs
     effective values in the diagnostics record. */
  const q = new URLSearchParams(window.location.search);
  function strictNum(k){
    if (!q.has(k)) return undefined;
    const raw = q.get(k);
    const v = (typeof raw === "string" && raw.trim() !== "" && /^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(raw.trim())) ? Number(raw) : NaN;
    if (!isFinite(v)){ OVERRIDE_DIAGNOSTICS.push(k + " rejected: not a complete finite number (supplied " + JSON.stringify(raw) + ")"); return null; }
    return v;
  }
  function intParam(k, apply, min, max){
    const v = strictNum(k); if (v === undefined || v === null) return;
    const eff = Math.max(min, Math.min(max, Math.floor(v)));
    if (eff !== v) OVERRIDE_DIAGNOSTICS.push(k + " clamped: requested " + v + " -> effective " + eff);
    apply(eff);
  }
  function numParam(k, apply, rule, why){
    const v = strictNum(k); if (v === undefined || v === null) return;
    if (rule && !rule(v)){ OVERRIDE_DIAGNOSTICS.push(k + " rejected: " + why); return; }
    apply(v);
  }
  const hexOk = (v) => /^#[0-9a-fA-F]{6}$/.test(v || "");
  if (q.get("label")) CONFIG.labelText = q.get("label");
  const pb = q.get("playback");
  if (pb){ if (pb === "once" || pb === "loop") CONFIG.playbackMode = pb; else OVERRIDE_DIAGNOSTICS.push("playback rejected: not once|loop"); }
  intParam("depth", v => CONFIG.depth = v, 1, 6);
  intParam("candles", v => CONFIG.candleCount = v, 0, 8);
  const dur = strictNum("durationMs");
  if (dur !== undefined && dur !== null){
    if (dur < 2000){ OVERRIDE_DIAGNOSTICS.push("durationMs clamped: requested " + dur + " -> effective 2000"); CONFIG.durationMs = 2000; }
    else CONFIG.durationMs = dur;
  }
  numParam("pushStart", v => CONFIG.checkpoints.pushStartMs = v);
  numParam("anchor", v => CONFIG.checkpoints.anchorMs = v);
  numParam("pushEnd", v => CONFIG.checkpoints.pushEndMs = v);
  numParam("holdEnd", v => CONFIG.checkpoints.holdEndMs = v);
  numParam("zoomStart", v => CONFIG.zoomStart = v, v => v > 0, "must be > 0");
  numParam("zoomEnd", v => CONFIG.zoomEnd = v, v => v > 0, "must be > 0");
  const col = (param, key) => { const v = q.get(param); if (v){ if (hexOk(v)) CONFIG.palette[key] = v; else OVERRIDE_DIAGNOSTICS.push(param + " rejected: not #rrggbb"); } };
  col("drape", "drape"); col("face", "face"); col("robe", "robe"); col("candle", "flame");
})();

function hexToRgba(hex, alpha){
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
  return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
}

/* Checkpoint coherence — EXPLICIT REJECT/REPAIR, roles never reassigned, never sorted.
   Domain: four finite numbers; window [0, durationMs]; strictly increasing.
   Policy: (1) any non-finite value -> FALLBACK to DEFAULT_CHECKPOINTS.
   (2) otherwise REPAIR IN PLACE: clamp into the window, then a forward pass
   enforces minSeparationMs preserving the supplied order and each checkpoint's
   ROLE, then a backward pass from durationMs if the forward pass overran.
   (3) if separation cannot fit the window, separation shrinks to
   floor(durationMs/4) and the repair is flagged separationReduced; if even the
   defaults cannot fit, status stays "fallback-defaults" with that flag.
   Status is "coherent" (input untouched), "repaired" (effective != supplied,
   distinguishable from untouched), or "fallback-defaults". The effective table —
   including effectiveAnchorMs — is what computeState plays and what diagnostics
   surface during playback. */
function checkpointDiagnostics(cfg){
  const names = ["pushStartMs", "anchorMs", "pushEndMs", "holdEndMs"];
  const raw = names.map(n => cfg.checkpoints[n]);
  const errors = [];
  let sep = cfg.checkpointPolicy.minSeparationMs;
  let separationReduced = false;
  if (raw.some(v => !isFinite(v))){
    errors.push("non-finite checkpoint");
    /* fallback defaults pass through the SAME duration-aware repair as any
       supplied table, so a short durationMs can never strand them outside
       the window or collapse their separation */
    const sub = { checkpoints: DEFAULT_CHECKPOINTS, durationMs: cfg.durationMs, checkpointPolicy: cfg.checkpointPolicy };
    const repaired = checkpointDiagnostics(sub);
    return { effective: repaired.effective, status: "fallback-defaults", errors: errors,
             effectiveAnchorMs: repaired.effectiveAnchorMs, anchorRole: repaired.anchorRole,
             namedHoldMs: repaired.namedHoldMs, totalStationaryMs: repaired.totalStationaryMs,
             separationReduced: repaired.separationReduced, supplied: raw.slice(),
             allocationDegraded: repaired.allocationDegraded };
  }
  raw.forEach((v, i) => { if (v < 0 || v > cfg.durationMs) errors.push("out-of-window:" + names[i]); });
  for (let i = 1; i < raw.length; i++) if (!(raw[i] > raw[i - 1])) errors.push("not-ordered:" + names[i]);
  if (3 * sep > cfg.durationMs){ sep = Math.floor(cfg.durationMs / 4); separationReduced = true; }
  const v = raw.map(x => Math.max(0, Math.min(cfg.durationMs, x)));
  for (let i = 1; i < v.length; i++) v[i] = Math.max(v[i], v[i - 1] + sep);
  if (v[v.length - 1] > cfg.durationMs){
    v[v.length - 1] = cfg.durationMs;
    for (let i = v.length - 2; i >= 0; i--) v[i] = Math.min(v[i], v[i + 1] - sep);
  }
  const changed = v.some((x, i) => x !== raw[i]);
  const eff = {}; names.forEach((n, i) => eff[n] = v[i]);
  /* Temporal-suitability FLAG (no auto-replacement: supplied checkpoint roles
     are preserved; a degraded allocation is reported, never silently replaced).
     The flag's hold basis is TOTAL STATIONARY duration (durationMs - pushEndMs:
     the named hold span plus the continued hold after it); the named hold span
     is reported separately and is not the flag's hold basis. anchorMs is an
     OBSERVATION MARKER: it names the observed interior-populate event and is
     consumed by diagnostics and checkpoint repair only; it does not drive the
     playback curve (progress never reads it). */
  const namedHoldMs = eff.holdEndMs - eff.pushEndMs;
  const totalStationaryMs = cfg.durationMs - eff.pushEndMs;
  const allocationDegraded = (eff.pushEndMs - eff.pushStartMs) < 0.25 * cfg.durationMs
    || totalStationaryMs < 0.10 * cfg.durationMs;
  return { effective: eff, status: changed ? "repaired" : "coherent", errors: errors,
           effectiveAnchorMs: eff.anchorMs, anchorRole: "observation-marker",
           namedHoldMs: namedHoldMs, totalStationaryMs: totalStationaryMs,
           separationReduced: separationReduced, supplied: raw.slice(),
           allocationDegraded: allocationDegraded };
}
function validateCheckpoints(cfg){
  const d = checkpointDiagnostics(cfg);
  return { coherent: d.status === "coherent", errors: d.errors, status: d.status };
}
function effectiveCheckpoints(cfg){ return checkpointDiagnostics(cfg).effective; }

/* CONFIG resolution — FIELD-SPECIFIC validation, run once before first render
   (direct CONFIG edits included, not only URL overrides). Every rejection
   falls back PER FIELD to the authored default snapshot and is recorded in
   the returned diagnostics list; one rejected field never discards unrelated
   valid edits. Field table:
     durationMs            finite, > 0            (dependent: checkpoint window)
     minSeparationMs       finite, > 0            (dependent: if 3x separation
                            exceeds durationMs the repair flags
                            separationReduced instead of rejecting)
     checkpoints.<each>    finite number          (ordering handled by repair)
     depth                 integer, clamped 1..6  (clamp reported)
     candleCount           integer, clamped 0..8  (0 is a VALID zero)
     figureButtons         integer, clamped 0..6  (0 is a VALID zero)
     zoomStart / zoomEnd   finite, > 0
     flicker.amp           finite, >= 0           (0 is a VALID zero)
     labelFontFactor       finite, > 0
     labelMinPx            finite, > 0
     playbackMode          "once" | "loop"
   A null/absent checkpoints or checkpointPolicy group falls back as a group
   and never throws. */
function resolveConfig(cfg, defaults){
  const diags = [];
  const bad = (v) => typeof v !== "number" || !isFinite(v);
  function numField(obj, key, path, rule, fallback){
    const v = obj[key];
    if (bad(v) || !rule(v)){ diags.push(path + " rejected: supplied " + String(v) + " -> fallback " + fallback + " (authored default)"); obj[key] = fallback; }
  }
  function intField(obj, key, path, min, max, fallback){
    const v = obj[key];
    if (bad(v)){ diags.push(path + " rejected: supplied " + String(v) + " -> fallback " + fallback + " (authored default)"); obj[key] = fallback; return; }
    const eff = Math.max(min, Math.min(max, Math.floor(v)));
    if (eff !== v) diags.push(path + " clamped: requested " + v + " -> effective " + eff);
    obj[key] = eff;
  }
  if (!cfg.checkpoints || typeof cfg.checkpoints !== "object"){
    diags.push("checkpoints rejected: group absent -> fallback authored table");
    cfg.checkpoints = JSON.parse(JSON.stringify(defaults.checkpoints));
  }
  if (!cfg.checkpointPolicy || typeof cfg.checkpointPolicy !== "object"){
    diags.push("checkpointPolicy rejected: group absent -> fallback authored group");
    cfg.checkpointPolicy = JSON.parse(JSON.stringify(defaults.checkpointPolicy));
  }
  numField(cfg, "durationMs", "durationMs", v => v > 0, defaults.durationMs);
  numField(cfg.checkpointPolicy, "minSeparationMs", "minSeparationMs", v => v > 0, defaults.checkpointPolicy.minSeparationMs);
  ["pushStartMs", "anchorMs", "pushEndMs", "holdEndMs"].forEach(n =>
    numField(cfg.checkpoints, n, "checkpoints." + n, () => true, defaults.checkpoints[n]));
  intField(cfg, "depth", "depth", 1, 6, defaults.depth);
  intField(cfg, "candleCount", "candleCount", 0, 8, defaults.candleCount);
  intField(cfg, "figureButtons", "figureButtons", 0, 6, defaults.figureButtons);
  numField(cfg, "zoomStart", "zoomStart", v => v > 0, defaults.zoomStart);
  numField(cfg, "zoomEnd", "zoomEnd", v => v > 0, defaults.zoomEnd);
  numField(cfg.flicker, "amp", "flicker.amp", v => v >= 0, defaults.flicker.amp);
  numField(cfg, "labelFontFactor", "labelFontFactor", v => v > 0, defaults.labelFontFactor);
  numField(cfg, "labelMinPx", "labelMinPx", v => v > 0, defaults.labelMinPx);
  if (cfg.playbackMode !== "once" && cfg.playbackMode !== "loop"){
    diags.push("playbackMode rejected: supplied " + String(cfg.playbackMode) + " -> fallback " + defaults.playbackMode + " (authored default)");
    cfg.playbackMode = defaults.playbackMode;
  }
  /* Geometry derivation (resolution-time): the recursion scale and the zoom
     anchor are computed from the validated geometry here, before any
     consumer runs; no independent literal for them exists in CONFIG. */
  const G = cfg.geometry || {};
  const geomNum = (v, fb) => (typeof v === "number" && isFinite(v)) ? v : fb;
  const dFl = geomNum(G.frameLeftPercent, defaults.geometry.frameLeftPercent);
  const dFw = geomNum(G.frameWidthPercent, defaults.geometry.frameWidthPercent);
  const dFt = geomNum(G.frameTopPercent, defaults.geometry.frameTopPercent);
  const dFh = geomNum(G.frameHeightPercent, defaults.geometry.frameHeightPercent);
  const dCw = geomNum(G.curtainWidthPercent, defaults.geometry.curtainWidthPercent);
  cfg.derivedLevelScale = (dFw / 100) * ((100 - 2 * dCw) / 100);
  cfg.derivedZoomAnchorXPercent = dFl + dFw / 2;
  cfg.derivedZoomAnchorYPercent = dFt + dFh / 2;
  return diags;
}

function smoothstep(x){ x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }

/* Label legibility — the nesting factor is applied EXACTLY ONCE: the recursive
   call already passes this level's true scene width (parent scene width x
   levelScale), so the font is simply sceneWidth x labelFontFactor. The floor is
   enforced at depths 0 and 1 only. Effective sizes at a 360 px stage:
   level 0 scene 360.00 px -> 18.00 px · level 1 scene 174.96 px -> raw 8.75 px,
   floored to 11 px · level 2 scene 85.03 px -> 4.25 px (glyph-band, not legible;
   the legibility claim is three SCENE levels, matching the specimen still). */
function sceneWidthAtLevel(stageWidthPx, level, cfg){ return stageWidthPx * Math.pow(cfg.derivedLevelScale, level); }
function labelFontPx(stageWidthPx, level, cfg){
  const raw = stageWidthPx * cfg.labelFontFactor;
  if (level <= 1) return Math.max(cfg.labelMinPx, raw);
  return raw;
}
function effectiveLabelSizes(stageWidthPx, cfg){
  const out = [];
  for (let l = 0; l < cfg.depth; l++) out.push(labelFontPx(sceneWidthAtLevel(stageWidthPx, l, cfg), l, cfg));
  return out;
}
function labelLegibilityStopLevel(cfg){
  let l = 0;
  while (labelFontPx(sceneWidthAtLevel(360, l, cfg), l, cfg) >= cfg.labelMinPx && l < 12) l++;
  return l;
}

/* Displayed-state geometry model (source-bound). Nesting is ANISOTROPIC: the
   width factor per level is frame width x interior width; the height factor
   is frame height x interior height (the interior starts below the header).
   Both factors are DERIVED from CONFIG geometry here, never re-entered as
   literals; the suite asserts they equal the priced anchors. Stage height =
   stage width x CONFIG stageAspectH/stageAspectW. Header fit = the complete
   medallion-plus-label row width AND the header height at each level. Glyph
   advance model: CONFIG typography glyphAdvanceEm per glyph plus
   letter-spacing per glyph — a conservative upper-bound model, asserted in
   the own-check suite for levels 0-1 at 360 and 390 px. */
function widthFactor(cfg){ const G = cfg.geometry; return (G.frameWidthPercent / 100) * ((100 - 2 * G.curtainWidthPercent) / 100); }
function heightFactor(cfg){ const G = cfg.geometry; return (G.frameHeightPercent / 100) * ((100 - G.frameHeaderPercent) / 100); }
function stageHeightPx(stageWidthPx, cfg){ return stageWidthPx * cfg.geometry.stageAspectH / cfg.geometry.stageAspectW; }
function sceneHeightAtLevel(stageWidthPx, level, cfg){ return stageHeightPx(stageWidthPx, cfg) * Math.pow(heightFactor(cfg), level); }
function headerModel(stageWidthPx, level, cfg){
  const G = cfg.geometry, T = cfg.typography;
  const sceneW = sceneWidthAtLevel(stageWidthPx, level, cfg);
  const sceneH = sceneHeightAtLevel(stageWidthPx, level, cfg);
  const frameW = sceneW * G.frameWidthPercent / 100;
  const frameH = sceneH * G.frameHeightPercent / 100;
  const headerH = frameH * G.frameHeaderPercent / 100;
  const font = labelFontPx(sceneW, level, cfg);
  const phraseW = cfg.labelText.length * font * (T.glyphAdvanceEm + T.letterSpacingEm);
  const medallionFontPx = Math.max(T.medallionMinPx, font * T.medallionFactor);
  const medallionW = medallionFontPx * T.medallionAdvanceEm;
  const rowW = phraseW + medallionW;
  const borderPx = Math.max(G.frameBorderMinPx, G.frameBorderPx * Math.pow(cfg.derivedLevelScale, level));
  return { sceneW: sceneW, sceneH: sceneH, frameW: frameW, frameH: frameH, headerH: headerH, fontPx: font,
           phraseW: phraseW, medallionFontPx: medallionFontPx, medallionW: medallionW, rowW: rowW,
           fitsWidth: rowW <= frameW - 2 * borderPx,
           fitsHeight: font * T.lineHeight <= headerH, borderPx: borderPx };
}
/* Occlusion model: the framed picture (drawn after the hall elements, inside
   its footprint) occludes whatever hall element overlaps its rect. Visible
   fraction per element = 1 - overlap area / element area, computed on the
   element rects the renderer actually places (percent of scene width for x,
   percent of scene height for y). Recognition dimensions are derived from
   the VISIBLE REMAINDER (the span above the frame's top edge for elements
   crossing it), never from the full element span. */
function rectOverlapArea(a, b){
  const w = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
  const h = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
  return (w > 0 && h > 0) ? w * h : 0;
}
function occlusionModel(stageWidthPx, cfg){
  const G = cfg.geometry, C = cfg.components;
  const level = cfg.depth - 1;
  const sceneW = sceneWidthAtLevel(stageWidthPx, level, cfg);
  const sceneH = sceneHeightAtLevel(stageWidthPx, level, cfg);
  const frame = { x: G.frameLeftPercent, y: G.frameTopPercent, w: G.frameWidthPercent, h: G.frameHeightPercent };
  const groupBottom = G.candleTopPercent + G.candleHeightPercent;
  const candleStep = derivedStep(cfg.candleCount, C.candle.widthPercent, C.candle.stepCapPercent);
  const out = { sceneW: sceneW, sceneH: sceneH, level: level, elements: {} };
  for (let i = 0; i < cfg.candleCount; i++){
    const bodyH = (C.candle.baseHeightPercent + (i % 2) * C.candle.altHeightDeltaPercent) / 100 * G.candleHeightPercent;
    const bodyTop = groupBottom - bodyH;
    const flameTop = bodyTop + (C.candle.flameTopPercent / 100) * bodyH;
    const rect = { x: G.candleLeftPercent + (i * candleStep / 100) * G.candleWidthPercent,
                   y: flameTop, w: (C.candle.widthPercent / 100) * G.candleWidthPercent, h: groupBottom - flameTop };
    const visFrac = 1 - rectOverlapArea(rect, frame) / (rect.w * rect.h);
    const visSpanPct = Math.max(0, G.frameTopPercent - rect.y);
    out.elements["candle" + i] = { rect: rect, visibleFraction: visFrac, visibleSpanPct: visSpanPct,
      visiblePxOpening: visSpanPct / 100 * sceneH * cfg.zoomStart,
      visiblePxHold: visSpanPct / 100 * sceneH * cfg.zoomEnd,
      bodyWidthPxOpening: rect.w / 100 * sceneW * cfg.zoomStart,
      pitchPx: (candleStep / 100) * (G.candleWidthPercent / 100) * sceneW };
  }
  const staffRect = { x: G.staffLeftPercent, y: G.staffTopPercent, w: G.staffWidthPercent, h: G.staffHeightPercent };
  const staffVisSpan = Math.max(0, G.frameTopPercent - staffRect.y);
  out.elements.staff = { rect: staffRect, visibleFraction: 1 - rectOverlapArea(staffRect, frame) / (staffRect.w * staffRect.h),
    visibleSpanPct: staffVisSpan, visiblePxOpening: staffVisSpan / 100 * sceneH * cfg.zoomStart,
    visiblePxHold: staffVisSpan / 100 * sceneH * cfg.zoomEnd,
    widthPxOpening: staffRect.w / 100 * sceneW * cfg.zoomStart };
  const faceRect = { x: (100 - G.figureRightPercent - G.figureWidthPercent) + (C.face.leftPercent / 100) * G.figureWidthPercent,
                     y: G.figureTopPercent + (C.face.topPercent / 100) * G.figureHeightPercent,
                     w: (C.face.widthPercent / 100) * G.figureWidthPercent, h: (C.face.heightPercent / 100) * G.figureHeightPercent };
  out.elements.face = { rect: faceRect, visibleFraction: 1 - rectOverlapArea(faceRect, frame) / (faceRect.w * faceRect.h),
    diameterPxOpening: Math.min(faceRect.w / 100 * sceneW, faceRect.h / 100 * sceneH) * cfg.zoomStart };
  const tableRect = { x: G.tableLeftPercent, y: G.tableTopPercent, w: G.tableWidthPercent, h: G.tableHeightPercent };
  out.elements.table = { rect: tableRect, visibleFraction: 1 - rectOverlapArea(tableRect, frame) / (tableRect.w * tableRect.h) };
  out.elements.frame = { rect: frame, visibleFraction: 1 };
  out.borderPx = Math.max(G.frameBorderMinPx, G.frameBorderPx * Math.pow(cfg.derivedLevelScale, level));
  return out;
}
function deepestDetailModel(stageWidthPx, cfg){
  /* displayed widths at the deepest scene level, at the opening scale zoomStart */
  const sceneW = sceneWidthAtLevel(stageWidthPx, cfg.depth - 1, cfg);
  const candleGroupW = sceneW * cfg.geometry.candleWidthPercent / 100;
  return { sceneW: sceneW,
           candleBodyPx: candleGroupW * cfg.components.candle.widthPercent / 100 * cfg.zoomStart,
           staffPx: sceneW * cfg.geometry.staffWidthPercent / 100 * cfg.zoomStart };
}

function scenePerLevelNodes(cfg){ return 19 + cfg.figureButtons + 2 * cfg.candleCount; }
function sceneNodeCount(cfg){ return cfg.depth * scenePerLevelNodes(cfg); }

/* Pure state from time — the EFFECTIVE checkpoint table decides the push.
   Phases: settle -> push -> hold -> loopHold (continued hold). In "once"
   mode time CLAMPS at durationMs and the phase at/after durationMs is
   terminalHold (progress 1, scale zoomEnd, retained); in "loop" mode time
   wraps at durationMs as before. */
function computeState(tMs, cfg){
  const t = cfg.playbackMode === "loop"
    ? ((tMs % cfg.durationMs) + cfg.durationMs) % cfg.durationMs
    : Math.max(0, Math.min(cfg.durationMs, tMs));
  const diag = checkpointDiagnostics(cfg);
  const cp = diag.effective;
  let progress = 0;
  if (t >= cp.pushEndMs) progress = 1;
  else if (t > cp.pushStartMs) progress = smoothstep((t - cp.pushStartMs) / (cp.pushEndMs - cp.pushStartMs));
  const scale = cfg.zoomStart + (cfg.zoomEnd - cfg.zoomStart) * progress;
  const phase = (cfg.playbackMode !== "loop" && t >= cfg.durationMs) ? "terminalHold"
    : t < cp.pushStartMs ? "settle" : (t < cp.pushEndMs ? "push" : (t < cp.holdEndMs ? "hold" : "loopHold"));
  return { t: t, progress: progress, scale: scale, phase: phase, depth: cfg.depth,
           checkpointsCoherent: diag.status === "coherent", checkpointStatus: diag.status,
           effectiveCheckpoints: cp, effectiveAnchorMs: diag.effectiveAnchorMs,
           checkpointErrors: diag.errors, separationReduced: diag.separationReduced,
           anchorRole: diag.anchorRole, namedHoldMs: diag.namedHoldMs,
           totalStationaryMs: diag.totalStationaryMs,
           allocationDegraded: diag.allocationDegraded };
}

/* Count-derived spacing: the CONFIG step is a CAP; the effective step shrinks so
   count-many items always end inside their group's bounds. */
function derivedStep(count, widthPercent, stepCapPercent){
  if (count <= 1) return 0;
  return Math.min(stepCapPercent, (100 - widthPercent) / (count - 1));
}

/* ===== The ONE scene renderer — calls itself for the framed picture's interior ===== */
function el(tag, cls){ const d = document.createElement(tag); if (cls) d.className = cls; return d; }
function box(node, left, top, width, height){
  node.style.left = left + "%"; node.style.top = top + "%";
  node.style.width = width + "%"; node.style.height = height + "%";
}
function buildScene(cfg, level, stageWidthPx){
  const P = cfg.palette, G = cfg.geometry, C = cfg.components;
  const scene = el("div", "scene");
  scene.style.background = P.hall;
  const backdrop = el("div", "abs"); box(backdrop, 0, 0, 100, 100);
  backdrop.style.background = "linear-gradient(" + G.backdropGradientDeg + "deg," + P.hall + " 0%," + P.hall + " " + G.drapeLeftPercent + "%," + P.drape + " " + (G.drapeLeftPercent + G.drapeTransitionOffsetPercent) + "%," + P.drapeDark + " 100%)";
  scene.appendChild(backdrop);
  const foldHalf = G.drapeFoldPeriodPx / 2;
  const drapeLeftW = G.drapeWidthPercent * G.drapeSplitPercent / 100;
  const drapeL = el("div", "abs"); box(drapeL, G.drapeLeftPercent, 0, drapeLeftW, 100);
  drapeL.style.background = "repeating-linear-gradient(" + G.drapeGradientDeg + "deg," + P.drape + " 0px," + P.drapeFold + " " + foldHalf + "px," + P.drape + " " + G.drapeFoldPeriodPx + "px)";
  scene.appendChild(drapeL);
  const drapeR = el("div", "abs"); box(drapeR, G.drapeLeftPercent + drapeLeftW, 0, G.drapeWidthPercent - drapeLeftW, 100);
  drapeR.style.background = "repeating-linear-gradient(" + G.drapeGradientDeg + "deg," + P.drapeDark + " 0px," + P.drape + " " + foldHalf + "px," + P.drapeDark + " " + G.drapeFoldPeriodPx + "px)";
  scene.appendChild(drapeR);
  const candleGroup = el("div", "abs");
  box(candleGroup, G.candleLeftPercent, G.candleTopPercent, G.candleWidthPercent, G.candleHeightPercent);
  scene.appendChild(candleGroup);
  const candleStep = derivedStep(cfg.candleCount, C.candle.widthPercent, C.candle.stepCapPercent);
  for (let i = 0; i < cfg.candleCount; i++){
    const candle = el("div", "abs");
    candle.style.left = (i * candleStep) + "%"; candle.style.bottom = "0%";
    candle.style.width = C.candle.widthPercent + "%";
    candle.style.height = (C.candle.baseHeightPercent + (i % 2) * C.candle.altHeightDeltaPercent) + "%";
    candle.style.background = P.candleBody; candle.style.borderRadius = C.candle.borderRadiusPercent + "%";
    const flame = el("div", "abs flame");
    flame.style.left = C.candle.flameLeftPercent + "%"; flame.style.top = C.candle.flameTopPercent + "%";
    flame.style.width = C.candle.flameWidthPercent + "%"; flame.style.height = C.candle.flameHeightPercent + "%";
    flame.style.background = "radial-gradient(circle," + P.flameCore + " 0%," + P.flame + " " + C.candle.flameGradientStopPercent + "%," + hexToRgba(P.glow, 0) + " 100%)";
    flame.style.borderRadius = "50%";
    flame.dataset.phase = String((level * Math.max(1, cfg.candleCount) + i) * cfg.flicker.phaseStepRad);
    candle.appendChild(flame);
    candleGroup.appendChild(candle);
  }
  const staff = el("div", "abs");
  box(staff, G.staffLeftPercent, G.staffTopPercent, G.staffWidthPercent, G.staffHeightPercent);
  staff.style.background = P.staffWood; staff.style.borderRadius = C.staff.borderRadiusPercent + "%";
  const orb = el("div", "abs");
  orb.style.left = C.staff.orbLeftPercent + "%"; orb.style.top = C.staff.orbTopPercent + "%";
  orb.style.width = C.staff.orbSizePercent + "%"; orb.style.paddingTop = C.staff.orbSizePercent + "%";
  orb.style.background = "radial-gradient(circle," + P.flameCore + " 0%," + P.staffOrb + " " + C.staff.orbGradientStopPercent + "%," + hexToRgba(P.glow, 0) + " 100%)";
  orb.style.borderRadius = "50%";
  staff.appendChild(orb);
  scene.appendChild(staff);
  const figure = el("div", "abs");
  figure.style.right = G.figureRightPercent + "%"; figure.style.top = G.figureTopPercent + "%";
  figure.style.width = G.figureWidthPercent + "%"; figure.style.height = G.figureHeightPercent + "%";
  const robe = el("div", "abs"); box(robe, C.robe.leftPercent, C.robe.topPercent, C.robe.widthPercent, C.robe.heightPercent);
  robe.style.background = "linear-gradient(" + C.robe.gradientDeg + "deg," + P.robe + " 0%," + P.robeShade + " 100%)";
  robe.style.borderRadius = C.robe.radiusTopPercent + "% " + C.robe.radiusTopPercent + "% 0% 0%";
  figure.appendChild(robe);
  const hood = el("div", "abs"); box(hood, C.hood.leftPercent, C.hood.topPercent, C.hood.widthPercent, C.hood.heightPercent);
  hood.style.background = P.hood; hood.style.borderRadius = C.hood.radiusTopLeftPercent + "% " + C.hood.radiusTopRightPercent + "% " + C.hood.radiusBottomPercent + "% " + C.hood.radiusBottomPercent + "%";
  figure.appendChild(hood);
  const face = el("div", "abs"); box(face, C.face.leftPercent, C.face.topPercent, C.face.widthPercent, C.face.heightPercent);
  face.style.background = "radial-gradient(circle," + P.face + " " + C.face.gradientStopPercent + "%," + P.faceRim + " 100%)";
  face.style.borderRadius = "50%";
  figure.appendChild(face);
  const btnStep = cfg.figureButtons > 1
    ? Math.min(C.button.stepCapPercent, (C.button.maxTopPercent - C.button.topStartPercent - C.button.sizePercent) / (cfg.figureButtons - 1))
    : 0;
  for (let b = 0; b < cfg.figureButtons; b++){
    const btn = el("div", "abs");
    btn.style.left = C.button.leftPercent + "%"; btn.style.top = (C.button.topStartPercent + b * btnStep) + "%";
    btn.style.width = C.button.sizePercent + "%"; btn.style.paddingTop = C.button.sizePercent + "%";
    btn.style.background = P.button; btn.style.borderRadius = "50%";
    figure.appendChild(btn);
  }
  scene.appendChild(figure);
  const table = el("div", "abs");
  box(table, G.tableLeftPercent, G.tableTopPercent, G.tableWidthPercent, G.tableHeightPercent);
  table.style.background = P.table; table.style.borderRadius = G.tableRadiusPercent + "% " + G.tableRadiusPercent + "% 0% 0%";
  scene.appendChild(table);
  /* The framed picture — its interior is THIS renderer, one level deeper. */
  const frameBox = el("div", "abs");
  box(frameBox, G.frameLeftPercent, G.frameTopPercent, G.frameWidthPercent, G.frameHeightPercent);
  frameBox.style.background = P.frameBg;
  const borderPx = Math.max(G.frameBorderMinPx, G.frameBorderPx * Math.pow(cfg.derivedLevelScale, level));
  frameBox.style.border = borderPx + "px solid " + P.frameBorder;
  const header = el("div", "abs"); box(header, 0, 0, 100, G.frameHeaderPercent);
  header.style.background = P.frameBg;
  header.style.display = "flex"; header.style.alignItems = "center"; header.style.justifyContent = "center";
  const medallion = el("span", "medallion");
  medallion.textContent = cfg.medallionText; medallion.style.color = P.label;
  medallion.style.fontSize = Math.max(cfg.typography.medallionMinPx, labelFontPx(stageWidthPx, level, cfg) * cfg.typography.medallionFactor) + "px";
  medallion.style.lineHeight = String(cfg.typography.lineHeight);
  header.appendChild(medallion);
  const label = el("div", "framelabel");
  label.textContent = cfg.labelText;
  label.style.color = P.label; label.style.letterSpacing = cfg.typography.letterSpacingEm + "em";
  label.style.whiteSpace = "nowrap"; label.style.lineHeight = String(cfg.typography.lineHeight);
  label.style.fontSize = labelFontPx(stageWidthPx, level, cfg) + "px";
  header.appendChild(label);
  frameBox.appendChild(header);
  const curtainL = el("div", "abs"); box(curtainL, 0, G.frameHeaderPercent, G.curtainWidthPercent, 100 - G.frameHeaderPercent);
  curtainL.style.background = P.curtain; frameBox.appendChild(curtainL);
  const curtainR = el("div", "abs");
  curtainR.style.right = "0%"; curtainR.style.top = G.frameHeaderPercent + "%";
  curtainR.style.width = G.curtainWidthPercent + "%"; curtainR.style.height = (100 - G.frameHeaderPercent) + "%";
  curtainR.style.background = P.curtain; frameBox.appendChild(curtainR);
  const interior = el("div", "frameInterior");
  interior.style.left = G.curtainWidthPercent + "%"; interior.style.top = G.frameHeaderPercent + "%";
  interior.style.width = (100 - 2 * G.curtainWidthPercent) + "%"; interior.style.height = (100 - G.frameHeaderPercent) + "%";
  interior.style.background = P.frameInner;
  if (level + 1 < cfg.depth){
    interior.appendChild(buildScene(cfg, level + 1, stageWidthPx * cfg.derivedLevelScale));
  }
  frameBox.appendChild(interior);
  scene.appendChild(frameBox);
  return scene;
}

/* ===== Stage assembly + clock ===== */
const stage = document.getElementById("stage");
const zoomWrap = document.getElementById("zoomWrap");
const diagEl = document.getElementById("diagnostics");
const RESOLVE_DIAGNOSTICS = resolveConfig(CONFIG, CONFIG_DEFAULTS);
document.body.style.background = CONFIG.palette.bg;
document.body.style.fontFamily = CONFIG.typography.fontFamily;
zoomWrap.style.transformOrigin = CONFIG.derivedZoomAnchorXPercent + "% " + CONFIG.derivedZoomAnchorYPercent + "%";
let builtDepth = -1;
function buildAll(){
  while (zoomWrap.children.length) zoomWrap.removeChild(zoomWrap.children[0]);
  const w = stage.clientWidth || 960;
  zoomWrap.appendChild(buildScene(CONFIG, 0, w));
  builtDepth = CONFIG.depth;
}
buildAll();
window.addEventListener("resize", buildAll);

let lastDiagKey = "";
function surfaceDiagnostics(s){
  const diag = { checkpointStatus: s.checkpointStatus, effectiveCheckpoints: s.effectiveCheckpoints,
                 effectiveAnchorMs: s.effectiveAnchorMs, anchorRole: s.anchorRole,
                 namedHoldMs: s.namedHoldMs, totalStationaryMs: s.totalStationaryMs,
                 checkpointErrors: s.checkpointErrors,
                 separationReduced: s.separationReduced, overrideDiagnostics: OVERRIDE_DIAGNOSTICS,
                 resolveDiagnostics: RESOLVE_DIAGNOSTICS, allocationDegraded: s.allocationDegraded,
                 derived: { levelScale: CONFIG.derivedLevelScale, zoomAnchorXPercent: CONFIG.derivedZoomAnchorXPercent, zoomAnchorYPercent: CONFIG.derivedZoomAnchorYPercent } };
  window.__T19_DIAGNOSTICS = diag;
  const key = JSON.stringify(diag);
  if (key === lastDiagKey) return;
  lastDiagKey = key;
  if (s.checkpointStatus !== "coherent" || OVERRIDE_DIAGNOSTICS.length || RESOLVE_DIAGNOSTICS.length || s.allocationDegraded){
    diagEl.style.display = "block";
    diagEl.textContent = "checkpoints: " + s.checkpointStatus + " · anchor (observation marker) " + s.effectiveAnchorMs +
      "ms · push " + s.effectiveCheckpoints.pushStartMs + "–" + s.effectiveCheckpoints.pushEndMs +
      "ms · hold ends " + s.effectiveCheckpoints.holdEndMs + "ms" +
      (s.checkpointErrors.length ? " · " + s.checkpointErrors.join(", ") : "") +
      (s.allocationDegraded ? " · allocationDegraded: push " + (s.effectiveCheckpoints.pushEndMs - s.effectiveCheckpoints.pushStartMs) + "ms / total stationary " + s.totalStationaryMs + "ms" : "") +
      (RESOLVE_DIAGNOSTICS.length ? " · " + RESOLVE_DIAGNOSTICS.join(", ") : "") +
      (OVERRIDE_DIAGNOSTICS.length ? " · " + OVERRIDE_DIAGNOSTICS.join(", ") : "");
    if (typeof console !== "undefined" && console.warn) console.warn("T19 diagnostics", diag);
  } else {
    diagEl.style.display = "none"; diagEl.textContent = "";
  }
}

function render(tMs){
  const s = computeState(tMs, CONFIG);
  zoomWrap.style.transform = "scale(" + s.scale.toFixed(4) + ")";
  surfaceDiagnostics(s);
  const flames = zoomWrap.querySelectorAll ? zoomWrap.querySelectorAll(".flame") : [];
  for (let i = 0; i < flames.length; i++){
    const phase = parseFloat(flames[i].dataset.phase || "0");
    const v = CONFIG.flicker.amp * Math.sin(s.t / CONFIG.flicker.periodDivisorMs + phase);
    flames[i].style.opacity = String(1 - Math.abs(v));
  }
  return s;
}

let playing = false, startStamp = 0, pausedAt = 0, rafId = null;
function nowMs(){ return (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now(); }
function tick(){
  if (!playing) return;
  const s = render(nowMs() - startStamp);
  if (s.phase === "terminalHold"){ /* once mode: STOP and RETAIN the terminal frame */
    playing = false; pausedAt = CONFIG.durationMs; rafId = null; return; }
  rafId = requestAnimationFrame(tick);
}
function play(){ if (playing) return; playing = true; startStamp = nowMs() - pausedAt; tick(); }
function pause(){ if (!playing) return; pausedAt = nowMs() - startStamp; playing = false; if (rafId) cancelAnimationFrame(rafId); rafId = null; }
function restart(){ /* the ONLY return to t=0 in once mode: an explicit action */
  pausedAt = 0; if (rafId) cancelAnimationFrame(rafId); rafId = null;
  if (playing){ startStamp = nowMs(); tick(); } else { playing = false; play(); } }

window.addEventListener("message", function(e){
  if (!e.data || typeof e.data !== "object") return;
  if (e.data.cmd === "play") play();
  if (e.data.cmd === "pause") pause();
  if (e.data.cmd === "restart") restart();
});
render(0);
play();
</script>
</body>
