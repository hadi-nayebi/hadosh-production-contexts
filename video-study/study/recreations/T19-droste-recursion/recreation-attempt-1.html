<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T19 — Droste recursion · recreation</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;font-family:Georgia,'Times New Roman',serif}
  #stage{position:relative;width:100%;height:100%;overflow:hidden}
  #zoomWrap{position:absolute;inset:0}
  .scene{position:absolute;inset:0;overflow:hidden}
  .abs{position:absolute}
  .frameInterior{position:absolute;overflow:hidden}
</style>
</head>
<body>
<div id="stage"><div id="zoomWrap"></div></div>
<script>
"use strict";
/* ===== CONFIG — every shaping variable of the technique lives here; the logic below reads only CONFIG =====
   Construction: ONE pure scene renderer builds the candlelit hall (draped backdrop,
   candle cluster, glowing staff, hooded figure, table, ornate framed picture). The
   framed picture's interior is rendered by CALLING THE SAME RENDERER recursively to
   CONFIG depth — genuine Droste recursion from a single scene definition. Motion is
   CHECKPOINT-PRICED: a slow push-in zooms toward the frame's centre between the push
   checkpoints, then holds; the loop resets at durationMs. */
const CONFIG = {
  durationMs: 14000,                 /* segment window 2:16.5-2:30.5 = 14 s, loops */
  labelText: "THIS VIDEO",           /* the framed picture's header bar text (the technique's subject text) */
  depth: 3,                          /* recursion depth: nesting levels rendered by the one renderer */
  candleCount: 3,
  figureButtons: 3,
  checkpoints: { pushStartMs: 800, anchorMs: 4500, pushEndMs: 9500, holdEndMs: 13000 },
  zoomStart: 0.94,                   /* push-in start scale */
  zoomEnd: 1.20,                     /* push-in end scale (held to holdEndMs) */
  zoomAnchorXPercent: 28,            /* = frame centre X: frameLeftPercent + frameWidthPercent / 2 */
  zoomAnchorYPercent: 64,            /* = frame centre Y: frameTopPercent + frameHeightPercent / 2 */
  flickerAmp: 0.18,                  /* candle flame opacity flicker amplitude (deterministic sine of t) */
  levelScale: 0.42,                  /* approx. width ratio of one nesting level to its parent (legibility math) */
  labelFontFactor: 0.05,             /* depth-0 label font px per px of stage width */
  labelMinPx: 11,                    /* legibility floor enforced at depths 0 and 1 at phone width */
  medallionText: "✶",
  palette: {
    bg: "#07050a",
    hall: "#171019",
    drape: "#7e1f2b",
    drapeDark: "#4a121d",
    drapeFold: "#5d1724",
    candleBody: "#e8dcc0",
    flame: "#ffca7a",
    flameCore: "#fff3d0",
    glow: "#ffb35c",
    staffWood: "#6e3b22",
    staffOrb: "#ffc46b",
    robe: "#2c3a5e",
    robeShade: "#1d2742",
    hood: "#14100e",
    face: "#f0d7ae",
    faceRim: "#caa06a",
    button: "#ffd98c",
    table: "#3d1420",
    frameBg: "#10182e",
    frameBorder: "#d9b96a",
    frameInner: "#05070f",
    curtain: "#8e2434",
    label: "#e9cf8f"
  },
  geometry: {
    drapeLeftPercent: 55, drapeWidthPercent: 45,
    candleLeftPercent: 33, candleTopPercent: 30, candleWidthPercent: 9, candleHeightPercent: 24,
    staffLeftPercent: 43, staffTopPercent: 10, staffWidthPercent: 2.2, staffHeightPercent: 46,
    figureRightPercent: 3, figureTopPercent: 6, figureWidthPercent: 36, figureHeightPercent: 82,
    tableLeftPercent: 0, tableTopPercent: 86, tableWidthPercent: 62, tableHeightPercent: 14,
    frameLeftPercent: 6, frameTopPercent: 38, frameWidthPercent: 44, frameHeightPercent: 52,
    frameHeaderPercent: 20, curtainWidthPercent: 9
  }
};

/* URL overrides (swap test / reuse):
   ?label=...&depth=2|3|4  subject + recursion  ·  ?pushStart=...&pushEnd=...&holdEnd=...&durationMs=...
   ?zoomStart=...&zoomEnd=...  push range  ·  ?drape=%23...&face=%23...&robe=%23...  palette
   ?candles=5  count */
(function applyOverrides(){
  const q = new URLSearchParams(window.location.search);
  const num = (k) => { const v = parseFloat(q.get(k)); return isFinite(v) ? v : null; };
  if (q.get("label")) CONFIG.labelText = q.get("label");
  if (num("depth") !== null) CONFIG.depth = Math.max(1, Math.min(6, Math.floor(num("depth"))));
  if (num("durationMs") !== null) CONFIG.durationMs = Math.max(2000, num("durationMs"));
  if (num("candles") !== null) CONFIG.candleCount = Math.max(0, Math.min(8, Math.floor(num("candles"))));
  if (num("pushStart") !== null) CONFIG.checkpoints.pushStartMs = num("pushStart");
  if (num("anchor") !== null) CONFIG.checkpoints.anchorMs = num("anchor");
  if (num("pushEnd") !== null) CONFIG.checkpoints.pushEndMs = num("pushEnd");
  if (num("holdEnd") !== null) CONFIG.checkpoints.holdEndMs = num("holdEnd");
  if (num("zoomStart") !== null) CONFIG.zoomStart = num("zoomStart");
  if (num("zoomEnd") !== null) CONFIG.zoomEnd = num("zoomEnd");
  if (q.get("drape")) CONFIG.palette.drape = q.get("drape");
  if (q.get("face")) CONFIG.palette.face = q.get("face");
  if (q.get("robe")) CONFIG.palette.robe = q.get("robe");
  if (q.get("candle")) CONFIG.palette.flame = q.get("candle");
})();

function hexToRgba(hex, alpha){
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
  return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
}

/* Checkpoint coherence: checkpoints must be strictly ordered and inside the loop.
   A reordered or out-of-window table is reported incoherent AND normalized
   (sorted + clamped) so the state function stays monotonic — never silently used raw. */
function validateCheckpoints(cfg){
  const cp = cfg.checkpoints;
  const vals = [cp.pushStartMs, cp.anchorMs, cp.pushEndMs, cp.holdEndMs];
  const errors = [];
  for (let i = 0; i < vals.length; i++){
    if (!(vals[i] >= 0 && vals[i] <= cfg.durationMs)) errors.push("out-of-window:" + i);
    if (i > 0 && !(vals[i] > vals[i - 1])) errors.push("not-ordered:" + i);
  }
  return { coherent: errors.length === 0, errors: errors };
}
function effectiveCheckpoints(cfg){
  const cp = cfg.checkpoints;
  const vals = [cp.pushStartMs, cp.anchorMs, cp.pushEndMs, cp.holdEndMs]
    .map(v => Math.max(0, Math.min(cfg.durationMs, v))).sort((a, b) => a - b);
  return { pushStartMs: vals[0], anchorMs: vals[1], pushEndMs: vals[2], holdEndMs: vals[3] };
}

function smoothstep(x){ x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }

/* Label legibility: raw size shrinks by levelScale per nesting level; the floor is
   enforced at depths 0 and 1 only. First level whose RAW size falls under the floor
   at a 360 px stage is where the label stops being legible (priced in the record). */
function labelFontPx(stageWidthPx, level, cfg){
  const raw = stageWidthPx * cfg.labelFontFactor * Math.pow(cfg.levelScale, level);
  if (level <= 1) return Math.max(cfg.labelMinPx, raw);
  return raw;
}
function labelLegibilityStopLevel(cfg){
  /* first level whose effective (floor-applied) size falls under the floor at 360 px */
  let l = 0;
  while (labelFontPx(360, l, cfg) >= cfg.labelMinPx && l < 12) l++;
  return l;
}

/* Pure node accounting for ONE renderer: every scene level builds the same element
   census (19 structural elements + figureButtons + 2 per candle: body + flame);
   total = depth x per-level. The node harness asserts this against a real traversal. */
function scenePerLevelNodes(cfg){ return 19 + cfg.figureButtons + 2 * cfg.candleCount; }
function sceneNodeCount(cfg){ return cfg.depth * scenePerLevelNodes(cfg); }

/* Pure state from time — checkpoint table decides the push; anchor at anchorMs. */
function computeState(tMs, cfg){
  const t = ((tMs % cfg.durationMs) + cfg.durationMs) % cfg.durationMs;
  const cp = effectiveCheckpoints(cfg);
  let progress = 0;
  if (t >= cp.pushEndMs) progress = 1;
  else if (t > cp.pushStartMs) progress = smoothstep((t - cp.pushStartMs) / (cp.pushEndMs - cp.pushStartMs));
  const scale = cfg.zoomStart + (cfg.zoomEnd - cfg.zoomStart) * progress;
  const phase = t < cp.pushStartMs ? "settle" : (t < cp.pushEndMs ? "push" : (t < cp.holdEndMs ? "hold" : "reset"));
  return { t: t, progress: progress, scale: scale, phase: phase, depth: cfg.depth,
           checkpointsCoherent: validateCheckpoints(cfg).coherent };
}

/* ===== The ONE scene renderer — calls itself for the framed picture's interior ===== */
function el(tag, cls){ const d = document.createElement(tag); if (cls) d.className = cls; return d; }
function box(node, left, top, width, height){
  node.style.left = left + "%"; node.style.top = top + "%";
  node.style.width = width + "%"; node.style.height = height + "%";
}
function buildScene(cfg, level, stageWidthPx){
  const P = cfg.palette, G = cfg.geometry;
  const scene = el("div", "scene");
  scene.style.background = P.hall;
  const backdrop = el("div", "abs"); box(backdrop, 0, 0, 100, 100);
  backdrop.style.background = "linear-gradient(90deg," + P.hall + " 0%," + P.hall + " " + G.drapeLeftPercent + "%," + P.drape + " " + (G.drapeLeftPercent + 6) + "%," + P.drapeDark + " 100%)";
  scene.appendChild(backdrop);
  const drapeL = el("div", "abs"); box(drapeL, G.drapeLeftPercent, 0, G.drapeWidthPercent / 2, 100);
  drapeL.style.background = "repeating-linear-gradient(90deg," + P.drape + " 0px," + P.drapeFold + " 9px," + P.drape + " 18px)";
  scene.appendChild(drapeL);
  const drapeR = el("div", "abs"); box(drapeR, G.drapeLeftPercent + G.drapeWidthPercent / 2, 0, G.drapeWidthPercent / 2, 100);
  drapeR.style.background = "repeating-linear-gradient(90deg," + P.drapeDark + " 0px," + P.drape + " 9px," + P.drapeDark + " 18px)";
  scene.appendChild(drapeR);
  const candleGroup = el("div", "abs");
  box(candleGroup, G.candleLeftPercent, G.candleTopPercent, G.candleWidthPercent, G.candleHeightPercent);
  scene.appendChild(candleGroup);
  for (let i = 0; i < cfg.candleCount; i++){
    const candle = el("div", "abs");
    candle.style.left = (i * 30) + "%"; candle.style.bottom = "0%"; candle.style.width = "22%"; candle.style.height = (62 + (i % 2) * 16) + "%";
    candle.style.background = P.candleBody; candle.style.borderRadius = "12%";
    const flame = el("div", "abs flame");
    flame.style.left = "22%"; flame.style.top = "-26%"; flame.style.width = "56%"; flame.style.height = "24%";
    flame.style.background = "radial-gradient(circle," + P.flameCore + " 0%," + P.flame + " 62%," + hexToRgba(P.glow, 0) + " 100%)";
    flame.style.borderRadius = "50%";
    candle.appendChild(flame);
    candleGroup.appendChild(candle);
  }
  const staff = el("div", "abs");
  box(staff, G.staffLeftPercent, G.staffTopPercent, G.staffWidthPercent, G.staffHeightPercent);
  staff.style.background = P.staffWood; staff.style.borderRadius = "40%";
  const orb = el("div", "abs");
  orb.style.left = "-90%"; orb.style.top = "-7%"; orb.style.width = "280%"; orb.style.paddingTop = "280%";
  orb.style.background = "radial-gradient(circle," + P.flameCore + " 0%," + P.staffOrb + " 55%," + hexToRgba(P.glow, 0) + " 100%)";
  orb.style.borderRadius = "50%";
  staff.appendChild(orb);
  scene.appendChild(staff);
  const figure = el("div", "abs");
  figure.style.right = G.figureRightPercent + "%"; figure.style.top = G.figureTopPercent + "%";
  figure.style.width = G.figureWidthPercent + "%"; figure.style.height = G.figureHeightPercent + "%";
  const robe = el("div", "abs"); box(robe, 6, 34, 88, 66);
  robe.style.background = "linear-gradient(180deg," + P.robe + " 0%," + P.robeShade + " 100%)";
  robe.style.borderRadius = "44% 44% 0% 0%";
  figure.appendChild(robe);
  const hood = el("div", "abs"); box(hood, 14, 0, 72, 46);
  hood.style.background = P.hood; hood.style.borderRadius = "50% 50% 46% 46%";
  figure.appendChild(hood);
  const face = el("div", "abs"); box(face, 27, 9, 46, 30);
  face.style.background = "radial-gradient(circle," + P.face + " 58%," + P.faceRim + " 100%)";
  face.style.borderRadius = "50%";
  figure.appendChild(face);
  for (let b = 0; b < cfg.figureButtons; b++){
    const btn = el("div", "abs");
    btn.style.left = "47%"; btn.style.top = (56 + b * 11) + "%"; btn.style.width = "6%"; btn.style.paddingTop = "6%";
    btn.style.background = P.button; btn.style.borderRadius = "50%";
    figure.appendChild(btn);
  }
  scene.appendChild(figure);
  const table = el("div", "abs");
  box(table, G.tableLeftPercent, G.tableTopPercent, G.tableWidthPercent, G.tableHeightPercent);
  table.style.background = P.table; table.style.borderRadius = "50% 50% 0% 0%";
  scene.appendChild(table);
  /* The framed picture — its interior is THIS renderer, one level deeper. */
  const frameBox = el("div", "abs");
  box(frameBox, G.frameLeftPercent, G.frameTopPercent, G.frameWidthPercent, G.frameHeightPercent);
  frameBox.style.background = P.frameBg;
  frameBox.style.border = "2px solid " + P.frameBorder;
  const header = el("div", "abs"); box(header, 0, 0, 100, G.frameHeaderPercent);
  header.style.background = P.frameBg; header.style.textAlign = "center";
  const medallion = el("span", "medallion");
  medallion.textContent = cfg.medallionText; medallion.style.color = P.label;
  medallion.style.fontSize = Math.max(6, labelFontPx(stageWidthPx, level, cfg) * 0.8) + "px";
  header.appendChild(medallion);
  const label = el("div", "framelabel");
  label.textContent = cfg.labelText;
  label.style.color = P.label; label.style.letterSpacing = "0.14em";
  label.style.fontSize = labelFontPx(stageWidthPx, level, cfg) + "px";
  header.appendChild(label);
  frameBox.appendChild(header);
  const curtainL = el("div", "abs"); box(curtainL, 0, G.frameHeaderPercent, G.curtainWidthPercent, 100 - G.frameHeaderPercent);
  curtainL.style.background = P.curtain; frameBox.appendChild(curtainL);
  const curtainR = el("div", "abs");
  curtainR.style.right = "0%"; curtainR.style.top = G.frameHeaderPercent + "%";
  curtainR.style.width = G.curtainWidthPercent + "%"; curtainR.style.height = (100 - G.frameHeaderPercent) + "%";
  curtainR.style.background = P.curtain; frameBox.appendChild(curtainR);
  const interior = el("div", "frameInterior");
  interior.style.left = G.curtainWidthPercent + "%"; interior.style.top = G.frameHeaderPercent + "%";
  interior.style.width = (100 - 2 * G.curtainWidthPercent) + "%"; interior.style.height = (100 - G.frameHeaderPercent) + "%";
  interior.style.background = P.frameInner;
  if (level + 1 < cfg.depth){
    interior.appendChild(buildScene(cfg, level + 1, stageWidthPx * cfg.levelScale));
  }
  frameBox.appendChild(interior);
  scene.appendChild(frameBox);
  return scene;
}

/* ===== Stage assembly + clock ===== */
const stage = document.getElementById("stage");
const zoomWrap = document.getElementById("zoomWrap");
document.body.style.background = CONFIG.palette.bg;
zoomWrap.style.transformOrigin = CONFIG.zoomAnchorXPercent + "% " + CONFIG.zoomAnchorYPercent + "%";
let builtDepth = -1;
function buildAll(){
  while (zoomWrap.children.length) zoomWrap.removeChild(zoomWrap.children[0]);
  const w = stage.clientWidth || 960;
  zoomWrap.appendChild(buildScene(CONFIG, 0, w));
  builtDepth = CONFIG.depth;
}
buildAll();
window.addEventListener("resize", buildAll);

let lastFlameKey = "";
function render(tMs){
  const s = computeState(tMs, CONFIG);
  zoomWrap.style.transform = "scale(" + s.scale.toFixed(4) + ")";
  const flick = (CONFIG.flickerAmp * Math.sin(s.t / 170)).toFixed(3);
  if (flick !== lastFlameKey){
    lastFlameKey = flick;
    const flames = zoomWrap.querySelectorAll ? zoomWrap.querySelectorAll(".flame") : [];
    for (let i = 0; i < flames.length; i++) flames[i].style.opacity = String(1 - Math.abs(parseFloat(flick)));
  }
  return s;
}

let playing = false, startStamp = 0, pausedAt = 0, rafId = null;
function nowMs(){ return (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now(); }
function tick(){ if (!playing) return; render(nowMs() - startStamp); rafId = requestAnimationFrame(tick); }
function play(){ if (playing) return; playing = true; startStamp = nowMs() - pausedAt; tick(); }
function pause(){ if (!playing) return; pausedAt = nowMs() - startStamp; playing = false; if (rafId) cancelAnimationFrame(rafId); rafId = null; }
function restart(){ pausedAt = 0; lastFlameKey = ""; if (playing){ startStamp = nowMs(); } else { render(0); } }

window.addEventListener("message", function(e){
  if (!e.data || typeof e.data !== "object") return;
  if (e.data.cmd === "play") play();
  if (e.data.cmd === "pause") pause();
  if (e.data.cmd === "restart") restart();
});
render(0);
play();
</script>
</body>
</html>
