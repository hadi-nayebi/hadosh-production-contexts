<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T192 — giant pixel numeral, parameterized recreation</title>
<style>
  html,body{margin:0;padding:0;background:#111;}
  #stage{position:relative;width:960px;max-width:100%;margin:0 auto;background:#000;}
  canvas{display:block;width:100%;height:auto;background:#000;}
</style></head><body>
<div id="stage"><canvas id="cv" width="960" height="540"></canvas></div>
<script>
"use strict";
/* ============ CONFIG — every parameter-table key (plan as amended, Cycle 035) ============ */
const CONFIG = {
  text: { numeral: "1971", line: "DESPITE THIS, CAPTIONS HAVE REMAINED UNCHANGED, SINCE 1971" },
  palette: { bg: "#000000", fg: "#ffffff", reserve: "#ffffff" },
  flow: { directionDeg: 90, streamVelocityPxPerSec: 140 },
  particle: {
    poolFromTargets: true, poolCountMin: 900, reserveFraction: 0.25,
    sizePx: 5, jitterPx: 1.5,
    borrowOpacity: 1.0, reserveOpacity: 0.35, reserveHoldOpacity: 0.0,
    surplusHoldOpacity: 0.0, looseHoldOpacity: 0.0,
    travelMs: 180, clusterFraction: 0.4, clusterBandRowNorm: 0.35, borrowJitterMs: 40,
    releaseMs: 300, releaseRowSpreadMs: 200, releaseJitterMs: 150,
    jitterPeriod1Ms: 90, jitterPeriod2Ms: 110
  },
  grid: { sampleStepPx: 5 },
  numeral: { widthFraction: 0.70, heightFractionMax: 0.44, centerYFraction: 0.47, capHeightRatio: 0.72, fontWeight: 900, fontFamily: "monospace" },
  line: { sizeFraction: 0.028, yFraction: 0.875, fadeMs: 300, fontWeight: 700, fontFamily: "monospace" },
  time: { clusterLeadMs: 350, formationStartMs: 1000, formationDurationMs: 1000, frontSweepMs: 700, exitStartMs: 4000, exitDurationMs: 1000 },
  seed: 19211
};
/* URL-param swap overrides: ?numeral=2049&formationDurationMs=1600&fg=%23ffd23f&line=... */
(function applyParams(){
  try{
    const q = new URLSearchParams(location.search);
    if(q.get("numeral")) CONFIG.text.numeral = q.get("numeral");
    if(q.get("line")) CONFIG.text.line = q.get("line");
    if(q.get("fg")) CONFIG.palette.fg = q.get("fg");
    if(q.get("formationDurationMs")) CONFIG.time.formationDurationMs = parseFloat(q.get("formationDurationMs"));
    if(q.get("formationStartMs")) CONFIG.time.formationStartMs = parseFloat(q.get("formationStartMs"));
  }catch(e){}
})();

/* ============ seeded RNG (mulberry32) ============ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ============ logical canvas ============ */
const W = 960, H = 540;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const T = CONFIG.time, P = CONFIG.particle;
const dirRad = CONFIG.flow.directionDeg * Math.PI/180;
const VX = Math.cos(dirRad) * CONFIG.flow.streamVelocityPxPerSec;
const VY = Math.sin(dirRad) * CONFIG.flow.streamVelocityPxPerSec;

/* ============ A1.2 runtime sampling of config-rendered text ============ */
function sampleTargets(){
  const off = document.createElement("canvas"); off.width = W; off.height = H;
  const o = off.getContext("2d");
  let fontPx = 300;
  o.font = CONFIG.numeral.fontWeight + " " + fontPx + "px " + CONFIG.numeral.fontFamily;
  const w0 = Math.max(1, o.measureText(CONFIG.text.numeral).width);
  fontPx = fontPx * (CONFIG.numeral.widthFraction * W) / w0;
  const maxFontByHeight = (CONFIG.numeral.heightFractionMax * H) / CONFIG.numeral.capHeightRatio;
  if(fontPx > maxFontByHeight) fontPx = maxFontByHeight;
  o.font = CONFIG.numeral.fontWeight + " " + fontPx + "px " + CONFIG.numeral.fontFamily;
  o.fillStyle = "#ffffff"; o.textAlign = "center"; o.textBaseline = "middle";
  o.fillText(CONFIG.text.numeral, W/2, CONFIG.numeral.centerYFraction * H);
  const img = o.getImageData(0, 0, W, H).data;
  const step = CONFIG.grid.sampleStepPx, targets = [];
  for(let y = step/2; y < H; y += step){
    for(let x = step/2; x < W; x += step){
      const a = img[((Math.floor(y)*W + Math.floor(x))*4) + 3];
      if(a > 128) targets.push({ x: x, y: y });
    }
  }
  return targets;
}

const targets = sampleTargets();
targets.sort((a,b)=> (a.y-b.y) || (a.x-b.x));
let minY = 1e9, maxY = -1e9;
for(const t of targets){ if(t.y<minY)minY=t.y; if(t.y>maxY)maxY=t.y; }
const spanY = Math.max(1, maxY-minY);
for(const t of targets) t.rowNorm = (t.y-minY)/spanY;

/* ============ pool: budgeted from sampled targets (A9.3) ============ */
const rng = mulberry32(CONFIG.seed);
let reserveCount = Math.ceil(targets.length * CONFIG.particle.reserveFraction / (1 - CONFIG.particle.reserveFraction));
let poolTotal = targets.length + reserveCount;
let surplusCount = 0;
if(CONFIG.particle.poolFromTargets && poolTotal < CONFIG.particle.poolCountMin){
  surplusCount = CONFIG.particle.poolCountMin - poolTotal; poolTotal = CONFIG.particle.poolCountMin;
}
const particles = [];
function streamInit(){ return { sx: rng()*W, sy: rng()*H, ph: rng()*Math.PI*2 }; }
for(let i=0;i<targets.length;i++){
  const tg = targets[i], r1 = rng(), r2 = rng();
  let borrowStart;
  if(tg.rowNorm < P.clusterBandRowNorm && r1 < P.clusterFraction){
    borrowStart = (T.formationStartMs - T.clusterLeadMs) + (r1 / P.clusterFraction) * T.clusterLeadMs;
  } else {
    borrowStart = T.formationStartMs + tg.rowNorm * T.frontSweepMs + (r2 - 0.5) * P.borrowJitterMs;
  }
  particles.push({ kind:"borrower", target: tg, borrowStart: borrowStart, lockAt: borrowStart + P.travelMs,
    releaseStart: T.exitStartMs + tg.rowNorm * P.releaseRowSpreadMs + rng()*P.releaseJitterMs, s: streamInit() });
}
for(let i=0;i<reserveCount;i++) particles.push({ kind:"reserve", s: streamInit() });
for(let i=0;i<surplusCount;i++) particles.push({ kind:"surplus", s: streamInit() });

/* ============ flow field: ONE constant field; stream position is a pure function of t ============ */
function streamPos(p, tMs){
  const dt = tMs/1000;
  let x = (p.s.sx + VX*dt) % W; if(x<0)x+=W;
  let y = (p.s.sy + VY*dt) % H; if(y<0)y+=H;
  return { x:x, y:y };
}
function streamPosRaw(p, tMs){ const dt=tMs/1000; return { x: p.s.sx + VX*dt, y: p.s.sy + VY*dt }; }
function ease(u){ return 1-(1-u)*(1-u); }
function phaseAt(t){
  if(t < T.formationStartMs - T.clusterLeadMs) return "PRE";
  if(t < T.formationStartMs + T.formationDurationMs) return "FORM";
  if(t < T.exitStartMs) return "HOLD";
  if(t < T.exitStartMs + T.exitDurationMs) return "RELEASE";
  return "DONE";
}
function lineOpacityAt(t){
  const start = T.formationStartMs - CONFIG.line.fadeMs;
  if(t <= start) return 0;
  if(t >= T.formationStartMs) return 1;
  return (t - start) / CONFIG.line.fadeMs;
}
function borrowerState(p, t){
  if(t < p.borrowStart) return { state:"stream", pos: streamPos(p,t), opacity: P.reserveOpacity };
  if(t < p.lockAt){
    const u = (t - p.borrowStart) / P.travelMs, e = ease(u), sp = streamPos(p, p.borrowStart);
    const jx = Math.sin(p.s.ph + t/P.jitterPeriod1Ms)*P.jitterPx*u, jy = Math.cos(p.s.ph + t/P.jitterPeriod2Ms)*P.jitterPx*u;
    return { state:"borrowing", pos:{ x: sp.x + (p.target.x-sp.x)*e + jx, y: sp.y + (p.target.y-sp.y)*e + jy },
             opacity: P.reserveOpacity + (P.borrowOpacity - P.reserveOpacity)*u };
  }
  if(t < p.releaseStart) return { state:"locked", pos:{ x:p.target.x, y:p.target.y }, opacity: P.borrowOpacity };
  if(t < p.releaseStart + P.releaseMs){
    const dt = (t - p.releaseStart)/1000;
    return { state:"released", pos:{ x:p.target.x + VX*dt, y:p.target.y + VY*dt },
             opacity: P.borrowOpacity + (P.reserveOpacity - P.borrowOpacity)*((t-p.releaseStart)/P.releaseMs) };
  }
  return { state:"stream", pos: streamPos(p,t), opacity: P.reserveOpacity };
}
function looseOpacity(kind, phase){
  if(phase === "HOLD"){
    if(kind === "reserve") return P.reserveHoldOpacity;
    if(kind === "surplus") return P.surplusHoldOpacity;
    return P.looseHoldOpacity;
  }
  return P.reserveOpacity;
}

/* ============ state function (own-check assertions evaluate this) ============ */
function stateAt(t){
  const phase = phaseAt(t);
  let locked = 0, topBorrowed = 0, topTotal = 0, looseVisible = 0, rainBelow = 0;
  const frontNorm = Math.min(1, Math.max(0, (t - T.formationStartMs)/T.formationDurationMs));
  const frontY = minY + frontNorm * spanY;
  let aboveTotal = 0, aboveLocked = 0;
  for(const tg of targets){ if(tg.rowNorm < 0.25){ topTotal++; } if(tg.rowNorm <= frontNorm*0.8) aboveTotal++; }
  for(const p of particles){
    if(p.kind === "borrower"){
      const st = borrowerState(p, t);
      if(st.state === "locked") locked++;
      if(p.target.rowNorm < 0.25 && t >= p.borrowStart) topBorrowed++;
      if(p.target.rowNorm <= frontNorm*0.8 && st.state === "locked") aboveLocked++;
      if(st.state !== "locked"){
        const op = (st.state === "stream" || st.state === "borrowing") ? looseOpacity("borrower", phase) : st.opacity;
        const eff = (phase === "HOLD" && st.state !== "released") ? op : st.opacity;
        if(phase === "HOLD" ? eff > 0.02 : st.opacity > 0.02) looseVisible++;
        if(st.pos.y > frontY && st.opacity > 0.02) rainBelow++;
      }
    } else {
      const op = looseOpacity(p.kind, phase);
      if(op > 0.02) looseVisible++;
      const pos = streamPos(p, t);
      if(pos.y > frontY && op > 0.02) rainBelow++;
    }
  }
  return { t:t, phase:phase, occupancy: targets.length ? locked/targets.length : 0, locked:locked,
    targetCount: targets.length, topBandBorrowedFraction: topTotal ? topBorrowed/topTotal : 0,
    rowsAboveFrontOccupancy: aboveTotal ? aboveLocked/aboveTotal : 1,
    rainBelowFrontCount: rainBelow, visibleLooseCount: looseVisible, lineOpacity: lineOpacityAt(t),
    counts:{ targets: targets.length, reserve: reserveCount, surplus: surplusCount, pool: poolTotal } };
}

/* ============ render ============ */
function render(t){
  ctx.fillStyle = CONFIG.palette.bg; ctx.fillRect(0,0,W,H);
  const phase = phaseAt(t);
  for(const p of particles){
    if(p.kind === "borrower") continue;
    const op = looseOpacity(p.kind, phase);
    if(op <= 0.01) continue;
    const pos = streamPos(p, t);
    ctx.globalAlpha = op; ctx.fillStyle = CONFIG.palette.reserve;
    ctx.fillRect(pos.x - P.sizePx/2, pos.y - P.sizePx/2, P.sizePx, P.sizePx);
  }
  for(const p of particles){
    if(p.kind !== "borrower") continue;
    const st = borrowerState(p, t);
    let op = st.opacity;
    if(phase === "HOLD" && st.state !== "locked") op = looseOpacity("borrower", phase);
    if(op <= 0.01) continue;
    ctx.globalAlpha = op; ctx.fillStyle = CONFIG.palette.fg;
    const sz = st.state === "locked" ? CONFIG.grid.sampleStepPx : P.sizePx;
    ctx.fillRect(st.pos.x - sz/2, st.pos.y - sz/2, sz, sz);
  }
  ctx.globalAlpha = 1;
  const lo = lineOpacityAt(t);
  if(lo > 0.01){
    ctx.globalAlpha = lo; ctx.fillStyle = CONFIG.palette.fg;
    ctx.font = CONFIG.line.fontWeight + " " + (CONFIG.line.sizeFraction*H) + "px " + CONFIG.line.fontFamily;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(CONFIG.text.line, W/2, CONFIG.line.yFraction*H);
    ctx.globalAlpha = 1;
  }
}
/* Controllable clock: free-running (looping) by default; the comparison page
   slaves this clock to the video's currentTime through seek()/setPaused()
   (single mapping recreationMs = videoMs - 500). seek() is a NON-LOOPING
   clamped follower: it clamps to 0…CYCLE_MS and never wraps — the loop lives
   only in the standalone internal clock above, never in seek(). */
const CYCLE_MS = T.exitStartMs + T.exitDurationMs;
let baseT = 0, baseStamp = null, isPaused = false, lastT = 0, follower = false;
function frame(ts){
  if(baseStamp === null) baseStamp = ts;
  if(!isPaused){
    const rawT = baseT + (ts - baseStamp);
    /* Standalone free-running clock loops in its internal clock only;
       a seeked (comparison follower) clock clamps at cycle end, never wraps. */
    lastT = follower ? Math.min(rawT, CYCLE_MS) : rawT % CYCLE_MS;
  }
  render(lastT);
  requestAnimationFrame(frame);
}
if(typeof requestAnimationFrame === "function") requestAnimationFrame(frame);

/* harness + comparison-control exposure */
const api = { CONFIG: CONFIG, stateAt: stateAt, borrowerState: borrowerState, streamPosRaw: streamPosRaw,
  streamPos: streamPos, particles: particles, targets: targets, phaseAt: phaseAt, lineOpacityAt: lineOpacityAt,
  cycleMs: CYCLE_MS,
  seek: function(ms){ follower = true; baseT = Math.min(CYCLE_MS, Math.max(0, ms)); baseStamp = null; lastT = baseT; render(lastT); },
  setPaused: function(p){ if(p){ baseT = lastT; } baseStamp = null; isPaused = !!p; },
  currentMs: function(){ return lastT; } };
if(typeof window !== "undefined") window.__T192 = api;
if(typeof globalThis !== "undefined") globalThis.__T192 = api;
</script></body></html>
