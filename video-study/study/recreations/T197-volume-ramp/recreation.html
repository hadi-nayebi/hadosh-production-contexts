var EASINGS = {
  "easeInOut": function(p){ return p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2; },

function resolveEnv(cfg, w){

    var s = cfg.sharedEnvelopes[w.envelopeRef];
    return { envOnsetMs: s.envOnsetMs, rampUpMs: s.rampMs, rampDownMs: 0, peakHoldMs: 0, sizePeak: s.sizePeak, weightPeak: s.weightPeak, persist: !!s.persist };
  }
  return { envOnsetMs: w.envOnsetMs, rampUpMs: w.rampUpMs, rampDownMs: w.rampDownMs, peakHoldMs: w.peakHoldMs || 0, sizePeak: w.sizePeak, weightPeak: w.weightPeak, persist: !!w.persist };
}

  var speechEnd = line.speechEndMs || 0, transientEnd = 0, i, w, e;

    w = line.words[i]; e = resolveEnv(cfg, w);

}

  for (li = 0; li < cfg.lines.length; li++) {
    var line = cfg.lines[li], rel = lineReleaseMs(cfg, line);
    releases.push(rel);
    if (li > 0) {
      for (wi = 0; wi < line.words.length; wi++) {
        var w = line.words[wi], e = resolveEnv(cfg, w);
        if ((e.sizePeak !== 1.0 || e.weightPeak !== cfg.baseWeight) && e.envOnsetMs < prevRelease && cfg.ownershipPolicy === "clamp-and-print") {

        }

    }
    prevRelease = rel;
  }
  return { releases: releases, clamps: clamps };
}
function effectiveEnvOnset(cfg, ownership, lineIdx, w){
  var e = resolveEnv(cfg, w), onset = e.envOnsetMs;
  if (lineIdx > 0 && cfg.ownershipPolicy === "clamp-and-print") {
    for (var i = 0; i < ownership.clamps.length; i++) {
      if (ownership.clamps[i].word === w.text && ownership.clamps[i].requestedOnset === e.envOnsetMs) onset = ownership.clamps[i].clampedOnset;
    }
  }
  return onset;
}
function envelopeAt(cfg, e, onset, t){
  var ease = EASINGS[cfg.easingName] || EASINGS.easeInOut;
  if (t < onset) return 0;
  var peakAt = onset + e.rampUpMs;
  if (t < peakAt) return e.rampUpMs > 0 ? ease((t - onset)/e.rampUpMs) : 1;
  if (t < peakAt + e.peakHoldMs) return 1;
  if (e.persist) return 1;
  var decayStart = peakAt + e.peakHoldMs;
  if (t < decayStart + e.rampDownMs) return e.rampDownMs > 0 ? 1 - ease((t - decayStart)/e.rampDownMs) : 0;
  return 0;
}
function wordStateAt(cfg, ownership, lineIdx, w, t){
  var e = resolveEnv(cfg, w);
  var onset = effectiveEnvOnset(cfg, ownership, lineIdx, w);
  var env = envelopeAt(cfg, e, onset, t);
  var minRatio = cfg.minSizePctOfStage / cfg.baseSizePctOfStage;
  var ratio = 1 + (e.sizePeak - 1) * env;
  var fitFail = false;
  if (ratio < minRatio) { ratio = minRatio; fitFail = true; }
  return {
    env: env,
    sizeRatio: ratio,
    sizePctOfStage: cfg.baseSizePctOfStage * ratio,
    weight: Math.round(cfg.baseWeight + (e.weightPeak - cfg.baseWeight) * env),
    spoken: t >= w.onsetMs,
    fitFail: fitFail
  };
}
function buildStateAt(cfg, t){
  var ownership = computeOwnership(cfg);
  var out = { t: t, ownership: ownership, lines: [], fitFail: false };
  for (var li = 0; li < cfg.lines.length; li++) {
    var line = cfg.lines[li], lo = { id: line.id, opacity: 1, words: [] };
    if (li < cfg.lines.length - 1) {
      var rel = ownership.releases[li];
      if (t >= rel + cfg.lineExitMs) lo.opacity = 0;
      else if (t >= rel) lo.opacity = 1 - (t - rel)/cfg.lineExitMs;
    }
    for (var wi = 0; wi < line.words.length; wi++) {
      var st = wordStateAt(cfg, ownership, li, line.words[wi], t);

}

  stage.style.fontFamily = CONFIG.fontStack;
  var ownership0 = computeOwnership(CONFIG);
  if (ownership0.clamps.length) { try { console.log("OWNERSHIP-CLAMP " + JSON.stringify(ownership0.clamps)); } catch (e) {} }

      g.style.width = (W * (1 - 2 * CONFIG.guideInsetPct/100)) + "px";
      g.style.height = CONFIG.guideThicknessPx + "px";
      g.style.background = CONFIG.guideColor;
      g.style.top = (H * (i === 0 ? (50 - CONFIG.guideGapPctOfStage/2)/100 : (50 + CONFIG.guideGapPctOfStage/2)/100)) + "px";
    });
    var narrowStage = (W / H) <= CONFIG.narrowStageAspectMax;
    var lineTops = narrowStage ? CONFIG.narrowLineTopPctOfStage : CONFIG.lineTopPctOfStage;
    CONFIG.lines.forEach(function(line, li){
      var el = document.getElementById(line.id);
      el.style.top = (H * lineTops[li]/100) + "px";
      el.style.lineHeight = CONFIG.lineHeight;
    });
    return H;
  }

    var el = document.getElementById(line.id), arr = [];

      s.className = "word"; s.textContent = w.text;

      arr.push(s);
    });
    spans.push(arr);
