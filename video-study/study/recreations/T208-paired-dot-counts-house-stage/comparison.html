<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T208 — Comparison</title>
<style>
  html,body{margin:0;padding:0;font-family:system-ui,sans-serif;background:#efece5;}
  #bar{display:flex;gap:8px;align-items:center;padding:10px;flex-wrap:wrap;}
  #bar button{padding:10px 16px;font-size:15px;cursor:pointer;}
  #sides{display:flex;gap:10px;padding:0 10px 10px;}
  .side{flex:1;min-width:0;}
  .side h2{font-size:15px;margin:4px 0;}
  .side video,.side iframe{width:100%;aspect-ratio:16/9;border:1px solid #999;background:#000;display:block;}
  .side iframe{background:#f4f1ea;}
  @media (max-width:640px){ #sides{flex-direction:column;} }
</style>
</head>
<body>
<div id="bar">
  <button id="btnPlay" type="button">Play both</button>
  <button id="btnRestart" type="button">Restart both</button>
  <span id="clock">0.0s / 19.0s</span>
</div>
<div id="sides">
  <div class="side">
    <h2>ORIGINAL — Vox Electoral College, paired dot counts @ 83.5–102.5s</h2>
    <video id="orig" src="segment.mp4" preload="auto" playsinline></video>
  </div>
  <div class="side">
    <h2>RECREATION — T208 paired dot counts, House stage, parameterized</h2>
    <iframe id="rec" src="recreation.html" title="recreation"></iframe>
  </div>
</div>
<script>
(function(){
  var orig=document.getElementById('orig'), rec=document.getElementById('rec');
  var btn=document.getElementById('btnPlay'), clock=document.getElementById('clock');
  var raf=null;
  function recRender(ms){ try{ var w=rec.contentWindow; if(w && w.__T208Render) w.__T208Render(ms); }catch(e){} }
  function sync(){ if(!orig.paused){ recRender(orig.currentTime*1000); clock.textContent=orig.currentTime.toFixed(1)+'s / 19.0s'; raf=requestAnimationFrame(sync); } }
  btn.addEventListener('click',function(){
    if(orig.paused){ orig.play(); btn.textContent='Pause both'; sync(); }
    else { orig.pause(); btn.textContent='Play both'; if(raf) cancelAnimationFrame(raf); recRender(orig.currentTime*1000); }
  });
  document.getElementById('btnRestart').addEventListener('click',function(){ orig.currentTime=0; recRender(0); orig.play(); btn.textContent='Pause both'; sync(); });
  orig.addEventListener('seeked',function(){ recRender(orig.currentTime*1000); });
  orig.addEventListener('ended',function(){ btn.textContent='Play both'; });
})();
</script>
</body>
</html>
