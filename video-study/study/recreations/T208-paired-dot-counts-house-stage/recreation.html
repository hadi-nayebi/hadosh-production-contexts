<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T208 — Paired dot counts, House stage (recreation)</title>
<style>
  html,body{margin:0;padding:0;background:#ddd6c9;font-family:Georgia,'Times New Roman',serif;}
  #wrap{max-width:960px;margin:0 auto;padding:8px;}
  #stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:1px solid #b9b2a2;}
  .colLabel{position:absolute;}
  .colName{font-weight:bold;}
  .colPop{font-variant-numeric:tabular-nums;}
  .tileLayer,.dotLayer,.annotLayer{position:absolute;left:0;top:0;width:100%;height:100%;}
  .tile{position:absolute;}
  #controls{display:flex;gap:8px;align-items:center;padding:8px 0;font-family:system-ui,sans-serif;font-size:14px;}
  #controls button{padding:8px 14px;font-size:14px;cursor:pointer;}
  #seek{flex:1;}
  .ratioLabel{position:absolute;font-weight:bold;font-variant-numeric:tabular-nums;}
  .phSquare{position:absolute;}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"></div>
  <div id="controls">
    <button id="btnPlay" type="button">Play</button>
    <button id="btnRestart" type="button">Restart</button>
    <input id="seek" type="range" min="0" max="19000" step="10" value="0">
    <span id="clock">0.0s</span>
  </div>
</div>

<script id="core">
'use strict';
const CONFIG = {
  stageW: 960, stageH: 540,
  boardTop: 150, labelBandH: 104, annotationBandH: 96,
  durationMs: 19000,
  countUpEasing: 'linear',
  cascadeMs: 1350, dotSettleMs: 220, tileFadeMs: 900, tileFadeLeadMs: 600, tileFadedOpacity: 0.12,
  tileContrastGate: 0.55,
  placeholderMorphMs: 600, placeholderTileFadeStartMs: 6000,
  dotR: 13, dotGap: 21, dotLandScaleFrom: 1.6, dotLandDy: -8, fillOrder: 'column',
  ratioMode: 'derived', ratioRounding: 1000,
  annotationAnchorMs: 13000, holdAfterCountMs: 1200, arrowDrawMs: 3000, arrowCurve: 0.35,
  entranceTransitionMs: 1000, entranceRisePx: 12,
  tileDissolveTailMs: 80, dotFadeBaseOpacity: 0.35, morphDotBaseOpacity: 0.3, morphScaleFrom: 0.55,
  labelTop: 18, labelColW: 360, placeholderSize: 26, placeholderDx: 40, placeholderDy: 40,
  annotLabelOffsetY: 300, arrowTargetDx: 60, arrowTargetDy: 290, arrowDashLen: 300, arrowStrokeW: 5,
  silhouetteTintOpacity: 0.25, fontStack: "Georgia,'Times New Roman',serif",
  personGlyph: true,
  textureOn: true, textureOpacity: 0.05,
  seed: 208,
  palette: { paper:'#f4f1ea', ink:'#111111', tile:'#3a3a38', tileFaded:'#c9c9c7', arrow:'#5b84ae', text:'#333333' },
  typeScale: { name:44, population:36, ratio:40 },
  maxCountPerColumn: 64, maxGridCols: 12, boardMaxGridW: 360, boardMaxGridH: 330,
  columns: [
    { id:'tx', label:'Texas', population:25268000, count:36, gridCols:6, x:130,
      countUpMs:1800, ratioLabelDx:300, ratioLabelDy:6,
      tile:{ w:290, h:290, silhouette:'tx' },
      events:{ entranceMs:500, countUpStartMs:1500, revealMode:'cascade', revealAnchorMs:6430, spokenCueMs:6930 } },
    { id:'vt', label:'Vermont', population:630000, count:1, gridCols:1, x:570,
      countUpMs:1500, ratioLabelDx:-150, ratioLabelDy:6,
      tile:{ w:175, h:175, silhouette:'vt' },
      events:{ entranceMs:3630, countUpStartMs:4130, revealMode:'morph', revealAnchorMs:10210, spokenCueMs:10210 } }
  ]
};
function clamp01(v){ return v<0?0:(v>1?1:v); }
function derivedRatio(col){
  if(CONFIG.ratioMode!=='derived') return null;
  if(!col.count || col.count<1) return null;
  return Math.round((col.population/col.count)/CONFIG.ratioRounding)*CONFIG.ratioRounding;
}
function fmt(n){ return n.toLocaleString('en-US'); }
function compileSchedule(cfg){
  const cols=[]; let prevSettle=0; let maxSettle=0;
  cfg.columns.forEach(function(col,idx){
    const ev=col.events;
    const entranceStart=ev.entranceMs, entranceEnd=entranceStart+cfg.entranceTransitionMs;
    const countUpStart=ev.countUpStartMs, countUpEnd=countUpStart+col.countUpMs;
    let revealStart, revealSettle, stagger=0;
    if(ev.revealMode==='cascade'){
      revealStart=Math.max(ev.revealAnchorMs, prevSettle);
      stagger = col.count>1 ? (cfg.cascadeMs-cfg.dotSettleMs)/Math.max(col.count-1,1) : 0;
      revealSettle = col.count>1 ? revealStart+cfg.cascadeMs : revealStart+cfg.dotSettleMs;
    } else {
      revealStart=Math.max(ev.revealAnchorMs, prevSettle);
      revealSettle=revealStart+cfg.placeholderMorphMs;
    }
    prevSettle=revealSettle; if(revealSettle>maxSettle) maxSettle=revealSettle;
    cols.push({ idx:idx, entranceStart:entranceStart, entranceEnd:entranceEnd,
      countUpStart:countUpStart, countUpEnd:countUpEnd,
      revealStart:revealStart, revealSettle:revealSettle, stagger:stagger });
  });
  const annotationStart=Math.max(cfg.annotationAnchorMs, maxSettle+cfg.holdAfterCountMs);
  return { cols:cols, annotationStart:annotationStart, arrowEnd:annotationStart+cfg.arrowDrawMs, maxRevealSettle:maxSettle };
}
function dotOrderIndex(cfg,col,i){
  const rows=Math.ceil(col.count/col.gridCols);
  if(cfg.fillOrder==='column'){ const c=Math.floor(i/rows), r=i%rows; return {col:c,row:r,order:i}; }
  return {col:i%col.gridCols, row:Math.floor(i/col.gridCols), order:i};
}
function stateAt(cfg,t){
  const S=compileSchedule(cfg);
  const pitch=2*cfg.dotR+cfg.dotGap;
  const out={ t:t, annotationStart:S.annotationStart, ratioVisible:0, arrowProgress:clamp01((t-S.annotationStart)/cfg.arrowDrawMs), cols:[] };
  cfg.columns.forEach(function(col,idx){
    const sc=S.cols[idx]; const ev=col.events;
    const c={ id:col.id, visible:t>=sc.entranceStart, entranceProgress:clamp01((t-sc.entranceStart)/cfg.entranceTransitionMs),
      popDisplay:0, tileOpacity:0, started:0, settled:0, inFlight:0, roundDots:0, morphProgress:0, placeholder:false,
      ratio:derivedRatio(col), revealStart:sc.revealStart, revealSettle:sc.revealSettle, stagger:sc.stagger };
    if(t>=sc.countUpStart){ const p=clamp01((t-sc.countUpStart)/col.countUpMs); c.popDisplay = p>=1? col.population : Math.round(col.population*p); }
    if(c.visible){
      if(ev.revealMode==='cascade'){
        const fadeStart=sc.revealStart-cfg.tileFadeLeadMs, fadeEnd=fadeStart+cfg.tileFadeMs;
        if(t<fadeStart) c.tileOpacity=1;
        else if(t<fadeEnd) c.tileOpacity=1-(1-cfg.tileFadedOpacity)*((t-fadeStart)/cfg.tileFadeMs);
        else if(t<sc.revealSettle-cfg.tileDissolveTailMs) c.tileOpacity=cfg.tileFadedOpacity;
        else if(t<sc.revealSettle) c.tileOpacity=cfg.tileFadedOpacity*(1-(t-(sc.revealSettle-cfg.tileDissolveTailMs))/cfg.tileDissolveTailMs);
        else c.tileOpacity=0;
        for(let i=0;i<col.count;i++){ const st=sc.revealStart+i*sc.stagger;
          if(t>=st){ c.started++; if(t>=st+cfg.dotSettleMs) c.settled++; else c.inFlight++; } }
      } else {
        const fs=cfg.placeholderTileFadeStartMs, fe=fs+cfg.tileFadeMs;
        if(t<fs) c.tileOpacity=1; else if(t<fe) c.tileOpacity=1-(t-fs)/cfg.tileFadeMs; else c.tileOpacity=0;
        c.placeholder = t>=fe && t<sc.revealStart+cfg.placeholderMorphMs;
        c.morphProgress = t<sc.revealStart?0:clamp01((t-sc.revealStart)/cfg.placeholderMorphMs);
        c.roundDots = c.morphProgress>=1?col.count:0;
        c.started = c.roundDots; c.settled = c.roundDots;
      }
    }
    out.cols.push(c);
  });
  if(t>=S.annotationStart) out.ratioVisible=cfg.columns.length;
  out.totalStarted=out.cols.reduce(function(a,c){return a+c.started;},0);
  out.totalSettled=out.cols.reduce(function(a,c){return a+c.settled;},0);
  return out;
}
if(typeof window!=='undefined'){ window.__T208={CONFIG:CONFIG,compileSchedule:compileSchedule,stateAt:stateAt,derivedRatio:derivedRatio,fmt:fmt,dotOrderIndex:dotOrderIndex}; }
</script>

<script id="render">
(function(){
  const core=window.__T208, CONFIG=core.CONFIG;
  const stage=document.getElementById('stage');
  stage.style.background=CONFIG.palette.paper; stage.style.fontFamily=CONFIG.fontStack;
  if(CONFIG.textureOn){ stage.style.backgroundImage='repeating-linear-gradient(0deg, rgba(0,0,0,'+CONFIG.textureOpacity+') 0 1px, transparent 1px 5px)'; }
  const SIL={ tx:'M20,80 L60,30 L120,45 L180,20 L240,60 L270,120 L230,200 L150,260 L70,240 L25,160 Z',
              vt:'M60,20 L120,35 L140,110 L110,220 L60,250 L35,140 L40,60 Z' };
  const colEls=[];
  CONFIG.columns.forEach(function(col,idx){
    const root=document.createElement('div'); root.className='colLabel';
    root.style.left=col.x+'px'; root.style.top=CONFIG.labelTop+'px'; root.style.width=CONFIG.labelColW+'px'; root.style.color=CONFIG.palette.text;
    const nm=document.createElement('div'); nm.className='colName'; nm.style.fontSize=CONFIG.typeScale.name+'px'; nm.textContent=col.label;
    const pop=document.createElement('div'); pop.className='colPop'; pop.style.fontSize=CONFIG.typeScale.population+'px';
    root.appendChild(nm); root.appendChild(pop); stage.appendChild(root);
    const tileL=document.createElement('div'); tileL.className='tileLayer'; stage.appendChild(tileL);
    const tile=document.createElement('div'); tile.className='tile';
    tile.style.left=col.x+'px'; tile.style.top=CONFIG.boardTop+'px'; tile.style.width=col.tile.w+'px'; tile.style.height=col.tile.h+'px';
    tile.style.background=CONFIG.palette.tile;
    if(col.tile.silhouette!=='none' && SIL[col.tile.silhouette]){
      tile.innerHTML='<svg width="100%" height="100%" viewBox="0 0 290 290" preserveAspectRatio="none"><path d="'+SIL[col.tile.silhouette]+'" fill="rgba(255,255,255,'+CONFIG.silhouetteTintOpacity+')"/></svg>';
    }
    tileL.appendChild(tile);
    const dotSvg=document.createElementNS('http://www.w3.org/2000/svg','svg'); dotSvg.setAttribute('class','dotLayer');
    dotSvg.setAttribute('viewBox','0 0 '+CONFIG.stageW+' '+CONFIG.stageH); stage.appendChild(dotSvg);
    const circles=[];
    const pitch=2*CONFIG.dotR+CONFIG.dotGap;
    for(let i=0;i<col.count;i++){ const pos=core.dotOrderIndex(CONFIG,col,i);
      const cir=document.createElementNS('http://www.w3.org/2000/svg','circle');
      cir.setAttribute('cx',col.x+pos.col*pitch+CONFIG.dotR); cir.setAttribute('cy',CONFIG.boardTop+pos.row*pitch+CONFIG.dotR);
      cir.setAttribute('r',CONFIG.dotR); cir.setAttribute('fill',CONFIG.palette.ink); cir.setAttribute('opacity','0');
      dotSvg.appendChild(cir); circles.push(cir); }
    const ph=document.createElement('div'); ph.className='phSquare';
    ph.style.left=(col.x+CONFIG.placeholderDx)+'px'; ph.style.top=(CONFIG.boardTop+CONFIG.placeholderDy)+'px'; ph.style.width=CONFIG.placeholderSize+'px'; ph.style.height=CONFIG.placeholderSize+'px';
    ph.style.background=CONFIG.palette.tile; ph.style.display='none'; stage.appendChild(ph);
    colEls.push({col:col,root:root,pop:pop,tile:tile,dotSvg:dotSvg,circles:circles,ph:ph});
  });
  const annotSvg=document.createElementNS('http://www.w3.org/2000/svg','svg'); annotSvg.setAttribute('class','annotLayer');
  annotSvg.setAttribute('viewBox','0 0 '+CONFIG.stageW+' '+CONFIG.stageH); stage.appendChild(annotSvg);
  const annotEls=[];
  CONFIG.columns.forEach(function(col){
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    const lx=col.x+col.ratioLabelDx, ly=CONFIG.boardTop+CONFIG.annotLabelOffsetY+col.ratioLabelDy;
    const gx=col.x+CONFIG.arrowTargetDx, gy=CONFIG.boardTop+CONFIG.arrowTargetDy;
    const mx=(lx+gx)/2, my=Math.min(ly,gy)-Math.abs(lx-gx)*CONFIG.arrowCurve;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d','M'+lx+','+(ly-14)+' Q'+mx+','+my+' '+gx+','+gy);
    path.setAttribute('stroke',CONFIG.palette.arrow); path.setAttribute('fill','none'); path.setAttribute('stroke-width',CONFIG.arrowStrokeW);
    g.appendChild(path); annotSvg.appendChild(g);
    const lab=document.createElement('div'); lab.className='ratioLabel';
    lab.style.left=lx+'px'; lab.style.top=ly+'px'; lab.style.fontSize=CONFIG.typeScale.ratio+'px'; lab.style.color=CONFIG.palette.text;
    if(CONFIG.personGlyph){ lab.textContent=''; const sp=document.createElement('span'); sp.textContent='\u{1F464} '; lab.appendChild(sp); lab.appendChild(document.createTextNode(core.fmt(core.derivedRatio(col)))); }
    else lab.textContent=core.fmt(core.derivedRatio(col));
    lab.style.display='none'; stage.appendChild(lab);
    path.style.strokeDasharray=CONFIG.arrowDashLen; path.style.strokeDashoffset=CONFIG.arrowDashLen;
    annotEls.push({path:path,lab:lab,len:CONFIG.arrowDashLen});
  });
  let playing=false, startStamp=0, startMs=0, curMs=0;
  const clock=document.getElementById('clock'), seek=document.getElementById('seek'), btn=document.getElementById('btnPlay');
  function render(t){
    curMs=t; const st=core.stateAt(CONFIG,t);
    colEls.forEach(function(e,idx){ const c=st.cols[idx]; const col=e.col; const sc=core.compileSchedule(CONFIG).cols[idx];
      e.root.style.opacity=c.entranceProgress; e.root.style.transform='translateY('+(CONFIG.entranceRisePx*(1-c.entranceProgress))+'px)';
      e.pop.textContent=c.popDisplay>0?core.fmt(c.popDisplay):'';
      e.tile.style.opacity=c.tileOpacity; e.tile.style.background = c.tileOpacity<1? CONFIG.palette.tileFaded : CONFIG.palette.tile;
      const pitch=2*CONFIG.dotR+CONFIG.dotGap;
      e.circles.forEach(function(cir,i){ const stDot=sc.revealStart+i*sc.stagger;
        if(col.events.revealMode==='morph'){ const p=c.morphProgress; cir.setAttribute('opacity',p>0?(CONFIG.morphDotBaseOpacity+(1-CONFIG.morphDotBaseOpacity)*p):'0'); cir.setAttribute('r',CONFIG.dotR*(CONFIG.morphScaleFrom+(1-CONFIG.morphScaleFrom)*p)); }
        else if(t<stDot){ cir.setAttribute('opacity','0'); }
        else { const p=Math.min(1,(t-stDot)/CONFIG.dotSettleMs); const s=CONFIG.dotLandScaleFrom+(1-CONFIG.dotLandScaleFrom)*p;
          cir.setAttribute('opacity',String(CONFIG.dotFadeBaseOpacity+(1-CONFIG.dotFadeBaseOpacity)*p)); cir.setAttribute('r',CONFIG.dotR*s);
          cir.setAttribute('cy',CONFIG.boardTop+core.dotOrderIndex(CONFIG,col,i).row*pitch+CONFIG.dotR+CONFIG.dotLandDy*(1-p)); }
      });
      e.ph.style.display = (col.events.revealMode==='morph' && c.placeholder && c.morphProgress<1)?'block':'none';
    });
    annotEls.forEach(function(a){ const show=t>=st.annotationStart; a.lab.style.display=show?'block':'none';
      a.path.style.strokeDashoffset = a.len*(1-st.arrowProgress); });
    clock.textContent=(t/1000).toFixed(1)+'s'; seek.value=t;
  }
  function tick(now){ if(!playing) return; const t=startMs+(now-startStamp); if(t>=CONFIG.durationMs){ render(CONFIG.durationMs); playing=false; btn.textContent='Play'; return; } render(t); requestAnimationFrame(tick); }
  btn.addEventListener('click',function(){ if(playing){ playing=false; btn.textContent='Play'; } else { playing=true; btn.textContent='Pause'; startStamp=performance.now(); startMs=curMs>=CONFIG.durationMs?0:curMs; requestAnimationFrame(tick); } });
  document.getElementById('btnRestart').addEventListener('click',function(){ curMs=0; playing=true; btn.textContent='Pause'; startStamp=performance.now(); startMs=0; requestAnimationFrame(tick); });
  seek.addEventListener('input',function(){ render(Number(seek.value)); });
  render(0);
  window.__T208Render=render;
})();
</script>
</body>
</html>
