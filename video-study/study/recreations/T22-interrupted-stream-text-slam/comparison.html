<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T22 — Comparison</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#111;color:#eee;font-family:Arial,sans-serif;padding:12px}
  h1{font-size:16px;margin-bottom:10px}
  #controls{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  #controls button{padding:12px 20px;font-size:15px;border:0;border-radius:8px;background:#e8a33d;color:#000;cursor:pointer;min-height:48px}
  #panels{display:flex;gap:12px}
  .panel{flex:1;min-width:0}
  .label{font-size:13px;font-weight:bold;margin-bottom:6px}
  .frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
  .frame video,.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  @media (max-width:640px){ #panels{flex-direction:column} }
</style></head><body>
<h1>T22 — Interrupted stream → text slam</h1>
<div id="controls">
  <button id="btnPlay">Play</button>
  <button id="btnPause">Pause</button>
  <button id="btnRestart">Restart</button>
</div>
<div id="panels">
  <div class="panel">
    <div class="label">ORIGINAL — P1 @ 2:32–2:37</div>
    <div class="frame"><video id="orig" src="segment.mp4" playsinline preload="auto"></video></div>
  </div>
  <div class="panel">
    <div class="label">RECREATION — T22, parameterized</div>
    <div class="frame"><iframe id="rec" src="recreation.html" title="T22 recreation"></iframe></div>
  </div>
</div>
<script>
  var orig = document.getElementById("orig");
  var rec = document.getElementById("rec");
  function recPlay(){ try { rec.contentWindow.T22.play(); } catch(e){} }
  document.getElementById("btnPlay").onclick = function(){ orig.play(); recPlay(); };
  document.getElementById("btnPause").onclick = function(){ orig.pause(); /* recreation phases are short; pause is restart-based — replay via Restart */ recPlay(); };
  document.getElementById("btnRestart").onclick = function(){ orig.currentTime = 0; orig.play(); recPlay(); };
</script></body></html>
