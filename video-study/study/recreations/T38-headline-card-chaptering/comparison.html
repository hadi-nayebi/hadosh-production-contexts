<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T38 comparison — headline-card chaptering</title>
<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0b0620;color:#fff;padding:12px;}
  .row{display:flex;gap:12px;align-items:flex-start;}
  .side{flex:1;min-width:0;}
  .side h3{margin:0 0 6px;font-size:14px;letter-spacing:.04em;}
  video,iframe{width:100%;aspect-ratio:16/9;border:0;display:block;background:#160a38;}
  .controls{display:flex;gap:10px;margin:14px 0;}
  button{font-size:16px;padding:12px 20px;border-radius:10px;border:0;background:#ffd21f;color:#14100a;font-weight:700;cursor:pointer;}
  @media (max-width:640px){ .row{flex-direction:column;} .side{width:100%;} }
</style>
</head>
<body>
<div class="controls">
  <button id="playBtn" type="button">Play both</button>
  <button id="pauseBtn" type="button">Pause</button>
  <button id="restartBtn" type="button">Restart</button>
</div>
<div class="row">
  <div class="side">
    <h3>ORIGINAL — Infinite Physics @ 11:58–12:12</h3>
    <video id="vid" src="segment.mp4" preload="metadata" playsinline></video>
  </div>
  <div class="side">
    <h3>RECREATION — T38 headline-card chaptering, parameterized</h3>
    <iframe id="rec" src="recreation.html" title="T38 recreation"></iframe>
  </div>
</div>
<script>
"use strict";
const vid = document.getElementById("vid"), frame = document.getElementById("rec");
function recAPI(){ try { return frame.contentWindow.__rec; } catch(e){ return null; } }
function syncRec(){ const r = recAPI(); if (r && vid.duration) r.seek(vid.currentTime / vid.duration * r.durationMs); }
vid.addEventListener("timeupdate", syncRec);
vid.addEventListener("seeked", syncRec);
document.getElementById("playBtn").addEventListener("click", ()=>{ vid.play(); const r = recAPI(); if (r) r.play(); syncRec(); });
document.getElementById("pauseBtn").addEventListener("click", ()=>{ vid.pause(); const r = recAPI(); if (r) r.pause(); });
document.getElementById("restartBtn").addEventListener("click", ()=>{ vid.currentTime = 0; const r = recAPI(); if (r){ r.seek(0); r.play(); } vid.play(); });
frame.addEventListener("load", syncRec);
</script>
</body>
</html>
