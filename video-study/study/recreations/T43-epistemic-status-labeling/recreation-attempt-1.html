<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>T43 — Epistemic status labeling, parameterized</title>
<style>
html,body{margin:0;padding:0;background:var(--bg);height:100%;font-family:var(--font)}
#stage{position:relative;width:100%;aspect-ratio:var(--aspect);overflow:hidden;background:linear-gradient(var(--angle),var(--bg),var(--bg2));color:var(--ink)}
.layer{position:absolute;inset:0}
.pill{position:absolute;display:flex;align-items:center;justify-content:center;white-space:nowrap;letter-spacing:.02em;text-align:center}
.smalltag{position:absolute;letter-spacing:.14em;white-space:nowrap}
#title{position:absolute}
#subtitle{position:absolute;opacity:.85}
.panel{position:absolute;background:var(--panel)}
.panel ul{margin:0}
#divider{position:absolute;top:0;bottom:0;border-left-style:dashed}
svg{position:absolute;inset:0;width:100%;height:100%}
</style></head><body>
<div id="stage">
  <div class="layer" id="phaseA">
    <svg id="artSvg" preserveAspectRatio="none"></svg>
    <div id="title"></div><div id="subtitle"></div>
    <div id="tagsA"></div>
    <div id="axisX" class="smalltag"></div>
  </div>
  <div class="layer" id="phaseB">
    <div id="divider"></div>
    <div id="leftPane" class="layer"></div>
    <div id="rightPane" class="layer"></div>
  </div>
</div>
<script>
const CONFIG = {
  durationMs: 14000,
  stageRefWidth: 960,
  fadeMs: 600,
  tagFadeMs: 500,
  dividerDrawMs: 900,
  fontFamily: "Arial, Helvetica, sans-serif",
  pillRadiusPx: 999,
  gradientDeg: 160,
  aspectW: 16,
  aspectH: 9,
  pillPaddingEm: {v:0.6, h:1.1},
  lineHeights: {title:1.05, list:1.55},
  fontWeights: {bold:800, semi:600, med:500},
  panelPaddingEm: {v:1, h:1.2},
  listIndentEm: 1.1,
  panelRadiusPx: 16,
  panelBorderPx: 1,
  palette: { bg:"#0d0620", bg2:"#2a1052", ink:"#ffffff", panel:"rgba(38,22,84,0.88)", panelEdge:"rgba(160,130,255,0.45)", divider:"#e8e2ff", curveFill:"#8b6fe8", curveStroke:"#ffd94d", axis:"#ffffff", waveStroke:"#5ee7f2", barrier:"#9a7fe8" },
  typography: { titlePx:60, subtitlePx:30, tagPx:30, smallPx:30, pillPx:30, listPx:30, provenancePx:30 },
  checkpoints: { artworkIn:0, titleIn:400, hypoTag:1600, schematicTag:3200, stylizedTag:4800, scaleTag:6200, splitStart:8200, dividerIn:8600, solidIn:9600, specIn:10400, provenanceIn:11600 },
  artwork: {
    title:"The inflaton field", subtitle:"energy V(φ)", titlePos:{x:4,y:5}, subtitlePos:{x:23,y:14},
    viewBox:"0 0 1000 562",
    areaPath:"M140,210 L520,220 C600,225 640,330 720,430 C780,490 860,470 940,500 L940,470 L940,505 L140,505 Z",
    curvePath:"M140,210 L520,220 C600,225 640,330 720,430 C780,490 860,470 940,500",
    areaOpacity:"0.92", curveStrokeWidth:"5", axisStrokeWidth:"3",
    axis:{x1:"140",y1:"180",x2:"140",y2:"505",x3:"140",y3:"505",x4:"940",y4:"505"},
    axisXText:"field value φ", axisXPct:{x:64,y:88}
  },
  artworkTags: [
    {id:"hypoTag", text:"HYPOTHETICAL", level:"speculative", bg:"#b79cff", fg:"#140a2e", xPct:4, yPct:24, kind:"pill"},
    {id:"schematicTag", text:"SCHEMATIC POTENTIAL", level:"schematic", bg:"transparent", fg:"#ffffff", xPct:58, yPct:93, kind:"small"},
    {id:"stylizedTag", text:"STYLIZED, NOT A LIKENESS", level:"stylized", bg:"#5ee7f2", fg:"#0b2233", xPct:4, yPct:86, kind:"pill"},
    {id:"scaleTag", text:"NOT TO SCALE", level:"scale", bg:"#ffd94d", fg:"#2e2400", xPct:60, yPct:6, kind:"pill"}
  ],
  split: {
    ratioPct:50, dividerWidthPx:3, pillYPct:8, provenanceYPct:78,
    left:{ pillText:"SOLID SCIENCE", pillBg:"#4dffb8", pillFg:"#06281a", panelXPct:6, panelYPct:32, panelWPct:36,
      items:["Conservation · expansion · CMB ·","inflation's successes"] },
    right:{ pillText:"SPECULATION", pillBg:"#b79cff", pillFg:"#140a2e", panelXPct:56, panelYPct:30, panelWPct:38,
      provenanceText:"1982 · VILENKIN · QUANTUM TUNNELING", provenanceBg:"#5ee7f2", provenanceFg:"#0b2233",
      wavePath:"M560,300 C580,240 600,360 620,300 C640,240 660,360 680,300 C700,260 720,340 760,305 C800,285 860,315 930,300",
      waveStrokeWidth:"6",
      barrier:{x:690,y:190,w:52,h:210,rx:10} }
  }
};
/* ---- construction (shaping values come from CONFIG; only structural 0/1/100 remain below) ---- */
const $=id=>document.getElementById(id);
const stage=$("stage"), root=document.documentElement.style;
root.setProperty("--bg",CONFIG.palette.bg); root.setProperty("--bg2",CONFIG.palette.bg2);
root.setProperty("--ink",CONFIG.palette.ink); root.setProperty("--panel",CONFIG.palette.panel);
root.setProperty("--panelEdge",CONFIG.palette.panelEdge); root.setProperty("--font",CONFIG.fontFamily);
root.setProperty("--angle",CONFIG.gradientDeg+"deg"); root.setProperty("--aspect",CONFIG.aspectW+"/"+CONFIG.aspectH);
$("title").textContent=CONFIG.artwork.title; $("title").style.lineHeight=CONFIG.lineHeights.title; $("title").style.fontWeight=CONFIG.fontWeights.bold; $("subtitle").style.fontWeight=CONFIG.fontWeights.med;  $("subtitle").textContent=CONFIG.artwork.subtitle;
$("axisX").textContent=CONFIG.artwork.axisXText;
const svg=$("artSvg"); svg.setAttribute("viewBox",CONFIG.artwork.viewBox);
const NS="http://www.w3.org/2000/svg";
function el(n,attrs){const e=document.createElementNS(NS,n);for(const k in attrs)e.setAttribute(k,attrs[k]);svg.appendChild(e);return e;}
const A=CONFIG.artwork;
el("path",{d:A.areaPath,fill:CONFIG.palette.curveFill,opacity:A.areaOpacity});
el("path",{d:A.curvePath,fill:"none",stroke:CONFIG.palette.curveStroke,"stroke-width":A.curveStrokeWidth});
el("line",{x1:A.axis.x1,y1:A.axis.y1,x2:A.axis.x2,y2:A.axis.y2,stroke:CONFIG.palette.axis,"stroke-width":A.axisStrokeWidth});
el("line",{x1:A.axis.x3,y1:A.axis.y3,x2:A.axis.x4,y2:A.axis.y4,stroke:CONFIG.palette.axis,"stroke-width":A.axisStrokeWidth});
const tagEls={};
CONFIG.artworkTags.forEach(t=>{
  const d=document.createElement("div"); d.className=t.kind==="pill"?"pill":"smalltag"; d.textContent=t.text;
  d.style.fontWeight=t.kind==="pill"?CONFIG.fontWeights.bold:CONFIG.fontWeights.semi; d.style.background=t.bg; d.style.color=t.fg; d.style.left=t.xPct+"%"; d.style.top=t.yPct+"%";
  d.dataset.cp=t.id; if(t.kind==="pill")d.style.padding=CONFIG.pillPaddingEm.v+"em "+CONFIG.pillPaddingEm.h+"em"; $("tagsA").appendChild(d); tagEls[t.id]=d;
});
function pill(parent,text,bg,fg,x,y){const d=document.createElement("div");d.className="pill";d.style.fontWeight=CONFIG.fontWeights.bold;d.style.padding=CONFIG.pillPaddingEm.v+"em "+CONFIG.pillPaddingEm.h+"em";d.textContent=text;d.style.background=bg;d.style.color=fg;d.style.left=x+"%";d.style.top=y+"%";parent.appendChild(d);return d;}
const L=CONFIG.split.left, R=CONFIG.split.right;
const solidPill=pill($("leftPane"),L.pillText,L.pillBg,L.pillFg,L.panelXPct,CONFIG.split.pillYPct);
const leftPanel=document.createElement("div"); leftPanel.className="panel";
leftPanel.style.left=L.panelXPct+"%"; leftPanel.style.top=L.panelYPct+"%"; leftPanel.style.width=L.panelWPct+"%";
leftPanel.style.padding=CONFIG.panelPaddingEm.v+"em "+CONFIG.panelPaddingEm.h+"em"; leftPanel.style.borderRadius=CONFIG.panelRadiusPx+"px"; leftPanel.style.border=CONFIG.panelBorderPx+"px solid "+CONFIG.palette.panelEdge;
const ul=document.createElement("ul"); ul.style.lineHeight=CONFIG.lineHeights.list; ul.style.paddingLeft=CONFIG.listIndentEm+"em"; L.items.forEach(s=>{const li=document.createElement("li");li.textContent=s;ul.appendChild(li);});
leftPanel.appendChild(ul); $("leftPane").appendChild(leftPanel);
const specPill=pill($("rightPane"),R.pillText,R.pillBg,R.pillFg,R.panelXPct,CONFIG.split.pillYPct);
const waveSvg=document.createElementNS(NS,"svg"); waveSvg.setAttribute("viewBox",CONFIG.artwork.viewBox); waveSvg.setAttribute("preserveAspectRatio","none");
const wp=document.createElementNS(NS,"path"); wp.setAttribute("d",R.wavePath); wp.setAttribute("fill","none"); wp.setAttribute("stroke",CONFIG.palette.waveStroke); wp.setAttribute("stroke-width",R.waveStrokeWidth); waveSvg.appendChild(wp);
const bar=document.createElementNS(NS,"rect"); const b=R.barrier; bar.setAttribute("x",b.x); bar.setAttribute("y",b.y); bar.setAttribute("width",b.w); bar.setAttribute("height",b.h); bar.setAttribute("rx",b.rx); bar.setAttribute("fill",CONFIG.palette.barrier); waveSvg.appendChild(bar);
const specObj=document.createElement("div"); specObj.className="layer"; specObj.appendChild(waveSvg); $("rightPane").appendChild(specObj);
const provPill=pill($("rightPane"),R.provenanceText,R.provenanceBg,R.provenanceFg,R.panelXPct,CONFIG.split.provenanceYPct);
provPill.style.whiteSpace="normal"; provPill.style.width=R.panelWPct+"%";
function fit(){const w=stage.clientWidth, s=w/CONFIG.stageRefWidth, T=CONFIG.typography;
  $("title").style.fontSize=T.titlePx*s+"px"; $("title").style.left=A.titlePos.x+"%"; $("title").style.top=A.titlePos.y+"%";
  $("subtitle").style.fontSize=T.subtitlePx*s+"px"; $("subtitle").style.left=A.subtitlePos.x+"%"; $("subtitle").style.top=A.subtitlePos.y+"%";
  document.querySelectorAll(".pill").forEach(e=>{e.style.fontSize=(e===provPill?T.provenancePx:T.pillPx)*s+"px"; e.style.borderRadius=CONFIG.pillRadiusPx+"px";});
  document.querySelectorAll(".smalltag").forEach(e=>{e.style.fontSize=T.smallPx*s+"px";});
  leftPanel.style.fontSize=T.listPx*s+"px";
  $("axisX").style.left=A.axisXPct.x+"%"; $("axisX").style.top=A.axisXPct.y+"%";
  CONFIG.artworkTags.forEach(t=>{if(t.kind==="pill")tagEls[t.id].style.fontSize=T.tagPx*s+"px";});
}
new ResizeObserver(fit).observe(stage);
const clamp01=v=>Math.max(0,Math.min(1,v));
const prog=(t,start,dur)=>clamp01((t-start)/dur);
function render(t){
  const C=CONFIG.checkpoints, F=CONFIG.fadeMs;
  $("phaseA").style.opacity=String(1-prog(t,C.splitStart,F));
  $("phaseB").style.opacity=String(prog(t,C.splitStart,F));
  $("artSvg").style.opacity=String(prog(t,C.artworkIn,F));
  $("title").style.opacity=String(prog(t,C.titleIn,F)); $("subtitle").style.opacity=String(prog(t,C.titleIn,F));
  CONFIG.artworkTags.forEach(tag=>{tagEls[tag.id].style.opacity=String(prog(t,C[tag.id],CONFIG.tagFadeMs));});
  divider.style.opacity=String(prog(t,C.dividerIn,CONFIG.dividerDrawMs));
  divider.style.transform="scaleY("+prog(t,C.dividerIn,CONFIG.dividerDrawMs)+")"; divider.style.transformOrigin="top";
  solidPill.style.opacity=String(prog(t,C.solidIn,F)); leftPanel.style.opacity=String(prog(t,C.solidIn,F));
  specPill.style.opacity=String(prog(t,C.specIn,F)); specObj.style.opacity=String(prog(t,C.specIn,F));
  provPill.style.opacity=String(prog(t,C.provenanceIn,F));
}
const divider=$("divider"); divider.style.left=CONFIG.split.ratioPct+"%"; divider.style.borderLeftColor=CONFIG.palette.divider; divider.style.borderLeftWidth=CONFIG.split.dividerWidthPx+"px";
let startT=null, playing=false;
function loop(ts){ if(!playing)return; if(startT===null)startT=ts; const t=ts-startT; if(t>=CONFIG.durationMs){render(CONFIG.durationMs);playing=false;return;} render(t); requestAnimationFrame(loop); }
window.__T43={CONFIG, setTime:ms=>render(ms), play:()=>{if(!playing){playing=true;startT=null;requestAnimationFrame(loop);}}, pause:()=>{playing=false;}, getState:()=>({durationMs:CONFIG.durationMs})};
render(0); fit();
</script></body></html>
