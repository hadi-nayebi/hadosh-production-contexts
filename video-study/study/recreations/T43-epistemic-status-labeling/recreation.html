<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>T43 — Epistemic status labeling, parameterized</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);height:100%;font-family:var(--font)}
#stage{position:relative;width:100%;aspect-ratio:var(--aspect);overflow:hidden;background:linear-gradient(var(--angle),var(--bg),var(--bg2));color:var(--ink)}
.layer{position:absolute;inset:0}
.pane{position:absolute;top:0;bottom:0;overflow:hidden}
.pill{position:absolute;display:flex;align-items:center;justify-content:center;white-space:nowrap;letter-spacing:var(--ls-pill);text-align:center}
.smalltag{position:absolute;letter-spacing:var(--ls-small);white-space:nowrap}
#title{position:absolute}
#subtitle{position:absolute}
.panel{position:absolute;background:var(--panel)}
.panel ul{margin:0}
#divider{position:absolute;top:0;bottom:0}
svg{position:absolute;inset:0;width:100%;height:100%}
.objbox{position:absolute}
.objbox svg{position:absolute;inset:0;width:100%;height:100%}
</style></head><body>
<div id="stage">
  <div class="layer" id="phaseA">
    <svg id="artSvg" preserveAspectRatio="none"></svg>
    <div id="title"></div><div id="subtitle"></div>
    <div id="tagsA"></div>
    <div id="axisX" class="smalltag"></div>
  </div>
  <div class="layer" id="phaseB">
    <div id="leftPane" class="pane"></div>
    <div id="rightPane" class="pane"></div>
    <div id="divider"></div>
  </div>
</div>
<script>
const CONFIG = {
  durationMs: 14000,
  stageRefWidth: 960,
  fadeMs: 600,
  tagFadeMs: 500,
  splitMs: 600,
  fontFamily: "Arial, Helvetica, sans-serif",
  pillRadiusPx: 999,
  gradientDeg: 160,
  aspectW: 16,
  aspectH: 9,
  pillPaddingEm: {v:0.6, h:1.1},
  lineHeights: {title:1.05, list:1.55},
  fontWeights: {bold:800, semi:600, med:500},
  panelPaddingEm: {v:1, h:1.2},
  listIndentEm: 1.1,
  panelRadiusPx: 16,
  panelBorderPx: 1,
  palette: { bg:"#0d0620", bg2:"#2a1052", ink:"#ffffff", panel:"rgba(38,22,84,0.88)", panelEdge:"rgba(160,130,255,0.45)", divider:"#e8e2ff", curveFill:"#8b6fe8", curveStroke:"#ffd94d", axis:"#ffffff", waveStroke:"#5ee7f2", barrier:"#9a7fe8" },
  typography: { titlePx:60, subtitlePx:30, tagPx:30, smallPx:30, pillPx:30, listPx:30, provenancePx:30, glyphWidthFactor:0.62,
    letterSpacingEm:{ pill:0.02, small:0.14 }, subtitleOpacity:0.85 },
  dividerStyle: "dashed",
  panelBorderStyle: "solid",
  provenanceWrapPolicy: "normal",
  svgAspectPolicy: "none",
  statusLevels: {
    speculative: { bg:"#b79cff", fg:"#140a2e", term:"SPECULATION" },
    schematic:   { bg:"transparent", fg:"#ffffff", term:"SCHEMATIC" },
    stylized:    { bg:"#5ee7f2", fg:"#0b2233", term:"STYLIZED" },
    scale:       { bg:"#ffd94d", fg:"#2e2400", term:"NOT TO SCALE" },
    measured:    { bg:"#4dffb8", fg:"#06281a", term:"SOLID SCIENCE" }
  },
  checkpoints: { artworkIn:0, titleIn:400, splitStart:2500, dividerIn:2500, solidIn:2900, specIn:3700, panelIn:3700, objectIn:7500, provenanceIn:7900 },
  artwork: {
    title:"The inflaton field", subtitle:"energy V(φ)", titlePos:{x:4,y:5}, subtitlePos:{x:23,y:14},
    viewBox:"0 0 1000 562",
    areaPath:"M140,210 L520,220 C600,225 640,330 720,430 C780,490 860,470 940,500 L940,470 L940,505 L140,505 Z",
    curvePath:"M140,210 L520,220 C600,225 640,330 720,430 C780,490 860,470 940,500",
    areaOpacity:"0.92", curveStrokeWidth:"5", axisStrokeWidth:"3",
    axis:{x1:"140",y1:"180",x2:"140",y2:"505",x3:"140",y3:"505",x4:"940",y4:"505"},
    axisXText:"field value φ", axisXPct:{x:64,y:88}
  },
  artworkTags: [
    {id:"hypoTag", text:"HYPOTHETICAL", level:"speculative", enterMs:600, xPct:4, yPct:24, kind:"pill"},
    {id:"schematicTag", text:"SCHEMATIC POTENTIAL", level:"schematic", enterMs:1400, xPct:52, yPct:80, kind:"small"}
  ],
  split: {
    ratioPct:50, dividerWidthPx:3, pillYPct:8,
    left:{ pillLevel:"measured", pillXPct:12, panelYPct:30,
      contents:[
        {type:"list", xPct:12, yPct:32, wPct:72, items:["Conservation · expansion · CMB ·","inflation's successes"]}
      ] },
    right:{ pillLevel:"speculative", pillXPct:12, panelYPct:30,
      contents:[
        {type:"object", xPct:8, wPct:84, hPct:34, wavePath:"M560,300 C580,240 600,360 620,300 C640,240 660,360 680,300 C700,260 720,340 760,305 C800,285 860,315 930,300",
         waveStrokeWidth:"6", barrier:{x:690,y:190,w:52,h:210,rx:10}},
        {type:"provenance", xPct:12, yPct:68, wPct:84, text:"1982 · VILENKIN · QUANTUM TUNNELING", level:"stylized"}
      ] }
  }
};
/* ---- entry entrance resolution: entry.enterMs wins; else the type-default checkpoint + entry.enterOffsetMs (default 0) ---- */
const ENTRY_DEFAULT_CHECKPOINT={list:"panelIn", object:"objectIn", provenance:"provenanceIn"};
function resolveEntryEnter(cfg,entry){
  if(Number.isFinite(entry.enterMs)) return entry.enterMs;
  const cp=ENTRY_DEFAULT_CHECKPOINT[entry.type];
  if(!cp) throw new Error("pane entry type "+entry.type+" has no default checkpoint and no enterMs");
  const off=entry.enterOffsetMs===undefined?0:entry.enterOffsetMs;
  if(!Number.isFinite(off)) throw new Error("pane entry enterOffsetMs is not finite");
  return cfg.checkpoints[cp]+off;
}
function panePillText(cfg,p){ return p.pillText || cfg.statusLevels[p.pillLevel].term; }
/* ---- validation (invalid configurations are rejected, never silently mis-rendered) ---- */
function validate(cfg){
  const r=cfg.split.ratioPct; if(!(r>5&&r<95)) throw new Error("split.ratioPct out of range: "+r);
  cfg.artworkTags.forEach(t=>{
    if(!cfg.statusLevels[t.level]) throw new Error("tag "+t.id+" names unknown status level "+t.level);
    if(!Number.isFinite(t.enterMs)) throw new Error("tag "+t.id+" has no explicit enterMs");
  });
  const times=cfg.artworkTags.map(t=>t.enterMs);
  for(let i=1;i<times.length;i++) if(times[i]<=times[i-1]) throw new Error("artwork tag enterMs not increasing");
  ["left","right"].forEach(side=>{ cfg.split[side].contents.forEach(c=>{
    if(!["list","object","provenance"].includes(c.type)) throw new Error("unknown pane content type "+c.type);
  });});
  const C=cfg.checkpoints, last=Math.max(C.solidIn,C.specIn,C.panelIn,C.objectIn,C.provenanceIn);
  if(last+cfg.fadeMs>cfg.durationMs) throw new Error("split entrances cannot complete within durationMs");
  /* fit rejection at the reference width: ink bound = chars*(glyphWidthFactor+letterSpacingEm)*fontPx + horizontal padding.
     A configuration whose pill cannot fit its container is rejected, never shrunk below the type floor. */
  const T=cfg.typography, W=cfg.stageRefWidth;
  const pillW=(text,px)=>text.length*(T.glyphWidthFactor+T.letterSpacingEm.pill)*px + 2*cfg.pillPaddingEm.h*px;
  cfg.artworkTags.filter(t=>t.kind==="pill").forEach(t=>{
    if(t.xPct/100*W + pillW(t.text,T.tagPx) > W) throw new Error("artwork pill "+t.id+" cannot fit the stage at ratio-independent width");
  });
  [["left",cfg.split.left],["right",cfg.split.right]].forEach(([side,p])=>{
    const paneW=(side==="left"?r:100-r)/100*W;
    if(p.pillXPct/100*paneW + pillW(panePillText(cfg,p),T.pillPx) > paneW) throw new Error(side+" pane pill cannot fit its pane at ratioPct "+r+" — unsupported configuration");
    p.contents.forEach(c=>{ if(c.xPct+c.wPct>100) throw new Error(side+" pane content exceeds pane-local bounds");
      if(c.enterMs!==undefined && !(Number.isFinite(c.enterMs)&&c.enterMs>=0)) throw new Error(side+" pane entry enterMs invalid");
      const resolved=resolveEntryEnter(cfg,c);
      if(resolved<0 || resolved+cfg.fadeMs>cfg.durationMs) throw new Error(side+" pane entry entrance cannot complete within durationMs"); });
  });
}
validate(CONFIG);
/* ---- construction (shaping values come from CONFIG; only structural 0/1/100 remain below) ---- */
const $=id=>document.getElementById(id);
const stage=$("stage"), root=document.documentElement.style;
root.setProperty("--bg",CONFIG.palette.bg); root.setProperty("--bg2",CONFIG.palette.bg2);
root.setProperty("--ink",CONFIG.palette.ink); root.setProperty("--panel",CONFIG.palette.panel);
root.setProperty("--panelEdge",CONFIG.palette.panelEdge); root.setProperty("--font",CONFIG.fontFamily);
root.setProperty("--angle",CONFIG.gradientDeg+"deg"); root.setProperty("--aspect",CONFIG.aspectW+"/"+CONFIG.aspectH);
root.setProperty("--ls-pill",CONFIG.typography.letterSpacingEm.pill+"em");
root.setProperty("--ls-small",CONFIG.typography.letterSpacingEm.small+"em");
$("title").textContent=CONFIG.artwork.title; $("title").style.lineHeight=CONFIG.lineHeights.title; $("title").style.fontWeight=CONFIG.fontWeights.bold; $("subtitle").style.fontWeight=CONFIG.fontWeights.med;  $("subtitle").textContent=CONFIG.artwork.subtitle;
$("axisX").textContent=CONFIG.artwork.axisXText;
const svg=$("artSvg"); svg.setAttribute("viewBox",CONFIG.artwork.viewBox); svg.setAttribute("preserveAspectRatio",CONFIG.svgAspectPolicy);
const NS="http://www.w3.org/2000/svg";
function el(n,attrs){const e=document.createElementNS(NS,n);for(const k in attrs)e.setAttribute(k,attrs[k]);svg.appendChild(e);return e;}
const A=CONFIG.artwork;
el("path",{d:A.areaPath,fill:CONFIG.palette.curveFill,opacity:A.areaOpacity});
el("path",{d:A.curvePath,fill:"none",stroke:CONFIG.palette.curveStroke,"stroke-width":A.curveStrokeWidth});
el("line",{x1:A.axis.x1,y1:A.axis.y1,x2:A.axis.x2,y2:A.axis.y2,stroke:CONFIG.palette.axis,"stroke-width":A.axisStrokeWidth});
el("line",{x1:A.axis.x3,y1:A.axis.y3,x2:A.axis.x4,y2:A.axis.y4,stroke:CONFIG.palette.axis,"stroke-width":A.axisStrokeWidth});
function levelColors(level,override){ const base=CONFIG.statusLevels[level]; return { bg:(override&&override.bg)||base.bg, fg:(override&&override.fg)||base.fg }; }
const tagEls={};
CONFIG.artworkTags.forEach(t=>{
  const c=levelColors(t.level,t);
  const d=document.createElement("div"); d.className=t.kind==="pill"?"pill":"smalltag"; d.textContent=t.text||CONFIG.statusLevels[t.level].term;
  d.style.fontWeight=t.kind==="pill"?CONFIG.fontWeights.bold:CONFIG.fontWeights.semi; d.style.background=c.bg; d.style.color=c.fg; d.style.left=t.xPct+"%"; d.style.top=t.yPct+"%";
  if(t.kind==="pill")d.style.padding=CONFIG.pillPaddingEm.v+"em "+CONFIG.pillPaddingEm.h+"em"; $("tagsA").appendChild(d); tagEls[t.id]=d;
});
function pill(parent,text,level,x,y,override){
  const c=levelColors(level,override);
  const d=document.createElement("div");d.className="pill";d.style.fontWeight=CONFIG.fontWeights.bold;d.style.padding=CONFIG.pillPaddingEm.v+"em "+CONFIG.pillPaddingEm.h+"em";d.textContent=text;d.style.background=c.bg;d.style.color=c.fg;d.style.left=x+"%";d.style.top=y+"%";parent.appendChild(d);return d;
}
/* ---- shared pane-content builder: one schema for both panes (list | object | provenance) ---- */
function buildContent(pane,entry,paneKey){
  if(entry.type==="list"){
    const p=document.createElement("div"); p.className="panel";
    p.style.left=entry.xPct+"%"; p.style.top=entry.yPct+"%"; p.style.width=entry.wPct+"%";
    p.style.padding=CONFIG.panelPaddingEm.v+"em "+CONFIG.panelPaddingEm.h+"em"; p.style.borderRadius=CONFIG.panelRadiusPx+"px"; p.style.border=CONFIG.panelBorderPx+"px "+CONFIG.panelBorderStyle+" "+CONFIG.palette.panelEdge;
    const ul=document.createElement("ul"); ul.style.lineHeight=CONFIG.lineHeights.list; ul.style.paddingLeft=CONFIG.listIndentEm+"em";
    entry.items.forEach(s=>{const li=document.createElement("li");li.textContent=s;ul.appendChild(li);});
    p.appendChild(ul); pane.appendChild(p); return p;
  }
  if(entry.type==="object"){
    const box=document.createElement("div"); box.className="objbox";
    box.style.left=entry.xPct+"%"; box.style.top=CONFIG.split[paneKey].panelYPct+"%"; box.style.width=entry.wPct+"%"; box.style.height=entry.hPct+"%";
    const s=document.createElementNS(NS,"svg"); s.setAttribute("viewBox",CONFIG.artwork.viewBox); s.setAttribute("preserveAspectRatio",CONFIG.svgAspectPolicy);
    const wp=document.createElementNS(NS,"path"); wp.setAttribute("d",entry.wavePath); wp.setAttribute("fill","none"); wp.setAttribute("stroke",CONFIG.palette.waveStroke); wp.setAttribute("stroke-width",entry.waveStrokeWidth); s.appendChild(wp);
    const b=entry.barrier, bar=document.createElementNS(NS,"rect"); bar.setAttribute("x",b.x); bar.setAttribute("y",b.y); bar.setAttribute("width",b.w); bar.setAttribute("height",b.h); bar.setAttribute("rx",b.rx); bar.setAttribute("fill",CONFIG.palette.barrier); s.appendChild(bar);
    box.appendChild(s); pane.appendChild(box); return box;
  }
  if(entry.type==="provenance"){
    const d=pill(pane,entry.text,entry.level,entry.xPct,entry.yPct);
    d.style.whiteSpace=CONFIG.provenanceWrapPolicy; d.style.width=entry.wPct+"%"; return d;
  }
}
const L=CONFIG.split.left, R=CONFIG.split.right;
const leftPane=$("leftPane"), rightPane=$("rightPane");
leftPane.style.left="0%"; leftPane.style.width=CONFIG.split.ratioPct+"%";
rightPane.style.left=CONFIG.split.ratioPct+"%"; rightPane.style.width=(100-CONFIG.split.ratioPct)+"%";
const solidPill=pill(leftPane,panePillText(CONFIG,L),L.pillLevel,L.pillXPct,CONFIG.split.pillYPct);
const leftBuilt=L.contents.map(c=>({entry:c, el:buildContent(leftPane,c,"left"), enterMs:resolveEntryEnter(CONFIG,c)}));
const specPill=pill(rightPane,panePillText(CONFIG,R),R.pillLevel,R.pillXPct,CONFIG.split.pillYPct);
const rightBuilt=R.contents.map(c=>({entry:c, el:buildContent(rightPane,c,"right"), enterMs:resolveEntryEnter(CONFIG,c)}));
function fit(){const w=stage.clientWidth, s=w/CONFIG.stageRefWidth, T=CONFIG.typography;
  $("title").style.fontSize=T.titlePx*s+"px"; $("title").style.left=A.titlePos.x+"%"; $("title").style.top=A.titlePos.y+"%";
  $("subtitle").style.fontSize=T.subtitlePx*s+"px"; $("subtitle").style.left=A.subtitlePos.x+"%"; $("subtitle").style.top=A.subtitlePos.y+"%";
  document.querySelectorAll(".pill").forEach(e=>{e.style.fontSize=T.pillPx*s+"px"; e.style.borderRadius=CONFIG.pillRadiusPx+"px";});
  document.querySelectorAll(".smalltag").forEach(e=>{e.style.fontSize=T.smallPx*s+"px";});
  leftBuilt.concat(rightBuilt).forEach(b=>{ if(b.entry.type==="list") b.el.style.fontSize=T.listPx*s+"px"; if(b.entry.type==="provenance") b.el.style.fontSize=T.provenancePx*s+"px"; });
  $("axisX").style.left=A.axisXPct.x+"%"; $("axisX").style.top=A.axisXPct.y+"%";
  CONFIG.artworkTags.forEach(t=>{if(t.kind==="pill")tagEls[t.id].style.fontSize=T.tagPx*s+"px";});
}
new ResizeObserver(fit).observe(stage);
const clamp01=v=>Math.max(0,Math.min(1,v));
const prog=(t,start,dur)=>clamp01((t-start)/dur);
function render(t){
  const C=CONFIG.checkpoints, F=CONFIG.fadeMs;
  const sp=prog(t,C.splitStart,CONFIG.splitMs);
  $("phaseA").style.opacity=String(1-sp);
  $("artSvg").style.opacity=String(prog(t,C.artworkIn,F));
  $("title").style.opacity=String(prog(t,C.titleIn,F)); $("subtitle").style.opacity=String(prog(t,C.titleIn,F)*CONFIG.typography.subtitleOpacity);
  CONFIG.artworkTags.forEach(tag=>{tagEls[tag.id].style.opacity=String(prog(t,tag.enterMs,CONFIG.tagFadeMs));});
  divider.style.opacity=t>=C.dividerIn?"1":"0";
  solidPill.style.opacity=String(prog(t,C.solidIn,F));
  specPill.style.opacity=String(prog(t,C.specIn,F));
  leftBuilt.concat(rightBuilt).forEach(b=>{ b.el.style.opacity=String(prog(t,b.enterMs,F)); });
}
const divider=$("divider"); divider.style.left=CONFIG.split.ratioPct+"%"; divider.style.borderLeftStyle=CONFIG.dividerStyle; divider.style.borderLeftColor=CONFIG.palette.divider; divider.style.borderLeftWidth=CONFIG.split.dividerWidthPx+"px";
let startT=null, playing=false;
function loop(ts){ if(!playing)return; if(startT===null)startT=ts; const t=ts-startT; if(t>=CONFIG.durationMs){render(CONFIG.durationMs);playing=false;return;} render(t); requestAnimationFrame(loop); }
window.__T43={CONFIG, setTime:ms=>render(ms), play:()=>{if(!playing){playing=true;startT=null;requestAnimationFrame(loop);}}, pause:()=>{playing=false;}, getState:()=>({durationMs:CONFIG.durationMs})};
render(0); fit();
</script></body></html>
