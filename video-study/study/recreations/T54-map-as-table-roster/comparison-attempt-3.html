<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T54 — Map-as-table roster · comparison</title>
<style>
  html,body{margin:0;padding:0;background:#0b2b33;color:#fff;font-family:Arial,Helvetica,sans-serif;}
  body{display:flex;flex-direction:column;align-items:center;padding:10px;box-sizing:border-box;}
  #wrap{display:flex;gap:12px;width:100%;max-width:1100px;}
  .side{flex:1;min-width:0;}
  .lab{font-size:13px;font-weight:700;letter-spacing:.04em;margin:0 0 6px;}
  video,iframe{width:100%;aspect-ratio:360/260;background:#14424e;border:0;display:block;}
  iframe{aspect-ratio:360/260;}
  #controls{display:flex;gap:10px;margin-top:14px;}
  button{min-width:88px;min-height:48px;font-size:15px;font-weight:700;border:0;border-radius:8px;background:#f7c948;color:#14232e;cursor:pointer;padding:0 16px;}
  @media (max-width:640px){ #wrap{flex-direction:column;} }
</style>
</head>
<body>
<div id="wrap">
  <div class="side">
    <p class="lab">ORIGINAL — Epochs in Ink @ 183–197 s (map-table states)</p>
    <video id="orig" src="segment.mp4" preload="metadata" playsinline></video>
  </div>
  <div class="side">
    <p class="lab">RECREATION — T54 map-as-table roster, parameterized</p>
    <iframe id="rec" src="recreation.html" title="T54 recreation"></iframe>
  </div>
</div>
<div id="controls">
  <button id="btnPlay" type="button">Play</button>
  <button id="btnPause" type="button">Pause</button>
  <button id="btnRestart" type="button">Restart</button>
</div>
<script>
"use strict";
const orig = document.getElementById("orig");
const rec = document.getElementById("rec");
let rafId = null;
function recApi(){ try { return rec.contentWindow && rec.contentWindow.__T54; } catch(e){ return null; } }
function syncLoop(){
  const api = recApi();
  if(api && !orig.paused){ api.seek(orig.currentTime * 1000); }
  if(!orig.paused && !orig.ended){ rafId = requestAnimationFrame(syncLoop); }
}
document.getElementById("btnPlay").addEventListener("click", function(){
  orig.play(); const api = recApi(); if(api) api.play(); syncLoop();
});
document.getElementById("btnPause").addEventListener("click", function(){
  orig.pause(); const api = recApi(); if(api) api.pause();
  if(rafId) cancelAnimationFrame(rafId);
});
document.getElementById("btnRestart").addEventListener("click", function(){
  orig.currentTime = 0; const api = recApi(); if(api) api.seek(0);
  orig.play(); if(api) api.play(); syncLoop();
});
orig.addEventListener("seeked", function(){ const api = recApi(); if(api) api.seek(orig.currentTime * 1000); });
</script>
</body>
</html>
