<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T57 — Quote cards with named attribution</title>
<style>
  html,body{margin:0;padding:0;background:var(--page-bg);}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  #stage{position:relative;width:100%;max-width:var(--stage-max);aspect-ratio:16/9;overflow:hidden;
    background:var(--field);font-family:var(--font-family);box-sizing:border-box;}
  #card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:var(--card-w);box-sizing:border-box;background:var(--card);
    border-left:var(--rule-w) solid var(--chip);border-radius:var(--card-radius);
    padding:var(--card-pad-y) var(--card-pad-x);box-shadow:var(--card-shadow);}
  #glyph{color:var(--chip);font-size:var(--glyph-size);line-height:0.6;font-weight:var(--quote-weight);}
  #quote{margin-top:var(--quote-gap);}
  .qline{color:var(--ink);font-size:var(--quote-size);font-weight:var(--quote-weight);
    line-height:var(--line-height);white-space:nowrap;opacity:0;}
  #chip{margin-top:var(--chip-gap);opacity:0;}
  #speaker{color:var(--chip-ink);font-size:var(--chip-size);font-weight:var(--chip-weight);}
  #occasion{color:var(--occasion);font-size:var(--chip-size);font-style:italic;font-weight:var(--occasion-weight);margin-left:var(--occasion-gap);}
</style>
</head>
<body>
<div id="stage">
  <div id="card">
    <div id="glyph">&ldquo;</div>
    <div id="quote"></div>
    <div id="chip"><span id="speaker"></span><span id="occasion"></span></div>
  </div>
</div>
<script>
"use strict";
/* ============ CONFIG — every content / timing / palette / geometry value lives here ============ */
const CONFIG = {
  durationMs: 14000,
  pageBg: "#000000",
  fontFamily: "Georgia, 'Times New Roman', serif",
  quotes: [
    { text: "Made a career of doing favors for his colleagues.",
      speaker: "Associated Press", occasion: "on Byrd",
      startAtMs: 0, exitStartMs: 8000 },
    { text: "Range far beyond his public ones.",
      speaker: "Semafor", occasion: "on Schumer's private commitments",
      startAtMs: 11500, exitStartMs: null }
  ],
  palette: { card: "#232a31", ink: "#f5f2ea", chip: "#b8860b", chipInk: "#ffffff",
             occasion: "#d9a62e", field: "#2e6b7a" },
  entranceMode: "unit",
  lifecycleMode: "specimen",
  cardEnterMs: 500,
  exitDurMs: 500,
  lineMs: 620,
  lineFadeMs: 260,
  chipFadeMs: 400,
  holdMs: 3000,
  entranceScaleFrom: 0.96,
  contrastTextMin: 4.5,
  contrastAccentMin: 2,
  contrastFallback: "lighten",
  layout: { stageMaxPx: 960, cardWidthFrac: 0.72, cardPadXFrac: 0.045, cardPadYFrac: 0.035,
            cardRadiusFrac: 0.012, rulePx: 4, cardMaxHeightFrac: 0.9,
            shadowOffsetYFrac: 0.011, shadowBlurFrac: 0.044, shadowAlpha: 0.35 },
  type: { quoteFrac: 0.040, glyphFrac: 0.075, chipFrac: 0.039,
          quoteWeight: 600, chipWeight: 700, occasionWeight: 400, lineHeight: 1.3,
          quoteGapFrac: 0.018, chipGapFrac: 0.022, fitGuard: 0.97,
          minQuotePx: 11, chipMinPx: 11, occasionGapEm: 0.45 }
};
/* URL override: ?config=<url-encoded JSON> deep-merges into CONFIG (swap route). */
(function applyOverride(){
  try {
    const q = new URLSearchParams(location.search).get("config");
    if (!q) return;
    const o = JSON.parse(q);
    (function merge(dst, src){
      for (const k in src) {
        if (src[k] && typeof src[k] === "object" && !Array.isArray(src[k]) &&
            dst[k] && typeof dst[k] === "object" && !Array.isArray(dst[k])) merge(dst[k], src[k]);
        else dst[k] = src[k];
      }
    })(CONFIG, o);
  } catch (e) { /* malformed override ignored; defaults stand */ }
})();

const stage = document.getElementById("stage");
const cardEl = document.getElementById("card");
const quoteEl = document.getElementById("quote");
const chipEl = document.getElementById("chip");
const speakerEl = document.getElementById("speaker");
const occasionEl = document.getElementById("occasion");
const glyphEl = document.getElementById("glyph");

function stageW() { return stage.clientWidth || CONFIG.layout.stageMaxPx; }

function applyVars() {
  const root = document.documentElement.style;
  root.setProperty("--page-bg", CONFIG.pageBg);
  const r = stage.style;
  r.setProperty("--field", CONFIG.palette.field);
  r.setProperty("--card", CONFIG.palette.card);
  r.setProperty("--ink", CONFIG.palette.ink);
  r.setProperty("--chip", CONFIG.palette.chip);
  r.setProperty("--chip-ink", CONFIG.palette.chipInk);
  r.setProperty("--occasion", CONFIG.palette.occasion);
  r.setProperty("--font-family", CONFIG.fontFamily);
  r.setProperty("--stage-max", CONFIG.layout.stageMaxPx + "px");
  const W = stageW();
  r.setProperty("--card-w", Math.round(W * CONFIG.layout.cardWidthFrac) + "px");
  r.setProperty("--card-pad-x", Math.round(W * CONFIG.layout.cardPadXFrac) + "px");
  r.setProperty("--card-pad-y", Math.round(W * CONFIG.layout.cardPadYFrac) + "px");
  r.setProperty("--card-radius", Math.round(W * CONFIG.layout.cardRadiusFrac) + "px");
  r.setProperty("--rule-w", CONFIG.layout.rulePx + "px");
  r.setProperty("--card-shadow", "0 " + Math.round(W * CONFIG.layout.shadowOffsetYFrac) + "px " +
    Math.round(W * CONFIG.layout.shadowBlurFrac) + "px rgba(0,0,0," + CONFIG.layout.shadowAlpha + ")");
  r.setProperty("--quote-size", Math.max(CONFIG.type.minQuotePx, W * CONFIG.type.quoteFrac) + "px");
  r.setProperty("--glyph-size", (W * CONFIG.type.glyphFrac) + "px");
  r.setProperty("--chip-size", Math.max(CONFIG.type.chipMinPx, W * CONFIG.type.chipFrac) + "px");
  r.setProperty("--quote-weight", CONFIG.type.quoteWeight);
  r.setProperty("--chip-weight", CONFIG.type.chipWeight);
  r.setProperty("--occasion-weight", CONFIG.type.occasionWeight);
  r.setProperty("--line-height", CONFIG.type.lineHeight);
  r.setProperty("--quote-gap", Math.round(W * CONFIG.type.quoteGapFrac) + "px");
  r.setProperty("--chip-gap", Math.round(W * CONFIG.type.chipGapFrac) + "px");
  r.setProperty("--occasion-gap", CONFIG.type.occasionGapEm + "em");
}

/* Measured line formation: greedy word wrap against canvas-measured text at the
   configured font; available width = card width minus actual padding minus rule.
   No preset line breaks, no character-count splitting. Long unbroken tokens are
   hard-split only when a single token exceeds the available width. */
const measCtx = document.createElement("canvas").getContext("2d");
function measure(text, px, weight, italic) {
  measCtx.font = (italic ? "italic " : "") + weight + " " + px + "px " + CONFIG.fontFamily;
  return measCtx.measureText(text).width;
}
function chipLineCount(q, availPx, chipPx) {
  const sp = measure("\u2014 " + q.speaker, chipPx, CONFIG.type.chipWeight, false);
  const oc = q.occasion ? measure(q.occasion, chipPx, CONFIG.type.occasionWeight, true) : 0;
  const gap = q.occasion ? chipPx * CONFIG.type.occasionGapEm : 0;
  return (sp + gap + oc) <= availPx ? 1 : 2;
}
function wrapQuote(q, availPx, fontPx, chipPx) {
  let size = fontPx;
  const guard = availPx * CONFIG.type.fitGuard;
  const words = q.text.split(/\s+/).filter(Boolean);
  function build(px) {
    const lines = []; let cur = "";
    for (const w of words) {
      if (measure(w, px, CONFIG.type.quoteWeight, false) > guard) {
        if (cur) { lines.push(cur); cur = ""; }
        let rest = w;
        while (measure(rest, px, CONFIG.type.quoteWeight, false) > guard && rest.length > 1) {
          let n = rest.length;
          while (n > 1 && measure(rest.slice(0, n), px, CONFIG.type.quoteWeight, false) > guard) n--;
          lines.push(rest.slice(0, n)); rest = rest.slice(n);
        }
        cur = rest; continue;
      }
      const trial = cur ? cur + " " + w : w;
      if (measure(trial, px, CONFIG.type.quoteWeight, false) <= guard) cur = trial;
      else { lines.push(cur); cur = w; }
    }
    if (cur) lines.push(cur);
    return lines;
  }
  /* Complete-card vertical fit: padding, glyph, gaps, quote lines and the
     attribution block (at its wrapped line count) are all priced; the quote
     font shrinks toward its floor until the whole card fits the height budget. */
  const W = stageW();
  const stageH = W * 9 / 16;
  const fixedH = 2 * (W * CONFIG.layout.cardPadYFrac)
    + (W * CONFIG.type.glyphFrac) * 0.6
    + W * CONFIG.type.quoteGapFrac + W * CONFIG.type.chipGapFrac;
  function totalH(px, lines) {
    return fixedH + lines.length * px * CONFIG.type.lineHeight
      + chipLineCount(q, availPx, chipPx) * chipPx * CONFIG.type.lineHeight;
  }
  let lines = build(size);
  while (size > CONFIG.type.minQuotePx && totalH(size, lines) > stageH * CONFIG.layout.cardMaxHeightFrac) {
    size -= 1; lines = build(size);
  }
  return { lines, fontPx: size, cardHeightPx: totalH(size, lines), stageHPx: stageH,
           chipLines: chipLineCount(q, availPx, chipPx) };
}

/* Contrast handling: text colors must clear the text floor against the card;
   the accent must clear the accent floor. When a color falls short and the
   configured fallback policy is "lighten", the color is lightened toward
   white in fixed steps until it clears (deterministic; the adjusted value is
   what renders). With any other policy value the colors render as configured. */
function lum(hex) {
  const c = hex.replace("#", "");
  const v = [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16) / 255)
    .map(s => s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4));
  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
}
function contrast(a, b) {
  const la = lum(a), lb = lum(b);
  return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
}
function lighten(hex, step) {
  const c = hex.replace("#", "");
  const ch = [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16));
  const out = ch.map(v => Math.round(v + (255 - v) * step));
  return "#" + out.map(v => v.toString(16).padStart(2, "0")).join("");
}
function guardPalette() {
  if (CONFIG.contrastFallback !== "lighten") return;
  const p = CONFIG.palette;
  const fix = (key, floor) => {
    let guard = 0;
    while (contrast(p[key], p.card) < floor && guard < 20) { p[key] = lighten(p[key], 0.12); guard++; }
  };
  fix("ink", CONFIG.contrastTextMin);
  fix("chipInk", CONFIG.contrastTextMin);
  fix("occasion", CONFIG.contrastTextMin);
  fix("chip", CONFIG.contrastAccentMin);
}

/* Precomputed timeline: every quote is wrapped and every start time is fixed
   before playback begins, so any seek lands on the same state sequential
   playback would show. In the scheduled lifecycle each quote carries its own
   start; otherwise starts accumulate from entrance + hold spans. The required
   duration is derived from the table; a shorter configured duration extends
   to the requirement and the extension is recorded in the diagnostics. */
let timeline = [];
let diagnostics = { extendedDurationMs: 0, requiredMs: 0, quoteCount: 0 };
function computeTimeline() {
  const W = stageW();
  const cardW = W * CONFIG.layout.cardWidthFrac;
  const avail = cardW - 2 * (W * CONFIG.layout.cardPadXFrac) - CONFIG.layout.rulePx;
  const fontPx = Math.max(CONFIG.type.minQuotePx, W * CONFIG.type.quoteFrac);
  const chipPx = Math.max(CONFIG.type.chipMinPx, W * CONFIG.type.chipFrac);
  timeline = [];
  let cursor = 0;
  CONFIG.quotes.forEach((q, i) => {
    const w = wrapQuote(q, avail, fontPx, chipPx);
    let start;
    if (CONFIG.lifecycleMode === "specimen" && typeof q.startAtMs === "number") start = q.startAtMs;
    else if (i === 0) start = 0;
    else start = cursor;
    const span = CONFIG.cardEnterMs + CONFIG.holdMs;
    const exitStart = (CONFIG.lifecycleMode === "specimen" && typeof q.exitStartMs === "number")
      ? q.exitStartMs : null;
    /* A scheduled quote with no exit holds to the end of the window. */
    const end = exitStart !== null ? exitStart + CONFIG.exitDurMs
      : (CONFIG.lifecycleMode === "specimen" && typeof q.startAtMs === "number")
        ? Math.max(start + CONFIG.cardEnterMs, CONFIG.durationMs)
        : start + span;
    timeline.push({ quote: q, wrapped: w, startMs: start, exitStartMs: exitStart, endMs: end });
    cursor = Math.max(cursor, end);
  });
  diagnostics.quoteCount = timeline.length;
  diagnostics.requiredMs = timeline.length ? Math.max.apply(null, timeline.map(e => e.endMs)) : 0;
  diagnostics.extendedDurationMs = Math.max(0, diagnostics.requiredMs - CONFIG.durationMs);
}
function effectiveDuration() { return Math.max(CONFIG.durationMs, diagnostics.requiredMs); }

let lineDivs = [];
let curQuote = -1;
function buildQuote(i) {
  const entry = timeline[i];
  const q = entry.quote;
  quoteEl.innerHTML = "";
  lineDivs = entry.wrapped.lines.map(txt => {
    const d = document.createElement("div");
    d.className = "qline"; d.textContent = txt; d.style.fontSize = entry.wrapped.fontPx + "px";
    quoteEl.appendChild(d); return d;
  });
  speakerEl.textContent = "\u2014 " + q.speaker;
  occasionEl.textContent = q.occasion;
}
function clamp01(v) { return Math.min(1, Math.max(0, v)); }
function renderAt(tMs) {
  if (!timeline.length) { cardEl.style.opacity = 0; return; }
  let i = 0;
  for (let k = 0; k < timeline.length; k++) if (tMs >= timeline[k].startMs) i = k;
  if (tMs < timeline[0].startMs) i = 0;
  if (i !== curQuote) { curQuote = i; buildQuote(i); }
  const entry = timeline[i];
  const local = tMs - entry.startMs;
  const enter = clamp01(local / CONFIG.cardEnterMs);
  let exitP = 0;
  if (entry.exitStartMs !== null) exitP = clamp01((tMs - entry.exitStartMs) / CONFIG.exitDurMs);
  const vis = enter * (1 - exitP);
  const scale = CONFIG.entranceScaleFrom + (1 - CONFIG.entranceScaleFrom) * enter;
  cardEl.style.opacity = vis;
  cardEl.style.transform = "translate(-50%,-50%) scale(" + scale + ")";
  if (CONFIG.entranceMode === "staggered") {
    lineDivs.forEach((d, li) => {
      const start = CONFIG.cardEnterMs + li * CONFIG.lineMs;
      d.style.opacity = clamp01((local - start) / CONFIG.lineFadeMs) * (1 - exitP);
    });
    const chipStart = CONFIG.cardEnterMs + lineDivs.length * CONFIG.lineMs;
    const cp = clamp01((local - chipStart) / CONFIG.chipFadeMs) * (1 - exitP);
    chipEl.style.opacity = cp;
    glyphEl.style.opacity = enter * (1 - exitP);
  } else {
    lineDivs.forEach(d => { d.style.opacity = vis; });
    chipEl.style.opacity = vis;
    glyphEl.style.opacity = vis;
  }
}
let startStamp = null, pausedAt = 0, playing = false;
function frame(now) {
  if (!playing) return;
  if (startStamp === null) startStamp = now - pausedAt;
  const t = now - startStamp;
  if (t >= effectiveDuration()) { renderAt(effectiveDuration()); playing = false; return; }
  renderAt(t);
  requestAnimationFrame(frame);
}
function play() { if (!playing) { playing = true; startStamp = null; requestAnimationFrame(frame); } }
function pause() { playing = false; }
function seek(ms) { pausedAt = Math.max(0, Math.min(effectiveDuration(), ms)); renderAt(pausedAt); if (playing) startStamp = null; }
function relayout() { applyVars(); computeTimeline(); curQuote = -1; renderAt(pausedAt); }
guardPalette();
applyVars();
computeTimeline();
if (timeline.length) { buildQuote(0); curQuote = 0; }
renderAt(0);
window.addEventListener("resize", relayout);
window.__T57 = { seek, play, pause, renderAt, CONFIG, timeline: () => timeline,
  diagnostics: () => diagnostics, effectiveDuration,
  wrap: (text) => { const W = stageW();
    const avail = W * CONFIG.layout.cardWidthFrac - 2 * (W * CONFIG.layout.cardPadXFrac) - CONFIG.layout.rulePx;
    return wrapQuote({ text, speaker: "", occasion: "" }, avail,
      Math.max(CONFIG.type.minQuotePx, W * CONFIG.type.quoteFrac),
      Math.max(CONFIG.type.chipMinPx, W * CONFIG.type.chipFrac)); },
  contrast };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
play();
</script>
</body>
</html>
