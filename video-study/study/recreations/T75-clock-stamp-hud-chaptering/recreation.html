<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T75 — Clock-stamp HUD chaptering (recreation)</title>
<!--
  T75 — Clock-stamp chaptering under a persistent HUD. Parameterized recreation.
  Technique: every frame carries the same top-left furniture — a year line above a
  large diegetic clock with a progress tick; chapters begin exactly on the clock's
  turns; the scene below swaps while the HUD persists. The HUD element is built ONCE
  and lives OUTSIDE the scene-swap container, so persistence at chapter turns holds
  by construction (only the clock text and tick fill update; the HUD node is never
  re-created). All content, timing and palette read from CONFIG below; the logic
  reads ONLY CONFIG. Scenes are simplified generated SVG silhouettes (context only,
  §8) derived procedurally from each chapter's scene name. No captions anywhere;
  the specimen's narration caption is excluded by fleet law. No specimen media.
  Chapter turns beyond the 5-19 s evidence window are an allocation model: the
  CONFIG chapter list carries >=2 turns inside the recreation's own duration.
  Seekable: render(tMs) is a pure function of t. PIXEL-UNVERIFIED: logic-level
  verification only (no browser binary in this seat).
-->
<style>
  html,body{margin:0;padding:0;}
  #stage{position:relative;margin:0 auto;overflow:hidden;font-family:Georgia,'Times New Roman',serif;}
  #sceneBox{position:absolute;inset:0;}
  #sceneBox svg{display:block;width:100%;height:100%;}
  #hud{position:absolute;z-index:5;pointer-events:none;}
  #yearLine{font-family:Verdana,Geneva,sans-serif;white-space:nowrap;}
  #clockRow{display:flex;align-items:center;}
  #clock{white-space:nowrap;line-height:1;}
  #tick{position:relative;}
  #tickFill{position:absolute;left:0;top:0;}
  #tickDot{position:absolute;border-radius:50%;}
</style>
</head>
<body>
<div id="stage">
  <div id="sceneBox"></div>
  <div id="hud">
    <div id="yearLine"></div>
    <div id="clockRow">
      <div id="clock"></div>
      <div id="tick"><div id="tickFill"></div><div id="tickDot"></div></div>
    </div>
  </div>
</div>
<script>
'use strict';
/* ================= CONFIG (specimen values are the defaults) ================= */
const CONFIG = {
  hud: { yearLine: "2037 · A POSSIBLE TUESDAY", tickColor: "#e8c86a", tickWidthPx: 34 },
  chapters: [
    { clock: "06:15", scene: "kitchen", sceneBg: "#101c3a" },
    { clock: "07:00", scene: "street",  sceneBg: "#1a2a4a" },
    { clock: "08:30", scene: "office",  sceneBg: "#24365e" }
  ],
  palette: { hudInk: "#f5f2e6", bg: "#101c3a", accent: "#e8c86a" },
  chapterMs: 4200,
  holdMs: 800,
  stage: { width: 360, height: 240 },
  type: { yearPx: 16, yearSpacingPx: 1, clockPx: 34 },
  geom: { hudTop: 10, hudLeft: 12, tickGapPx: 8, tickHPx: 2, tickDotPx: 6, groundHPx: 34, winW: 10, winH: 13, starCount: 22, starOpacity: 0.5, winLitRatio: 0.34, winOpacity: 0.85 }
};
/* ============ CONFIG override (swap tests) — allowlisted, validated ============ */
function isStr(v){ return typeof v === 'string' && v.length > 0 && v.length <= 80; }
function isHex(v){ return typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v); }
function isPos(v){ return typeof v === 'number' && isFinite(v) && v > 0 && v <= 60000; }
function isPx(v){ return typeof v === 'number' && isFinite(v) && v >= 4 && v <= 120; }
function applyOverride(cfg, o){
  if (!o || typeof o !== 'object') return cfg;
  const c = JSON.parse(JSON.stringify(cfg));
  if (o.hud && typeof o.hud === 'object'){
    if (isStr(o.hud.yearLine)) c.hud.yearLine = o.hud.yearLine;
    if (isHex(o.hud.tickColor)) c.hud.tickColor = o.hud.tickColor;
    if (isPx(o.hud.tickWidthPx)) c.hud.tickWidthPx = o.hud.tickWidthPx;
  }
  if (Array.isArray(o.chapters) && o.chapters.length >= 1 && o.chapters.length <= 8){
    const ok = o.chapters.every(function(ch){ return ch && isStr(ch.clock) && isStr(ch.scene) && isHex(ch.sceneBg); });
    if (ok) c.chapters = o.chapters.map(function(ch){ return { clock: ch.clock, scene: ch.scene, sceneBg: ch.sceneBg }; });
  }
  if (o.palette && typeof o.palette === 'object'){
    if (isHex(o.palette.hudInk)) c.palette.hudInk = o.palette.hudInk;
    if (isHex(o.palette.bg)) c.palette.bg = o.palette.bg;
    if (isHex(o.palette.accent)) c.palette.accent = o.palette.accent;
  }
  if (isPos(o.chapterMs)) c.chapterMs = o.chapterMs;
  if (isPos(o.holdMs) || o.holdMs === 0) c.holdMs = o.holdMs;
  return c;
}
let CFG = CONFIG;
try {
  const q = new URLSearchParams(location.search).get('cfg');
  if (q) CFG = applyOverride(CONFIG, JSON.parse(q));
} catch (e) { CFG = CONFIG; }

/* ================= Scene silhouettes (generated, seeded by scene name) ================= */
function seedOf(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0); }
function rng(seed){ let a = seed; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function sceneSVG(ch){
  const W = CFG.stage.width, H = CFG.stage.height, g = CFG.geom;
  const r = rng(seedOf(ch.scene));
  const groundY = H - g.groundHPx;
  let out = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
  out += '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="' + ch.sceneBg + '"/>';
  // stars (deterministic dots)
  for (let i = 0; i < g.starCount; i++){
    const sx = Math.floor(r() * W), sy = Math.floor(r() * groundY * 0.5);
    out += '<circle cx="' + sx + '" cy="' + sy + '" r="1" fill="' + CFG.palette.hudInk + '" opacity="' + g.starOpacity + '"/>';
  }
  // building silhouettes across the width
  let x = -6;
  while (x < W){
    const bw = 26 + Math.floor(r() * 30);
    const bh = 52 + Math.floor(r() * (groundY - 70));
    const by = groundY - bh;
    out += '<rect x="' + x + '" y="' + by + '" width="' + bw + '" height="' + bh + '" fill="' + CFG.palette.bg + '"/>';
    const cols = Math.max(1, Math.floor(bw / (g.winW + 7)));
    const rows = Math.max(1, Math.floor(bh / (g.winH + 8)));
    for (let cx = 0; cx < cols; cx++) for (let cy = 0; cy < rows; cy++){
      if (r() < g.winLitRatio){
        const wx = x + 5 + cx * (g.winW + 7), wy = by + 6 + cy * (g.winH + 8);
        out += '<rect x="' + wx + '" y="' + wy + '" width="' + g.winW + '" height="' + g.winH + '" fill="' + CFG.palette.accent + '" opacity="' + g.winOpacity + '"/>';
      }
    }
    x += bw + 4 + Math.floor(r() * 8);
  }
  out += '<rect x="0" y="' + groundY + '" width="' + W + '" height="' + g.groundHPx + '" fill="' + CFG.palette.bg + '"/>';
  out += '</svg>';
  return out;
}

/* ================= Build (HUD built once, outside the scene container) ================= */
const stageEl = document.getElementById('stage');
const sceneBox = document.getElementById('sceneBox');
const hudEl = document.getElementById('hud');
const yearEl = document.getElementById('yearLine');
const clockEl = document.getElementById('clock');
const tickEl = document.getElementById('tick');
const tickFill = document.getElementById('tickFill');
const tickDot = document.getElementById('tickDot');
document.body.style.background = CFG.palette.bg;
stageEl.style.width = CFG.stage.width + 'px';
stageEl.style.height = CFG.stage.height + 'px';
stageEl.style.background = CFG.palette.bg;
hudEl.style.top = CFG.geom.hudTop + 'px';
hudEl.style.left = CFG.geom.hudLeft + 'px';
yearEl.textContent = CFG.hud.yearLine;
yearEl.style.fontSize = CFG.type.yearPx + 'px';
yearEl.style.letterSpacing = CFG.type.yearSpacingPx + 'px';
yearEl.style.color = CFG.palette.accent;
clockEl.style.fontSize = CFG.type.clockPx + 'px';
clockEl.style.color = CFG.palette.hudInk;
tickEl.style.width = CFG.hud.tickWidthPx + 'px';
tickEl.style.height = CFG.geom.tickHPx + 'px';
tickEl.style.marginLeft = CFG.geom.tickGapPx + 'px';
tickEl.style.background = CFG.palette.hudInk;
tickFill.style.height = CFG.geom.tickHPx + 'px';
tickFill.style.background = CFG.hud.tickColor;
tickDot.style.top = (-(CFG.geom.tickDotPx - CFG.geom.tickHPx) / 2) + 'px';
tickDot.style.width = CFG.geom.tickDotPx + 'px';
tickDot.style.height = CFG.geom.tickDotPx + 'px';
tickDot.style.background = CFG.hud.tickColor;
const sceneCache = CFG.chapters.map(function(ch){ return sceneSVG(ch); });
let curChapter = -1;

/* ================= render(t): pure function of t (ms) ================= */
function chapterSpan(){ return CFG.chapterMs + CFG.holdMs; }
function totalMs(){ return chapterSpan() * CFG.chapters.length; }
function render(t){
  const span = chapterSpan();
  const tt = ((t % totalMs()) + totalMs()) % totalMs();
  const idx = Math.min(CFG.chapters.length - 1, Math.floor(tt / span));
  const frac = (tt - idx * span) / span;
  if (idx !== curChapter){
    curChapter = idx;
    sceneBox.innerHTML = sceneCache[idx];       // scene swaps UNDER the HUD
    clockEl.textContent = CFG.chapters[idx].clock; // clock flips exactly at the boundary
  }
  const fillW = Math.round(CFG.hud.tickWidthPx * frac);
  tickFill.style.width = fillW + 'px';
  tickDot.style.left = Math.max(0, fillW - CFG.geom.tickDotPx) + 'px';
  return { chapter: idx, clock: CFG.chapters[idx].clock, frac: frac };
}
window.__render = render;
window.__totalMs = totalMs();
window.__hudNode = hudEl;

/* ================= Autoplay ================= */
let startStamp = null;
function frame(ts){
  if (startStamp === null) startStamp = ts;
  render(ts - startStamp);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
