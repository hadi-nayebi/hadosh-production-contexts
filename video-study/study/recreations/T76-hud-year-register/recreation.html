<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T76 — HUD year register (recreation)</title>
<!--
  T76 — The HUD year as epistemic register. Parameterized recreation.
  Technique: the HUD's clock tracks the story's hour and HOLDS (it never changes);
  its YEAR tracks the evidence — inside a 2037 scene it reads the scene year until a
  present-day seed card is on screen, when the year flips to the seed's year while
  the clock holds the scene's hour; when the card leaves, the year returns.
  Construction: the HUD is built ONCE outside the scene container. ONE shared flip
  progress value (derived from render(t) at a year-changing boundary) drives BOTH
  the seed card's arrival/departure AND the year digits' roll — the card's arrival
  visibly carries the flip (plan-review cure 1). render(t) is a pure function of t:
  exactly ONE state owns the stage at any t; the inactive card is absent (display
  none) outside its boundary transition; there are no CSS transitions, so seeking
  forward or backward lands on the same frame (Owner Cure 2, phase exclusivity).
  Cure 1 (intensity separation): during the seed state the scene container dims to
  CONFIG intensity.sceneSeed while the card and the HUD (outside the scene
  container) stay at intensity.fg. The scene generator also keeps a CONFIG quiet
  zone behind the HUD (no lit windows or stars inside it — T75 readability cure).
  Schedule basis: t=0 allocation (RUN.md §1/§2b) — the segment window proves the
  flipped STATE; the flip sequence is re-based to the build's own zero as the
  CONFIG states list. INTERIM-CURE SCHEDULE (timing lens, interim1): phases carry
  INDEPENDENT durations — the scene phase (4200 ms) puts the flip entry inside
  the measured seg 3-6 s bracket, and the seed phase (8400 ms) + endHoldMs hold
  the flipped state through the window's end (the specimen still shows it at
  seg 13.5 s). The return flip resolves at the loop seam as an explicit
  allocation: during the first flipMs after the wrap, the year rolls back and
  the card exits. Cycle is exactly 14000 ms: sum of state durMs + endHoldMs,
  where endHoldMs holds the final settled state before the loop wraps.
  All content, timing, palette, typography and geometry read from CONFIG; the
  logic reads ONLY CONFIG. No captions anywhere. No specimen media.
  PIXEL-UNVERIFIED: logic-level verification only (no browser binary in this seat).
-->
<style>
  html,body{margin:0;padding:0;}
  #stage{position:relative;margin:0 auto;overflow:hidden;}
  #sceneBox{position:absolute;inset:0;}
  #sceneBox svg{display:block;width:100%;height:100%;}
  #hud{position:absolute;z-index:5;pointer-events:none;}
  #yearLine{white-space:nowrap;display:flex;align-items:baseline;}
  #yearWrap{position:relative;display:inline-block;overflow:hidden;vertical-align:baseline;}
  .yearSpan{white-space:nowrap;}
  .yearSpan.abs{position:absolute;left:0;top:0;}
  #clockRow{display:flex;align-items:center;}
  #clock{white-space:nowrap;line-height:1;}
  #tick{position:relative;}
  #tickDot{position:absolute;border-radius:50%;}
  #card{position:absolute;z-index:4;box-sizing:border-box;}
  #cardStatus{white-space:nowrap;}
  #cardPlace{white-space:nowrap;}
</style>
</head>
<body>
<div id="stage">
  <div id="sceneBox"></div>
  <div id="card">
    <div id="cardStatus"></div>
    <div id="cardPlace"></div>
  </div>
  <div id="hud">
    <div id="yearLine"><span id="yearWrap"><span class="yearSpan" id="yearA"></span><span class="yearSpan abs" id="yearB"></span></span><span id="dayPart"></span></div>
    <div id="clockRow">
      <div id="clock"></div>
      <div id="tick"><div id="tickDot"></div></div>
    </div>
  </div>
</div>
<script>
'use strict';
/* ================= CONFIG (specimen values are the defaults) ================= */
const CONFIG = {
  hud: { sceneYear: 2037, dayLine: "A POSSIBLE TUESDAY", clock: "12:00" },
  states: [
    { kind: "scene", durMs: 4200 },
    { kind: "seed", seedYear: 2026, cardStatus: "ALREADY BEING BUILT", cardPlace: "UK · 2026", durMs: 8400 }
  ],
  palette: { bg: "#1d3f8f", hudInk: "#f5f2e6", accent: "#e8c86a", card: "#16283f", scene: "#274b8f" },
  flipMs: 350,
  endHoldMs: 1400,
  flipEasing: "easeOutCubic",
  stage: { width: 360, height: 240 },
  type: { font: "Georgia, 'Times New Roman', serif", sans: "Verdana, Geneva, sans-serif", yearPx: 16, clockPx: 34, cardStatusPx: 16, cardPlacePx: 17, daySpacingPx: 1, cardSpacingPx: 1 },
  intensity: { fg: 1, sceneSeed: 0.55 },
  geom: { hudTop: 10, hudLeft: 12, tickGapPx: 8, tickHPx: 2, tickDotPx: 6, tickWidthPx: 34, quietW: 200, quietH: 66, cardLeft: 12, cardTop: 92, cardW: 252, cardPadPx: 10, cardAccentW: 3, flipRisePx: 12, cardTravelPx: 26, wrapEm: 1.25, groundHPx: 30, winW: 10, winH: 13, starCount: 18, starOpacity: 0.5, winLitRatio: 0.3, winOpacity: 0.85, bWMin: 26, bWVar: 30, bHMin: 52, bHVar: 90, bGapMin: 4, bGapVar: 8 }
};
/* ============ CONFIG override (swap tests) — allowlisted, validated ============ */
function isStr(v, max){ return typeof v === 'string' && v.length > 0 && v.length <= (max || 80); }
function isHex(v){ return typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v); }
function isPos(v){ return typeof v === 'number' && isFinite(v) && v > 0 && v <= 60000; }
function isYear(v){ return typeof v === 'number' && isFinite(v) && v >= 1900 && v <= 2200; }
function isPx(v){ return typeof v === 'number' && isFinite(v) && v >= 4 && v <= 120; }
function isUnit(v){ return typeof v === 'number' && isFinite(v) && v > 0 && v <= 1; }
function applyOverride(cfg, o){
  if (!o || typeof o !== 'object') return cfg;
  const c = JSON.parse(JSON.stringify(cfg));
  if (o.hud && typeof o.hud === 'object'){
    if (isYear(o.hud.sceneYear)) c.hud.sceneYear = o.hud.sceneYear;
    if (isStr(o.hud.dayLine, 40)) c.hud.dayLine = o.hud.dayLine;
    if (isStr(o.hud.clock, 10)) c.hud.clock = o.hud.clock;
  }
  if (Array.isArray(o.states) && o.states.length >= 1 && o.states.length <= 8){
    const ok = o.states.every(function(s){
      if (!s || (s.kind !== 'scene' && s.kind !== 'seed')) return false;
      if (!isPos(s.durMs)) return false;
      if (s.kind === 'seed') return isYear(s.seedYear) && isStr(s.cardStatus, 40) && isStr(s.cardPlace, 40);
      return true;
    });
    if (ok) c.states = o.states.map(function(s){
      return s.kind === 'seed' ? { kind: 'seed', seedYear: s.seedYear, cardStatus: s.cardStatus, cardPlace: s.cardPlace, durMs: s.durMs } : { kind: 'scene', durMs: s.durMs };
    });
  }
  if (o.palette && typeof o.palette === 'object'){
    ['bg','hudInk','accent','card','scene'].forEach(function(k){ if (isHex(o.palette[k])) c.palette[k] = o.palette[k]; });
  }
  if (isPos(o.flipMs)) c.flipMs = o.flipMs;
  if (isPos(o.endHoldMs) || o.endHoldMs === 0) c.endHoldMs = o.endHoldMs;
  if (o.flipEasing === 'easeOutCubic' || o.flipEasing === 'linear') c.flipEasing = o.flipEasing;
  if (o.stage && typeof o.stage === 'object'){
    if (isPx(o.stage.width) || (typeof o.stage.width === 'number' && o.stage.width >= 200 && o.stage.width <= 720)) c.stage.width = o.stage.width;
    if (typeof o.stage.height === 'number' && o.stage.height >= 120 && o.stage.height <= 480) c.stage.height = o.stage.height;
  }
  if (o.type && typeof o.type === 'object'){
    if (isStr(o.type.font, 120)) c.type.font = o.type.font;
    if (isStr(o.type.sans, 120)) c.type.sans = o.type.sans;
    ['yearPx','clockPx','cardStatusPx','cardPlacePx'].forEach(function(k){ if (isPx(o.type[k])) c.type[k] = o.type[k]; });
    if (typeof o.type.daySpacingPx === 'number' && o.type.daySpacingPx >= 0 && o.type.daySpacingPx <= 8) c.type.daySpacingPx = o.type.daySpacingPx;
    if (typeof o.type.cardSpacingPx === 'number' && o.type.cardSpacingPx >= 0 && o.type.cardSpacingPx <= 8) c.type.cardSpacingPx = o.type.cardSpacingPx;
  }
  if (o.intensity && typeof o.intensity === 'object'){
    if (isUnit(o.intensity.fg)) c.intensity.fg = o.intensity.fg;
    if (isUnit(o.intensity.sceneSeed)) c.intensity.sceneSeed = o.intensity.sceneSeed;
  }
  if (o.geom && typeof o.geom === 'object'){
    Object.keys(c.geom).forEach(function(k){
      const v = o.geom[k];
      if (typeof v === 'number' && isFinite(v) && v >= 0 && v <= 720) c.geom[k] = v;
    });
  }
  return c;
}
let CFG = CONFIG;
try {
  const q = new URLSearchParams(location.search).get('cfg');
  if (q) CFG = applyOverride(CONFIG, JSON.parse(q));
} catch (e) { CFG = CONFIG; }

/* ================= Scene silhouette (generated, deterministic) ================= */
function seedOf(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0); }
function rng(seed){ let a = seed; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function sceneSVG(){
  const W = CFG.stage.width, H = CFG.stage.height, g = CFG.geom;
  const r = rng(seedOf('t76-city'));
  const groundY = H - g.groundHPx;
  let out = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
  out += '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="' + CFG.palette.bg + '"/>';
  for (let i = 0; i < g.starCount; i++){
    const sx = Math.floor(r() * W), sy = Math.floor(r() * groundY * 0.5);
    if (sx < g.quietW && sy < g.quietH) continue; // quiet zone behind the HUD
    out += '<circle cx="' + sx + '" cy="' + sy + '" r="1" fill="' + CFG.palette.hudInk + '" opacity="' + g.starOpacity + '"/>';
  }
  let x = -6;
  while (x < W){
    const bw = g.bWMin + Math.floor(r() * g.bWVar);
    const bh = g.bHMin + Math.floor(r() * g.bHVar);
    const by = groundY - bh;
    out += '<rect x="' + x + '" y="' + by + '" width="' + bw + '" height="' + bh + '" fill="' + CFG.palette.scene + '"/>';
    const cols = Math.max(1, Math.floor(bw / (g.winW + 7)));
    const rows = Math.max(1, Math.floor(bh / (g.winH + 8)));
    for (let cx = 0; cx < cols; cx++) for (let cy = 0; cy < rows; cy++){
      if (r() < g.winLitRatio){
        const wx = x + 5 + cx * (g.winW + 7), wy = by + 6 + cy * (g.winH + 8);
        if (wx < g.quietW && wy < g.quietH) continue; // quiet zone behind the HUD
        out += '<rect x="' + wx + '" y="' + wy + '" width="' + g.winW + '" height="' + g.winH + '" fill="' + CFG.palette.accent + '" opacity="' + g.winOpacity + '"/>';
      }
    }
    x += bw + g.bGapMin + Math.floor(r() * g.bGapVar);
  }
  out += '<rect x="0" y="' + groundY + '" width="' + W + '" height="' + g.groundHPx + '" fill="' + CFG.palette.scene + '"/>';
  out += '</svg>';
  return out;
}

/* ================= Build (HUD + card built once, outside the scene container) ================= */
const stageEl = document.getElementById('stage');
const sceneBox = document.getElementById('sceneBox');
const hudEl = document.getElementById('hud');
const yearWrap = document.getElementById('yearWrap');
const yearA = document.getElementById('yearA');
const yearB = document.getElementById('yearB');
const dayPart = document.getElementById('dayPart');
const clockEl = document.getElementById('clock');
const tickEl = document.getElementById('tick');
const tickDot = document.getElementById('tickDot');
const cardEl = document.getElementById('card');
const cardStatusEl = document.getElementById('cardStatus');
const cardPlaceEl = document.getElementById('cardPlace');
document.body.style.background = CFG.palette.bg;
stageEl.style.width = CFG.stage.width + 'px';
stageEl.style.height = CFG.stage.height + 'px';
stageEl.style.background = CFG.palette.bg;
stageEl.style.fontFamily = CFG.type.font;
sceneBox.innerHTML = sceneSVG();
hudEl.style.top = CFG.geom.hudTop + 'px';
hudEl.style.left = CFG.geom.hudLeft + 'px';
hudEl.style.opacity = String(CFG.intensity.fg);
yearWrap.style.height = Math.round(CFG.type.yearPx * CFG.geom.wrapEm) + 'px';
[yearA, yearB].forEach(function(el){
  el.style.fontFamily = CFG.type.sans;
  el.style.fontSize = CFG.type.yearPx + 'px';
  el.style.letterSpacing = CFG.type.daySpacingPx + 'px';
  el.style.color = CFG.palette.accent;
});
dayPart.style.fontFamily = CFG.type.sans;
dayPart.style.fontSize = CFG.type.yearPx + 'px';
dayPart.style.letterSpacing = CFG.type.daySpacingPx + 'px';
dayPart.style.color = CFG.palette.accent;
dayPart.textContent = ' · ' + CFG.hud.dayLine;
clockEl.textContent = CFG.hud.clock; // set ONCE — the clock holds by construction
clockEl.style.fontSize = CFG.type.clockPx + 'px';
clockEl.style.color = CFG.palette.hudInk;
tickEl.style.width = CFG.geom.tickWidthPx + 'px';
tickEl.style.height = CFG.geom.tickHPx + 'px';
tickEl.style.marginLeft = CFG.geom.tickGapPx + 'px';
tickEl.style.background = CFG.palette.accent;
tickDot.style.width = CFG.geom.tickDotPx + 'px';
tickDot.style.height = CFG.geom.tickDotPx + 'px';
tickDot.style.top = (-(CFG.geom.tickDotPx - CFG.geom.tickHPx) / 2) + 'px';
tickDot.style.right = '0px';
tickDot.style.background = CFG.palette.accent;
cardEl.style.left = CFG.geom.cardLeft + 'px';
cardEl.style.top = CFG.geom.cardTop + 'px';
cardEl.style.width = CFG.geom.cardW + 'px';
cardEl.style.padding = CFG.geom.cardPadPx + 'px';
cardEl.style.background = CFG.palette.card;
cardEl.style.borderLeft = CFG.geom.cardAccentW + 'px solid ' + CFG.palette.accent;
cardEl.style.opacity = String(CFG.intensity.fg);
cardStatusEl.style.fontFamily = CFG.type.sans;
cardStatusEl.style.fontSize = CFG.type.cardStatusPx + 'px';
cardStatusEl.style.letterSpacing = CFG.type.cardSpacingPx + 'px';
cardStatusEl.style.color = CFG.palette.accent;
cardPlaceEl.style.fontSize = CFG.type.cardPlacePx + 'px';
cardPlaceEl.style.color = CFG.palette.hudInk;

/* ================= render(t): pure function of t (ms) ================= */
const EASINGS = {
  easeOutCubic: function(p){ return 1 - Math.pow(1 - p, 3); },
  linear: function(p){ return p; }
};
function yearFor(state){ return state.kind === 'seed' ? state.seedYear : CFG.hud.sceneYear; }
function statesMs(){ return CFG.states.reduce(function(a, s){ return a + s.durMs; }, 0); }
function totalMs(){ return statesMs() + CFG.endHoldMs; }
function render(t){
  const total = totalMs();
  const cycle = Math.floor(t / total);
  const tt = ((t % total) + total) % total;
  const n = CFG.states.length;
  let idx, local;
  if (tt >= statesMs()){ idx = n - 1; local = CFG.states[n - 1].durMs; } // endHold: final state settled
  else {
    let acc = 0; idx = 0;
    while (idx < n - 1 && tt >= acc + CFG.states[idx].durMs){ acc += CFG.states[idx].durMs; idx++; }
    local = tt - acc;
  }
  const cur = CFG.states[idx];
  const prev = CFG.states[(idx - 1 + n) % n];
  const yCur = yearFor(cur), yPrev = yearFor(prev);
  const ease = EASINGS[CFG.flipEasing] || EASINGS.easeOutCubic;
  // Shared flip progress: ONE value drives the year roll AND the card's travel.
  // At the loop seam (idx 0, prev = last state) this same rule runs the return
  // flip — the seam allocation named in the header — but ONLY on loop
  // continuation (cycle >= 1): fresh playback (cycle 0) opens settled on the
  // scene state, matching the observed opening (2037, no card).
  let p = 1, flipping = false;
  if (yCur !== yPrev && local < CFG.flipMs && !(cycle === 0 && idx === 0)){ p = ease(local / CFG.flipMs); flipping = true; }
  // Year register
  if (flipping){
    yearA.textContent = String(yPrev);
    yearB.textContent = String(yCur);
    yearA.style.transform = 'translateY(' + (-p * CFG.geom.flipRisePx) + 'px)';
    yearA.style.opacity = String(1 - p);
    yearB.style.transform = 'translateY(' + ((1 - p) * CFG.geom.flipRisePx) + 'px)';
    yearB.style.opacity = String(p);
    yearB.style.display = 'inline-block';
  } else {
    yearA.textContent = String(yCur);
    yearA.style.transform = 'translateY(0px)';
    yearA.style.opacity = '1';
    yearB.style.display = 'none';
  }
  // Seed card: present only when the seed state owns the stage (or its boundary flip)
  let cardP = -1; // -1 = absent
  if (cur.kind === 'seed') cardP = flipping ? p : 1;
  else if (prev.kind === 'seed' && flipping) cardP = 1 - p;
  if (cardP < 0){
    cardEl.style.display = 'none';
  } else {
    const seedState = cur.kind === 'seed' ? cur : prev;
    cardStatusEl.textContent = seedState.cardStatus;
    cardPlaceEl.textContent = seedState.cardPlace;
    cardEl.style.display = 'block';
    cardEl.style.opacity = String(CFG.intensity.fg * cardP);
    cardEl.style.transform = 'translateX(' + (-(1 - cardP) * CFG.geom.cardTravelPx) + 'px)';
  }
  // Scene intensity: dimmed while the seed state owns the stage (Cure 1)
  let sceneO = 1;
  if (cur.kind === 'seed') sceneO = flipping ? (1 - p * (1 - CFG.intensity.sceneSeed)) : CFG.intensity.sceneSeed;
  else if (prev.kind === 'seed' && flipping) sceneO = CFG.intensity.sceneSeed + p * (1 - CFG.intensity.sceneSeed);
  sceneBox.style.opacity = String(sceneO);
  return { state: idx, kind: cur.kind, year: yCur, clock: CFG.hud.clock, flipping: flipping, card: cardP >= 0 };
}
window.__render = render;
window.__totalMs = totalMs();
window.__hudNode = hudEl;
window.__clockNode = clockEl;

/* ================= Autoplay ================= */
let startStamp = null;
function frame(ts){
  if (startStamp === null) startStamp = ts;
  render(ts - startStamp);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
