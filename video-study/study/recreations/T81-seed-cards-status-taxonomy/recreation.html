<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T81 — Seed cards with status taxonomy (parameterized recreation)</title>
<style>
  html,body{margin:0;padding:0;background:#0b1526;}
  #stage{position:relative;overflow:hidden;margin:0 auto;}
  #scene{position:absolute;inset:0;}
  .blk{position:absolute;}
  .win{position:absolute;}
  #sun{position:absolute;border-radius:50%;}
  #card{position:absolute;box-sizing:border-box;}
  #cardStatus{font-weight:bold;}
  .rule{}
</style>
</head>
<body>
<div id="stage">
  <div id="scene"></div>
  <div id="card">
    <div id="cardStatus"></div>
    <div id="cardPlace"></div>
    <div id="cardClaim"></div>
    <div class="rule" id="cardRule"></div>
    <div id="cardSource"></div>
  </div>
</div>
<script>
"use strict";
/* ============ CONFIG — every content / timing / palette / font / geometry value lives here ============ */
const CONFIG = {
  taxonomy: ["ALREADY IN USE","ALREADY BEING BUILT","ALREADY IN THE LAB","ALREADY MEASURED","ALREADY PLANNED"],
  cards: [
    {status:"ALREADY IN USE", place:"INDIA", year:2025, claim:"Live translation into any headphones, free", source:"GOOGLE TRANSLATE BETA · DEC 2025"},
    {status:"ALREADY BEING BUILT", place:"UK", year:2026, claim:"An AI assistant for government services", source:"GOV.UK · ANTHROPIC PILOT, JAN 2026"},
    {status:"ALREADY IN THE LAB", place:"USA", year:2025, claim:"AI-designed antibiotics cured infected mice", source:"LAB REPORT · 2025"}
  ],
  palette: {card:"#16283f", ink:"#ffffff", accent:"#e8c86a", bg:"#1d3f8f"},
  enterMs: 450,
  holdMs: 4150,
  endHoldMs: 200,
  type: {font:"Georgia, 'Times New Roman', serif", claimPx:24, statusPx:15, placePx:15, sourcePx:13,
         statusSpacingEm:0.14, placeSpacingEm:0.14, sourceSpacingEm:0.04, claimLineHeight:1.25},
  geom: {
    stageW:360, stageH:540, cardX:20, cardY:96, cardW:320, cardPad:16, borderW:3, risePx:14,
    gapAfterStatus:4, gapBeforeClaim:12, gapBeforeRule:14, gapBeforeSource:8, ruleH:1, ruleOpacity:0.45,
    sceneDim:0.55, sceneBlock:"#274b8f", sceneWin:"#e8c86a", sceneWinOpacity:0.5,
    sunX:262, sunY:34, sunD:56,
    blocks:[[0,300,86,240],[92,262,74,278],[252,286,108,254],[172,336,72,204]],
    winW:14, winH:20, winGapX:24, winGapY:36, winCols:3, winRows:4, winOffX:10, winOffY:12, winInset:6
  }
};
/* ============ override (?cfg= JSON, deep merge) — the swap-test surface ============ */
function deepMerge(base, over){
  if (Array.isArray(over)){
    if (!Array.isArray(base)) return over.slice();
    const merged = base.map(function(b, i){ return i < over.length ? deepMerge(b, over[i]) : b; });
    for (let i = base.length; i < over.length; i++) merged.push(over[i]);
    return merged;
  }
  if (over && typeof over === "object"){
    const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
    for (const k of Object.keys(over)) out[k] = deepMerge(base ? base[k] : undefined, over[k]);
    return out;
  }
  return over;
}
let CFG = CONFIG;
try {
  const raw = new URLSearchParams(location.search).get("cfg");
  if (raw) CFG = deepMerge(CONFIG, JSON.parse(raw));
} catch(e) { CFG = CONFIG; }

/* ============ validation — status must index the taxonomy (checked AFTER override) ============ */
function validate(cfg){
  const problems = [];
  cfg.cards.forEach(function(c, i){
    if (cfg.taxonomy.indexOf(c.status) === -1) problems.push("cards["+i+"].status not in taxonomy: "+c.status);
  });
  if (!(cfg.enterMs > 0)) problems.push("enterMs must be > 0");
  if (!(cfg.holdMs > 0)) problems.push("holdMs must be > 0");
  if (!(cfg.endHoldMs >= 0)) problems.push("endHoldMs must be >= 0");
  return problems;
}
const PROBLEMS = validate(CFG);

/* ============ phase machine — one card owns the stage (Cure 2: phase exclusivity) ============ */
function cycleMs(cfg){ return cfg.cards.length * (cfg.enterMs + cfg.holdMs) + cfg.endHoldMs; }
function stateAt(cfg, t){
  const slot = cfg.enterMs + cfg.holdMs;
  const total = cycleMs(cfg);
  const tt = ((t % total) + total) % total;
  const slotsEnd = cfg.cards.length * slot;
  if (tt >= slotsEnd) return {idx: cfg.cards.length - 1, phase:"endhold", p:1};
  const idx = Math.floor(tt / slot);
  const local = tt - idx * slot;
  if (local < cfg.enterMs) return {idx: idx, phase:"enter", p: local / cfg.enterMs};
  return {idx: idx, phase:"hold", p:1};
}

/* ============ DOM construction (browser only) ============ */
if (typeof document !== "undefined"){
  const g = CFG.geom, pal = CFG.palette, ty = CFG.type;
  const stage = document.getElementById("stage");
  stage.style.width = g.stageW + "px";
  stage.style.height = g.stageH + "px";
  stage.style.background = pal.bg;
  stage.style.fontFamily = ty.font;

  /* simplified scene — flat code-drawn blocks, dimmer than the card (Cure 1: intensity separation).
     The card is NOT a child of #scene, so the dim never touches it. */
  const scene = document.getElementById("scene");
  scene.style.opacity = String(g.sceneDim);
  const sun = document.createElement("div");
  sun.id = "sun";
  sun.style.left = g.sunX + "px"; sun.style.top = g.sunY + "px";
  sun.style.width = g.sunD + "px"; sun.style.height = g.sunD + "px";
  sun.style.background = pal.accent;
  scene.appendChild(sun);
  g.blocks.forEach(function(b){
    const blk = document.createElement("div");
    blk.className = "blk";
    blk.style.left = b[0] + "px"; blk.style.top = b[1] + "px";
    blk.style.width = b[2] + "px"; blk.style.height = b[3] + "px";
    blk.style.background = g.sceneBlock;
    scene.appendChild(blk);
    for (let r = 0; r < g.winRows; r++){
      for (let c = 0; c < g.winCols; c++){
        const wx = g.winOffX + c * g.winGapX, wy = g.winOffY + r * g.winGapY;
        if (wx + g.winW > b[2] - g.winInset || wy + g.winH > b[3] - g.winInset) continue;
        const win = document.createElement("div");
        win.className = "win";
        win.style.left = wx + "px"; win.style.top = wy + "px";
        win.style.width = g.winW + "px"; win.style.height = g.winH + "px";
        win.style.background = g.sceneWin;
        win.style.opacity = String(g.sceneWinOpacity);
        blk.appendChild(win);
      }
    }
  });

  /* the one fixed card design — single node, content swapped whole at slot boundaries */
  const card = document.getElementById("card");
  card.style.left = g.cardX + "px";
  card.style.top = g.cardY + "px";
  card.style.width = g.cardW + "px";
  card.style.padding = g.cardPad + "px";
  card.style.background = pal.card;
  card.style.borderLeft = g.borderW + "px solid " + pal.accent;
  card.style.color = pal.ink;
  const elStatus = document.getElementById("cardStatus");
  const elPlace = document.getElementById("cardPlace");
  const elClaim = document.getElementById("cardClaim");
  const elSource = document.getElementById("cardSource");
  const elRule = document.getElementById("cardRule");
  elStatus.style.color = pal.accent; elStatus.style.fontSize = ty.statusPx + "px"; elStatus.style.letterSpacing = ty.statusSpacingEm + "em";
  elPlace.style.color = pal.ink; elPlace.style.fontSize = ty.placePx + "px"; elPlace.style.marginTop = g.gapAfterStatus + "px"; elPlace.style.letterSpacing = ty.placeSpacingEm + "em";
  elClaim.style.color = pal.ink; elClaim.style.fontSize = ty.claimPx + "px"; elClaim.style.marginTop = g.gapBeforeClaim + "px"; elClaim.style.lineHeight = String(ty.claimLineHeight);
  elRule.style.background = pal.accent; elRule.style.opacity = String(g.ruleOpacity); elRule.style.marginTop = g.gapBeforeRule + "px"; elRule.style.height = g.ruleH + "px";
  elSource.style.color = pal.accent; elSource.style.fontSize = ty.sourcePx + "px"; elSource.style.marginTop = g.gapBeforeSource + "px"; elSource.style.letterSpacing = ty.sourceSpacingEm + "em";

  let shownIdx = -1;
  function showCard(i){
    const c = CFG.cards[i];
    elStatus.textContent = c.status;
    elPlace.textContent = c.place + " · " + c.year;
    elClaim.textContent = c.claim;
    elSource.textContent = c.source;
    shownIdx = i;
  }

  /* clock: shared start timestamp, pausable via postMessage from comparison.html */
  let startStamp = performance.now(), pausedAt = null, pauseAccum = 0;
  function nowMs(){
    const n = pausedAt !== null ? pausedAt : performance.now();
    return n - startStamp - pauseAccum;
  }
  function frame(){
    const st = stateAt(CFG, nowMs());
    if (st.idx !== shownIdx) showCard(st.idx);
    if (st.phase === "enter"){
      card.style.opacity = String(st.p);
      card.style.transform = "translateY(" + ((1 - st.p) * g.risePx) + "px)";
    } else {
      card.style.opacity = "1";
      card.style.transform = "translateY(0px)";
    }
    requestAnimationFrame(frame);
  }
  showCard(0);
  requestAnimationFrame(frame);

  window.addEventListener("message", function(ev){
    if (!ev.data || ev.data.t81 === undefined) return;
    if (ev.data.t81 === "pause" && pausedAt === null) pausedAt = performance.now();
    if (ev.data.t81 === "play" && pausedAt !== null){ pauseAccum += performance.now() - pausedAt; pausedAt = null; }
    if (ev.data.t81 === "restart"){ startStamp = performance.now(); pauseAccum = 0; pausedAt = null; shownIdx = -1; }
  });
  window.__t81 = {CFG: CFG, PROBLEMS: PROBLEMS, cycleMs: cycleMs(CFG), stateAt: function(t){ return stateAt(CFG, t); }};
}
if (typeof module !== "undefined" && module.exports){
  module.exports = {CONFIG: CONFIG, deepMerge: deepMerge, validate: validate, cycleMs: cycleMs, stateAt: stateAt, CFG: CFG, PROBLEMS: PROBLEMS};
}
</script>
</body>
</html>
