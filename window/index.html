<html lang="en">
<head>

<style>
  :root { --bg:#0e0f13; --card:#171a21; --card2:#1d212b; --ink:#e8eaf0; --dim:#9aa3b2;
          --ok:#57cc99; --amber:#ffb454; --grey:#6b7280; --blue:#6cb2f5; --line:#262b36; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
         -webkit-text-size-adjust:100%; }
  .wrap { max-width:520px; margin:0 auto; padding:14px 12px 40px; }
  h1 { font-size:22px; font-weight:700; }
  .sub { color:var(--dim); font-size:13px; margin-top:4px; line-height:1.45; }
  .counts { display:flex; gap:6px; flex-wrap:wrap; margin:12px 0 4px; }
  .count { background:var(--card2); border:1px solid var(--line); border-radius:999px;
           padding:5px 10px; font-size:13px; font-variant-numeric:tabular-nums; }
  .count b { font-size:15px; }
  .filters { display:flex; gap:6px; margin:10px 0 14px; flex-wrap:wrap; }
  .filters button { background:var(--card); color:var(--dim); border:1px solid var(--line);
    border-radius:999px; padding:8px 14px; font-size:14px; cursor:pointer; min-height:40px; }
  .filters button.on { color:var(--ink); border-color:var(--blue); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:12px 13px; margin-bottom:10px; cursor:pointer; }
  .card .id { font-size:19px; font-weight:700; letter-spacing:.2px; }
  .card .ttl { color:var(--dim); font-size:13.5px; margin-top:2px; line-height:1.35;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
  .chip { font-size:12px; padding:3px 8px; border-radius:999px; border:1px solid var(--line);
          color:var(--dim); font-variant-numeric:tabular-nums; }
  .chip.verified { color:#0c2018; background:var(--ok); border-color:var(--ok); font-weight:700; }
  .chip.partial { color:#241a05; background:var(--amber); border-color:var(--amber); font-weight:700; }
  .chip.seeded { color:var(--ink); background:#2a2f3a; }
  .chip.voice-clone { color:var(--blue); border-color:#2c4a6e; }
  .chip.voice-tierb { color:var(--amber); border-color:#5a4420; }
  .bar { height:8px; background:#262b36; border-radius:99px; margin-top:10px; overflow:hidden; }
  .bar > div { height:100%; background:var(--blue); border-radius:99px; }
  .bar.partial > div { background:var(--amber); }
  .covnum { font-size:13px; color:var(--dim); margin-top:5px; font-variant-numeric:tabular-nums; }
  .covnum b { color:var(--ink); font-size:15px; }
  .evid { color:var(--dim); font-size:13px; margin-top:8px; line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .detail { display:none; margin-top:12px; border-top:1px solid var(--line); padding-top:11px; cursor:default; }
  .card.open .detail { display:block; }
  .detail h3 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:12px 0 6px; }
  .detail h3:first-child { margin-top:0; }
  .subs { font-size:14.5px; line-height:1.55; font-variant-numeric:tabular-nums; }
  .opens { display:flex; gap:6px; flex-wrap:wrap; }
  .opens .chip { color:var(--ink); background:var(--card2); }
  .stage { font-size:13px; color:var(--dim); line-height:1.5; }
  .row { font-size:14px; line-height:1.55; }
  .row a { color:var(--blue); }
  .playbtn { display:block; width:100%; margin-top:12px; background:var(--ok); color:#0c2018;
    border:0; border-radius:10px; padding:13px; font-size:16px; font-weight:700; cursor:pointer; min-height:48px; }
  .playbtn:disabled { background:#2a2f3a; color:var(--dim); }
  .pstat { font-size:13px; color:var(--dim); margin-top:8px; min-height:18px; line-height:1.4; }
  .framewrap { margin-top:10px; background:#000; border-radius:10px; overflow:hidden; position:relative; }
  .framewrap iframe { border:0; display:block; background:#000; transform-origin:0 0; }
  .hint { font-size:12.5px; color:var(--dim); margin-top:6px; line-height:1.45; }
  footer { color:var(--grey); font-size:12.5px; line-height:1.55; margin-top:18px; }
  footer a { color:var(--blue); }
</style>
</head>

<script>
const SNAP = JSON.parse(document.getElementById('snapshot').textContent);
const pieces = SNAP.pieces;
const rank = p => p.verified ? 0 : p.class === 'assembled' ? 1 : p.class === 'partial' ? 2 : 3;
pieces.sort((a,b) => rank(a) - rank(b) || a.id.localeCompare(b.id));

const counts = document.getElementById('counts');
const nV = pieces.filter(p=>p.verified).length, nA = pieces.filter(p=>p.class==='assembled').length,
      nP = pieces.filter(p=>p.class==='partial').length, nS = pieces.filter(p=>p.class==='seeded').length;
counts.innerHTML = `<span class="count"><b>${pieces.length}</b> branches</span>
  <span class="count"><b>${nV}</b> verified</span><span class="count"><b>${nP}</b> partial</span>
  <span class="count"><b>${nS}</b> seeded</span>`;

let filter = 'all';
const filtersEl = document.getElementById('filters');
[['all','All'],['verified','Verified'],['partial','Partial'],['seeded','Seeded']].forEach(([k,label])=>{
  const b = document.createElement('button'); b.textContent = label; if (k==='all') b.className='on';
  b.onclick = () => { filter = k; [...filtersEl.children].forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); render(); };
  filtersEl.appendChild(b);
});

const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mb = n => n ? (n/1048576).toFixed(1)+' MB' : '';

function titleOf(p) {
  if (p.metadata && p.metadata.title) return p.metadata.title;
  if (p.readme && p.readme.title_field) return p.readme.title_field;
  if (p.readme && p.readme.h1) return p.readme.h1.replace(/^[A-Za-z0-9-]+ — /, '');
  return '';
}
function stageChip(p) {
  if (p.verified) return `<span class="chip verified">✓ VERIFIED</span>`;
  if (p.class === 'partial') return `<span class="chip partial">PARTIAL</span>`;
  if (p.class === 'assembled') return `<span class="chip">ASSEMBLED</span>`;
  return `<span class="chip seeded">SEEDED · stage 0</span>`;
}
function voiceChip(p) {
  if (!p.voice) return '';
  if (p.voice.status.startsWith('CLONE')) return `<span class="chip voice-clone">voice: clone ✓</span>`;
  if (p.voice.status.startsWith('TIER B')) return `<span class="chip voice-tierb">voice: Tier B · guide delivered</span>`;
  return `<span class="chip">${esc(p.voice.status)}</span>`;
}

function detailHTML(p) {
  let h = '';
  const cov = p.readme && p.readme.coverage;
  if (cov) {
    const s = cov.scaffold, e = cov.elements, w = cov.words;
    h += `<h3>Coverage — recorded decisions with reasons</h3><div class="subs">` +
      (s ? `Scaffold <b>${s.decided}/${s.total}</b> · ` : '') +
      (e ? `Elements <b>${e.decided}/${e.total}</b> · ` : '') +
      (w ? `Words <b>${w.decided}/${w.total}</b>` : '') + `</div>`;
  }
  if (p.metadata) {
    h += `<h3>Open fields (${p.metadata.opens.length})</h3><div class="opens">` +
      p.metadata.opens.map(o=>`<span class="chip">${esc(o)}</span>`).join('') + `</div>`;
  }
  const edNote = (p.readme && p.readme.stage_text && p.readme.stage_text.includes('editability (b) PROVEN'))
    ? `✓ In-package editability (b) PROVEN on branch bytes.`
    : `In-package editability absent — a named gap (see package README).`;
  h += `<h3>Verification</h3><div class="row">` + (p.verified
    ? `✓ ${esc(p.verified.label || 'Verified')} ${esc(p.verified.date)} · JOB ${esc(p.verified.job)}<br><span class="stage">${edNote}</span>`
    : `Package verification not yet run.`) + `</div>`;
  if (p.voice) h += `<h3>Voice</h3><div class="row">${esc(p.voice.status_raw || p.voice.status)}</div>`;
  if (p.readme && p.readme.stage_text)
    h += `<h3>Stage (from the package README)</h3><div class="stage">${esc(p.readme.stage_text)}</div>`;
  if (p.readme && p.readme.evidence_state)
    h += `<h3>Evidence state at opening</h3><div class="stage">${esc(p.readme.evidence_state)}</div>`;
  h += `<h3>Branch</h3><div class="row"><a href="${p.branch_url}">${esc(p.branch)}</a>` +
       ` · head <code>${esc(p.head_short)}</code></div>`;
  if (p.readme && p.readme.public_url)
    h += `<div class="row">Public: <a href="${esc(p.readme.public_url)}">${esc(p.readme.public_url)}</a></div>`;
  if (p.scene_raw_url) {
    h += `<button class="playbtn" data-play="${p.id}">▶ Play scene (${mb(p.scene_bytes)})</button>` +
         `<div class="pstat" id="pstat-${p.id}"></div><div id="pwrap-${p.id}"></div>` +
         `<div class="hint">The scene loads from the branch itself. Sound: use the scene's own play control inside the player.</div>`;
  }
  return h;
}

function render() {
  const list = document.getElementById('list'); list.innerHTML = '';
  pieces.filter(p => filter==='all' ? true : filter==='verified' ? !!p.verified : p.class===filter)
  .forEach(p => {
    const cov = p.readme && p.readme.coverage;
    const card = document.createElement('div'); card.className = 'card'; card.id = 'card-' + p.id;
    card.innerHTML = `<div class="id">${esc(p.id)}</div><div class="ttl">${esc(titleOf(p))}</div>` +
      `<div class="chips">${stageChip(p)}${voiceChip(p)}</div>` +
      (cov ? `<div class="bar ${p.class==='partial'?'partial':''}"><div style="width:${Math.round(100*cov.decided/cov.total)}%"></div></div>
              <div class="covnum"><b>${cov.decided}/${cov.total}</b> decisions recorded</div>`
           : `<div class="evid">${esc((p.readme && p.readme.evidence_state) || '')}</div>`) +
      `<div class="detail">${detailHTML(p)}</div>`;
    card.addEventListener('click', ev => {
      if (ev.target.closest('a,button,iframe')) return;
      card.classList.toggle('open');
    });
    list.appendChild(card);
  });
  list.querySelectorAll('[data-play]').forEach(b => b.addEventListener('click', () => play(b.dataset.play)));
}

async function play(id) {
  const p = pieces.find(x => x.id === id);
  const stat = document.getElementById('pstat-' + id), wrap = document.getElementById('pwrap-' + id);
  const btn = document.querySelector(`[data-play="${id}"]`);
  btn.disabled = true; stat.textContent = `Fetching the scene from branch ${p.branch} (${mb(p.scene_bytes)})…`;
  try {
    const r = await fetch(p.scene_raw_url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const html = await r.text();
    wrap.innerHTML = `<div class="framewrap"><iframe title="${esc(id)} scene" allow="autoplay; fullscreen"></iframe></div>`;
    const ifr = wrap.querySelector('iframe');
    ifr.srcdoc = html;
    stat.textContent = `Scene loaded from the branch (${(html.length/1048576).toFixed(1)} MB of HTML). It renders below; sound starts from the scene's own play control.`;
    fitFrame(wrap.querySelector('.framewrap'), ifr);
  } catch (e) {
    stat.innerHTML = `Scene fetch failed (${esc(e.message)}). Fallback: open the scene file on the branch — ` +
      `<a href="https://github.com/${SNAP.repo}/blob/${p.branch}/scene/index.html">scene/index.html on ${esc(p.branch)}</a> — or the branch's render/render.mp4.`;
  }
  btn.disabled = false;
}

// Scenes are fixed-stage documents (authored full-viewport; e.g. the
// trailer's stage measures ~735x1993 CSS px and does not shrink to
// its frame). Fit the whole stage into the card width by scaling.
function fitFrame(box, ifr) {
  let tries = 0;
  const tick = () => {
    tries++;
    let sw = 0, sh = 0;
    try { const d = ifr.contentDocument;
      if (d) { sw = d.documentElement.scrollWidth; sh = d.documentElement.scrollHeight; }
    } catch (e) { /* srcdoc not ready */ }
    if (sw > 0 && sh > 0) {
      const avail = box.clientWidth || 340;
      const scale = Math.min(1, avail / sw);
      ifr.style.width = sw + 'px'; ifr.style.height = sh + 'px';
      ifr.style.transform = `scale(${scale})`;
      box.style.height = Math.round(sh * scale) + 'px';
      if (tries < 6) setTimeout(tick, 700); // stage can settle late; refit a few times
    } else if (tries < 12) setTimeout(tick, 500);
  };
  setTimeout(tick, 400);
}

render();
document.getElementById('foot').innerHTML =
  `Prototype — local only, nothing published. Data snapshot baked ${esc(SNAP.generated_at_et)} from the live branches of ` +
  `${esc(SNAP.repo)} (per-branch heads inside each card). The live version regenerates this snapshot from the branches on demand; ` +
  `no numbers here are maintained by hand. Playback route: fetch the branch's scene text and render it in-page (srcdoc) — ` +
  `the raw URL itself refuses framing (X-Frame-Options: deny), so the scene is never framed directly.`;

const m = location.hash.match(/play=([a-z0-9-]+)/i);
if (m) { const c = document.getElementById('card-' + m[1]);
  if (c) { c.classList.add('open'); c.scrollIntoView(); play(m[1]); } }
</script>
